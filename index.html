{id:'mat',sec:'p5',name:'2D arrays in assembly',short:'2D in asm',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>Your L05 slides read pgh in IA32 assembly. The trick is building "5 × index" out of Part 2's address math:</p>`+
codeBlock('# get_pgh_zip: return pgh[index], the start of a row\n# %eax = index\nleal  (%eax,%eax,4), %eax   # 5 * index\nleal  pgh(,%eax,4), %eax    # pgh + 4*(5*index) = pgh + 20*index')+
`<p><code>leal</code> does the math without reading memory, so the result is an <b>address</b>: the start of row index. To read one element, the code adds dig to 5 × index first, then uses <code>movl</code>, which <b>does</b> read memory:</p>`+
codeBlock('# get_pgh_digit: return pgh[index][dig]\nmovl  8(%ebp), %eax          # index\nleal  (%eax,%eax,4), %eax    # 5*index\naddl  12(%ebp), %eax         # 5*index + dig\nmovl  pgh(,%eax,4), %eax     # M[pgh + 4*(5*index + dig)]')+
`<div class="tip"><span class="tl">Matrices on the slides</span>A 16 × 16 int matrix has 64-byte rows (16 × 4), and <code>sall $6</code> multiplies by 2⁶ = 64. For an n × n matrix the row size n × 4 isn't known ahead of time, so the code uses <code>imull</code>.</div>`,
qs:[
{instr:'leal (%eax,%eax,4), %eax',plain:true,prompt:'With index in %eax, what does this compute?',options:['5 × index','4 × index','index + 4'],answer:0,explain:'%eax + %eax × 4 = 5 × %eax. That\'s Part 2\'s D(Rb,Ri,S) math, done by lea.'},
{instr:'leal pgh(,%eax,4), %eax',plain:true,prompt:'Now %eax = 5 × index. What does this give?',code:false,options:['pgh + 20 × index, the start of row index','pgh + 4 × index','the int stored at pgh[index]'],answer:0,explain:'pgh + 4 × (5 × index) = pgh + 20 × index. lea never reads memory, so it\'s an address.'},
{instr:'movl pgh(,%eax,4), %eax',plain:true,prompt:'Now %eax = 5 × index + dig. What does this read?',code:false,options:['pgh[index][dig]','pgh[dig][index]','the address of row index'],answer:0,explain:'It reads M[pgh + 4 × (5 × index + dig)] = M[pgh + 20 × index + 4 × dig], which is pgh[index][dig].'},
{prompt:'Why does each row step by 20?',code:false,options:['A row is 5 ints × 4 bytes','pgh has 20 ints','20 is the biggest scale allowed'],answer:0,explain:'One zip code is 5 ints, and each int is 4 bytes.'},
{instr:'sall $6, %edx',plain:true,prompt:'In fix_ele (a 16 × 16 int matrix), this multiplies i by',options:['64','6','16'],answer:0,explain:'Shifting left by 6 bits multiplies by 2⁶ = 64, one row of 16 ints × 4 bytes.'},
{instr:'sall $2, %eax',plain:true,prompt:'And this multiplies j by',options:['4','2','8'],answer:0,explain:'2² = 4, the size of one int.'},
{prompt:'n × n int matrix: where is a[i][j]?',options:['a + i·n·4 + j·4','a + i·4 + j·n·4','a + (i + j)·4'],answer:0,explain:'Each row is n ints = n × 4 bytes. Skip i rows, then j ints.'},
{prompt:'Why does var_ele need <code>imull</code>, but fix_ele can shift?',code:false,options:['n isn\'t known until the program runs, so it needs a real multiply','imull is faster than a shift','16 isn\'t a power of 2'],answer:0,explain:'16 × 4 = 64 is a power of 2, so a shift works. n could be anything.'}
]},

{id:'multi',sec:'p5',name:'Arrays of pointers: two reads',short:'Pointer arrays',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>Another way to build something that looks 2D: an array of <b>pointers</b>, where each pointer leads to its own 1D array. From your L05 slides:</p>`+
codeBlock('zip_dig cmu = { 1, 5, 2, 1, 3 };\nzip_dig mit = { 0, 2, 1, 3, 9 };\nzip_dig ucb = { 9, 4, 7, 2, 0 };\n\nint *univ[3] = {mit, cmu, ucb};')+univViz()+
`<div class="rule-box">univ[index][dig] = Mem[ Mem[univ + 4·index] + 4·dig ]</div>
<p>That's <b>two memory reads</b>: first read the pointer to the right array, then read the digit inside it. pgh needed only one, because its rows sit right next to each other.</p>
<div class="tip"><span class="tl">IA32 again</span>Your slide is IA32, where a pointer is 4 bytes, so univ's pointers are 4 apart. On x86-64 they'd be 8 apart.</div>`,
qs:[
{prompt:'What is each element of <code>univ</code>?',code:false,options:['A pointer to an int array','An int','A whole zip code of 5 ints'],answer:0,explain:'int *univ[3]: cover univ[3] and int * is left. A pointer.'},
{prompt:'On your IA32 slide, how many bytes is each element of univ?',options:['4','8','20'],answer:0,explain:'IA32 pointers are 4 bytes.'},
{vis:univViz({u:1}),prompt:'univ starts at 160. What is stored in univ[1], at 164?',code:false,options:['16, the address of cmu','36, the address of mit','1, the first digit of cmu'],answer:0,explain:'univ = {mit, cmu, ucb}, so univ[1] holds cmu\'s address, 16.'},
{prompt:'Find <code>univ[2][3]</code>, one read at a time.',board:function(f){return univViz({u:f.r1?2:null,arr:f.p?'ucb':null,idx:f.v!=null?3:null});},
 guided:[{label:'Read 1',ask:'Read 1: univ[2] is at 160 + 4 × 2 = 168. What\'s stored there?',options:['56','168','36','2'],answer:0,say:'56, the address of ucb.',fill:{r1:1}},
  {label:'Address',ask:'The digit is at 56 + 4 × 3 =',options:['68','59','80','12'],answer:0,say:'56 + 12 = 68.',fill:{p:1}},
  {label:'Read 2',ask:'Read 2: what\'s stored at 68?',options:['2','7','0','3'],answer:0,say:'ucb = {9, 4, 7, 2, 0}, and ucb[3] = 2.',fill:{v:2}}],
 explain:'Two reads: univ[2] = 56, then M[56 + 12] = M[68] = 2.'},
{prompt:'How many memory reads does <code>univ[index][dig]</code> need?',options:['2','1','3'],answer:0,explain:'One for the pointer, one for the digit.'},
{prompt:'And <code>pgh[index][dig]</code>?',options:['1','2'],answer:0,keep:true,explain:'The address is just pgh + 20 × index + 4 × dig, so one read.'},
{instr:'movl univ(,%eax,4), %edx',plain:true,prompt:'With index in %eax, what does this do?',code:false,options:['Reads univ[index], the pointer to that row','Reads the digit itself','Computes an address without reading memory'],answer:0,explain:'It\'s movl, so it reads memory at univ + 4 × index: that\'s read 1.'},
{instr:'movl (%edx,%eax,4), %eax',plain:true,prompt:'Now %edx is that pointer p and %eax = dig. What does this read?',code:false,options:['p[dig], the digit','univ[dig]','the pointer again'],answer:0,explain:'Read 2: M[p + 4 × dig].'},
{prompt:'Find <code>univ[0][4]</code>.',board:function(f){return univViz({u:f.r1?0:null,arr:f.p?'mit':null,idx:f.v!=null?4:null});},
 guided:[{label:'Read 1',ask:'Read 1: univ[0] is at 160. What\'s stored there?',options:['36','16','160','0'],answer:0,say:'36, the address of mit.',fill:{r1:1}},
  {label:'Address',ask:'The digit is at 36 + 4 × 4 =',options:['52','40','56','20'],answer:0,say:'36 + 16 = 52.',fill:{p:1}},
  {label:'Read 2',ask:'Read 2: what\'s stored at 52?',options:['9','3','0','2'],answer:0,say:'mit = {0, 2, 1, 3, 9}, and mit[4] = 9.',fill:{v:9}}],
 explain:'univ[0] = 36, then M[36 + 16] = M[52] = 9.'},
{prompt:'Which access does this formula describe?',vis:'<div class="rule-box">Mem[pgh + 20·index + 4·dig]</div>',code:false,options:['pgh[index][dig], a nested array','univ[index][dig], a multi-level array'],answer:0,keep:true,explain:'One read, with all the math up front: the nested array. The multi-level array needs Mem[Mem[…] …].'}
]},

{id:'struct',sec:'p5',name:'Structs: fields at fixed offsets',short:'Structs',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>A <b>struct</b> is one block of memory holding fields of different types, one after another. Each field sits at a fixed <b>offset</b> from the start. From your L05 slides:</p>`+
codeBlock('struct rec {\n    int a[3];\n    int i;\n    struct rec *n;\n};')+structViz()+
`<div class="rule-box">r->field is at r + offset</div>
<p>The compiler works out every offset ahead of time. a is 3 ints (12 bytes), so i starts at 12, and n at 16. Setting a field is one instruction:</p>`+
codeBlock('# r->i = val;      %eax = r, %edx = val\nmovl  %edx, 12(%eax)        # Mem[r+12] = val')+
`<div class="tip"><span class="tl">IA32 vs x86-64</span>Your slide is IA32, where n is a 4-byte pointer, so the struct is 20 bytes. On x86-64, n is 8 bytes and the struct is 24.</div>`,
qs:[
{prompt:'What is the offset of <code>a</code>?',options:['0','4','12'],answer:0,explain:'a is the first field, so it starts right at r.'},
{prompt:'What is the offset of <code>i</code>?',options:['12','4','3'],answer:0,hint:'a takes up 3 ints.',explain:'3 ints × 4 bytes = 12.',after:structViz('i')},
{prompt:'What is the offset of <code>n</code>?',options:['16','12','20'],answer:0,explain:'12 for a, plus 4 for i.',after:structViz('n')},
{prompt:'How big is struct rec on your IA32 slide?',input:true,dec:true,expect:'20',explain:'12 + 4 + 4 = 20 bytes.'},
{prompt:'r points to a struct rec. Where is <code>r-&gt;i</code>?',options:['r + 12','r + 4','M[r] + 12'],answer:0,explain:'Start of the struct plus i\'s offset.'},
{prompt:'Where is <code>r-&gt;a[2]</code>?',options:['r + 8','r + 2','r + 12'],answer:0,explain:'a starts at offset 0, and element 2 is 2 ints in: r + 8.',after:structViz('a[2]')},
{prompt:'<code>&amp;r-&gt;a[idx]</code> is',options:['r + 4·idx','r + idx','r + 12 + 4·idx'],answer:0,explain:'a is at offset 0, and each element is 4 bytes. The slide computes it with sall $2 (× 4) and addl.'},
{instr:'movl %edx, 12(%eax)',plain:true,prompt:'%eax = r and %edx = val. What does this do?',code:false,options:['r->i = val','r->n = val','val = r->i'],answer:0,explain:'It writes val into memory at r + 12, which is the field i. Source first, then destination.'},
{prompt:'Which instruction reads <code>r-&gt;n</code> into %ecx? (r is in %eax)',options:['movl 16(%eax), %ecx','movl 12(%eax), %ecx','leal 16(%eax), %ecx'],answer:0,explain:'n is at offset 16, and reading a value means mov, not lea.'},
{prompt:'On x86-64, pointers are 8 bytes. How big is struct rec there?',input:true,dec:true,expect:'24',explain:'a is 12, i is 4 (that\'s 16 so far), and n is now 8: 24.'}
]},

/* ===== Part 6 · Memory & DRAM (L06 part 1) ===== */
{id:'pyr',sec:'p6',name:'The memory pyramid',short:'The pyramid',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>Fast storage is expensive, so there's only a little of it. Cheap storage is slow, but you can have lots. Computers use <b>both</b>, stacked like a pyramid: a little fast storage on top, lots of cheap storage below.</p>`+
pyramidViz()+
`<div class="tip"><span class="tl">Read it like this</span>Going <b>up</b>: smaller, faster, costlier per byte. Going <b>down</b>: larger, slower, cheaper per byte. Each level is named L0 to L6, top to bottom.</div>`,
qs:[
{prompt:'Put these in order, <b>fastest first</b>.',order:['Registers','L1 cache','L3 cache','Main memory (DRAM)','Local disk'],explain:'Top of the pyramid to the bottom: registers, then the caches, then main memory, then disk.'},
{prompt:'Which level is L0, the top of the pyramid?',options:['Registers','L1 cache','Main memory'],answer:0,explain:'Registers sit right inside the CPU: tiny and the fastest of all.'},
{prompt:'The L1, L2 and L3 caches are made of',options:['SRAM','DRAM','Flash'],answer:0,explain:'Caches are SRAM: fast and expensive.'},
{prompt:'Main memory, L4, is made of',options:['DRAM','SRAM','Flash'],answer:0,explain:'Main memory is DRAM: slower than SRAM, but much cheaper per byte.'},
{prompt:'Going <b>down</b> the pyramid, storage gets',options:['bigger, slower, and cheaper per byte','smaller, faster, and costlier per byte','bigger, faster, and cheaper per byte'],answer:0,explain:'That\'s the trade every level makes.'},
{prompt:'Which costs more per byte?',options:['L2 cache','Main memory'],answer:0,keep:true,explain:'Higher up costs more per byte.'},
{prompt:'Which holds more?',options:['Main memory','L3 cache'],answer:0,keep:true,explain:'Lower down is bigger.'},
{prompt:'Where do tapes, distributed file systems and Web servers sit?',options:['L6, remote storage','L5, local disks','L4, main memory'],answer:0,explain:'The bottom of the pyramid: remote secondary storage.'},
{prompt:'L5 is',options:['local disks','L3 cache','registers'],answer:0,explain:'Local secondary storage: the disks in your computer.',after:pyramidViz(5)}
]},

{id:'sram',sec:'p6',name:'SRAM vs DRAM',short:'SRAM vs DRAM',shuffleOpts:true,
defaults:{m:null,code:false,options:['SRAM','DRAM'],keep:true},
lesson:`<p>RAM comes on chips. Its basic unit is a <b>cell</b> that holds one bit, and several chips together make a memory. There are two kinds:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th></th><th>SRAM (static)</th><th>DRAM (dynamic)</th></tr></thead><tbody>
<tr><td>Parts per bit</td><td>4 or 6 transistors</td><td>1 transistor + 1 capacitor</td></tr>
<tr><td>Keeps its value?</td><td>Yes, as long as it has power</td><td>No: refresh every 10–100 ms</td></tr>
<tr><td>Bothered by disturbances?</td><td>No</td><td>Yes</td></tr>
<tr><td>Relative cost</td><td>1000×</td><td>1×</td></tr>
<tr><td>Speed and size</td><td>Faster access, less power, stores less</td><td>Stores more, cheaper</td></tr>
<tr><td>Used for</td><td><b>Cache memories</b></td><td><b>Main memory</b></td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">How to remember it</span><b>S</b>RAM is <b>S</b>peedy, <b>S</b>mall and <b>S</b>teep in price: caches. <b>D</b>RAM is <b>D</b>ense and cheap, but its capacitors <b>D</b>rain, so it needs refreshing: main memory.</div>`,
qs:[
{prompt:'Which one is used for <b>cache memories</b>?',answer:0,explain:'Caches need speed, and SRAM is the fast one.'},
{prompt:'Which one is used for <b>main memory</b>?',answer:1,explain:'Main memory needs lots of bytes cheaply, so DRAM.'},
{prompt:'Which one stores a bit with <b>1 transistor and 1 capacitor</b>?',answer:1,explain:'DRAM. The capacitor holds the bit as a tiny charge.'},
{prompt:'Which one uses <b>4 or 6 transistors</b> per bit?',answer:0,explain:'SRAM. More parts per bit is why it costs more and stores less.'},
{prompt:'Which one must be <b>refreshed every 10–100 ms</b>?',answer:1,explain:'DRAM\'s capacitors leak, so their charge has to be refreshed.'},
{prompt:'Which one keeps its value as long as it has power?',answer:0,explain:'SRAM is "static": no refreshing needed.'},
{prompt:'Which one costs about <b>1000×</b> as much?',answer:0,explain:'SRAM: 1000× vs DRAM\'s 1×.'},
{prompt:'Which one is <b>sensitive to disturbances</b>?',answer:1,explain:'DRAM. Its tiny charges can be upset by things like light or electrical noise.'},
{prompt:'Which one stores more per chip?',answer:1,explain:'DRAM needs fewer parts per bit, so more bits fit.'},
{prompt:'Which one has faster access and uses less power?',answer:0,explain:'SRAM, from your slide 5.'},
{prompt:'RAM\'s basic storage unit is',options:['a cell that holds one bit','a byte','a supercell'],keep:false,answer:0,explain:'One bit per cell. (A supercell is a group of cells, coming up next.)'}
]},

{id:'dram',sec:'p6',name:'Inside a DRAM chip',short:'DRAM chip',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>A <b>d × w</b> DRAM chip holds d × w bits, grouped into <b>d supercells</b> of <b>w bits</b> each. The supercells are laid out in a square of rows and columns.</p>`+
dramViz({r:2,c:1})+
`<p>Your slide's chip is <b>16 × 8</b>: 16 supercells of 8 bits (128 bits in all), arranged as 4 rows × 4 columns. Supercell (2,1) means row 2, column 1.</p>
<p>The <b>memory controller</b> talks to the chip with <b>2 addr pins</b>, which carry a row or column number (0 to 3), and <b>8 data pins</b>, which carry one supercell.</p>`,
qs:[
{prompt:'A 16 × 8 DRAM has how many supercells?',options:['16','8','128'],answer:0,explain:'d × w means d supercells of w bits: 16 supercells.'},
{prompt:'How many bits are in each supercell?',options:['8','16','4'],answer:0,explain:'w = 8 bits.'},
{prompt:'Type how many bits a 16 × 8 DRAM holds in all.',input:true,dec:true,expect:'128',explain:'16 × 8 = 128 bits.'},
{prompt:'Its 16 supercells form a square. Rows × columns?',options:['4 × 4','2 × 8','16 × 1'],answer:0,explain:'4 × 4 = 16.'},
{prompt:'Supercell (2,1) is at',options:['row 2, column 1','row 1, column 2','supercell number 21'],answer:0,explain:'(row, column).',after:dramViz({r:2,c:1})},
{prompt:'How many addr pins carry a row or column number from 0 to 3?',options:['2','4','16'],answer:0,explain:'Two bits can name 0 to 3.'},
{prompt:'How many data pins does it need?',options:['8','2','16'],answer:0,explain:'One supercell (8 bits) comes out at a time.'},
{prompt:'A 64 × 8 DRAM as a square: rows × columns?',options:['8 × 8','4 × 16','64 × 1'],answer:0,explain:'64 supercells: 8 × 8.'},
{prompt:'And how many addr pins does the 64 × 8 chip need?',options:['3','6','8'],answer:0,hint:'They name a row or column from 0 to 7.',explain:'3 bits name 0 to 7, because 2³ = 8.'},
{prompt:'A d × w DRAM holds how many bits?',options:['d × w','d + w','d'],answer:0,explain:'d supercells, w bits each.'}
]},

{id:'rascas',sec:'p6',name:'Reading a supercell: RAS, then CAS',short:'RAS and CAS',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>Reading one supercell takes <b>two steps</b> over the same 2 addr pins: first the <b>row</b>, then the <b>column</b>.</p>
<ol class="steps"><li><b>RAS</b> (row access strobe) picks a row. The whole row is copied into the chip's <b>internal row buffer</b>.</li><li><b>CAS</b> (column access strobe) picks a column from that buffer. That supercell goes out on the 8 data pins, and on to the CPU.</li></ol>`+
toy('dram')+
`<div class="tip"><span class="tl">Why a square, not one long line?</span>Sending the row and the column on the same pins means the chip needs <b>fewer pins</b>. The cost: two steps make each access <b>slower</b>. The bonus: once a row is in the buffer, the rest of it is cheap to read. That's <b>locality</b>, which Part 9 is all about.</div>`,
qs:[
{prompt:'Put the steps for reading supercell (2,1) in order.',order:['RAS = 2 selects row 2','Row 2 is copied into the row buffer','CAS = 1 selects column 1','Supercell (2,1) goes out on the data pins to the CPU'],explain:'Row first, then column: RAS, copy the row, CAS, send it out.'},
{prompt:'RAS stands for',options:['Row access strobe','Random access storage','Register address select'],answer:0,explain:'It picks the row.'},
{prompt:'CAS stands for',options:['Column access strobe','Cache access strobe','Column address storage'],answer:0,explain:'It picks the column.'},
{prompt:'Which is sent first?',options:['RAS','CAS'],answer:0,keep:true,explain:'Row first, then column.'},
{prompt:'After RAS, where does the whole row go?',options:['The internal row buffer','Straight to the CPU','The data pins'],answer:0,explain:'The whole row is copied into the buffer. CAS then picks from it.'},
{prompt:'To read supercell (3,0):',options:['RAS = 3, then CAS = 0','RAS = 0, then CAS = 3','RAS = 30'],answer:0,explain:'RAS gets the row, CAS gets the column.',after:dramViz({r:3,c:0,row:true,buf:true,col:true})},
{prompt:'Why lay the supercells out as a square?',options:['The row and column can share the same addr pins, so the chip needs fewer pins','It makes every read faster','A square holds more bits'],answer:0,explain:'Reusing the addr pins cuts the pin count.'},
{prompt:'What\'s the side effect of the square layout?',options:['Slower access: two steps instead of one','Data gets lost','It needs more pins'],answer:0,explain:'RAS and CAS take turns on the same pins.'},
{prompt:'A[0] to A[3] all sit in row 2. How many address transmissions does reading all four take?',input:true,dec:true,expect:'5',traps:[{v:'8',msg:'That sends RAS again for every element. The row is already in the buffer after the first RAS.'}],hint:'The row stays in the buffer.',explain:'One RAS for row 2, then four CAS: 5. That\'s locality paying off.'},
{prompt:'If the 16 supercells sat in one long line, how many addr pins would it take to name 0 to 15?',options:['4','2','16'],answer:0,explain:'2⁴ = 16, so 4 pins, twice as many as the square needs.'}
]},

{id:'module',sec:'p6',name:'Memory modules',short:'Modules',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>One chip is small, so a memory <b>module</b> (the stick you plug in) holds several. Your slide's <b>64 MB module</b> has <b>eight 8M × 8 DRAMs</b>.</p>`+
moduleViz(2)+
`<ol class="steps"><li>The memory controller sends the <b>same</b> (row i, column j) to all 8 chips.</li><li>Each chip sends back its 8-bit supercell (i, j).</li><li>Together that's <b>64 bits</b>, the 8 bytes at address A. DRAM k supplies bits 8k to 8k + 7.</li></ol>
<div class="tip"><span class="tl">Heads-up on words</span>This slide calls 64 bits a "doubleword". In Part 1, a double word (movl) was 4 bytes. Different slides name sizes differently. What matters here: 8 chips × 8 bits = 64 bits = 8 bytes.</div>`,
qs:[
{prompt:'How many DRAM chips are on the slide\'s 64 MB module?',options:['8','64','1'],answer:0,explain:'Eight 8M × 8 DRAMs.'},
{prompt:'Each chip sends how many bits per read?',options:['8','64','1'],answer:0,explain:'One 8-bit supercell.'},
{prompt:'Together, one read from all the chips gives',options:['64 bits, which is 8 bytes','8 bits, which is 1 byte','32 bits, which is 4 bytes'],answer:0,explain:'8 chips × 8 bits = 64 bits.'},
{prompt:'Which chip supplies bits 16–23?',options:['DRAM 2','DRAM 16','DRAM 5'],answer:0,hint:'DRAM k supplies bits 8k to 8k + 7.',explain:'16 ÷ 8 = 2, so DRAM 2.',after:moduleViz(2)},
{prompt:'Which chip supplies bits 56–63?',options:['DRAM 7','DRAM 0','DRAM 6'],answer:0,explain:'56 ÷ 8 = 7.',after:moduleViz(7)},
{prompt:'Which chip supplies bits 0–7?',options:['DRAM 0','DRAM 7','DRAM 1'],answer:0,explain:'The lowest byte comes from DRAM 0.',after:moduleViz(0)},
{prompt:'Byte 5 of the 64-bit word (bits 40–47) comes from',options:['DRAM 5','DRAM 4','DRAM 40'],answer:0,explain:'Byte k comes from DRAM k.',after:moduleViz(5)},
{prompt:'Does each chip get a different address?',options:['No. All 8 get the same (row i, column j).','Yes. Each one gets its own.'],answer:0,keep:true,explain:'Same supercell position in every chip. Each chip just holds a different byte of the word.'},
{prompt:'An 8M × 8 chip holds 8M supercells of 8 bits. How many MB is that?',options:['8 MB','64 MB','1 MB'],answer:0,explain:'8 bits is 1 byte, so 8M supercells = 8 MB. Eight chips: 64 MB.'}
]},

{id:'rcbits',sec:'p6',name:'Rows, columns and address bits',short:'Rows × cols',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>In-Class Practice 6 asks: for a <b>d × w</b> DRAM, which <b>r rows × c columns</b> make the address as short as possible? Four quick rules:</p>
<ol class="steps"><li><b>Only d matters.</b> d is the number of supercells, and w is just how wide each one is. So 16 × 1 and 16 × 4 get the same shape.</li><li><b>Make it as square as you can</b>, with r and c both powers of 2 and r × c = d. If it can't be a perfect square, give the extra factor of 2 to the rows, so r &gt; c.</li><li><b>b = log₂.</b> b_r = log₂ r is how many bits it takes to name a row, and b_c = log₂ c does the same for columns.</li><li><b>max(b_r, b_c)</b> is how many addr pins the chip needs, since rows and columns take turns on them.</li></ol>
<div class="tip"><span class="tl">Shortcut: split the exponent</span>Write d as 2ⁿ, then split n in half with the bigger half going to the rows. 128 = 2⁷ and 7 = 4 + 3, so r = 2⁴ = 16 and c = 2³ = 8. Then b_r = 4, b_c = 3, and the max is 4.</div>`+
powers2()+toy('shape'),
qs:[
{prompt:'How many bits does it take to name 16 rows (0 to 15)?',options:['4','16','8','2'],answer:0,explain:'2⁴ = 16, so b = log₂ 16 = 4 bits.'},
{prompt:'What is b_c for 32 columns?',options:['5','32','6','4'],answer:0,explain:'2⁵ = 32, so b_c = 5.'},
{prompt:'A <b>16 × 4</b> DRAM. What shape is its array?',options:['4 rows × 4 columns','16 rows × 4 columns','4 rows × 16 columns'],answer:0,hint:'Which number counts supercells?',explain:'Only d = 16 matters. The 4 just makes each supercell 4 bits wide.',after:gridBox(4,4)},
{prompt:'128 supercells. Rows × columns?',options:['16 × 8','8 × 16','128 × 1','11 × 11'],answer:0,hint:'128 = 2⁷. Split the 7, bigger half to the rows.',explain:'7 = 4 + 3, so r = 2⁴ = 16 and c = 2³ = 8. (11 × 11 isn\'t made of powers of 2, and it isn\'t 128.)',after:gridBox(16,8)},
{prompt:'512 supercells. Rows × columns?',options:['32 × 16','16 × 32','64 × 8','22 × 22'],answer:0,explain:'512 = 2⁹ and 9 = 5 + 4, so 32 × 16.'},
{prompt:'1024 supercells. Rows × columns?',options:['32 × 32','64 × 16','1024 × 1'],answer:0,explain:'1024 = 2¹⁰ and 10 = 5 + 5: a perfect square.'},
{prompt:'For a 128 × 8 DRAM, what is max(b_r, b_c)?',options:['4','3','7','8'],answer:0,explain:'r = 16 and c = 8, so b_r = 4 and b_c = 3. The bigger one is 4.'},
{prompt:'max(b_r, b_c) tells you',options:['how many addr pins the chip needs','how many data pins the chip needs','how wide each supercell is'],answer:0,explain:'The row and the column take turns on the same addr pins, so there have to be enough pins for the bigger one.'},
{prompt:'A 256 × 8 DRAM. Type max(b_r, b_c).',input:true,dec:true,expect:'4',explain:'256 = 2⁸ = 16 × 16, so b_r = b_c = 4.'},
{prompt:'Why is the squarest shape the best one?',options:['It keeps the bigger of b_r and b_c as small as possible','It stores more bits','It makes w bigger'],answer:0,explain:'128 supercells in one long line need 7 bits. As 16 × 8, the row needs only 4.'}
]},

{id:'nvm',sec:'p7',name:'Faster DRAM, and memory that remembers',short:'DRAM & ROM',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p><b>Faster DRAM.</b> The basic DRAM cell hasn't changed since 1966. What got better is the way it talks to the CPU:</p>
<div class="tbl-wrap"><table class="t"><tbody>
<tr><td class="c">SDRAM</td><td>Synchronized with the system clock. Reuses the row address: RAS, CAS, CAS, CAS.</td></tr>
<tr><td class="c">DDR SDRAM</td><td>Double data rate: uses both edges of the clock, so <b>2 bits per cycle per pin</b>. A small prefetch buffer sets the type: DDR = 2 bits, DDR2 = 4 bits, DDR3/4 = 8 bits. The Core i7 supports only DDR3.</td></tr>
</tbody></table></div>
<p><b>Memory that remembers.</b> SRAM and DRAM are <b>volatile</b>: power off, data gone. <b>Nonvolatile</b> memories keep their data with the power off:</p>
<div class="tbl-wrap"><table class="t"><tbody>
<tr><td class="c">ROM</td><td>Programmed during production</td></tr>
<tr><td class="c">PROM</td><td>Can be programmed once</td></tr>
<tr><td class="c">EPROM</td><td>Bulk erased with UV light or X-rays</td></tr>
<tr><td class="c">EEPROM</td><td>Erased electronically</td></tr>
<tr><td class="c">Flash</td><td>EEPROM that erases a sector at a time. Wears out after about <b>100,000</b> erasings.</td></tr>
</tbody></table></div>
<p>Uses: firmware like the BIOS (in ROM), solid state disks (flash), and disk caches.</p>
<div class="tip"><span class="tl">The letters build up</span>ROM → <b>P</b>ROM (you can <b>P</b>rogram it, once) → <b>E</b>PROM (<b>E</b>rasable, with light) → <b>EE</b>PROM (<b>E</b>lectrically <b>E</b>rasable) → Flash (EEPROM, a sector at a time).</div>`,
qs:[
{prompt:'"Volatile" memory',options:['loses its data when the power goes off','keeps its data with the power off','can only be written once'],answer:0,explain:'Like a volatile liquid, it disappears.'},
{prompt:'SRAM and DRAM are',options:['volatile','nonvolatile'],answer:0,keep:true,explain:'Both lose their data without power.'},
{prompt:'Which is programmed once, during production?',options:['ROM','PROM','EEPROM','Flash'],answer:0,explain:'Read-only memory: written at the factory.'},
{prompt:'Which can <b>you</b> program, but only once?',options:['PROM','ROM','EPROM','Flash'],answer:0,explain:'Programmable ROM.'},
{prompt:'Which is bulk erased with UV light or X-rays?',options:['EPROM','EEPROM','PROM','ROM'],answer:0,explain:'Erasable PROM.'},
{prompt:'Which is erased electronically?',options:['EEPROM','EPROM','PROM','ROM'],answer:0,explain:'Electrically erasable PROM.'},
{prompt:'Which erases a sector at a time and is used in SSDs?',options:['Flash','ROM','PROM','SRAM'],answer:0,explain:'Flash memory: EEPROM with partial (sector) erase.'},
{prompt:'Flash wears out after about how many erasings?',options:['100,000','1,000','It never wears out'],answer:0,explain:'About 100,000, from your slide.'},
{prompt:'Where is firmware like the BIOS stored?',options:['ROM','DRAM','SRAM'],answer:0,explain:'It has to survive power-off, so a nonvolatile ROM.'},
{prompt:'DDR SDRAM sends how many bits per clock cycle per pin?',options:['2','1','8'],answer:0,explain:'Double data rate: both clock edges.'},
{prompt:'DDR2\'s prefetch buffer is 4 bits. What is DDR3\'s?',options:['8 bits','4 bits','2 bits'],answer:0,explain:'DDR = 2, DDR2 = 4, DDR3/4 = 8.'},
{prompt:'SDRAM can go RAS, CAS, CAS, CAS. Why does that help?',options:['More reads from the same row skip the RAS step','It erases the row faster','It stores more bits'],answer:0,explain:'Same idea as Part 6: once the row is in the buffer, more CAS reads are cheap.'}
]},

{id:'atime',sec:'p7',name:'Disk access time',short:'Access time',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>Reading one sector takes three waits, one after another:</p>
<ol class="steps"><li><b>Seek</b>: move the heads over the right cylinder. Typically 3–9 ms.</li><li><b>Rotational latency</b>: wait for the first bit of the sector to spin under the head. On average, half a turn.</li><li><b>Transfer</b>: read the sector's bits as it passes. One sector's share of a turn.</li></ol>
<div class="rule-box">T access = T avg seek + T avg rotation + T avg transfer<br>One turn = 60,000 ms ÷ RPM<br>T avg rotation = ½ × one turn<br>T avg transfer = one turn ÷ (avg sectors per track)</div>`+
toy('atime')+
`<p>Your slide's example: 7,200 RPM, 9 ms seek, 400 sectors per track. One turn is 60,000 ÷ 7,200 = 8.33 ms, so rotation ≈ 4 ms and transfer ≈ 0.02 ms, and T access ≈ 9 + 4 + 0.02 = <b>13.02 ms</b>.</p>
<div class="tip"><span class="tl">Rounding</span>Exact math gives 4.17 ms for the rotation. The slide rounds it to 4 ms, which gives 13.02 ms. The answers here accept either.</div>
<p class="fine">The big lesson: seek and rotation take nearly all the time. The first bit of a sector is expensive, and the rest are nearly free. SRAM takes about 4 ns per doubleword and DRAM about 60 ns, so a disk is about <b>40,000×</b> slower than SRAM and <b>2,500×</b> slower than DRAM.</p>`,
qs:[
{prompt:'T access =',options:['T seek + T rotation + T transfer','T seek × T rotation','T transfer only'],answer:0,explain:'Three waits, added up.'},

{id:'fileread',sec:'p7',name:'Reading a whole file',short:'Whole files',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>Practice 7 Q3 reads a whole file, block after block. Getting to the <b>first</b> block costs the usual wait: <b>T avg seek + T avg rotation</b>. After that, it depends on where the other blocks are:</p>`+
cardPair('<b>Best case: side by side</b><p>The blocks fill whole tracks of one cylinder, so the head just keeps reading. <b>Each full track takes one full rotation</b> (T max rotation). Moving to the next surface of the same cylinder needs no seek, because all the heads move together.</p>','<b>Random case: scattered</b><p>Every block is somewhere new, so <b>every block</b> pays T avg seek + T avg rotation all over again.</p>')+
`<div class="rule-box">Best = T avg seek + T avg rotation + (number of full tracks) × T max rotation<br>Random = (number of blocks) × (T avg seek + T avg rotation)</div>
<p>A textbook example: a 1 MB file of 512-byte blocks is 2,000 blocks. The disk spins at 10,000 RPM (6 ms a turn, 3 ms on average), seeks in 5 ms, and fits 1,000 sectors on a track. Best: 5 + 3 + 2 × 6 = <b>20 ms</b>. Random: 2,000 × (5 + 3) = <b>16,000 ms</b>. That's 800 times slower.</p>`+
toy('fileread')+
`<div class="tip"><span class="tl">Counting blocks</span>Like the textbook, count 1 MB as 1,000 KB in these estimates, so 1 KB blocks make 1,000 blocks. The tiny transfer time for each block (a hundredth of a millisecond) is left out.</div>`,
qs:[
{prompt:'Before it can read the first block, the disk has to wait',options:['T avg seek + T avg rotation','one full rotation','nothing'],answer:0,explain:'Move the arm to the right cylinder, then wait for the block to spin around.'},

{prompt:'In the best case, why don\'t the later blocks need a seek?',options:['They\'re side by side on one cylinder, and switching surfaces doesn\'t move the arm','The disk skips seeks for files','The CPU caches them'],answer:0,explain:'All the heads move together, so every surface of the cylinder is already under a head.'},
{prompt:'In the random case, each block costs',options:['T avg seek + T avg rotation, all over again','one full rotation','nothing extra'],answer:0,explain:'Each block is somewhere new.'},
{prompt:'2,000 blocks, random case, 5 ms seek and 3 ms average rotation. Type the total in ms.',input:true,dec:true,expect:'16000',explain:'2,000 × (5 + 3) = 16,000 ms. That\'s 16 seconds.'},

`<ul class="facts"><li><b>USB controller</b>: mouse and keyboard.</li><li><b>Graphics adapter</b>: the monitor.</li><li><b>Disk controller</b>: the disk.</li><li><b>Expansion slots</b>: other devices, such as network adapters.</li></ul>`,

{prompt:'The mouse and keyboard connect to the',options:['USB controller','graphics adapter','disk controller'],answer:0,explain:'USB controller.'},
{prompt:'The monitor connects to the',options:['graphics adapter','USB controller','I/O bridge'],answer:0,explain:'The graphics adapter drives the monitor.'},
{prompt:'The disk connects to the',options:['disk controller','memory bus','graphics adapter'],answer:0,explain:'The disk controller.'},
{prompt:'A network adapter goes in',options:['an expansion slot','the memory bus','the CPU chip'],answer:0,explain:'Expansion slots are for other devices like network adapters.'},
{prompt:'The I/O bridge connects',options:['the system bus, the memory bus and the I/O bus','only the CPU and the disk','the mouse and the monitor'],answer:0,explain:'It sits in the middle of all three buses.'},

{id:'dread',sec:'p8',name:'Reading a disk sector',short:'Disk read',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>The disk is so slow that the CPU doesn't wait around for it. A disk read takes three steps. Watch the path light up:</p>`+
toy('trace',{list:true,next:'Next step',code:['CPU writes the request to the disk controller\'s port','Disk controller copies the sector into memory (DMA)','Disk controller interrupts the CPU: done!'],states:[
 {at:0,note:'Step 1: the CPU starts the read by writing a <b>command</b>, a <b>logical block number</b>, and a <b>destination memory address</b> to a <b>port</b>: an address that belongs to the disk controller.',vis:ioViz({on:['cpu','bridge','io','disk'],cargo:{sys:'command, block #, address'},io:'→ disk controller'})},
 {at:1,note:'Step 2: the disk controller reads the sector and copies it <b>straight into main memory</b>. That\'s <b>DMA</b>, direct memory access. The CPU isn\'t involved, so it can do other work.',vis:ioViz({on:['disk','io','bridge','main'],cargo:{mem:'sector data → memory'},io:'sector data →'})},
 {at:2,note:'Step 3: when the DMA transfer is done, the disk controller notifies the CPU with an <b>interrupt</b>: it signals a special "interrupt" pin on the CPU.',vis:ioViz({on:['disk','io','bridge','cpu'],cargo:{sys:'interrupt → CPU'},io:'interrupt →'})}]}),
qs:[
{prompt:'Put the steps of a disk read in order.',order:['The CPU writes a command, block number and memory address to the disk controller\'s port','The disk controller copies the sector into main memory (DMA)','The disk controller interrupts the CPU'],explain:'Ask, copy, notify.'},
{prompt:'What three things does the CPU write to the disk controller\'s port?',options:['A command, a logical block number, and a destination memory address','The sector\'s data','Only the block number'],answer:0,explain:'What to do, which block, and where in memory to put it.'},
{prompt:'A "port" here is',options:['an address that belongs to a device\'s controller','a USB socket','a register inside the CPU'],answer:0,explain:'Writing to that address sends the request to the disk controller.'},
{prompt:'DMA stands for',options:['direct memory access','disk memory adapter','data move algorithm'],answer:0,explain:'The device writes into memory directly.'},
{prompt:'During DMA, who copies the sector into memory?',options:['The disk controller','The CPU, one word at a time','The graphics adapter'],answer:0,explain:'That\'s the whole point of DMA.'},
{prompt:'How does the CPU find out the read is done?',options:['An interrupt from the disk controller','It keeps checking every nanosecond','The data shows up in %eax'],answer:0,explain:'The controller asserts the CPU\'s interrupt pin.'},
{prompt:'Why use DMA and an interrupt at all?',options:['So the CPU can do other work instead of waiting on the slow disk','To make the disk spin faster','To save disk space'],answer:0,explain:'A disk read takes milliseconds, and the CPU can run millions of instructions in that time.'}
]},

{id:'ssd',sec:'p8',name:'Solid state disks',short:'SSDs',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>An <b>SSD</b> has no spinning parts. It's <b>flash memory</b> plus a <b>flash translation layer</b> (FTL) that turns requests for logical disk blocks into flash operations.</p>`+
ssdViz()+
`<ul class="facts"><li>Flash memory is split into <b>blocks</b>, and each block into <b>pages</b>.</li><li>A page is <b>512 bytes to 4 KB</b>. A block is <b>32 to 128 pages</b>.</li><li>Data is read and written in units of <b>pages</b>.</li><li>A page can be written only after its whole <b>block has been erased</b>.</li><li>A block wears out after about <b>100,000</b> repeated writes.</li></ul>`,
qs:[
{prompt:'An SSD stores data in',options:['flash memory','spinning platters','DRAM'],answer:0,explain:'Flash: nonvolatile, no moving parts.'},
{prompt:'The flash translation layer',options:['turns requests for logical disk blocks into pages and blocks','spins the disk','erases the CPU cache'],answer:0,explain:'It sits between the I/O bus and the flash memory.'},
{prompt:'An SSD reads and writes in units of',options:['pages','blocks','bits'],answer:0,explain:'Pages. (But it erases whole blocks.)'},
{prompt:'How big is a page?',options:['512 bytes to 4 KB','32 to 128 KB','1 bit'],answer:0,explain:'From your slide.'},
{prompt:'How many pages are in a block?',options:['32 to 128','1','4,096'],answer:0,explain:'From your slide.'},
{prompt:'Before a page can be written, what must be erased?',options:['Its whole block','Just that page','The flash translation layer'],answer:0,explain:'The catch with flash: erase works on whole blocks.'},
{prompt:'A block wears out after about',options:['100,000 writes','1,000 writes','a billion writes'],answer:0,explain:'Same as flash in Part 7.'},
{prompt:'A block has 64 pages of 4 KB each. Type its size in KB.',input:true,dec:true,expect:'256',explain:'64 × 4 KB = 256 KB.'}
]},

{prompt:'A random read takes about',options:['50 µs','50 ms','50 ns'],answer:0,explain:'Microseconds. A disk takes milliseconds.'},
{prompt:'Why are random writes so slow?',options:['Erasing a block is slow, and one page write copies the whole block\'s useful pages','The flash spins slowly','Pages are bigger than blocks'],answer:0,explain:'Both reasons from your slide.'},
{prompt:'Erasing a block takes around',options:['1 ms','1 µs','1 s'],answer:0,explain:'About a millisecond.'},
{prompt:'Writing the new page into a different block can leave old copies of data behind. That\'s',options:['a security issue','a speed boost','extra capacity'],answer:0,explain:'Multiple copies of data can stick around.'},
{prompt:'On this SSD, which are faster?',options:['Reads','Writes'],answer:0,keep:true,explain:'Reads beat writes in every row of the table.'}
]},

{id:'ssdvs',sec:'p8',name:'SSD vs spinning disk',short:'SSD vs disk',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<div class="tbl-wrap"><table class="t"><thead><tr><th></th><th>SSD</th></tr></thead><tbody>
<tr><td>Advantages</td><td><b>No moving parts</b>, so it's faster, uses less power, and is more rugged.</td></tr>
<tr><td>Disadvantages</td><td>It can <b>wear out</b>. Wear-leveling logic in the flash translation layer spreads writes around to slow that down. Intel's X25 guarantees 1 petabyte (10¹⁵ bytes) of random writes before wearing out. In 2010, SSDs cost about <b>100×</b> more per byte.</td></tr>
<tr><td>Where you find them</td><td>MP3 players, phones and laptops, and more and more in desktops and servers.</td></tr>
</tbody></table></div>
<p>A spinning disk has to seek and wait for rotation, about 10 ms per access. The SSD's random read is about 50 µs.</p>`,
qs:[
{prompt:'Why are SSDs faster, lower-power and more rugged?',options:['No moving parts','Bigger platters','More DRAM inside'],answer:0,explain:'Nothing has to spin or seek.'},
{prompt:'What\'s an SSD\'s big disadvantage?',options:['It can wear out','It loses data when the power is off','It needs refreshing every 10 ms'],answer:0,explain:'Flash blocks wear out after many writes.'},
{prompt:'Wear leveling, in the flash translation layer,',options:['spreads writes across blocks so no block wears out early','makes reads faster','erases one page at a time'],answer:0,explain:'It keeps any one block from taking all the writes.'},
{prompt:'How much random writing does the Intel X25 guarantee before wearing out?',options:['1 petabyte (10¹⁵ bytes)','1 terabyte','100,000 bytes'],answer:0,explain:'From your slide.'},
{prompt:'In 2010, SSDs cost about how much more per byte than rotating disks?',options:['100×','2×','1,000×'],answer:0,explain:'About 100 times.'},
{prompt:'A disk access takes about 10 ms (10,000 µs). An SSD random read takes 50 µs. About how many times faster is the SSD? Type a number.',input:true,dec:true,expect:'200',explain:'10,000 µs ÷ 50 µs = 200.'},
{prompt:'Which one has seek time and rotational latency?',options:['A rotating disk','An SSD'],answer:0,keep:true,explain:'Only a spinning disk has heads to move and platters to wait for.'},
{prompt:'Where did SSDs show up first?',options:['MP3 players, phones and laptops','Only in big servers','Tape drives'],answer:0,explain:'They were beginning to appear in desktops and servers.'}
]},

{id:'wear',sec:'p8',name:'How long until it wears out?',short:'SSD lifetime',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>Flash wears out, so an SSD can only take so many bytes of writes in its life. How long it lasts is just a division:</p>
<div class="rule-box">lifetime = total bytes it can write ÷ bytes written per second (or per day)</div>
<ul class="facts"><li>Storage counts in powers of 10: MB = 10⁶, GB = 10⁹, TB = 10¹², PB = 10¹⁵ bytes.</li><li>A year has 60 × 60 × 24 × 365 = <b>31,536,000</b> seconds, about 3.15 × 10⁷.</li><li>Keep the powers of 10 separate: 128 × 10¹⁵ ÷ (470 × 10⁶) = (128 ÷ 470) × 10⁹ seconds.</li></ul>`+
toy('life')+
`<p class="fine">Part 8's slide had the Intel X25, which promised 1 PB of writes. Writing 100 GB every day, that's 10¹⁵ ÷ 10¹¹ = 10,000 days, about 27 years.</p>`,
qs:[
{prompt:'1 PB is how many bytes?',options:['10¹⁵','10¹²','10⁹','10¹⁸'],answer:0,explain:'P is for peta: 10¹⁵.'},
{prompt:'470 MB/s is how many bytes per second?',options:['470 × 10⁶','470 × 10⁹','470 × 10³'],answer:0,explain:'M is for mega: 10⁶.'},
{prompt:'How many seconds are in a year (365 days)?',options:['31,536,000','8,760','525,600','3,153,600'],answer:0,explain:'60 × 60 × 24 × 365 = 31,536,000. (8,760 is the hours in a year, and 525,600 the minutes.)'},
{prompt:'The lifetime in seconds is',options:['total bytes ÷ bytes per second','bytes per second ÷ total bytes','total bytes × bytes per second'],answer:0,explain:'How many seconds it takes to write all the bytes it can take.'},
{prompt:'1 PB written at 100 MB/s. Type how many seconds that takes.',input:true,num:true,expect:10000000,tol:0.5,show:'10,000,000 s',explain:'10¹⁵ ÷ 10⁸ = 10⁷ = 10,000,000 seconds.'},
{prompt:'About how many years is 10,000,000 seconds?',options:['0.32 years, about 4 months','3.2 years','32 years'],answer:0,explain:'10,000,000 ÷ 31,536,000 ≈ 0.32.'},
{prompt:'1 PB written at 20 GB per day. Type how many days it lasts.',input:true,dec:true,expect:'50000',explain:'10¹⁵ ÷ (20 × 10⁹) = 50,000 days, about 137 years.'},
{prompt:'Writing nonstop, which wears the SSD out sooner?',options:['470 MB/s: more bytes per second uses up the total faster','303 MB/s','Both the same'],answer:0,explain:'Lifetime = total ÷ rate, so a faster rate means a shorter life.'},
{prompt:'Why does a laptop\'s SSD last much longer than the nonstop worst case?',options:['It writes far fewer bytes per day','Laptop flash is better','Laptop SSDs never erase'],answer:0,explain:'A normal day of use writes a few GB, not hundreds of MB every single second.'}
]},

/* ===== Part 9 · Locality (L06 part 4) ===== */
{id:'gap',sec:'p9',name:'The CPU–memory gap',short:'The gap',shuffleOpts:true,
defaults:{m:null,code:false},
lesson:`<p>From 1985 to 2015, everything got faster and cheaper, but <b>not at the same pace</b>:</p>`+
gapBars()+trendsViz()+
`<p>CPU clock rates climbed until <b>2003</b>, when the Pentium 4 hit the <b>power wall</b>: faster clocks made too much heat. After that, CPUs got faster by adding <b>more cores</b> instead.</p>
<div class="tip"><span class="tl">The big idea</span>The CPU got about 2,000× faster, but DRAM only got 10× faster. That <b>gap keeps widening</b>. What saves us is a property of programs called <b>locality</b>, which is the rest of this part.</div>`,
qs:[
{prompt:'From 1985 to 2015, which got faster by the most?',options:['The CPU (effective cycle time, 2,075×)','DRAM access (10×)','Disk access (25×)'],answer:0,explain:'The CPU raced ahead.'},
{prompt:'DRAM access time improved by about',options:['10×','2,075×','44,000×'],answer:0,explain:'200 ns to 20 ns.'},
{prompt:'So the gap between CPU and memory speed is',options:['widening','shrinking','staying the same'],answer:0,explain:'The CPU keeps pulling ahead of DRAM and disk.'},
{prompt:'In 2003, with the Pentium 4, CPU designers hit',options:['the power wall','the 1 GHz limit','the cache wall'],answer:0,explain:'Faster clocks meant too much power and heat.'},
{prompt:'After the power wall, CPUs got faster mostly by',options:['adding more cores','raising the clock rate','using bigger disks'],answer:0,explain:'2 cores in 2005, 4 by 2010.'},
{prompt:'Which got cheaper by the most?',options:['Disk, per GB (3,333,333×)','DRAM, per MB (44,000×)','SRAM, per MB (116×)'],answer:0,explain:'$100,000 per GB down to 3 cents.'},
{prompt:'Clock rates went from 6 MHz (1985) to 3,000 MHz (2015). Type how many times faster.',input:true,dec:true,expect:'500',explain:'3,000 ÷ 6 = 500.'},
{prompt:'What helps bridge the CPU–memory gap?',options:['Locality','Faster disks','More registers'],answer:0,explain:'Your slide: "Locality to the rescue!"'}
]},

{id:'loc',sec:'p9',name:'Temporal vs spatial locality',short:'Two localities',shuffleOpts:true,
defaults:{m:null,code:false,options:['Temporal','Spatial'],keep:true},
lesson:`<p><b>The principle of locality</b>: programs tend to use data and instructions with addresses <b>near or equal to</b> the ones they used recently.</p>`+
cardPair('<b>Temporal locality</b><p>The <b>same item</b> is used again soon.</p><p class="fine">Temporal = time: the same thing again, soon.</p>','<b>Spatial locality</b><p>Items with <b>nearby addresses</b> are used close together in time.</p><p class="fine">Spatial = space: the neighbors, soon.</p>')+
`<p>Your slide's example finds both kinds in one tiny loop:</p>`+
codeBlock('sum = 0;\nfor (i = 0; i < n; i++)\n    sum += a[i];      # a[0], a[1], a[2]... next door each time\nreturn sum;           # sum: the same variable every time')+
`<div class="tbl-wrap"><table class="t"><thead><tr><th>Reference</th><th>Locality</th></tr></thead><tbody>
<tr><td>a[i] in order, one after another</td><td><b>Spatial</b></td></tr>
<tr><td>sum, every time through the loop</td><td><b>Temporal</b></td></tr>
<tr><td>The instructions, run in sequence</td><td><b>Spatial</b></td></tr>
<tr><td>The loop body, run again and again</td><td><b>Temporal</b></td></tr>
</tbody></table></div>`,
qs:[
{prompt:'<code>sum</code> is used every time through the loop.',answer:0,explain:'The same item, again and again: temporal.'},
{prompt:'<code>a[0]</code>, <code>a[1]</code>, <code>a[2]</code>, … are read in order.',answer:1,explain:'Neighbors in memory, one after another: spatial.'},
{prompt:'The loop\'s instructions run again and again.',answer:0,explain:'The same instructions repeat: temporal.'},
{prompt:'Instructions run one after another, in memory order.',answer:1,explain:'Each one sits right after the last: spatial.'},
{prompt:'<code>i</code> is read and updated on every pass.',answer:0,explain:'The same variable over and over: temporal.'},
{prompt:'A 2D array is read row by row.',answer:1,explain:'Row by row walks memory in order: spatial.'},
{prompt:'The same small function is called over and over.',answer:0,explain:'Its instructions get reused: temporal.'},
{prompt:'"Recently used items are likely to be used again soon."',answer:0,explain:'That\'s the definition of temporal locality.'},
{prompt:'"Items with nearby addresses tend to be used close together in time."',answer:1,explain:'That\'s the definition of spatial locality.'},
{prompt:'The principle of locality says programs',options:['tend to use addresses near or equal to ones they used recently','use memory in random order','only use registers'],keep:false,answer:0,explain:'That\'s why caches work.'}
]},

{id:'stride',sec:'p9',name:'Stride-k patterns',short:'Stride',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>A loop that visits <b>every</b> element in order has a <b>stride-1</b> pattern, also called a <b>sequential</b> pattern. Visiting every <b>k</b>th element is a <b>stride-k</b> pattern. Stride counts elements, not bytes.</p>`+
toy('stride')+
`<div class="tip"><span class="tl">The rule</span>As the stride grows, spatial locality gets <b>worse</b>. Stride-1 is the best.</div>`,
qs:[
{pre:'for (i = 0; i < n; i += 2)\n    sum += a[i];',prompt:'What stride is this?',options:['stride-2','stride-1','stride-8'],answer:0,explain:'i += 2 visits every 2nd element.'},
{prompt:'A stride-1 pattern is also called',code:false,options:['a sequential reference pattern','a random pattern','a stride-0 pattern'],answer:0,explain:'Every element, in order.'},
{prompt:'<code>int a[]</code>, stride 2. Which element is visited second?',options:['a[2]','a[1]','a[4]'],answer:0,explain:'a[0], then a[2], then a[4], and so on.'},
{prompt:'a starts at address 0. Where is that second visit, a[2]?',options:['8','2','4'],answer:0,explain:'2 ints × 4 bytes = 8.'},
{prompt:'<code>int a[]</code> at address 0, stride 3. The addresses of the first four visits?',code:false,options:['0, 12, 24, 36','0, 3, 6, 9','0, 4, 8, 12'],answer:0,explain:'Each step skips 3 ints = 12 bytes.'},
{prompt:'Which has better spatial locality?',options:['stride-1','stride-4'],answer:0,keep:true,explain:'Smaller stride, better spatial locality.'},
{prompt:'As the stride grows, spatial locality',code:false,options:['gets worse','gets better','stays the same'],answer:0,explain:'From your slide.'},
{prompt:'<code>double d[]</code> (8 bytes each), stride 2. Each step jumps how many bytes?',input:true,dec:true,expect:'16',explain:'2 elements × 8 bytes = 16.'},
{prompt:'Stride is counted in',code:false,options:['elements','bytes','cache lines'],answer:0,explain:'"With respect to the element size", as your slide says.'}
]},

{id:'rowcol',sec:'p9',name:'Rows vs columns',short:'Rows vs cols',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>Part 5 showed that C stores a 2D array <b>row by row</b>. So the order of your loops decides the stride. Run your slide's example both ways:</p>`+
toy('loops')+
`<ul class="facts"><li><b>i outside, j inside</b>: walks memory in order. <b>Stride-1</b>, good spatial locality.</li><li><b>j outside, i inside</b>: jumps a whole row each step. <b>Stride-N</b>, where N is the number of columns. Here N = 3.</li></ul>`+
'<div class="pair2">'+codeBlock('copyij: fast\nfor (i = 0; i < 2048; i++)\n  for (j = 0; j < 2048; j++)\n    dst[i][j] = src[i][j];')+codeBlock('copyji: 21× slower\nfor (j = 0; j < 2048; j++)\n  for (i = 0; i < 2048; i++)\n    dst[i][j] = src[i][j];')+'</div>'+
`<p class="fine">Same work, same answer, but on a Pentium 4 copyji is <b>21 times slower</b>, only because of the access pattern.</p>`,
qs:[
{pre:'for (i = 0; i < M; i++)\n    for (j = 0; j < N; j++)\n        sum += a[i][j];',prompt:'What pattern does this give?',options:['stride-1','stride-N','random'],answer:0,explain:'i outside, j inside walks memory in order.'},
{pre:'for (j = 0; j < N; j++)\n    for (i = 0; i < M; i++)\n        sum += a[i][j];',prompt:'M = 2 and N = 3. What pattern does this give?',options:['stride-3 (stride-N)','stride-1','stride-2'],answer:0,explain:'Each step moves down a row, which is 3 elements ahead in memory.'},
{pre:'for (j = 0; j < 3; j++)\n    for (i = 0; i < 2; i++)\n        sum += a[i][j];',prompt:'Tap the elements in the order this loop visits them.',order:['a[0][0]','a[1][0]','a[0][1]','a[1][1]','a[0][2]','a[1][2]'],explain:'i changes fastest: a[0][0], a[1][0], then the next column.'},
{pre:'for (j = 0; j < 3; j++)\n    for (i = 0; i < 2; i++)\n        sum += a[i][j];',prompt:'What is the access order of a[1][0], at address 12?',options:['2','4','3'],answer:0,explain:'It\'s visited right after a[0][0].',after:accTable({addr:['0','4','8','12','16','20'],cont:['a[0][0]','a[0][1]','a[0][2]','a[1][0]','a[1][1]','a[1][2]'],order:['1','3','5','2','4','6'],hl:[false,false,false,true,false,false]})},
{pre:'for (j = 0; j < 3; j++)\n    for (i = 0; i < 2; i++)\n        sum += a[i][j];',prompt:'And the access order of a[0][2], at address 8?',options:['5','3','6'],answer:0,explain:'Column 2 comes last: a[0][2] is 5th and a[1][2] is 6th.',after:accTable({addr:['0','4','8','12','16','20'],cont:['a[0][0]','a[0][1]','a[0][2]','a[1][0]','a[1][1]','a[1][2]'],order:['1','3','5','2','4','6'],hl:[false,false,true,false,false,false]})},
{prompt:'Which copy is faster?',code:false,options:['copyij: i outside, j inside','copyji: j outside, i inside'],answer:0,keep:true,explain:'It walks memory in order.'},
{prompt:'On a Pentium 4, about how many times slower is copyji?',options:['21','2','2,048'],answer:0,explain:'21 times slower, just from the access pattern.'},
{prompt:'Why is i-outside, j-inside the fast one?',code:false,options:['C stores rows one after another, so j inside walks memory in order','C stores columns one after another','The compiler skips the slow one'],answer:0,explain:'Row-major order, from Part 5.'},
{prompt:'<code>int a[100][100]</code>, j outside and i inside. Each step jumps how many bytes?',input:true,dec:true,expect:'400',explain:'One row: 100 ints × 4 bytes = 400.'}
]},

{id:'loop3d',sec:'p9',name:'3D arrays and loop order',short:'3D arrays',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>Practice 9 clears a <b>3D</b> array, <code>int m[N][N][N]</code>. C stores it row-major too: as you walk through memory, the <b>last</b> index changes fastest.</p>
<div class="rule-box">m[i][j][k] is at m + (i·N·N + j·N + k) × 4</div>
<ul class="facts"><li>k + 1: the very next int, 4 bytes away. <b>Stride-1.</b></li><li>j + 1: a whole row of N ints away. <b>Stride-N.</b></li><li>i + 1: a whole N × N slab away. <b>Stride-N².</b></li></ul>
<p>So the loop for the <b>last index</b> should be the innermost loop. Run your worksheet's three functions on a tiny m[2][2][2]:</p>`+
toy('loops3')+
`<div class="tip"><span class="tl">The pointer version</span><code>*ptr++ = 0</code> starts at m[0][0][0] and steps one int at a time, straight through memory. That's stride-1, using one simple loop instead of three.</div>`,
qs:[
{prompt:'<code>int m[2][2][2]</code>: which element comes right after m[0][0][0] in memory?',options:['m[0][0][1]','m[0][1][0]','m[1][0][0]'],answer:0,explain:'The last index changes fastest.'},
{prompt:'And which comes right after m[0][0][1]?',options:['m[0][1][0]','m[0][0][2]','m[1][0][0]'],answer:0,explain:'k has run out (N = 2), so j goes up by one and k starts over at 0.'},
{prompt:'In m[i][j][k], which index changes fastest as you walk through memory in order?',code:false,options:['k, the last one','i, the first one','j, the middle one'],answer:0,explain:'Row-major: the last index changes fastest.'},
{pre:'for (i...)\n  for (j...)\n    for (k...)\n      m[i][j][k] = 0;',prompt:'What pattern does this loop order give?',options:['stride-1','stride-N','stride-N²'],answer:0,explain:'k, the last index, is innermost, so each step goes to the very next int.'},
{pre:'for (i...)\n  for (k...)\n    for (j...)\n      m[i][j][k] = 0;',prompt:'Now j is innermost. Each step jumps',code:false,options:['N ints: stride-N','1 int: stride-1','N² ints: stride-N²'],answer:0,explain:'j + 1 is a whole row of N ints further on.'},
{prompt:'m[i][j][k] is at m + (___) × 4',options:['i·N·N + j·N + k','i + j·N + k·N·N','i·N + j·N + k'],answer:0,explain:'Skip i slabs of N·N ints, j rows of N ints, then k more ints.'},
{pre:'ptr = &m[0][0][0];\nfor (i = 0; i < N*N*N; i++)\n    *ptr++ = 0;',prompt:'How does this walk through memory?',code:false,options:['In order, one int at a time: stride-1','Every N ints: stride-N','At random'],answer:0,explain:'ptr++ moves to the very next int each time.'},
{prompt:'N = 800, and j is the innermost loop. Each step jumps how many bytes?',input:true,dec:true,expect:'3200',explain:'One row: 800 ints × 4 bytes = 3,200 bytes.'},
{prompt:'For <code>m[i][j][k]</code>, which loop should be innermost?',code:false,options:['The k loop, for the last index','The i loop','It doesn\'t matter'],answer:0,explain:'Then the writes walk straight through memory.'}
]},

{id:'cls9',sec:'p9',name:'Class Practice 9',short:'Class P9',shuffleOpts:true,
defaults:{m:null,code:true,tag:'From class'},
lesson:`<p>All four questions from In-Class Practice 9. They all come back to one idea from the last level: in m[i][j][k], the <b>last index</b> should change fastest.</p>`+
codeBlock('void clear_one(int m[N][N][N]) {      // i, j, k\n    for (i...) for (j...) for (k...)\n        m[i][j][k] = 0;\n}\nvoid clear_two(int m[N][N][N]) {      // i, k, j\n    for (i...) for (k...) for (j...)\n        m[i][j][k] = 0;\n}\nvoid clear_three(int m[N][N][N]) {    // one pointer\n    int *ptr = &(m[0][0][0]);\n    for (i = 0; i < N*N*N; i++)\n        *ptr++ = 0;\n}'),
qs:[
{tag:'From class · Q1',pre:'void clear_one(int m[N][N][N])\n{\n   int i, j, k;\n\n   for (i = 0; i < N; i++)\n      for (j = 0; j < N; j++)\n         for (k = 0; k < N; k++)\n            m[i][j][k] = 0;\n}',prompt:'What type of reference pattern does the clear_one function have?',options:['stride-1','stride-N','stride-N²','random'],answer:0,explain:'k is the innermost loop and the last index, so it writes one int after another. In the worksheet\'s box, type <b>stride-1</b>.'},
{tag:'From class · Q2',pre:'void clear_two(int m[N][N][N])\n{\n   int i, j, k;\n\n   for (i = 0; i < N; i++)\n      for (k = 0; k < N; k++)\n         for (j  = 0; j < N; j++)\n            m[i][j][k] = 0;\n}',prompt:'Compare clear_one and clear_two. Which function has better spatial locality?',code:false,options:['The clear_two function has better spatial locality.','The clear_one function has better spatial locality.','Both have equivalent spatial locality.'],answer:1,keep:true,explain:'clear_two puts j innermost, so every write jumps a whole row of N ints (stride-N). clear_one is stride-1.'},
{tag:'From class · Q3',prompt:'Q3: sort clear_one, clear_two and clear_three by spatial locality and reference pattern.',

  {label:'clear_two',ask:'<code>clear_two</code> (j innermost)',options:['Good Locality','Poor Locality'],answer:1,keep:true,say:'Stride-N.',fill:{b:'Poor Locality'}},
  {label:'clear_three',ask:'<code>clear_three</code> (*ptr++)',options:['Poor Locality','Good Locality'],answer:1,keep:true,say:'Straight through memory: stride-1.',fill:{c:'Good Locality'}},
  {label:'stride-1',ask:'stride-1',options:['Poor Locality','Good Locality'],answer:1,keep:true,say:'Every neighbor, in order.',fill:{d:'Good Locality'}},
  {label:'stride-k',ask:'stride-k',options:['Good Locality','Poor Locality'],answer:1,keep:true,say:'It skips k − 1 elements every step.',fill:{e:'Poor Locality'}}],
 explain:'Good: clear_one, clear_three and stride-1. Poor: clear_two and stride-k. The choices are in the same order as the worksheet\'s menus.'},

 guided:[{label:'Slowest',ask:'Which one is stride-N, so it should be the slowest?',options:['clear_two','clear_one','clear_three'],answer:0,keep:true,say:'j is innermost: every write jumps 800 ints.',fill:{slow:'clear_two'}},
  {label:'Tie-break',ask:'clear_one and clear_three both walk memory in order. What does clear_three save?',code:false,options:['Two of the three loops and the m[i][j][k] index math','The memory writes','Nothing: they do exactly the same work'],answer:0,say:'One simple loop, and the pointer just moves to the next int.',fill:{mid:'clear_one'}},

  {label:'Fix',ask:'How do you fix it?',options:['Swap the loops: i outside, j inside','Make the array bigger','Add a second sum'],answer:0,say:'Then j changes first and memory is read in order.'}],

   T_([['<b>ZF</b>','the answer is 0, so they were equal','either'],['<b>SF</b>','the answer is negative','signed'],['<b>CF</b>','S2 is below S1','unsigned'],['<b>OF</b>','the signed answer doesn\'t fit (a byte holds −128 to 127)','signed']],['Flag','Is 1 when','Reads values as'])+
   '<p><code>test S1, S2</code> computes S2 AND S1. <code>test %eax, %eax</code> checks %eax itself, and test always sets CF = OF = 0.</p>'+
   '<h3>One byte, two readings</h3><p>0x00–0x7F: both readings match. 0x80–0xFF: signed = unsigned − 256. A negative n is stored as 256 + n.</p>'+
   '<h3>set and jumps: "is S2 ___ S1?"</h3>'+T_([['e / ne','equal / not equal','either'],['g / ge / l / le','greater / greater or equal / less / less or equal','signed'],['a / ae / b / be','above / above or equal / below / below or equal','unsigned']],['Letters','Question','Reads as'])+
   '<p>set puts 1 or 0 in a byte like %al. A jump jumps when the answer is yes. <code>jz</code> = <code>je</code>, <code>jnz</code> = <code>jne</code>, <code>jmp</code> always jumps. Fake: jlt, jgt, jeq, jet.</p>'+
   '<h3>Patterns</h3><ul class="facts"><li>A jump that <b>skips</b> code uses the opposite condition: <code>if (a == b)</code> skips with <code>jne</code>.</li><li><code>while (size)</code>: <code>test %edi, %edi</code>, then <code>jz</code> out of the loop.</li><li><code>xor %eax, %eax</code> sets %eax to 0.</li></ul>'},
  {id:'p4',part:'Part 4',name:'Procedures',src:'In-Class Practice 4',next:'p5',
   intro:'How one function calls another. Three things have to happen: jump there and back, hand over the arguments, and make room for local variables. The stack and a few registers do all three, and you can step through each one.',
   after:'or move on to Part 5.',
   path:[['stk','callret','Jumping there and back','push and pop with a live stack, then call and ret, step by step.'],['args','saves','Data and memory','Argument registers, stack frames, and who saves which register.'],['cls4','cls4','Class questions','All three Practice 4 questions as guided problems, plus two new ones.']],
   sheet:'<div class="rule-box">pushq X: %rsp − 8, then write X there<br>popq X: read the top into X, then %rsp + 8</div><p>The stack grows toward <b>lower</b> addresses. IA32\'s pushl and popl move by 4.</p>'+
   '<div class="rule-box">call f: push the return address (the next line), then jump to f<br>ret: pop the return address into %rip</div>'+
   '<h3>Arguments</h3>'+argsViz()+'<p>Diane\'s Silk Dress Costs $89. A 7th argument goes on the stack. An int argument uses the 4-byte name: %edi, %esi, %edx.</p>'+
   '<h3>Stack frames</h3><p><code>subq $48, %rsp</code> makes 48 bytes of room. <code>addq $48, %rsp</code> gives it back before <code>ret</code>, so ret pops the return address.</p>'+
   '<h3>Who saves registers</h3>'+T_([['Caller-save','%eax %edx %ecx','%r10 %r11, %rax and the argument registers'],['Callee-save','%ebx %esi %edi','%rbx %rbp %r12–%r15'],['Special','%esp %ebp','%rsp']],['','IA32','x86-64'])},
  {id:'p5',part:'Part 5',name:'Arrays',src:'In-Class Practice 5 · L05',next:'p6',
   intro:'How arrays sit in memory, and how expressions like <code>S[3]</code> and <code>&amp;S[i]</code> become lea and mov. Then the rest of L05: 2D arrays, arrays of pointers, and structs.',
   after:'or try the Parts 4–5 mix.',
   path:[['tsize','decl','How big','Type sizes, then reading a declaration.'],['eaddr','leamov','Where and what','Element i, pointer math, then the array recipe: lea vs mov.'],['cls5a','cls5b','Class questions','Both Practice 5 questions, one row at a time.'],['grid2d','struct','Beyond the worksheet (L05)','2D arrays, arrays of pointers and structs, for the exam.']],
   sheet:T_([['char','1','b'],['short','2','w'],['int','4','l'],['long, double','8','q'],['any pointer (x86-64)','8','q']],['Type','Bytes','Suffix'])+
   '<div class="rule-box">T A[N]: N × size(T) bytes. Element i starts at x + size × i.</div>'+
   '<h3>The array recipe</h3><ol class="steps"><li><b>Value or address?</b> Brackets alone give a value (type T). A plain name, + or &amp; give an address (type T *).</li><li><b>Bytes in</b>: multiply the whole index by the element size. Values get M[…].</li><li><b>Instruction</b>: an address uses <code>leaq</code> into %rax. A value uses <code>mov</code> sized to the element (movw into %ax for a short). Split into D(%rdx,%rcx,S).</li></ol>'+
   '<h3>From L05</h3><ul class="facts"><li>2D array <code>T A[R][C]</code>, row-major: A[i][j] is at A + (i·C + j)·K.</li><li>Array of pointers (univ): Mem[Mem[univ + 4·index] + 4·dig], two reads.</li><li>struct rec {int a[3]; int i; struct rec *n;}: a at 0, i at 12, n at 16. 20 bytes on IA32, 24 on x86-64. r->i is at r + 12.</li></ul>'},
  {id:'p6',part:'Part 6',name:'Memory & DRAM',src:'L06 part 1 · In-Class Practice 6',next:'p7',
   intro:'Part 6 starts the memory hierarchy: why computers use a pyramid of memories, how SRAM and DRAM differ, and what happens inside a DRAM chip when you read it. Tap the chip and watch. Then Practice 6\'s table, one row at a time.',
   after:'or move on to Part 7.',
   path:[['pyr','sram','Kinds of memory','The pyramid, then SRAM vs DRAM.'],['dram','rcbits','Inside DRAM','Supercells, RAS and CAS, modules, then picking rows × columns.'],['cls6','cls6','Class questions','Practice 6\'s table, one row at a time, with its label bank.'],['ex6','ex6','Exam-style practice','More DRAM problems with new numbers.']],
   sheet:pyramidViz()+T_([['Parts per bit','4–6 transistors','1 transistor + 1 capacitor'],['Keeps its value?','Yes, while powered','Refresh every 10–100 ms'],['Disturbances','Not sensitive','Sensitive'],['Cost','1000×','1×'],['Used for','Caches','Main memory']],['','SRAM','DRAM'])+
   '<h3>A d × w DRAM chip</h3><p>d supercells of w bits, in a square. 16 × 8: 16 supercells, 8 bits each, 4 × 4, 2 addr pins, 8 data pins.</p>'+
   '<ol class="steps"><li>RAS = row: the whole row is copied into the row buffer.</li><li>CAS = column: that supercell goes out on the data pins.</li></ol>'+
   '<p>Square layout: fewer pins, but two steps (slower). Reading more of the same row only needs more CAS.</p>'+
   '<h3>Modules</h3><p>64 MB = eight 8M × 8 DRAMs. All get the same (i, j). DRAM k supplies bits 8k to 8k + 7 of the 64-bit word.</p>'+
   '<h3>Rows × columns (Practice 6)</h3><p>Only d matters, not w. Write d = 2ⁿ and split n in half, bigger half to the rows. b_r = log₂ r, b_c = log₂ c, and max(b_r, b_c) is the number of addr pins.</p>'+T_([['32 × 8','8','4','3','2','3'],['256 × 4','16','16','4','4','4'],['2048 × 1','64','32','6','5','6']],['d × w','r','c','b_r','b_c','max'])},
  {id:'p7',part:'Part 7',name:'Buses & Disks',src:'L06 part 2 · In-Class Practice 7',next:'p8',
   intro:'How the CPU and memory talk over buses, what memory survives a power-off, and how a spinning disk works: its shape, its capacity, and why it\'s so slow. Then all three Practice 7 questions, step by step.',
   after:'or move on to Part 8.',
   path:[['nvm','bus','Memory and buses','Faster DRAM, nonvolatile memory, then reads and writes over the bus.'],['disk','fileread','Disks','Geometry, capacity, access time, then reading a whole file.'],['cls7','cls7','Class questions','All three Practice 7 questions, step by step.'],['ex7','ex7','Exam-style practice','New capacity and access-time problems.']],
   sheet:'<p><b>SDRAM</b>: synced to the clock, can reuse a row (RAS, CAS, CAS, CAS). <b>DDR</b>: 2 bits per cycle per pin. Prefetch: DDR 2, DDR2 4, DDR3/4 8 bits.</p>'+
   T_([['ROM','programmed in production'],['PROM','programmed once'],['EPROM','erased with UV or X-rays'],['EEPROM','erased electronically'],['Flash','EEPROM, erases a sector at a time; ~100,000 erasings']],['Nonvolatile','Detail'])+
   '<h3>Bus trips</h3><p>CPU → system bus → I/O bridge → memory bus → memory. <b>Read</b>: address out, data x back, x into the register. <b>Write</b>: address out (memory waits), data y out, memory stores y. Reads are faster: they can overlap, writes are sequential.</p>'+
   '<h3>Disks</h3><p>Platters (2 surfaces each) → tracks (rings) → sectors (with gaps). Lined-up tracks form a cylinder. Heads move together.</p>'+
   '<div class="rule-box">Capacity = bytes/sector × sectors/track × tracks/surface × surfaces/platter × platters<br>1 GB = 10⁹ bytes</div>'+
   '<div class="rule-box">T access = T seek + T rotation + T transfer<br>one turn = 60,000 ms ÷ RPM<br>T rotation = ½ turn,  T transfer = turn ÷ sectors per track</div>'+
   '<p>Example: 7,200 RPM, 9 ms seek, 400 sectors → 9 + 4 + 0.02 = 13.02 ms. Seek and rotation dominate. A disk is about 2,500× slower than DRAM and 40,000× slower than SRAM.</p>'+
   '<h3>Reading a whole file (Practice 7 Q3)</h3><p>Best case, side by side: T avg seek + T avg rotation + (full tracks) × T max rotation. Random: blocks × (T avg seek + T avg rotation). Count 1 MB as 1,000 KB. Cylinders = tracks per surface.</p>'},
  {id:'p8',part:'Part 8',name:'I/O & SSDs',src:'L06 part 3 · In-Class Practice 8',next:'p9',
   intro:'How devices hang off the I/O bus, how a disk read happens without tying up the CPU, and how solid state disks work, including why writing to them is slow. Then Practice 8\'s SSD lifetimes.',
   after:'or move on to Part 9.',
   path:[['iobus','dread','I/O','The I/O bus, then a disk read: port, DMA, interrupt.'],['ssd','wear','SSDs','Pages and blocks, writing a page, SSD vs disk, and how long one lasts.'],['cls8','cls8','Class questions','Practice 8\'s three SSD lifetimes, step by step.'],['ex8','ex8','Exam-style practice','Mixed problems, some step by step.']],
   sheet:'<p>I/O bus: USB controller (mouse, keyboard), graphics adapter (monitor), disk controller (disk), expansion slots (network adapters). The I/O bridge joins the system, memory and I/O buses.</p>'+
   '<h3>Reading a disk sector</h3><ol class="steps"><li>CPU writes a command, logical block number, and destination address to the disk controller\'s port.</li><li>The disk controller copies the sector into memory by DMA (direct memory access).</li><li>When done, it interrupts the CPU.</li></ol>'+
   '<h3>SSDs</h3><p>Flash memory + flash translation layer. Pages: 512 B–4 KB. Blocks: 32–128 pages. Read/write pages, but a page can only be written after its block is erased. A block wears out after ~100,000 writes.</p>'+
   T_([['Sequential','550 MB/s','470 MB/s'],['Random','365 MB/s','303 MB/s'],['Random access','50 µs','60 µs']],['','Read','Write'])+
   '<p>Random writes are slow: erasing takes ~1 ms and one page write copies the whole block. SSDs: no moving parts (faster, less power, rugged), but they wear out (wear leveling helps) and cost ~100× more per byte (2010).</p>'+
   '<h3>How long an SSD lasts (Practice 8)</h3><div class="rule-box">lifetime = total bytes ÷ write rate</div><p>PB = 10¹⁵, GB = 10⁹, MB = 10⁶ bytes. A year is 31,536,000 seconds, or 365 days.</p>'},
  {id:'p9',part:'Part 9',name:'Locality',src:'L06 part 4 · In-Class Practice 9',next:'rev',
   intro:'Why the memory hierarchy works at all. CPUs got far faster than memory, and what saves us is locality. You\'ll judge code the way your slides ask: spot temporal and spatial locality, strides, and good and bad loops. Then Practice 9\'s three clear functions.',
   after:'or try the Parts 6–9 mix.',
   path:[['gap','loc','Why locality','The CPU–memory gap, then temporal vs spatial locality.'],['stride','loop3d','Access patterns','Stride-k, rows vs columns, then 3D arrays.'],['cls9','cls9','Class questions','All four Practice 9 questions on clear_one, clear_two and clear_three.'],['ex9','ex9','Exam-style practice','Judge real loops, step by step.']],
   sheet:'<p>1985–2015: the CPU\'s effective cycle time got 2,075× faster, DRAM access only 10×. After the 2003 power wall, CPUs added cores. The gap keeps widening, and locality bridges it.</p>'+
   T_([['Temporal','the same item is used again soon','sum, i, a loop\'s instructions'],['Spatial','nearby addresses are used close together','a[0], a[1], a[2]…; instructions in sequence']],['Locality','Meaning','Example'])+
   '<h3>Strides</h3><p>Stride-1 (sequential) visits every element. Stride-k visits every kth. Bigger stride, worse spatial locality.</p>'+
   '<h3>2D arrays</h3><p>C is row-major. <b>i outside, j inside</b>: stride-1, fast. <b>j outside, i inside</b>: stride-N, slow (copyji is 21× slower on a Pentium 4).</p>'+
   '<h3>Why a hierarchy</h3><p>Fast storage costs more per byte, holds less and uses more power. The CPU–memory gap is widening. Good programs have locality. Together: a memory hierarchy.</p>'+
   '<h3>3D arrays (Practice 9)</h3><p>m[i][j][k] is at m + (i·N·N + j·N + k) × 4. Put the loop for the last index, k, innermost for stride-1. A pointer stepping through with *ptr++ is stride-1 with the least loop work.</p>'},

var STORE='will-it-assemble:v1';
var S={view:'home',sec:'p1',xp:0,streak:0,best:{},cur:null,lab:'movb %eax, (%esp)',labMode:'val',labM:'practice',labOp:'(%rax,%rdx,4)',labF:{op:'cmp',bits:8,v1:'0xaa',v2:'0x53'},confirmReset:false};
function save(){try{localStorage.setItem(STORE,JSON.stringify({best:S.best,xp:S.xp,v:6}));}catch(e){}}
function loadSaved(){try{var v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&typeof v==='object')return v;}catch(e){}return null;}
function pipsFor(m){return m===0?4:m===1?3:m<=3?2:1;}
function secLevels(id){var out=[];LEVELS.forEach(function(L,k){if(L.sec===id)out.push(k);});return out;}
function secNext(id){var ls=secLevels(id);for(var k=0;k<ls.length;k++){if(!S.best[LEVELS[ls[k]].id])return ls[k];}return -1;}
function secCleared(id){return secLevels(id).filter(function(k){return S.best[LEVELS[k].id];}).length;}
function defaultSec(){for(var k=0;k<SECTIONS.length;k++){if(secNext(SECTIONS[k].id)!==-1)return SECTIONS[k].id;}return 'rev';}

function buildSet(L){
  var all=range(L.qs.length);
  if(!L.pick) return all;
  var out=[];
  Object.keys(L.pick).forEach(function(g){var pool=shuffle(all.filter(function(k){return L.qs[k].grp===g;}));out=out.concat(pool.slice(0,L.pick[g]));});
  return shuffle(out);
}
function startLevel(li){
  var L=LEVELS[li]; S.sec=L.sec; S.view='level';
  if(S.cur&&S.cur.li===li&&S.cur.phase!=='done')return;
  var set=buildSet(L), perm={}, gperm={};
  set.forEach(function(k){var q=L.qs[k];
    if(q.options){var p=range(q.options.length);if(L.shuffleOpts&&!q.keep)shuffle(p);perm[k]=p;}
    if(q.order){var po=range(q.order.length),n=0;do{shuffle(po);n++;}while(n<20&&q.order.length>2&&po.every(function(x,i){return x===i;}));perm[k]=po;}
    if(q.guided){gperm[k]=q.guided.map(function(st){var pg=range(st.options.length);if(!st.keep)shuffle(pg);return pg;});}
  });
  S.cur={li:li,id:L.id,phase:'lesson',set:set,queue:set.slice(),perm:perm,gperm:gperm,g:null,ord:[],solved:[],missed:[],mistakes:0,answered:null};
}
function curQ(){var c=S.cur;if(!c||!c.queue.length)return null;return LEVELS[c.li].qs[c.queue[0]];}
function permOf(c,qi,q){var p=c.perm&&c.perm[qi];if(p&&q.options&&p.length===q.options.length)return p;return q.options?range(q.options.length):[];}
function solFor(q){var M=q.m?MACHINES[q.m]:null,op=q.solve||q.op;return (M&&op)?solveOperand(op,M):null;}
function expectedFor(q,sol){if(q.num)return q.show||(fmtNum(q.expect)+(q.unit?' '+q.unit:''));if(q.expect)return q.expect;if(!sol||sol.error)return null;return q.ask==='address'?toHex(sol.addr):sol.vStr;}
function trapFor(q,sol,val){
  var n=normHex(val); if(n===null) return null;
  var lists=[]; if(q.traps)lists.push(q.traps); if(sol&&!sol.error)lists.push(q.ask==='address'?sol.addrTraps:sol.valTraps);
  for(var i=0;i<lists.length;i++){for(var j=0;j<lists[i].length;j++){if(normHex(lists[i][j].v)===n)return lists[i][j].msg;}}
  if(sol&&!sol.error&&sol.kind==='mem'&&q.ask!=='address'&&q.m){
    var M=MACHINES[q.m],hit=null;
    M.mem.some(function(m){if(normHex(m[1])===n){hit=m[0];return true;}return false;});
    if(hit) return 'That\'s the value at '+esc(hit)+', a different address. Recheck the address math.';
  }
  return null;
}

function record(correct,info){

function answer(k){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q)return;
  if(q.guided){gAnswer(k);return;}
  if(q.order){ordTap(k);return;}
  if(q.input||!q.options)return;
  var perm=permOf(c,c.queue[0],q); if(k<0||k>=perm.length)return;
  var oi=perm[k], correct=oi===q.answer, info={picked:k};
  if(!correct) info.trap=trapFor(q,solFor(q),q.options[oi]);
  record(correct,info);
}
function gAnswer(k){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||!q.guided)return;
  var qi=c.queue[0]; if(!c.g)c.g={k:0,wrong:{},miss:0,picks:[]};
  var g=c.g, st=q.guided[g.k]; if(!st)return;
  var perm=gPerm(c,qi,g.k,q); if(k<0||k>=perm.length)return;
  var wr=g.wrong[g.k]=g.wrong[g.k]||[]; if(wr.indexOf(k)>=0)return;
  if(perm[k]===st.answer){
    g.picks[g.k]=k; g.k++;
    if(g.k>=q.guided.length){record(g.miss===0,{guided:true,miss:g.miss});return;}
    render(); focusCard(false);
    var now=document.querySelector('.gd-s.now'); if(now){var b=now.getBoundingClientRect();if(b.bottom>window.innerHeight)now.scrollIntoView({block:'nearest',behavior:smooth()});}
  } else { wr.push(k); g.miss++; render(); focusCard(false); }
}
function ordTap(k){
