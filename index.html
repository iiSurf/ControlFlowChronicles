{id:'gap',sec:'p9',name:'The CPU–memory gap',short:'The gap',shuffleOpts:true,
defaults:{m:null,code:false},
recap:"From 1985 to 2015, CPUs got about 2,000× faster, but DRAM only 10× and disks 25×. That widening <b>gap</b> is why caches and locality matter.",
lesson:`<p>From 1985 to 2015, everything got faster and cheaper, but <b>not at the same pace</b>:</p>`+
gapBars()+trendsViz()+
`<p>CPU clock rates climbed until <b>2003</b>, when the Pentium 4 hit the <b>power wall</b>: faster clocks made too much heat. After that, CPUs got faster by adding <b>more cores</b> instead.</p>
<div class="tip"><span class="tl">The big idea</span>The CPU got about 2,000× faster, but DRAM only got 10× faster. That <b>gap keeps widening</b>. What saves us is a property of programs called <b>locality</b>, which is the rest of this part.</div>`,
qs:[
{prompt:'From 1985 to 2015, which got faster by the most?',options:['The CPU (effective cycle time, 2,075×)','DRAM access (10×)','Disk access (25×)'],answer:0,explain:'The CPU raced ahead.'},
{prompt:'DRAM access time improved by about',options:['10×','2,075×','44,000×'],answer:0,explain:'200 ns to 20 ns.'},
{prompt:'So the gap between CPU and memory speed is',options:['widening','shrinking','staying the same'],answer:0,explain:'The CPU keeps pulling ahead of DRAM and disk.'},
{prompt:'In 2003, with the Pentium 4, CPU designers hit',options:['the power wall','the 1 GHz limit','the cache wall'],answer:0,explain:'Faster clocks meant too much power and heat.'},
{prompt:'After the power wall, CPUs got faster mostly by',options:['adding more cores','raising the clock rate','using bigger disks'],answer:0,explain:'2 cores in 2005, 4 by 2010.'},
{prompt:'Which got cheaper by the most?',options:['Disk, per GB (3,333,333×)','DRAM, per MB (44,000×)','SRAM, per MB (116×)'],answer:0,explain:'$100,000 per GB down to 3 cents.'},
{prompt:'Clock rates went from 6 MHz (1985) to 3,000 MHz (2015). Type how many times faster.',input:true,dec:true,expect:'500',explain:'3,000 ÷ 6 = 500.'},
{prompt:'What helps bridge the CPU–memory gap?',options:['Locality','Faster disks','More registers'],answer:0,explain:'Your slide: "Locality to the rescue!"'}
]},

{id:'loc',sec:'p9',name:'Temporal vs spatial locality',short:'Two localities',shuffleOpts:true,
defaults:{m:null,code:false,options:['Temporal','Spatial'],keep:true},
recap:"<b>Temporal</b> = time: the same item again, soon. <b>Spatial</b> = space: its neighbors, soon.",
lesson:`<p><b>The principle of locality</b>: programs tend to use data and instructions with addresses <b>near or equal to</b> the ones they used recently.</p>`+
cardPair('<b>Temporal locality</b><p>The <b>same item</b> is used again soon.</p><p class="fine">Temporal = time: the same thing again, soon.</p>','<b>Spatial locality</b><p>Items with <b>nearby addresses</b> are used close together in time.</p><p class="fine">Spatial = space: the neighbors, soon.</p>')+
`<p>Your slide's example finds both kinds in one tiny loop:</p>`+
codeBlock('sum = 0;\nfor (i = 0; i < n; i++)\n    sum += a[i];      # a[0], a[1], a[2]... next door each time\nreturn sum;           # sum: the same variable every time')+
`<p>Which kind is each one? Sort them:</p>${toy('sorter',{s:'loc',title:'Try it · temporal or spatial?'})}
<details class="ref"><summary>The same answers as a table</summary>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Reference</th><th>Locality</th></tr></thead><tbody>
<tr><td>a[i] in order, one after another</td><td><b>Spatial</b></td></tr>
<tr><td>sum, every time through the loop</td><td><b>Temporal</b></td></tr>
<tr><td>The instructions, run in sequence</td><td><b>Spatial</b></td></tr>
<tr><td>The loop body, run again and again</td><td><b>Temporal</b></td></tr>
</tbody></table></div></details>`,
qs:[
{prompt:'<code>sum</code> is used every time through the loop.',answer:0,explain:'The same item, again and again: temporal.'},
{prompt:'<code>a[0]</code>, <code>a[1]</code>, <code>a[2]</code>, … are read in order.',answer:1,explain:'Neighbors in memory, one after another: spatial.'},
{prompt:'The loop\'s instructions run again and again.',answer:0,explain:'The same instructions repeat: temporal.'},
{prompt:'Instructions run one after another, in memory order.',answer:1,explain:'Each one sits right after the last: spatial.'},
{prompt:'<code>i</code> is read and updated on every pass.',answer:0,explain:'The same variable over and over: temporal.'},
{prompt:'A 2D array is read row by row.',answer:1,explain:'Row by row walks memory in order: spatial.'},
{prompt:'The same small function is called over and over.',answer:0,explain:'Its instructions get reused: temporal.'},
{prompt:'"Recently used items are likely to be used again soon."',answer:0,explain:'That\'s the definition of temporal locality.'},
{prompt:'"Items with nearby addresses tend to be used close together in time."',answer:1,explain:'That\'s the definition of spatial locality.'},
{prompt:'The principle of locality says programs',options:['tend to use addresses near or equal to ones they used recently','use memory in random order','only use registers'],keep:false,answer:0,explain:'That\'s why caches work.'}
]},

{id:'stride',sec:'p9',name:'Stride-k patterns',short:'Stride',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"Stride-1, every element in order, is the best. The bigger the stride, the worse the spatial locality.",
lesson:`<p>A loop that visits <b>every</b> element in order has a <b>stride-1</b> pattern, also called a <b>sequential</b> pattern. Visiting every <b>k</b>th element is a <b>stride-k</b> pattern. Stride counts elements, not bytes.</p>`+
toy('stride')+
`<div class="tip"><span class="tl">The rule</span>As the stride grows, spatial locality gets <b>worse</b>. Stride-1 is the best.</div>`,
qs:[
{pre:'for (i = 0; i < n; i += 2)\n    sum += a[i];',prompt:'What stride is this?',options:['stride-2','stride-1','stride-8'],answer:0,explain:'i += 2 visits every 2nd element.'},
{prompt:'A stride-1 pattern is also called',code:false,options:['a sequential reference pattern','a random pattern','a stride-0 pattern'],answer:0,explain:'Every element, in order.'},
{prompt:'<code>int a[]</code>, stride 2. Which element is visited second?',options:['a[2]','a[1]','a[4]'],answer:0,explain:'a[0], then a[2], then a[4], and so on.'},
{prompt:'a starts at address 0. Where is that second visit, a[2]?',options:['8','2','4'],answer:0,explain:'2 ints × 4 bytes = 8.'},
{prompt:'<code>int a[]</code> at address 0, stride 3. The addresses of the first four visits?',code:false,options:['0, 12, 24, 36','0, 3, 6, 9','0, 4, 8, 12'],answer:0,explain:'Each step skips 3 ints = 12 bytes.'},
{prompt:'Which has better spatial locality?',options:['stride-1','stride-4'],answer:0,keep:true,explain:'Smaller stride, better spatial locality.'},
{prompt:'As the stride grows, spatial locality',code:false,options:['gets worse','gets better','stays the same'],answer:0,explain:'From your slide.'},
{prompt:'<code>double d[]</code> (8 bytes each), stride 2. Each step jumps how many bytes?',input:true,dec:true,expect:'16',explain:'2 elements × 8 bytes = 16.'},
{prompt:'Stride is counted in',code:false,options:['elements','bytes','cache lines'],answer:0,explain:'"With respect to the element size", as your slide says.'}
]},

{id:'rowcol',sec:'p9',name:'Rows vs columns',short:'Rows vs cols',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"C stores arrays row by row, so put the <b>row index in the outer loop</b>. i outside and j inside walks memory with stride 1.",
lesson:`<p>Part 5 showed that C stores a 2D array <b>row by row</b>. So the order of your loops decides the stride. Run your slide's example both ways:</p>`+
toy('loops')+
`<ul class="facts"><li><b>i outside, j inside</b>: walks memory in order. <b>Stride-1</b>, good spatial locality.</li><li><b>j outside, i inside</b>: jumps a whole row each step. <b>Stride-N</b>, where N is the number of columns. Here N = 3.</li></ul>`+
'<div class="pair2">'+codeBlock('copyij: fast\nfor (i = 0; i < 2048; i++)\n  for (j = 0; j < 2048; j++)\n    dst[i][j] = src[i][j];')+codeBlock('copyji: 21× slower\nfor (j = 0; j < 2048; j++)\n  for (i = 0; i < 2048; i++)\n    dst[i][j] = src[i][j];')+'</div>'+
`<p class="fine">Same work, same answer, but on a Pentium 4 copyji is <b>21 times slower</b>, only because of the access pattern.</p>`,
qs:[
{pre:'for (i = 0; i < M; i++)\n    for (j = 0; j < N; j++)\n        sum += a[i][j];',prompt:'What pattern does this give?',options:['stride-1','stride-N','random'],answer:0,explain:'i outside, j inside walks memory in order.'},
{pre:'for (j = 0; j < N; j++)\n    for (i = 0; i < M; i++)\n        sum += a[i][j];',prompt:'M = 2 and N = 3. What pattern does this give?',options:['stride-3 (stride-N)','stride-1','stride-2'],answer:0,explain:'Each step moves down a row, which is 3 elements ahead in memory.'},
{pre:'for (j = 0; j < 3; j++)\n    for (i = 0; i < 2; i++)\n        sum += a[i][j];',prompt:'Tap the elements in the order this loop visits them.',order:['a[0][0]','a[1][0]','a[0][1]','a[1][1]','a[0][2]','a[1][2]'],explain:'i changes fastest: a[0][0], a[1][0], then the next column.'},
{pre:'for (j = 0; j < 3; j++)\n    for (i = 0; i < 2; i++)\n        sum += a[i][j];',prompt:'What is the access order of a[1][0], at address 12?',options:['2','4','3'],answer:0,explain:'It\'s visited right after a[0][0].',after:accTable({addr:['0','4','8','12','16','20'],cont:['a[0][0]','a[0][1]','a[0][2]','a[1][0]','a[1][1]','a[1][2]'],order:['1','3','5','2','4','6'],hl:[false,false,false,true,false,false]})},
{pre:'for (j = 0; j < 3; j++)\n    for (i = 0; i < 2; i++)\n        sum += a[i][j];',prompt:'And the access order of a[0][2], at address 8?',options:['5','3','6'],answer:0,explain:'Column 2 comes last: a[0][2] is 5th and a[1][2] is 6th.',after:accTable({addr:['0','4','8','12','16','20'],cont:['a[0][0]','a[0][1]','a[0][2]','a[1][0]','a[1][1]','a[1][2]'],order:['1','3','5','2','4','6'],hl:[false,false,true,false,false,false]})},
{prompt:'Which copy is faster?',code:false,options:['copyij: i outside, j inside','copyji: j outside, i inside'],answer:0,keep:true,explain:'It walks memory in order.'},
{prompt:'On a Pentium 4, about how many times slower is copyji?',options:['21','2','2,048'],answer:0,explain:'21 times slower, just from the access pattern.'},
{prompt:'Why is i-outside, j-inside the fast one?',code:false,options:['C stores rows one after another, so j inside walks memory in order','C stores columns one after another','The compiler skips the slow one'],answer:0,explain:'Row-major order, from Part 5.'},
{prompt:'<code>int a[100][100]</code>, j outside and i inside. Each step jumps how many bytes?',input:true,dec:true,expect:'400',explain:'One row: 100 ints × 4 bytes = 400.'}
]},

{id:'loop3d',sec:'p9',name:'3D arrays and loop order',short:'3D arrays',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"In m[i][j][k], the <b>last index should change fastest</b>: make its loop the innermost one.",
lesson:`<p>Practice 9 clears a <b>3D</b> array, <code>int m[N][N][N]</code>. C stores it row-major too: as you walk through memory, the <b>last</b> index changes fastest.</p>
<div class="rule-box">m[i][j][k] is at m + (i·N·N + j·N + k) × 4</div>
<ul class="facts"><li>k + 1: the very next int, 4 bytes away. <b>Stride-1.</b></li><li>j + 1: a whole row of N ints away. <b>Stride-N.</b></li><li>i + 1: a whole N × N slab away. <b>Stride-N².</b></li></ul>
<p>So the loop for the <b>last index</b> should be the innermost loop. Run your worksheet's three functions on a tiny m[2][2][2]:</p>`+
toy('loops3')+
`<div class="tip"><span class="tl">The pointer version</span><code>*ptr++ = 0</code> starts at m[0][0][0] and steps one int at a time, straight through memory. That's stride-1, using one simple loop instead of three.</div>`,
qs:[
{prompt:'<code>int m[2][2][2]</code>: which element comes right after m[0][0][0] in memory?',options:['m[0][0][1]','m[0][1][0]','m[1][0][0]'],answer:0,explain:'The last index changes fastest.'},
{prompt:'And which comes right after m[0][0][1]?',options:['m[0][1][0]','m[0][0][2]','m[1][0][0]'],answer:0,explain:'k has run out (N = 2), so j goes up by one and k starts over at 0.'},
{prompt:'In m[i][j][k], which index changes fastest as you walk through memory in order?',code:false,options:['k, the last one','i, the first one','j, the middle one'],answer:0,explain:'Row-major: the last index changes fastest.'},
{pre:'for (i...)\n  for (j...)\n    for (k...)\n      m[i][j][k] = 0;',prompt:'What pattern does this loop order give?',options:['stride-1','stride-N','stride-N²'],answer:0,explain:'k, the last index, is innermost, so each step goes to the very next int.'},
{pre:'for (i...)\n  for (k...)\n    for (j...)\n      m[i][j][k] = 0;',prompt:'Now j is innermost. Each step jumps',code:false,options:['N ints: stride-N','1 int: stride-1','N² ints: stride-N²'],answer:0,explain:'j + 1 is a whole row of N ints further on.'},
{prompt:'m[i][j][k] is at m + (___) × 4',options:['i·N·N + j·N + k','i + j·N + k·N·N','i·N + j·N + k'],answer:0,explain:'Skip i slabs of N·N ints, j rows of N ints, then k more ints.'},
{pre:'ptr = &m[0][0][0];\nfor (i = 0; i < N*N*N; i++)\n    *ptr++ = 0;',prompt:'How does this walk through memory?',code:false,options:['In order, one int at a time: stride-1','Every N ints: stride-N','At random'],answer:0,explain:'ptr++ moves to the very next int each time.'},
{prompt:'N = 800, and j is the innermost loop. Each step jumps how many bytes?',input:true,dec:true,expect:'3200',explain:'One row: 800 ints × 4 bytes = 3,200 bytes.'},
{prompt:'For <code>m[i][j][k]</code>, which loop should be innermost?',code:false,options:['The k loop, for the last index','The i loop','It doesn\'t matter'],answer:0,explain:'Then the writes walk straight through memory.'}
]},

{id:'cls9',sec:'p9',name:'Class Practice 9',short:'Class P9',shuffleOpts:true,
defaults:{m:null,code:true,tag:'From class'},
recap:"In m[i][j][k], the last index should change fastest. A loop order that does that walks memory with stride 1.",
lesson:`<p>All four questions from In-Class Practice 9. They all come back to one idea from the last level: in m[i][j][k], the <b>last index</b> should change fastest.</p>`+
codeBlock('void clear_one(int m[N][N][N]) {      // i, j, k\n    for (i...) for (j...) for (k...)\n        m[i][j][k] = 0;\n}\nvoid clear_two(int m[N][N][N]) {      // i, k, j\n    for (i...) for (k...) for (j...)\n        m[i][j][k] = 0;\n}\nvoid clear_three(int m[N][N][N]) {    // one pointer\n    int *ptr = &(m[0][0][0]);\n    for (i = 0; i < N*N*N; i++)\n        *ptr++ = 0;\n}'),
qs:[
{tag:'From class · Q1',pre:'void clear_one(int m[N][N][N])\n{\n   int i, j, k;\n\n   for (i = 0; i < N; i++)\n      for (j = 0; j < N; j++)\n         for (k = 0; k < N; k++)\n            m[i][j][k] = 0;\n}',prompt:'What type of reference pattern does the clear_one function have?',options:['stride-1','stride-N','stride-N²','random'],answer:0,explain:'k is the innermost loop and the last index, so it writes one int after another. In the worksheet\'s box, type <b>stride-1</b>.'},
{tag:'From class · Q2',pre:'void clear_two(int m[N][N][N])\n{\n   int i, j, k;\n\n   for (i = 0; i < N; i++)\n      for (k = 0; k < N; k++)\n         for (j  = 0; j < N; j++)\n            m[i][j][k] = 0;\n}',prompt:'Compare clear_one and clear_two. Which function has better spatial locality?',code:false,options:['The clear_two function has better spatial locality.','The clear_one function has better spatial locality.','Both have equivalent spatial locality.'],answer:1,keep:true,explain:'clear_two puts j innermost, so every write jumps a whole row of N ints (stride-N). clear_one is stride-1.'},
{tag:'From class · Q3',prompt:'Q3: sort clear_one, clear_two and clear_three by spatial locality and reference pattern.',
 board:rowBoard(['clear_one','clear_two','clear_three','stride-1','stride-k'],[{k:'a'},{k:'b'},{k:'c'},{k:'d'},{k:'e'}]),
 guided:[{label:'clear_one',ask:'<code>clear_one</code> (k innermost)',options:['Poor Locality','Good Locality'],answer:1,keep:true,say:'Stride-1.',fill:{a:'Good Locality'}},
  {label:'clear_two',ask:'<code>clear_two</code> (j innermost)',options:['Good Locality','Poor Locality'],answer:1,keep:true,say:'Stride-N.',fill:{b:'Poor Locality'}},
  {label:'clear_three',ask:'<code>clear_three</code> (*ptr++)',options:['Poor Locality','Good Locality'],answer:1,keep:true,say:'Straight through memory: stride-1.',fill:{c:'Good Locality'}},
  {label:'stride-1',ask:'stride-1',options:['Poor Locality','Good Locality'],answer:1,keep:true,say:'Every neighbor, in order.',fill:{d:'Good Locality'}},
  {label:'stride-k',ask:'stride-k',options:['Good Locality','Poor Locality'],answer:1,keep:true,say:'It skips k − 1 elements every step.',fill:{e:'Poor Locality'}}],
 explain:'Good: clear_one, clear_three and stride-1. Poor: clear_two and stride-k. The choices are in the same order as the worksheet\'s menus.'},
{tag:'From class · Q4',prompt:'Q4: N = 800. The three runs took 1,780 ms, 2,450 ms and 3,970 ms. Which one executed the fastest?',
 board:rowBoard(['1,780 ms','2,450 ms','3,970 ms'],[{k:'fast'},{k:'mid'},{k:'slow'}]),
 guided:[{label:'Slowest',ask:'Which one is stride-N, so it should be the slowest?',options:['clear_two','clear_one','clear_three'],answer:0,keep:true,say:'j is innermost: every write jumps 800 ints.',fill:{slow:'clear_two'}},
  {label:'Tie-break',ask:'clear_one and clear_three both walk memory in order. What does clear_three save?',code:false,options:['Two of the three loops and the m[i][j][k] index math','The memory writes','Nothing: they do exactly the same work'],answer:0,say:'One simple loop, and the pointer just moves to the next int.',fill:{mid:'clear_one'}},
  {label:'Fastest',ask:'So which one executed the fastest?',options:['clear_two','clear_one','clear_three'],answer:2,keep:true,say:'clear_three.',fill:{fast:'clear_three'}}],
 explain:'clear_three is the fastest (about 1,780 ms), then clear_one (2,450 ms), then clear_two (3,970 ms). As the question warns, a clever compiler can shrink the gap between clear_one and clear_three. Conceptually, stride-1 with the least loop work wins.'}
]},

{id:'ex9',sec:'p9',name:'Exam-style: judge the locality',short:'Exam practice',shuffleOpts:true,
defaults:{m:null,code:true,tag:'Exam-style'},
lesson:`<p>Your slide says it: looking at code and getting a feel for its locality is a key skill. These problems make you do exactly that, step by step.</p>
`,
qs:[
{prompt:'Judge this loop over <code>int a[3][4]</code>.',board:function(f){return codeBlock('int a[3][4];   /* 3 rows, 4 columns */\nfor (j = 0; j < 4; j++)\n    for (i = 0; i < 3; i++)\n        sum += a[i][j];')+(f.s?'<p class="tr-note">Verdict: <b>'+esc(f.s)+'</b></p>':'');},
 guided:[{label:'Next element',ask:'Which element is visited right after a[0][0]?',options:['a[1][0]','a[0][1]','a[0][2]'],answer:0,code:true,say:'i is the inner loop, so i changes first.'},
  {label:'Its address',ask:'a[0][0] is at address 0. Where is a[1][0]?',options:['16','4','12'],answer:0,say:'One row is 4 ints × 4 bytes = 16.'},
  {label:'Stride',ask:'So each step jumps',options:['4 elements: stride-4','1 element: stride-1','3 elements: stride-3'],answer:0,say:'A whole row of 4 elements: stride-N with N = 4.',fill:{s:'stride-4, poor spatial locality'}},
  {label:'Fix',ask:'How do you fix it?',options:['Swap the loops: i outside, j inside','Make the array bigger','Add a second sum'],answer:0,say:'Then j changes first and memory is read in order.'}],
 explain:'Stride-4. Swapping the loops makes it stride-1.'},
{prompt:'Judge this loop.',board:function(f){return codeBlock('sum = 0;\nfor (i = 0; i < n; i += 2)\n    sum += a[i];');},
 guided:[{label:'Stride',ask:'The pattern for a is',options:['stride-2','stride-1','stride-n'],answer:0,say:'i += 2.'},
  {label:'sum',ask:'sum gives',options:['temporal locality','spatial locality'],answer:0,keep:true,say:'The same variable every pass.'},
  {label:'Compare',ask:'Compared with i++, a\'s spatial locality is',options:['worse','better','the same'],answer:0,say:'Bigger stride, worse spatial locality.'}],
 explain:'a is stride-2 (spatial, but worse than stride-1), and sum is temporal.'},
{pre:'int a[3][2];\nfor (j = 0; j < 2; j++)\n    for (i = 0; i < 3; i++)\n        sum += a[i][j];',prompt:'Tap the elements in the order this loop visits them.',order:['a[0][0]','a[1][0]','a[2][0]','a[0][1]','a[1][1]','a[2][1]'],explain:'i changes fastest: down column 0, then down column 1.'},
{prompt:'Fast storage, compared with slow storage, costs ___ per byte, holds ___, and uses ___ power.',code:false,options:['more, less, more','less, more, less','more, more, less'],answer:0,explain:'Your last slide: fast storage costs more per byte, has less capacity, and needs more power (heat).'},
{prompt:'Well-written programs tend to have',code:false,options:['good locality','random access patterns','no loops'],answer:0,explain:'That\'s what makes the hierarchy pay off.'},
{prompt:'Put those facts together and you get',code:false,options:['a memory hierarchy','one big DRAM','all registers'],answer:0,explain:'A little fast storage on top of lots of slow storage, which works because of locality.'},
{prompt:'<code>int a[1000][1000]</code>, j outside and i inside. Each step jumps how many bytes?',input:true,dec:true,expect:'4000',explain:'One row: 1,000 ints × 4 bytes = 4,000.'},
{pre:'for (i = 0; i < n; i++)\n    b[i] = a[i] + a[i];',prompt:'Which kind of locality does reading <code>a[i]</code> twice in one pass show?',options:['Temporal','Spatial'],answer:0,keep:true,explain:'The same item used again right away. (Going on to a[i+1] next pass is spatial.)'}
]},

{id:'cblocks',sec:'p10',name:'Caches and blocks',short:'Blocks',shuffleOpts:true,
defaults:{m:null,code:false},
recap:'Data moves in whole <b>blocks</b>, and block b goes in slot b % (number of slots). Misses come in three kinds: <b>cold</b> (the first time), <b>conflict</b> (two blocks want one slot) and <b>capacity</b> (too much data to fit).',
lesson:`<p>A <b>cache</b> is a small, fast memory that keeps copies of the data you're using from a bigger, slower one. Every level of Part 6's pyramid is a cache for the level below it. See how one works, in 5 small steps:</p>`+
toy('cbsteps')+
`<div class="tip"><span class="tl">Words to keep</span><b>Block</b>: the chunk of memory that moves all at once. <b>Hit</b>: the block is already in the cache. <b>Miss</b>: it isn't, so it gets copied in. <b>Evict</b>: kick a block out to make room.</div>`,
qs:[
{prompt:'Data moves between the cache and memory in units of',options:['whole blocks','single bytes','whole files'],answer:0,explain:'Your slides: data is copied in block-sized transfer units.'},
{prompt:'In the 4-slot cache, block b goes in slot b % 4. Which slot does block 10 go in?',options:['2','10','0','1'],answer:0,explain:'10 % 4 = 2, as on your slide.'},
{prompt:'Same cache. Type the slot that block 13 goes in.',input:true,dec:true,expect:'1',explain:'13 % 4 = 1: 13 = 3 × 4 + 1.'},
{prompt:'You ask for block 14, and slot 2 already holds 14. That\'s a',options:['hit','miss'],answer:0,keep:true,explain:'The block is in the cache, so it\'s read straight from there.'},
{prompt:'You ask for block 12. Slot 0 holds block 8. What happens?',options:['Miss: 12 is copied in from memory, and 8 is evicted','Hit: slot 0 has a block in it','Miss: 12 goes in an empty slot instead'],answer:0,explain:'12 % 4 = 0, and slot 0 holds 8, not 12. In this cache, 12 can only go in slot 0.'},
{prompt:'The cache is empty and you ask for block 5. What kind of miss is it?',options:['Cold (compulsory)','Conflict','Capacity'],answer:0,explain:'The first time you ask for a block, it can\'t be in the cache yet.'},
{prompt:'Asking for blocks 0, 8, 0, 8, … misses every time, even though slots 1 to 3 are free. What kind of miss is that?',options:['Conflict','Cold','Capacity'],answer:0,explain:'0 and 8 both need slot 0 (0 % 4 = 8 % 4 = 0), so they keep evicting each other.'},
{prompt:'A loop keeps using more data than the whole cache can hold. Its misses are',options:['capacity misses','conflict misses','only cold misses'],answer:0,explain:'The working set is bigger than the cache.'},
{prompt:'Which replacement policy evicts the block that hasn\'t been used for the longest time?',options:['LRU, least recently used','FIFO, first in first out','Random'],answer:0,explain:'LRU looks at when each block was last used.'},
{prompt:'Why does a hierarchy of caches work?',options:['Locality: programs use the data at level k more often than the data at level k + 1','Caches are bigger than memory','Memory is never slow'],answer:0,explain:'That\'s why level k + 1 can be slower, bigger and cheaper.'}
]},

{id:'cgeo',sec:'p10',name:'S, E and B: the shape of a cache',short:'S, E and B',shuffleOpts:true,
defaults:{m:null,code:false},
recap:'<b>C = S × E × B</b>: sets × lines per set × bytes per block. E = 1 is direct-mapped, and S = 1 is fully associative.',
lesson:`<p>L77's cache had 4 slots that held one block each. Real caches come in many shapes, and three numbers describe every one of them: <b>S</b>, <b>E</b> and <b>B</b>. Build a cache one piece at a time:</p>`+
toy('geosteps')+
`<div class="tip"><span class="tl">Say it in order</span><b>S</b> sets, each with <b>E</b> lines, each holding <b>B</b> bytes. Multiply them for the size: C = S × E × B.</div>`,
qs:[
{prompt:'In a cache described by (S, E, B), S is the number of',options:['sets','lines per set','bytes per block'],answer:0,explain:'S = 2ˢ sets.'},
{prompt:'E is the number of',options:['lines in each set','sets','bytes per block'],answer:0,explain:'Each set has E lines.'},
{prompt:'B is the number of',options:['data bytes per block','sets','tag bits'],answer:0,explain:'B = 2ᵇ bytes per cache block.'},
{prompt:'Besides its B data bytes, each line has',options:['1 valid bit and t tag bits','nothing else','its full address'],answer:0,explain:'The valid bit says whether the line holds real data. The tag says which block it is.'},
{prompt:'The cache size C is',options:['S × E × B','S + E + B','S × B','E × B'],answer:0,explain:'Sets × lines per set × bytes per line.'},
{prompt:'S = 8, E = 2 and B = 4. Type C, in bytes.',input:true,dec:true,expect:'64',explain:'8 × 2 × 4 = 64 bytes.'},
{prompt:'C = 512 bytes, B = 8 and E = 2. How many sets are there?',input:true,dec:true,expect:'32',hint:'S = C ÷ (B × E).',explain:'512 ÷ (8 × 2) = 32 sets.',traps:[{v:'64',msg:'That\'s 512 ÷ 8. Divide by E too: 512 ÷ (8 × 2).'},{v:'256',msg:'That\'s 512 ÷ 2. Divide by B too: 512 ÷ (8 × 2).'}]},
{prompt:'A cache with E = 1, one line in every set, is called',options:['direct-mapped','fully associative','2-way set associative'],answer:0,explain:'Each block has exactly one place it can go.'},
{prompt:'C = 2,048 bytes, B = 64 and E = 32. How many sets?',options:['1, so it\'s fully associative','32','64'],answer:0,explain:'2,048 ÷ (64 × 32) = 1. A single set holds every line.'},
{prompt:'Does C count the valid bits and the tags?',options:['No, only the data bytes','Yes, everything in each line'],answer:0,keep:true,explain:'C = S × E × B data bytes.'}
]},

{id:'caddr',sec:'p10',name:'Where does an address go?',short:'Tag, set, offset',shuffleOpts:true,
defaults:{m:null,code:false},
recap:'Read an address like the memory map: <b>tag = row</b>, <b>set = column</b>, <b>offset = place in the box</b>. In the bits, the offset is the last b bits, the set is the next s bits, and the tag is everything left.',
lesson:`<p>To find a byte, a cache needs three answers: <b>which set</b> to look in, <b>which block</b> it is, and <b>which byte</b> of that block. All three are hiding in the address's bits. Find them in 4 small steps:</p>`+
toy('memmap')+
`<h3>Any cache</h3>
<p>A real cache's map just has more columns (sets), bigger boxes (blocks) and many more rows. Each field gets enough bits to count its things:</p>`+
bitsStrip()+
`<div class="rule-box rule-lines"><div>offset: b bits, count B bytes</div><div>set: s bits, count S sets</div><div>tag: the rest, m − s − b</div></div>
<p class="fine">E doesn't change the split. It's how many lines are in each set, not which set.</p>`,
qs:[
{vis:memMap({cols:true,rows:true}),prompt:'Byte 22 is in the box 20–23. Which set is that box in?',options:['Set 1','Set 2','Set 0','Set 5'],answer:0,explain:'Its column is set 1. (Box 20–23 is box 5, and 5 % 4 = 1.)'},
{vis:memMap({cols:true,rows:true}),prompt:'And which tag does byte 22 have?',options:['Tag 1','Tag 0','Tag 2','Tag 5'],answer:0,explain:'It\'s in row 1.'},
{prompt:'Which place in the box 20–23 is byte 22?',options:['Place 2','Place 22','Place 1','Place 3'],answer:0,explain:'Count from 0: 20 is place 0, 21 is place 1, 22 is place 2.'},
{prompt:'22 in binary is 01 01 10. Which part is the set?',code:true,options:['The middle 01','The last 10','The first 01'],answer:0,explain:'Tag 01 | set 01 | offset 10: row 1, column 1, place 2.'},
{prompt:'Tap the three fields of an address, left to right.',order:['tag','set index','block offset'],explain:'Row, column, place. The offset is on the right because it changes with every byte.'},
{vis:memMap({cols:true,rows:true}),prompt:'Tag bits 11, set bits 10, offset bits 00. Type the byte\'s address.',input:true,dec:true,expect:'56',hint:'Row 3, column 2, place 0.',explain:'Row 3, column 2 is the box 56–59. Place 0 is byte 56.'},
{vis:memMap({cols:true,rows:true}),prompt:'Byte 47 ends row 2. Where is the next byte, 48?',options:['Row 3, set 0, place 0','Row 2, set 0, place 0','Row 3, set 3, place 0'],answer:0,explain:'Memory wraps around like text on a page: the next row starts back at set 0, with the tag 1 higher.'},
{vis:memMap({cols:true,rows:true}),prompt:'Bytes 13 and 45 are both place 1, in set 3. What\'s different about them?',options:['Their tag: 0 and 2','Their set','Their offset'],answer:0,explain:'Same column, different rows. The tag is how the cache tells them apart.'},
{prompt:'A cache with 8 sets would have a memory map with how many columns?',options:['8','4','3'],answer:0,explain:'One column per set. Counting 8 columns takes 3 set bits.'},
{prompt:'m = 16, S = 32 sets, B = 8 bytes. Find b, s and t.',board:rowBoard(['offset bits b','set bits s','tag bits t'],[{k:'b'},{k:'s'},{k:'t'}]),
 guided:[{label:'b',ask:'How many bits does it take to count 8 bytes (0 to 7)?',options:['3','8','4'],answer:0,say:'000 to 111.',fill:{b:'3'}},
  {label:'s',ask:'How many bits to count 32 sets?',options:['5','32','6'],answer:0,say:'2⁵ = 32.',fill:{s:'5'}},
  {label:'t',ask:'The tag gets the leftovers: 16 − 5 − 3 =',options:['8','11','13'],answer:0,say:'8 tag bits.',fill:{t:'8'}}],
 explain:'b = 3, s = 5, t = 8.'},
{prompt:'Does E, the number of lines per set, change b, s or t?',options:['No: E is how many lines are in a set, not which set','Yes: more lines means more set bits'],answer:0,explain:'Only m, S and B decide the split.'},
{prompt:'Same 4 sets and 4-byte boxes, but now 256 bytes of memory, so the map has 16 rows. Address 0x9A = 1001 1010. Type its tag in hex.',input:true,expect:'0x9',explain:'1001 | 10 | 10: tag 0x9, set 2, offset 2. More memory only adds rows, so the tag gets more bits: here it\'s the whole first hex digit.',traps:[{v:'0x2',msg:'That\'s the set (or the offset). The tag is everything left: 1001.'}]}
]},

{id:'clook',sec:'p10',name:'Be the cache: go, check, grab',short:'Be the cache',shuffleOpts:true,
defaults:{m:null,code:false},
recap:'<b>Go, check, grab.</b> Go to set CI. Check for a line with its light on (valid = 1) and tag = CT: yes is a hit, no is a miss. On a hit, grab the byte at offset CO.',
lesson:`<p>Now use the split to <b>read a byte</b>. Picture the cache as a mailroom: each <b>set</b> is a shelf, each <b>line</b> is a box with a name on it (the <b>tag</b>) and a light (the <b>valid bit</b>), and the <b>offset</b> says which item to take out of the box.</p>
<div class="rule-box rule-lines"><div>1. Go to set CI</div><div>2. Check: light on, tag = CT?</div><div>3. Grab byte CO</div></div>
<p>A line that passes the check is a <b>hit</b>. If none does, it's a <b>miss</b>, and there's nothing to grab.</p>

{id:'cls10',sec:'p10',name:'Class Practice 10',short:'Class P10',shuffleOpts:true,
defaults:{m:null,code:true,tag:'From class'},
recap:"<b>S = C ÷ (B × E)</b>. Then s = log₂ S, b = log₂ B, and the tag gets whatever is left: t = m − s − b.",
lesson:`<p>In-Class Practice 10 has one question: a table of three caches. From m, C, B and E, find <b>S, t, s and b</b> for each one. Warm up on a small cache first:</p>`+
toy('walk',{w:'p10',title:'Warm up · the four answers'})+
`<p>The practice questions use the same four steps on the worksheet's three caches.</p>`,
qs:(function(){
  var rows=[[1,32,1024,4,1],[2,32,1024,8,4],[3,32,1024,32,32]];
  var out=rows.map(function(r){
    var m=r[1],C=r[2],B=r[3],E=r[4],S=C/(B*E),s=lg2(S),b=lg2(B),t=m-s-b;
    var sOpts=[S,C/B,C/E,S*2].filter(function(v,i,a){return a.indexOf(v)===i;}).slice(0,4);
    return {tag:'From class · Q1',prompt:'Q1, cache '+r[0]+': m = '+m+', C = 1,024, B = '+B+', E = '+E+'. Find S, t, s and b.',
      board:rowBoard(['m','C','B','E','S','t','s','b'],[String(m),'1,024',String(B),String(E),{k:'S'},{k:'t'},{k:'s'},{k:'b'}]),
      guided:[
        {label:'S',ask:'S = C ÷ (B × E) = 1,024 ÷ ('+B+' × '+E+') =',options:sOpts.map(function(v){return fmtNum(v);}),answer:0,say:fmtNum(S)+(S===1?': one set, so it\'s fully associative.':' sets.'),fill:{S:String(S)}},
        {label:'s',ask:'s = log₂ S = log₂ '+fmtNum(S)+' =',options:[String(s),String(S===1?1:S),String(s+1)].filter(function(v,i,a){return a.indexOf(v)===i;}),answer:0,say:S===1?'2⁰ = 1, so s = 0: with one set, no bits are needed to pick it.':'2'+supNum(s)+' = '+fmtNum(S)+'.',fill:{s:String(s)}},
        {label:'b',ask:'b = log₂ B = log₂ '+B+' =',options:[String(b),String(B),String(b+1)],answer:0,say:'2'+supNum(b)+' = '+B+'.',fill:{b:String(b)}},
        {label:'t',ask:'t = m − s − b = '+m+' − '+s+' − '+b+' =',options:[String(t),String(m-s),String(m-b),String(t-2)].filter(function(v,i,a){return a.indexOf(v)===i;}),answer:0,say:t+' tag bits.',fill:{t:String(t)}}],
      explain:'S = '+S+', t = '+t+', s = '+s+', b = '+b+'.'+(S===1?' With E = 32 lines in a single set, this cache is fully associative.':'')};
  });
  return out;
})()},

{id:'dmsim',sec:'p11',name:'Misses fill the cache',short:'Direct-mapped',shuffleOpts:true,
defaults:{m:null,code:false},
recap:'A miss copies the <b>whole box</b> into its set, with the box\'s row as the tag, so the next byte in that box hits. In a direct-mapped cache each set holds one box, so boxes in the <b>same column</b> keep kicking each other out: a <b>conflict miss</b>.',
lesson:`<p>In Part 10 the cache was already filled in. Now start with an <b>empty</b> cache and watch it fill up, one read at a time.</p>
<p>Your slides use a tiny machine: <b>16 bytes</b> of memory in <b>boxes of 2</b>, and a cache with <b>4 sets</b> that hold <b>1 box each</b>. That's called direct-mapped. Same map as L79: tag = row, set = column.</p>
<div class="rule-box rule-lines"><div>Hit: the box is already in its set.</div><div>Miss: copy the whole box into its set.</div><div>Its tag is the box's row.</div></div>
<p>Do the slides' reads yourself, 0, 1, 7, 8, 0. For each one, find the byte's box, then decide: hit or miss?</p>`+
toy('crun',{E:1})+
`<div class="tip"><span class="tl">Remember it</span>A miss copies the whole box, so the next byte in it hits. Boxes in the same column share one set. With room for only one box, they keep kicking each other out.</div>`,

{id:'sasim',sec:'p11',name:'Two lines per set',short:'2-way',shuffleOpts:true,

<p>Same 16 bytes and boxes of 2, but now the cache has <b>2 sets with 2 lines each</b> (E = 2, called 2-way set associative). With only 2 columns, the map has 4 rows.</p>
<div class="rule-box rule-lines"><div>A box can go in either line of its set.</div><div>Check both lines for it.</div><div>Set full? Kick out the one used longest ago.</div></div>
<p>The same reads, 0, 1, 7, 8, 0, plus one more. On a miss, you also pick the line:</p>`+
toy('crun',{E:2})+
`<div class="tip"><span class="tl">Remember it</span>Two lines per set means two boxes from the same column can live together. When a set is full, LRU (least recently used) kicks out the box used longest ago.</div>`,

{prompt:'Run the reads 0, 1, 7, 8, 0 on the 2-way cache.',board:rowBoard(['Read 0','Read 1','Read 7','Read 8','Read 0'],[{k:'a'},{k:'b'},{k:'c'},{k:'d'},{k:'e'}]),
 guided:[{label:'Read 0',ask:'Read 0: box 0–1, set 0. Set 0 is empty.',options:['Miss','Hit'],answer:0,keep:true,say:'Box 0–1 goes in one line of set 0.',fill:{a:'miss'}},

  {label:'Read 7',ask:'Read 7: box 6–7, set 1. Set 1 is empty.',options:['Miss','Hit'],answer:0,keep:true,say:'Box 6–7 goes in set 1.',fill:{c:'miss'}},

{id:'cwrite',sec:'p11',name:'What about writes?',short:'Writes',shuffleOpts:true,
defaults:{m:null,code:false},
recap:'<b>Write-through</b>: through to memory, every time. <b>Write-back</b>: back to memory later, when the line is evicted; the <b>dirty bit</b> means memory is out of date. <b>Write-allocate</b>: on a write miss, bring the box into the cache first. Typical pairs: back + allocate, through + no-allocate.',
lesson:`<p>So far the CPU only read. When it <b>writes</b> to x, the new value goes into the cache, and memory still has the old one. A cache has to decide two things: <b>when</b> memory gets the new value, and what to do when the thing it's writing <b>isn't in the cache</b> yet. Try each policy:</p>`+
toy('wsteps')+
`<div class="tip"><span class="tl">Remember it</span>Through: through to memory, every time. Back: back to memory later, when the line is evicted. The dirty bit is the unsaved-changes dot. Allocate: make room in the cache first.</div>`,
qs:[
{prompt:'Write-through means',options:['every write also goes to memory right away','memory gets the new value when the line is evicted','writes skip the cache'],answer:0,explain:'Through to memory, every time.'},
{prompt:'Write-back means',options:['memory gets the new value later, when the line is evicted','every write goes straight to memory','the cache is never written'],answer:0,explain:'Back to memory later.'},
{prompt:'What does the dirty bit say?',options:['The line has changed, so memory is out of date','The line is empty','The line was used recently'],answer:0,explain:'If it\'s on when the line is evicted, the line gets written back.'},
{prompt:'Which policy needs a dirty bit?',options:['Write-back','Write-through'],answer:0,keep:true,explain:'Write-through keeps memory up to date, so there\'s nothing to remember.'},
{prompt:'Write-allocate means that on a write miss, the cache',options:['loads the box, then writes it in the cache','writes straight to memory','ignores the write'],answer:0,explain:'It makes room in the cache for it.'},
{prompt:'No-write-allocate means that on a write miss, the cache',options:['writes straight to memory and leaves the cache alone','loads the box first','evicts every line'],answer:0,explain:'The box never enters the cache.'},
{prompt:'Which of these is a typical pair?',options:['Write-back + write-allocate','Write-back + no-write-allocate','Write-through + write-allocate'],answer:0,explain:'The other typical pair is write-through + no-write-allocate.'},

   '<div class="rule-box">T A[N]: N × size(T) bytes. Element i starts at x + size × i.</div>'+
   '<h3>The array recipe</h3><ol class="steps"><li><b>Value or address?</b> Brackets alone give a value (type T). A plain name, + or &amp; give an address (type T *).</li><li><b>Bytes in</b>: multiply the whole index by the element size. Values get M[…].</li><li><b>Instruction</b>: an address uses <code>leaq</code> into %rax. A value uses <code>mov</code> sized to the element (movw into %ax for a short). Split into D(%rdx,%rcx,S).</li></ol>'+
   '<h3>From L05</h3><ul class="facts"><li>2D array <code>T A[R][C]</code>, row-major: A[i][j] is at A + (i·C + j)·K.</li><li>Array of pointers (univ): Mem[Mem[univ + 4·index] + 4·dig], two reads.</li><li>struct rec {int a[3]; int i; struct rec *n;}: a at 0, i at 12, n at 16. 20 bytes on IA32, 24 on x86-64. r->i is at r + 12.</li></ul>'},
  {id:'p6',part:'Part 6',name:'Memory & DRAM',src:'L06 part 1 · In-Class Practice 6',next:'p7',
   intro:'Part 6 starts the memory hierarchy: why computers use a pyramid of memories, how SRAM and DRAM differ, and what happens inside a DRAM chip when you read it. Tap the chip and watch. Then Practice 6\'s table, one row at a time.',
   after:'or move on to Part 7.',
   path:[['pyr','sram','Kinds of memory','The pyramid, then SRAM vs DRAM.'],['dram','rcbits','Inside DRAM','Supercells, RAS and CAS, modules, then picking rows × columns.'],['cls6','cls6','Class questions','Practice 6\'s table, one row at a time, with its label bank.'],['ex6','ex6','Exam-style practice','More DRAM problems with new numbers.']],
   sheet:pyramidViz()+T_([['Parts per bit','4–6 transistors','1 transistor + 1 capacitor'],['Keeps its value?','Yes, while powered','Refresh every 10–100 ms'],['Disturbances','Not sensitive','Sensitive'],['Cost','1000×','1×'],['Used for','Caches','Main memory']],['','SRAM','DRAM'])+
   '<h3>A d × w DRAM chip</h3><p>d supercells of w bits, in a square. 16 × 8: 16 supercells, 8 bits each, 4 × 4, 2 addr pins, 8 data pins.</p>'+
   '<ol class="steps"><li>RAS = row: the whole row is copied into the row buffer.</li><li>CAS = column: that supercell goes out on the data pins.</li></ol>'+
   '<p>Square layout: fewer pins, but two steps (slower). Reading more of the same row only needs more CAS.</p>'+
   '<h3>Modules</h3><p>64 MB = eight 8M × 8 DRAMs. All get the same (i, j). DRAM k supplies bits 8k to 8k + 7 of the 64-bit word.</p>'+
   '<h3>Rows × columns (Practice 6)</h3><p>Only d matters, not w. Write d = 2ⁿ and split n in half, bigger half to the rows. b_r = log₂ r, b_c = log₂ c, and max(b_r, b_c) is the number of addr pins.</p>'+T_([['32 × 8','8','4','3','2','3'],['256 × 4','16','16','4','4','4'],['2048 × 1','64','32','6','5','6']],['d × w','r','c','b_r','b_c','max'])},
  {id:'p7',part:'Part 7',name:'Buses & Disks',src:'L06 part 2 · In-Class Practice 7',next:'p8',
   intro:'How the CPU and memory talk over buses, what memory survives a power-off, and how a spinning disk works: its shape, its capacity, and why it\'s so slow. Then all three Practice 7 questions, step by step.',
   after:'or move on to Part 8.',
   path:[['nvm','bus','Memory and buses','Faster DRAM, nonvolatile memory, then reads and writes over the bus.'],['disk','fileread','Disks','Geometry, capacity, access time, then reading a whole file.'],['cls7','cls7','Class questions','All three Practice 7 questions, step by step.'],['ex7','ex7','Exam-style practice','New capacity and access-time problems.']],
   sheet:'<p><b>SDRAM</b>: synced to the clock, can reuse a row (RAS, CAS, CAS, CAS). <b>DDR</b>: 2 bits per cycle per pin. Prefetch: DDR 2, DDR2 4, DDR3/4 8 bits.</p>'+
   T_([['ROM','programmed in production'],['PROM','programmed once'],['EPROM','erased with UV or X-rays'],['EEPROM','erased electronically'],['Flash','EEPROM, erases a sector at a time; ~100,000 erasings']],['Nonvolatile','Detail'])+
   '<h3>Bus trips</h3><p>CPU → system bus → I/O bridge → memory bus → memory. <b>Read</b>: address out, data x back, x into the register. <b>Write</b>: address out (memory waits), data y out, memory stores y. Reads are faster: they can overlap, writes are sequential.</p>'+
   '<h3>Disks</h3><p>Platters (2 surfaces each) → tracks (rings) → sectors (with gaps). Lined-up tracks form a cylinder. Heads move together.</p>'+
   '<div class="rule-box">Capacity = bytes/sector × sectors/track × tracks/surface × surfaces/platter × platters<br>1 GB = 10⁹ bytes</div>'+
   '<div class="rule-box">T access = T seek + T rotation + T transfer<br>one turn = 60,000 ms ÷ RPM<br>T rotation = ½ turn,  T transfer = turn ÷ sectors per track</div>'+
   '<p>Example: 7,200 RPM, 9 ms seek, 400 sectors → 9 + 4 + 0.02 = 13.02 ms. Seek and rotation dominate. A disk is about 2,500× slower than DRAM and 40,000× slower than SRAM.</p>'+
   '<h3>Reading a whole file (Practice 7 Q3)</h3><p>T avg transfer = T max rotation ÷ sectors per track. Best case (one cylinder, all heads reading at once): T avg seek + T avg rotation + (blocks ÷ surfaces) × T avg transfer. Random: blocks × (T avg seek + T avg rotation + T avg transfer). Count 1 MB as 1,000 KB. Cylinders = tracks per surface.</p>'},
  {id:'p8',part:'Part 8',name:'I/O & SSDs',src:'L06 part 3 · In-Class Practice 8',next:'p9',
   intro:'How devices hang off the I/O bus, how a disk read happens without tying up the CPU, and how solid state disks work, including why writing to them is slow. Then Practice 8\'s SSD lifetimes.',
   after:'or move on to Part 9.',
   path:[['iobus','dread','I/O','The I/O bus, then a disk read: port, DMA, interrupt.'],['ssd','wear','SSDs','Pages and blocks, writing a page, SSD vs disk, and how long one lasts.'],['cls8','cls8','Class questions','Practice 8\'s three SSD lifetimes, step by step.'],['ex8','ex8','Exam-style practice','Mixed problems, some step by step.']],
   sheet:'<p>I/O bus: USB controller (mouse, keyboard), graphics adapter (monitor), disk controller (disk), expansion slots (network adapters). The I/O bridge joins the system, memory and I/O buses.</p>'+
   '<h3>Reading a disk sector</h3><ol class="steps"><li>CPU writes a command, logical block number, and destination address to the disk controller\'s port.</li><li>The disk controller copies the sector into memory by DMA (direct memory access).</li><li>When done, it interrupts the CPU.</li></ol>'+
   '<h3>SSDs</h3><p>Flash memory + flash translation layer. Pages: 512 B–4 KB. Blocks: 32–128 pages. Read/write pages, but a page can only be written after its block is erased. A block wears out after ~100,000 writes.</p>'+
   T_([['Sequential','550 MB/s','470 MB/s'],['Random','365 MB/s','303 MB/s'],['Random access','50 µs','60 µs']],['','Read','Write'])+
   '<p>Random writes are slow: erasing takes ~1 ms and one page write copies the whole block. SSDs: no moving parts (faster, less power, rugged), but they wear out (wear leveling helps) and cost ~100× more per byte (2010).</p>'+
   '<h3>How long an SSD lasts (Practice 8)</h3><div class="rule-box">lifetime = total bytes ÷ write rate</div><p>PB = 10¹⁵, GB = 10⁹, MB = 10⁶ bytes. A year is 31,536,000 seconds, or 365 days.</p>'},
  {id:'p9',part:'Part 9',name:'Locality',src:'L06 part 4 · In-Class Practice 9',next:'p10',
   intro:'Why the memory hierarchy works at all. CPUs got far faster than memory, and what saves us is locality. You\'ll judge code the way your slides ask: spot temporal and spatial locality, strides, and good and bad loops. Then Practice 9\'s three clear functions.',
   after:'or try the Parts 6–9 mix.',
   path:[['gap','loc','Why locality','The CPU–memory gap, then temporal vs spatial locality.'],['stride','loop3d','Access patterns','Stride-k, rows vs columns, then 3D arrays.'],['cls9','cls9','Class questions','All four Practice 9 questions on clear_one, clear_two and clear_three.'],['ex9','ex9','Exam-style practice','Judge real loops, step by step.']],
   sheet:'<p>1985–2015: the CPU\'s effective cycle time got 2,075× faster, DRAM access only 10×. After the 2003 power wall, CPUs added cores. The gap keeps widening, and locality bridges it.</p>'+
   T_([['Temporal','the same item is used again soon','sum, i, a loop\'s instructions'],['Spatial','nearby addresses are used close together','a[0], a[1], a[2]…; instructions in sequence']],['Locality','Meaning','Example'])+
   '<h3>Strides</h3><p>Stride-1 (sequential) visits every element. Stride-k visits every kth. Bigger stride, worse spatial locality.</p>'+
   '<h3>2D arrays</h3><p>C is row-major. <b>i outside, j inside</b>: stride-1, fast. <b>j outside, i inside</b>: stride-N, slow (copyji is 21× slower on a Pentium 4).</p>'+
   '<h3>Why a hierarchy</h3><p>Fast storage costs more per byte, holds less and uses more power. The CPU–memory gap is widening. Good programs have locality. Together: a memory hierarchy.</p>'+
   '<h3>3D arrays (Practice 9)</h3><p>m[i][j][k] is at m + (i·N·N + j·N + k) × 4. Put the loop for the last index, k, innermost for stride-1. A pointer stepping through with *ptr++ is stride-1 with the least loop work.</p>'},
  {id:'p10',part:'Part 10',name:'Cache Memory',src:'L07 parts 1–2 · In-Class Practice 10',next:'p11',
   intro:'Part 10 opens up the cache, the small fast memory between the CPU and DRAM. Fill a tiny cache block by block, build one from S, E and B, split an address into tag, set and offset, then look a byte up. Then Practice 10\'s table, one cache at a time.',
   after:'or move on to Part 11.',
   path:[['cblocks','cgeo','How caches work','Blocks, hits and misses, then the shape of a cache: S, E and B.'],['caddr','clook','Reading the cache','Read an address like a map: tag = row, set = column, offset = place. Then be the cache: go, check, grab.'],['cls10','cls10','Class questions','Practice 10\'s table: S, t, s and b, one cache at a time.'],['ex10','ex10','Exam-style practice','More lookups and cache shapes, step by step.']],
   sheet:'<div class="rule-box">C = S × E × B   ·   address = tag (t) | set index (s) | block offset (b)</div><p>Practice 10: S = C ÷ (B × E), then s = log₂ S, b = log₂ B and t = m − s − b.</p>'+
   T_([['S','sets','S = 2ˢ, so s = log₂ S'],['E','lines per set','E = 1: direct-mapped. S = 1: fully associative.'],['B','data bytes per block','B = 2ᵇ, so b = log₂ B'],['t','tag bits','t = m − s − b']],['Letter','Meaning','Rule'])+
   '<h3>Hits and misses</h3><ul class="facts"><li>Data moves in whole blocks. Hit: the block is in the cache. Miss: copy it in, evicting a victim if needed (LRU, FIFO or random).</li><li><b>Cold</b>: the first use. <b>Conflict</b>: blocks fight over one set (0, 8, 0, 8, …). <b>Capacity</b>: the working set is bigger than the cache.</li></ul>'+
   '<h3>Reading a byte (Practice 11, Q1–Q2)</h3><p>Read an address like the memory map: <b>tag = row, set = column, offset = place in the box</b>. Then <b>go, check, grab</b>:</p><ol class="steps"><li>Write the address in binary. CO = the low b bits, CI = the next s bits, CT = the rest.</li><li>Go to set CI.</li><li>Hit only if a line there has valid = 1 and tag = CT.</li><li>On a hit, return the byte at offset CO. On a miss, the answer is ---.</li></ol>'},
  {id:'p11',part:'Part 11',name:'Cache Misses',src:'L07 parts 2–3 · In-Class Practice 11',next:'p12',
   intro:'Part 11 puts the cache to work, on the same memory map as Part 10. Start with an empty cache and watch misses fill it, give each set room for two boxes, untangle two arrays that collide, then see what writes do and how fast a cache is. Then all five Practice 11 questions, step by step.',
   after:'or move on to Part 12.',
   path:[['dmsim','sasim','Run a cache','Start empty: you decide hit or miss for each read. One box per set, then two.'],['conflict','cperf','Misses and speed','Arrays that collide, what writes do, and counting how fast a cache is.'],['cls11','cls11','Class questions','All five Practice 11 questions: the 0x0E34 lookup, then the direct-mapped cache.'],['ex11','ex11','Exam-style practice','New traces, miss rates and write policies.']],
   sheet:'<h3>Running a cache</h3><p>A miss copies the <b>whole box</b> into its set (tag = its row), so the next byte in that box hits. Direct-mapped: one box per set, so boxes in the same column fight (<b>conflict misses</b>). 2-way: two boxes per set, and when it\'s full, <b>LRU</b> evicts the one used longest ago.</p><p>The slides\' machine: 16 bytes, boxes of 2. Direct-mapped (S = 4): t = 1, s = 2, b = 1, and reads 0, 1, 7, 8, 0 go miss, hit, miss, miss, miss. 2-way (S = 2, E = 2): t = 2, s = 1, b = 1, and the same reads go miss, hit, miss, miss, hit.</p>'+
   '<h3>Conflict misses (Practice 11, Q5)</h3><p><b>Same column = same set = they fight.</b> set = (address ÷ B) mod S, so addresses a whole row (the cache size) apart share a set. Arrays that line up thrash. Padding the first array shifts the second into other columns.</p>'+
   T_([['Write-through','on a write hit, write the next level now','simple, but bus traffic on every write'],['Write-back','write the line out when it\'s evicted','needs a dirty bit'],['Write-allocate','on a write miss, load the block, then update it','good if more writes follow'],['No-write-allocate','on a write miss, write straight down','the block isn\'t loaded']],['Policy','What it does','Note'])+
   '<p>Through = through to memory every time. Back = back to memory later; dirty = memory is out of date. Typical pairs: write-through + no-write-allocate, or write-back + write-allocate.</p>'+
   '<div class="rule-box">miss rate = misses ÷ accesses = 1 − hit rate<br>average access time = hit rate × hit time + miss rate × miss penalty</div>'+
   '<p>Count 100 reads: 97 hits × 1 + 3 misses × 100 = 397 cycles, about 4 a read. 99% hits ≈ 2 cycles. Core i7: L1 32 KB 8-way (4 cycles), L2 256 KB 8-way (11), L3 8 MB 16-way and shared (30–40), all with 64-byte blocks.</p>'},
  {id:'p12',part:'Part 12',name:'Virtual Memory',src:'L08 part 1 · In-Class Practice 12',next:'rev',
   intro:'Part 12 starts virtual memory: the addresses a program uses aren\'t the real ones. See what the MMU does, then count address spaces: n bits give N = 2ⁿ addresses. Then Practice 12\'s table, one row at a time.',
   after:'or try the Parts 10–12 mix.',
   path:[['vmidea','vmidea','Virtual addresses','Physical vs virtual addressing, and address spaces.'],['vspace','vspace','Counting addresses','N = 2ⁿ, the largest address, and K, M, G, T and P.'],['cls12','cls12','Class questions','Practice 12\'s table, one row at a time.'],['ex12','ex12','Exam-style practice','More address-space problems.']],
   sheet:'<div class="rule-box">N = 2ⁿ virtual addresses, from 0 to N − 1</div>'+
   '<ul class="facts"><li>Physical addressing: the CPU sends real addresses (simple embedded systems).</li><li>Virtual addressing: the MMU on the CPU chip turns each virtual address into a physical one (servers, desktops, laptops).</li><li>Physical address space: M = 2ᵐ addresses. Each byte has one physical address and one or more virtual ones.</li></ul>'+
   T_([['K','2¹⁰'],['M','2²⁰'],['G','2³⁰'],['T','2⁴⁰'],['P','2⁵⁰']],['Unit','Power of 2'])+
   '<p>Split n into tens plus the rest: 2¹⁶ = 2⁶ × 2¹⁰ = 64K, 2³² = 4G, 2⁴⁸ = 256T, 2⁶⁴ = 2¹⁴ × 2⁵⁰ = 16,384P. The largest address is all 1s: 2⁸ − 1 = 255 = 0xFF.</p>'},

/* ---------- game state ---------- */
var STORE='will-it-assemble:v1';
var S={view:'home',sec:'p1',xp:0,streak:0,best:{},cur:null,lab:'movb %eax, (%esp)',labMode:'val',labM:'practice',labOp:'(%rax,%rdx,4)',labF:{op:'cmp',bits:8,v1:'0xaa',v2:'0x53'},confirmReset:false};
function save(){try{localStorage.setItem(STORE,JSON.stringify({best:S.best,xp:S.xp,v:6}));}catch(e){}}
function loadSaved(){try{var v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&typeof v==='object')return v;}catch(e){}return null;}
function pipsFor(m){return m===0?4:m===1?3:m<=3?2:1;}
function secLevels(id){var out=[];LEVELS.forEach(function(L,k){if(L.sec===id)out.push(k);});return out;}
function secNext(id){var ls=secLevels(id);for(var k=0;k<ls.length;k++){if(!S.best[LEVELS[ls[k]].id])return ls[k];}return -1;}
function secCleared(id){return secLevels(id).filter(function(k){return S.best[LEVELS[k].id];}).length;}
function defaultSec(){for(var k=0;k<SECTIONS.length;k++){if(secNext(SECTIONS[k].id)!==-1)return SECTIONS[k].id;}return 'rev';}

function buildSet(L){
  var all=range(L.qs.length);
  if(!L.pick) return all;
  var out=[];
  Object.keys(L.pick).forEach(function(g){var pool=shuffle(all.filter(function(k){return L.qs[k].grp===g;}));out=out.concat(pool.slice(0,L.pick[g]));});
  return shuffle(out);
}
function startLevel(li){
  var L=LEVELS[li]; S.sec=L.sec; S.view='level';
  if(S.cur&&S.cur.li===li&&S.cur.phase!=='done')return;
  var set=buildSet(L), perm={}, gperm={};
  set.forEach(function(k){var q=L.qs[k];
    if(q.options){var p=range(q.options.length);if(L.shuffleOpts&&!q.keep)shuffle(p);perm[k]=p;}
    if(q.order){var po=range(q.order.length),n=0;do{shuffle(po);n++;}while(n<20&&q.order.length>2&&po.every(function(x,i){return x===i;}));perm[k]=po;}
    if(q.guided){gperm[k]=q.guided.map(function(st){var pg=range(st.options.length);if(!st.keep)shuffle(pg);return pg;});}
  });
  S.cur={li:li,id:L.id,phase:'lesson',set:set,queue:set.slice(),perm:perm,gperm:gperm,g:null,ord:[],solved:[],missed:[],mistakes:0,answered:null};
}
function curQ(){var c=S.cur;if(!c||!c.queue.length)return null;return LEVELS[c.li].qs[c.queue[0]];}
function permOf(c,qi,q){var p=c.perm&&c.perm[qi];if(p&&q.options&&p.length===q.options.length)return p;return q.options?range(q.options.length):[];}
function solFor(q){var M=q.m?MACHINES[q.m]:null,op=q.solve||q.op;return (M&&op)?solveOperand(op,M):null;}
function expectedFor(q,sol){if(q.num)return q.show||(fmtNum(q.expect)+(q.unit?' '+q.unit:''));if(q.expect)return q.expect;if(!sol||sol.error)return null;return q.ask==='address'?toHex(sol.addr):sol.vStr;}
function trapFor(q,sol,val){
  var n=normHex(val); if(n===null) return null;
  var lists=[]; if(q.traps)lists.push(q.traps); if(sol&&!sol.error)lists.push(q.ask==='address'?sol.addrTraps:sol.valTraps);
  for(var i=0;i<lists.length;i++){for(var j=0;j<lists[i].length;j++){if(normHex(lists[i][j].v)===n)return lists[i][j].msg;}}
  if(sol&&!sol.error&&sol.kind==='mem'&&q.ask!=='address'&&q.m){
    var M=MACHINES[q.m],hit=null;
    M.mem.some(function(m){if(normHex(m[1])===n){hit=m[0];return true;}return false;});
    if(hit) return 'That\'s the value at '+esc(hit)+', a different address. Recheck the address math.';
  }
  return null;
}

function record(correct,info){

  else{S.streak=0;c.mistakes++;if(c.missed.indexOf(qi)<0)c.missed.push(qi);}
  info.correct=correct;info.gain=gain;c.answered=info;
  save();render();focusCard(false);

function answer(k){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q)return;
  if(q.guided){gAnswer(k);return;}
  if(q.order){ordTap(k);return;}
  if(q.input||!q.options)return;
  var perm=permOf(c,c.queue[0],q); if(k<0||k>=perm.length)return;
  var oi=perm[k], correct=oi===q.answer, info={picked:k};
  if(!correct) info.trap=trapFor(q,solFor(q),q.options[oi]);
  record(correct,info);
}

  var q=curQ(); if(!q||!q.guided)return;
  var qi=c.queue[0]; if(!c.g)c.g={k:0,wrong:{},miss:0,picks:[]};
  var g=c.g, st=q.guided[g.k]; if(!st)return;
  var perm=gPerm(c,qi,g.k,q); if(k<0||k>=perm.length)return;
  var wr=g.wrong[g.k]=g.wrong[g.k]||[]; if(wr.indexOf(k)>=0)return;
  if(perm[k]===st.answer){
    g.picks[g.k]=k; g.k++;
    if(g.k>=q.guided.length){record(g.miss===0,{guided:true,miss:g.miss});return;}
    render(); focusCard(false);
    var now=document.querySelector('.gd-s.now'); if(now){var b=now.getBoundingClientRect();if(b.bottom>window.innerHeight)now.scrollIntoView({block:'nearest',behavior:smooth()});}
  } else { wr.push(k); g.miss++; render(); focusCard(false); }
}
function ordTap(k){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||!q.order||k<0||k>=q.order.length)return;
  c.ord=c.ord||[]; var p=c.ord.indexOf(k);
  if(p>=0)c.ord=c.ord.slice(0,p); else c.ord.push(k);
  render(); focusCard(false);
}
function ordCheck(){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||!q.order)return;
  var perm=ordPerm(c,c.queue[0],q), seq=c.ord||[];
  if(seq.length<q.order.length){var m=document.querySelector('.ord-bar .fine');if(m)m.textContent='Place all '+q.order.length+' first.';return;}
  record(seq.every(function(k,pos){return perm[k]===pos;}),{ord:seq.slice()});
}
function submitTyped(){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||!q.input)return;
  var inp=$('#ans-in'), msg=$('#ans-msg'); if(!inp)return;
  var raw=inp.value.trim(), n=normHex(raw);
  if(q.num){
    var t=raw.replace(/[−–]/g,'-').replace(/,/g,'').replace(/\s+/g,'').replace(/[a-zµ]+$/i,'');
    if(!t){msg.textContent='Type a number first'+(q.unit?', in '+q.unit:'')+'.';msg.hidden=false;inp.focus();return;}
    if(!/^-?(\d+\.?\d*|\.\d+)$/.test(t)){msg.textContent='Type a plain number, like 8.33.';msg.hidden=false;inp.focus();return;}
    var x=parseFloat(t), tol=q.tol!=null?q.tol:1e-9*Math.max(1,Math.abs(q.expect)), okn=Math.abs(x-q.expect)<=tol+1e-12, infon={typed:raw};
    if(!okn&&q.unit==='GB'&&Math.abs(x/1e9-q.expect)<=tol+1e-12) infon.trap='That\'s the number of bytes. Divide by 10⁹ to get GB.';
    if(!okn&&q.traps){q.traps.some(function(tr){if(Math.abs(Number(tr.v)-x)<=tol+1e-12){infon.trap=tr.msg;return true;}return false;});}
    record(okn,infon);return;
  }
  if(q.dec){
    var d=raw.replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/,/g,'');
    if(!d){msg.textContent='Type a number first, like 24.';msg.hidden=false;inp.focus();return;}
    if(!/^-?\d+$/.test(d)){msg.textContent='Type a whole number in decimal, like 24.';msg.hidden=false;inp.focus();return;}
    var okd=Number(d)===Number(q.expect), infod={typed:raw};
    if(!okd&&q.traps){q.traps.some(function(t){if(String(Number(t.v))===String(Number(d))){infod.trap=t.msg;return true;}return false;});}
    record(okd,infod);return;
  }
  if(!raw){msg.textContent='Type a hex value first, like 0x2D.';msg.hidden=false;inp.focus();return;}
  if(n===null){msg.textContent='Use hex digits 0–9 and A–F, like 0x2D.';msg.hidden=false;inp.focus();return;}
  var sol=solFor(q), exp=expectedFor(q,sol), correct=n===normHex(exp), info={typed:raw};
  if(!correct) info.trap=trapFor(q,sol,raw);
  record(correct,info);
}
function submitFlags(){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||!q.flags)return;
  var keys=q.flags.slice(); if(q.set)keys.push('al');
  var picks=c.picks||{}, missing=keys.filter(function(k){return picks[k]!==0&&picks[k]!==1;});
  var msg=$('#ans-msg');
  if(missing.length){if(msg){msg.textContent='Pick 0 or 1 for '+missing.map(function(k){return k==='al'?'%al':k;}).join(', ')+' first.';msg.hidden=false;}return;}
  var r=solveFlags(q.fl); if(r.error)return;
  var res={}, correct=true;
  keys.forEach(function(k){var actual=k==='al'?condEval(q.set,r.F).val:r.F[k];var ok=picks[k]===actual;if(!ok)correct=false;res[k]={picked:picks[k],actual:actual,ok:ok};});
  record(correct,{res:res});
}
function resetProgress(){S.best={};S.xp=0;S.streak=0;S.cur=null;S.confirmReset=false;save();S.view='home';render();focusCard(true);}
function next(){
  var c=S.cur; if(!c||!c.answered)return;
  var qi=c.queue.shift(); if(!c.answered.correct)c.queue.push(qi);
  c.answered=null; c.picks={}; c.g=null; c.ord=[];
  if(!c.queue.length){c.phase='done';c.pts=pipsFor(c.mistakes);var id=LEVELS[c.li].id;S.best[id]=Math.max(S.best[id]||0,c.pts);save();}
  render();focusCard(true);
}
function goNextLevel(){
  var c=S.cur; if(!c)return;
  if(c.li<LEVELS.length-1)startLevel(c.li+1); else {var li=c.li;S.cur=null;startLevel(li);}
  render();focusCard(true);
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sec]');
  if(t){S.sec=t.dataset.sec;S.view='home';render();focusCard(true);return;}
  var g=e.target.closest('[data-go]');
  if(g){var v=g.dataset.go;
    if(v==='home')S.view='home';
    else if(v==='lab'){S.view='lab';S.sec='rev';}
    else if(v==='lab-mov'||v==='lab-val'||v==='lab-flags'){S.view='lab';S.sec='rev';S.labMode=v.slice(4);}
    else if(v.indexOf('sheet-')===0){S.view='sheet';S.sheet=v.slice(6);S.sec=S.sheet;}
    else if(v.indexOf('sec-')===0){S.sec=v.slice(4);S.view='home';}
    else startLevel(+v);
    render();focusCard(true);return;}
  var ta=e.target.closest('[data-ta]'); if(ta){var host=ta.closest('[data-tid]');if(host){var had=document.activeElement===ta;toyAct(host.dataset.tid,ta.dataset.ta,ta);toyRefresh(host.dataset.tid,had?ta.dataset.ta:null);}return;}
  var gb=e.target.closest('[data-gans]'); if(gb){gAnswer(+gb.dataset.gans);return;}
  var ob=e.target.closest('[data-ord]'); if(ob){ordTap(+ob.dataset.ord);return;}
  var an=e.target.closest('[data-ans]'); if(an){answer(+an.dataset.ans);return;}
  var fl=e.target.closest('[data-fl]');
  if(fl){var c0=S.cur;if(c0&&c0.phase==='q'&&!c0.answered){c0.picks=c0.picks||{};c0.picks[fl.dataset.fl]=+fl.dataset.v;var grp=fl.parentNode;Array.prototype.forEach.call(grp.querySelectorAll('button'),function(b){var on=b===fl;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});var m0=$('#ans-msg');if(m0)m0.hidden=true;}return;}
  var lm=e.target.closest('[data-lab]'); if(lm){S.labMode=lm.dataset.lab;render();return;}
  var mm=e.target.closest('[data-labm]'); if(mm){S.labM=mm.dataset.labm;render();return;}
  var fx=e.target.closest('[data-fex]'); if(fx){var ex0=LAB_FLAG_EX[+fx.dataset.fex];S.labF={op:ex0.op,bits:ex0.bits,v1:ex0.v1,v2:ex0.v2};render();return;}
  var ac=e.target.closest('[data-act]');
  if(ac){var a=ac.dataset.act;
    if(a==='practice'){S.cur.phase='q';S.cur.picks={};render();focusCard(true);}
    else if(a==='check')submitTyped();
    else if(a==='checkflags')submitFlags();
    else if(a==='checkorder')ordCheck();
    else if(a==='clearorder'){if(S.cur&&!S.cur.answered){S.cur.ord=[];render();focusCard(false);}}
    else if(a==='reset-ask'){S.confirmReset=true;render();}
    else if(a==='reset-no'){S.confirmReset=false;render();}
    else if(a==='reset-yes')resetProgress();
    else if(a==='next')next();
    else if(a==='hint'){var hh=$('#hint');if(hh){hh.hidden=!hh.hidden;ac.textContent=hh.hidden?'Show a hint':'Hide the hint';}}
    else if(a==='replay'){var li=S.cur.li;S.cur=null;startLevel(li);render();focusCard(true);}
    else if(a==='nextlevel')goNextLevel();
    return;}
  var ex=e.target.closest('[data-ex]');
  if(ex){S.lab=ex.dataset.ex;var inp=$('#lab-in');if(inp){inp.value=S.lab;$('#lab-out').innerHTML=labMovOut(S.lab);inp.focus();}return;}
  var op=e.target.closest('[data-op]');
  if(op){S.labOp=op.dataset.op;var inp2=$('#lab-op');if(inp2){inp2.value=S.labOp;$('#lab-out').innerHTML=labValOut();inp2.focus();}}
});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  var tg=e.target;
  if(tg&&tg.id==='ans-in'){if(e.key==='Enter'){e.preventDefault();submitTyped();}return;}
  if(tg&&tg.closest&&tg.closest('input,textarea,select'))return;
  if(S.view!=='level'||!S.cur)return;
  var c=S.cur, q=c.phase==='q'?curQ():null;
  if(/^[1-9]$/.test(e.key)&&q&&!q.input&&!q.flags&&!c.answered){answer(+e.key-1);e.preventDefault();return;}
  if(e.key==='Enter'){
    if(tg&&tg.closest&&tg.closest('button,a,summary')&&!(c.phase==='q'&&q&&q.flags&&!c.answered&&tg.closest('.seg2')))return;
    if(c.phase==='lesson'){c.phase='q';c.picks={};render();focusCard(true);}
    else if(c.phase==='q'&&c.answered)next();
    else if(c.phase==='q'&&q&&q.flags)submitFlags();
    else if(c.phase==='q'&&q&&q.order)ordCheck();
    else if(c.phase==='q'&&q&&q.input){var inp=$('#ans-in');if(inp)inp.focus();}
    else if(c.phase==='done')goNextLevel();
    else return;
    e.preventDefault();
  }
});

document.addEventListener('input',function(e){var t=e.target;if(!t||!t.closest)return;var ti=t.closest('[data-ti]');if(!ti)return;var host=ti.closest('[data-tid]');if(!host)return;toyAct(host.dataset.tid,ti.dataset.ti,ti);toyRefresh(host.dataset.tid);});

/* ---------- boot ---------- */
function start(data){
  var base={view:'home',sec:null,xp:0,streak:0,best:{},cur:null,lab:'movb %eax, (%esp)',labMode:'val',labM:'practice',labOp:'(%rax,%rdx,4)',labF:{op:'cmp',bits:8,v1:'0xaa',v2:'0x53'},confirmReset:false};
  if(data&&data.S&&typeof data.S==='object'&&data.S.best){for(var k in data.S)base[k]=data.S[k];S=base;}
  else{S=base;var sv=loadSaved();if(sv){S.best=sv.best||{};S.xp=sv.xp||0;if(!sv.v||sv.v<6)S.sec='p6';}}
  if(!MACHINES[S.labM])S.labM='practice';
  if(!S.labF||typeof S.labF!=='object')S.labF={op:'cmp',bits:8,v1:'0xaa',v2:'0x53'};
  S.confirmReset=false;
  if(S.cur){
    if(S.cur.id){var kk=lvOf(S.cur.id)-1;if(kk<0)S.cur=null;else S.cur.li=kk;}
    else if(S.cur.li>=lvOf('stk')-1)S.cur=null;
  }
  if(S.cur){
    var L=LEVELS[S.cur.li];
    if(!L||!S.cur.queue){S.cur=null;}
    else{
      if(!S.cur.set)S.cur.set=range(L.qs.length);
      var ok=S.cur.queue.concat(S.cur.set).every(function(k){return k>=0&&k<L.qs.length;});
      if(!ok)S.cur=null;
    }
  }
  if(S.view==='level'&&!S.cur)S.view='home';
  if(!S.sec||!SECTIONS.some(function(x){return x.id===S.sec;}))S.sec=(S.view==='level'&&S.cur)?LEVELS[S.cur.li].sec:defaultSec();
  render();
}
if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function'){window.claude.hot.snapshot(function(){return {S:S};});}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){window.claude.hot.ready(start);}
else{start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});}
</script>
