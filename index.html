{instr:'cmpb %rdi, %rsi',plain:true,prompt:'With a in <code>%rdi</code> and b in <code>%rsi</code>, what does this compute?',options:['b − a','a − b','a + b'],answer:0,hint:'Second minus first. Which argument is second here?',explain:'Second minus first is <code>%rsi − %rdi</code>, which is b − a. Worksheet Q1 is written this way, so the subtraction goes the other direction from Q2.'},
{instr:'cmpl %esi, %edi',plain:true,prompt:'After this runs, what\'s in <code>%edi</code>?',code:false,options:['The same value as before','a − b','0'],answer:0,hint:'cmp throws the result away.',explain:'cmp only sets the flags. Neither operand changes.'},

{instr:'testl %eax, %eax',plain:true,prompt:'What does this compute?',code:false,options:['%eax &amp; %eax, which is just %eax','%eax − %eax, which is 0','%eax + %eax'],answer:0,hint:'test uses AND, not subtraction.',explain:'<code>test</code> ANDs the two operands. A value ANDed with itself is itself, so this just checks whether <code>%eax</code> is zero or negative.'},

defaults:{m:null,only:['ZF','SF']},
lesson:`<p>After cmp, sub, add or test, the CPU records four one-bit flags. Start with the two that only look at the result itself.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Flag</th><th>Name</th><th>Set to 1 when</th></tr></thead><tbody>
<tr><td class="c">ZF</td><td>zero flag</td><td>the result is exactly zero</td></tr>
<tr><td class="c">SF</td><td>sign flag</td><td>the result is negative as a signed number. SF is a copy of the result's top bit.</td></tr>
</tbody></table></div>`+

{id:'cf',sec:'p3',name:'CF: the unsigned borrow',short:'Carry flag',shuffleOpts:true,
defaults:{m:null,only:['CF']},
lesson:`<p>CF is about <b>unsigned</b> math. Every byte has two readings: unsigned (0 to 255) and signed (−128 to 127). The top bit decides. If a byte is 0x80 or more, its signed reading is negative, and equals the unsigned reading minus 256.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Byte</th><th>Unsigned</th><th>Signed</th></tr></thead><tbody>
<tr><td class="c">0x53</td><td>83</td><td>+83</td></tr>
<tr><td class="c">0x7F</td><td>127</td><td>+127</td></tr>
<tr><td class="c">0x80</td><td>128</td><td>−128</td></tr>
<tr><td class="c">0xAA</td><td>170</td><td>−86</td></tr>
<tr><td class="c">0xD2</td><td>210</td><td>−46</td></tr>
<tr><td class="c">0xFF</td><td>255</td><td>−1</td></tr>
</tbody></table></div>
<p><b>CF for subtraction:</b> 1 when the unsigned math goes below zero, which happens when the second value is below the first. Your slide puts it as "if the subtrahend is greater than the minuend, CF = 1". <b>CF for addition:</b> 1 when the unsigned sum is bigger than 255, so a 1 carries out the top and is lost.</p>`+
flagsWorked({op:'cmp',bits:8,text:'cmpb %dil, %sil',s1:{label:'a',reg:'%dil',val:'0xaa'},s2:{label:'b',reg:'%sil',val:'0x53'}},{only:['CF']})+
`<div class="tip"><span class="tl">Negative numbers in the question</span>A value like −46 is stored as the byte 0xD2, which is 210 unsigned. Convert first, then compare as unsigned.</div>`,

{id:'of',sec:'p3',name:'OF: the signed overflow',short:'Overflow flag',shuffleOpts:true,
defaults:{m:null,only:['OF']},
lesson:`<p>OF is about <b>signed</b> math. It's 1 when the true signed answer doesn't fit in the signed range: −128 to 127 for a byte, about ±2.1 billion for a 4-byte int.</p>
<ol class="steps"><li><b>Read both values as signed.</b> 0xAA is −86, not 170.</li><li><b>Do the real math</b>, like on paper.</li><li><b>Check the range.</b> Outside it means OF = 1.</li></ol>`+
flagsWorked({op:'cmp',bits:8,text:'cmpb %dil, %sil',s1:{label:'a',reg:'%dil',val:'0xaa'},s2:{label:'b',reg:'%sil',val:'0x53'}},{only:['OF']})+
flagsWorked({op:'cmp',bits:8,text:'cmpb %dil, %sil',s1:{label:'a',reg:'%dil',val:'-101'},s2:{label:'b',reg:'%sil',val:'-46'}},{only:['OF']})+
`<div class="tip"><span class="tl">Two shortcuts</span>Subtracting two numbers with the <b>same</b> sign can never overflow. Adding two numbers with <b>different</b> signs can never overflow. Overflow needs the real answer to be pushed past the edge, and those combinations pull it toward the middle.</div>
<p class="fine">Your slide's formula for t = b − a: OF = (a&lt;0 &amp;&amp; b&gt;0 &amp;&amp; t&lt;0) || (a&gt;0 &amp;&amp; b&lt;0 &amp;&amp; t&gt;0). That's the same test written as sign checks. The "does it fit?" method gives the same answer and is easier to do by hand.</p>`,

{fl:{op:'cmp',bits:8,text:'cmpb %dil, %sil',s1:{label:'a',reg:'%dil',val:'0xaa'},s2:{label:'b',reg:'%sil',val:'0x53'}},prompt:'After this, what is OF?',options:['OF = 1','OF = 0'],answer:0,hint:'Signed: +83 − (−86).',explain:'Signed, +83 − (−86) = +169, which is bigger than 127, so OF = 1.'},

{id:'setx',sec:'p3',name:'SET: flags into a byte',short:'SET',shuffleOpts:true,
defaults:{m:null},
lesson:`<p>A <code>setX</code> instruction turns the flags into a 0 or 1 in a byte register, usually <code>%al</code>. The letters after <code>set</code> say which condition to check.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>setX</th><th>Condition</th><th>Meaning</th></tr></thead><tbody>
<tr><td class="c">sete</td><td class="c">ZF</td><td>Equal / zero</td></tr>
<tr><td class="c">setne</td><td class="c">~ZF</td><td>Not equal / not zero</td></tr>
<tr><td class="c">sets</td><td class="c">SF</td><td>Negative</td></tr>
<tr><td class="c">setns</td><td class="c">~SF</td><td>Nonnegative</td></tr>
<tr><td class="c">setg</td><td class="c">~(SF^OF) &amp; ~ZF</td><td>Greater (signed)</td></tr>
<tr><td class="c">setge</td><td class="c">~(SF^OF)</td><td>Greater or equal (signed)</td></tr>
<tr><td class="c">setl</td><td class="c">SF^OF</td><td>Less (signed)</td></tr>
<tr><td class="c">setle</td><td class="c">(SF^OF) | ZF</td><td>Less or equal (signed)</td></tr>
<tr><td class="c">seta</td><td class="c">~CF &amp; ~ZF</td><td>Above (unsigned)</td></tr>
<tr><td class="c">setae</td><td class="c">~CF</td><td>Above or equal (unsigned)</td></tr>
<tr><td class="c">setb</td><td class="c">CF</td><td>Below (unsigned)</td></tr>
<tr><td class="c">setbe</td><td class="c">CF | ZF</td><td>Below or equal (unsigned)</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">The naming pattern</span><b>e</b> equal, <b>ne</b> not equal, <b>s</b> sign. <b>g</b>reater and <b>l</b>ess are the <b>signed</b> compares, using SF and OF. <b>a</b>bove and <b>b</b>elow are the <b>unsigned</b> compares, using CF. Adding <b>e</b> means "or equal", which brings ZF in.</div>
<p>Why SF^OF means "less"? If there was no overflow, a negative result means less. If there was an overflow, the sign bit is backwards, so flip it. XOR with OF does exactly that.</p>`+
flagsWorked({op:'cmp',bits:8,text:'cmpb %dil, %sil',s1:{label:'a',reg:'%dil',val:'0xaa'},s2:{label:'b',reg:'%sil',val:'0x53'}},{set:'setb',only:['CF','ZF']})+
`<p class="fine">set only writes one byte and leaves the other bytes of the register alone, so compilers usually follow it with <code>movzbl %al, %eax</code> to zero the rest. ~ means NOT, ^ means XOR, &amp; means AND and | means OR.</p>`,
qs:[
{given:{CF:0,ZF:1,SF:0,OF:0},cond:'sete',instr:'sete %al',plain:true,prompt:'With these flags, what does this put in <code>%al</code>?',options:['%al = 1','%al = 0'],answer:0,hint:'sete uses ZF.',explain:'sete copies ZF, and ZF is 1.'},
{given:{CF:1,ZF:0,SF:1,OF:1},cond:'setb',instr:'setb %al',plain:true,prompt:'With these flags, what does this put in <code>%al</code>?',options:['%al = 1','%al = 0'],answer:0,hint:'setb uses CF.',explain:'setb copies CF, and CF is 1.'},
{given:{CF:1,ZF:0,SF:1,OF:1},cond:'setl',instr:'setl %al',plain:true,prompt:'Same flags. What does <code>setl</code> put in <code>%al</code>?',options:['%al = 0','%al = 1'],answer:0,hint:'setl uses SF^OF. 1^1 is 0.',explain:'setl is SF^OF = 1^1 = 0. The same flags gave setb a 1, so these values are below as unsigned but not less as signed. That\'s 0x53 vs 0xAA again.'},
{given:{CF:0,ZF:0,SF:1,OF:0},cond:'setg',instr:'setg %al',plain:true,prompt:'With these flags, what does this put in <code>%al</code>?',options:['%al = 0','%al = 1'],answer:0,hint:'SF is 1 with no overflow, so the result was really negative.',explain:'setg is ~(SF^OF) &amp; ~ZF = ~(1^0) &amp; ~0 = 0 &amp; 1 = 0. A negative result without overflow means less, not greater.'},
{prompt:'Which instruction means "greater than, unsigned"?',code:true,options:['seta','setg','setge','setb'],answer:0,hint:'above and below are the unsigned words.',explain:'<b>a</b>bove is the unsigned greater-than. <code>setg</code> is the signed one.'},
{prompt:'Which instruction means "less than or equal, signed"?',code:true,options:['setle','setbe','setl','setb'],answer:0,hint:'less is signed, and e adds "or equal".',explain:'<b>l</b>ess is signed, and the <b>e</b> adds "or equal". <code>setbe</code> is the unsigned version.'},
{fl:{op:'cmp',bits:8,text:'cmpb %dil, %sil',s1:{label:'a',reg:'%dil',val:'14'},s2:{label:'b',reg:'%sil',val:'37'}},flags:['CF','ZF','SF','OF'],set:'setne',prompt:'Set the flags, then what <code>setne %al</code> gives.',hint:'b − a = 23. Not equal.'},
{fl:{op:'cmp',bits:8,text:'cmpb %dil, %sil',s1:{label:'a',reg:'%dil',val:'0xaa'},s2:{label:'b',reg:'%sil',val:'0x53'}},flags:['CF','ZF','SF','OF'],set:'setb',prompt:'Set the flags, then what <code>setb %al</code> gives.',hint:'setb copies CF.'},
{fl:{op:'cmp',bits:8,text:'cmpb %dil, %sil',s1:{label:'a',reg:'%dil',val:'49'},s2:{label:'b',reg:'%sil',val:'49'}},flags:['CF','ZF','SF','OF'],set:'setge',prompt:'Set the flags, then what <code>setge %al</code> gives.',hint:'setge is ~(SF^OF). Equal counts as "or equal".'},
{prompt:'After <code>setl %al</code>, what does <code>movzbl %al, %eax</code> do?',code:false,options:['Zeroes the upper 3 bytes of %eax, so the whole register is 0 or 1','Moves %eax into %al','Sets %eax to −1'],answer:0,explain:'set writes only one byte. movzbl copies that byte into the full register and fills the rest with zeros, so the function can return a clean 0 or 1.'}
]},

{id:'jumps',sec:'p3',name:'Jumps: same letters',short:'Jumps',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>A <code>jX label</code> instruction jumps to the label when its condition is true. Otherwise execution falls through to the next instruction. The conditions are the same ones setX uses, with the same letters.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>jX</th><th>Synonym</th><th>Condition</th><th>Meaning</th></tr></thead><tbody>
<tr><td class="c">jmp</td><td></td><td class="c">1</td><td>Always</td></tr>
<tr><td class="c">je</td><td class="c">jz</td><td class="c">ZF</td><td>Equal / zero</td></tr>
<tr><td class="c">jne</td><td class="c">jnz</td><td class="c">~ZF</td><td>Not equal / not zero</td></tr>
<tr><td class="c">js</td><td></td><td class="c">SF</td><td>Negative</td></tr>
<tr><td class="c">jns</td><td></td><td class="c">~SF</td><td>Nonnegative</td></tr>
<tr><td class="c">jg</td><td class="c">jnle</td><td class="c">~(SF^OF) &amp; ~ZF</td><td>Greater (signed)</td></tr>
<tr><td class="c">jge</td><td class="c">jnl</td><td class="c">~(SF^OF)</td><td>Greater or equal (signed)</td></tr>
<tr><td class="c">jl</td><td class="c">jnge</td><td class="c">SF^OF</td><td>Less (signed)</td></tr>
<tr><td class="c">jle</td><td class="c">jng</td><td class="c">(SF^OF) | ZF</td><td>Less or equal (signed)</td></tr>
<tr><td class="c">ja</td><td class="c">jnbe</td><td class="c">~CF &amp; ~ZF</td><td>Above (unsigned)</td></tr>
<tr><td class="c">jae</td><td class="c">jnb, jnc</td><td class="c">~CF</td><td>Above or equal (unsigned)</td></tr>
<tr><td class="c">jb</td><td class="c">jnae, jc</td><td class="c">CF</td><td>Below (unsigned)</td></tr>
<tr><td class="c">jbe</td><td class="c">jna</td><td class="c">CF | ZF</td><td>Below or equal (unsigned)</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">Fake names</span>There is no <code>jlt</code>, <code>jgt</code>, <code>jeq</code>, <code>jet</code> or <code>jlte</code>. The real letters are <b>e, ne, s, ns, g, ge, l, le, a, ae, b, be</b>. Your worksheet lists fake names as answer choices, so this is the same "real or fake" game as Part 1's registers.</div>`,
qs:[
{prompt:'Which jump means "greater than, unsigned"?',options:['ja','jg','jgt','jae'],answer:0,hint:'above is unsigned.',explain:'<b>a</b>bove is the unsigned greater-than. <code>jg</code> is signed, and <code>jgt</code> doesn\'t exist.'},
{prompt:'Which jump means "less than or equal, signed"?',options:['jle','jbe','jl','jlte'],answer:0,hint:'less is signed, e adds or-equal.',explain:'<b>l</b>ess is signed and <b>e</b> adds "or equal". <code>jbe</code> is the unsigned one. <code>jlte</code> doesn\'t exist.'},
{prompt:'Which jump means "less than, unsigned"?',options:['jb','jl','jlt','jbe'],answer:0,hint:'below is unsigned.',explain:'<b>b</b>elow is the unsigned less-than. <code>jl</code> is signed, and <code>jlt</code> doesn\'t exist.'},

{prompt:'Which jump is the same as <code>jz</code>?',options:['je','jne','js','jmp'],answer:0,explain:'Zero and equal are the same test, ZF, so <code>jz</code> and <code>je</code> are two names for one instruction.'},
{prompt:'Which jump always jumps, no matter the flags?',options:['jmp','je','ja','jns'],answer:0,explain:'<code>jmp</code> is unconditional. Loops use it to go back to the top.'},
{prompt:'<code>jnb</code> is another name for which jump?',options:['jae','jb','jbe','jg'],answer:0,hint:'Not below means…',explain:'Not below is the same as above or equal, so <code>jnb</code> = <code>jae</code>.'},
{given:{CF:0,ZF:0,SF:0,OF:0},cond:'jg',instr:'jg .L2',plain:true,prompt:'After <code>cmpl %esi, %edi</code> set these flags, does this jump?',code:false,options:['Jumps to .L2','Falls through to the next instruction'],answer:0,hint:'jg is ~(SF^OF) & ~ZF.',explain:'~(0^0) &amp; ~0 = 1, so it jumps. The compare found a greater than b.'},

{id:'ifelse',sec:'p3',name:'if/else: jump over the body',short:'if / else',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>C runs the body of an <code>if</code> when the test is true. Assembly usually does the opposite: it <b>jumps past the body when the test is false</b>. So the jump often uses the opposite condition from the C code. Always check where the label leads.</p>
<p>Your slide's <code>absdiff</code>, with x in %edx and y in %eax:</p>`+
codeBlock('int absdiff(int x, int y) {\n    if (x > y)  result = x - y;\n    else        result = y - x;\n}\n\n    cmpl  %eax, %edx     # x - y\n    jle   .L6            # if (x <= y) go to the else part\n    subl  %eax, %edx     # result = x - y\n    movl  %edx, %eax\n    jmp   .L7            # skip the else part\n.L6:\n    subl  %edx, %eax     # result = y - x\n.L7:')+
`<p>The C says <code>x &gt; y</code>, but the jump is <code>jle</code>, because it goes to the <b>else</b> part. The worksheet\'s function has the same shape, twice:</p>`+
codeBlock('int function(int a, int b) {      // a in %edi, b in %esi\n    if (a == b) return 0;\n    if (a condition b) return a;\n    else return b;\n}\n\nfunction:\n      cmpl      %esi, %edi    # a - b\n      [[jne]]       .L1           # not equal? skip the return 0\n      xor       %eax, %eax    # return 0\n      ret\n.L1:  [[cond_jmp]]  .L2           # a condition b? go return a\n      movl      %esi, %eax    # return b\n      ret\n.L2:  movl      %edi, %eax    # return a\n      ret')+
`<p>The first blank jumps <b>over</b> the <code>return 0</code>, so it fires when a and b are <i>not</i> equal: <code>jne</code>. The second blank jumps <b>to</b> the <code>return a</code>, so it uses the condition itself, with no flip. Since the compare computed a − b, "a &gt; b unsigned" is simply <code>ja</code>.</p>
<div class="tip"><span class="tl">Two idioms</span><code>xor %eax, %eax</code> sets %eax to 0 (anything XOR itself is 0). And <code>cmovg %edx, %eax</code> copies %edx into %eax only if the last compare said greater, which avoids a jump entirely. Your slide uses it for absdiff.</div>`,
qs:[
{prompt:'In absdiff, after <code>cmpl %eax, %edx</code> (x − y), which jump goes to the <b>else</b> part of <code>if (x &gt; y)</code>?',options:['jle','jg','jl','jge'],answer:0,hint:'The jump fires when the test is false.',explain:'The else part runs when x &gt; y is false, which is x ≤ y, so <code>jle</code>.'},
{prompt:'<code>if (a == b) return 0;</code> compiles to a compare, then a jump that <b>skips</b> the <code>return 0</code>. Which jump?',options:['jne','je','jz','jeq'],answer:0,hint:'Skip the return when they are not equal.',explain:'The jump skips the return when the test is false, so it fires when a ≠ b: <code>jne</code>. <code>jeq</code> doesn\'t exist.'},
{instr:'xor %eax, %eax',plain:true,prompt:'What does this do?',code:false,options:['Sets %eax to 0','Flips every bit of %eax','Compares %eax with itself'],answer:0,explain:'Anything XOR itself is 0, so this is a short way to write <code>movl $0, %eax</code>. The worksheet uses it for <code>return 0</code>.'},
{prompt:'At .L1, <code>cond_jmp .L2</code> jumps to <code>return a</code> when <code>a condition b</code> is true, after <code>cmpl %esi, %edi</code> computed a − b. If the condition is <code>a &gt; b</code> (unsigned), cond_jmp is',options:['ja','jg','jbe','jle'],answer:0,hint:'This jump goes to the then-part, so no flip. Unsigned greater is…',explain:'The jump goes to the then-part, so it uses the condition as written. Unsigned greater-than is <code>ja</code>.'},
{prompt:'Same setup. If the condition is <code>a &lt;= b</code> (signed), cond_jmp is',options:['jle','jbe','jg','jl'],answer:0,explain:'Signed less-or-equal is <code>jle</code>.'},
{prompt:'Same setup. If the condition is <code>a &lt; b</code> (unsigned), cond_jmp is',options:['jb','jl','jbe','jae'],answer:0,explain:'Unsigned less-than is <code>jb</code>.'},
{prompt:'For <code>if (x &lt; y) { A } else { B }</code>, after <code>cmpl %eax, %edx</code> (x − y), which jump goes to the else part?',options:['jge','jl','jle','jg'],answer:0,hint:'Opposite of less-than.',explain:'The else part runs when x &lt; y is false, which is x ≥ y: <code>jge</code>.'},
{instr:'cmovg %edx, %eax',plain:true,prompt:'What does this do?',code:false,options:['Copies %edx into %eax only if the last compare was greater (signed)','Always copies %edx into %eax','Jumps to the address in %edx'],answer:0,explain:'A conditional move. The copy happens only when the condition holds. Otherwise %eax keeps its value, and no jump is needed.'},
{prompt:'Why does the compiler sometimes use <code>cmov</code> instead of a jump?',code:false,options:['Jumps disrupt the instruction pipeline. cmov doesn\'t transfer control.','cmov is faster because it skips the compare.','Jumps can\'t be used inside functions.'],answer:0,explain:'From your slide: branches are disruptive to the pipeline, and a conditional move doesn\'t need a control transfer. It only makes sense when both sides are cheap and safe to compute.'}
]},

{id:'loops',sec:'p3',name:'Loops: test, then jump out',short:'Loops',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>A <code>while</code> loop in assembly checks the condition at the top and <b>jumps out</b> when it fails. At the bottom, an unconditional <code>jmp</code> goes back to the top.</p>`+
codeBlock('while (Test)          Loop:  if (!Test) goto Done\n    Body                      Body\n                              goto Loop\n                       Done:')+
`<p>The worksheet\'s <code>array_sum</code>, with size in %edi and the array pointer in %esi:</p>`+
codeBlock('int array_sum(int size, int *array) {\n    int sum = 0;\n    while (size)\n        sum += array[--size];\n    return sum;\n}\n\narray_sum:\n        xor   %eax, %eax          # sum = 0\n.L1:    [[test  %edi, %edi]]        # is size zero?\n        [[jz]]    .L2                 # yes: leave the loop\n        dec   %edi                # --size\n        add   (%esi, %edi, 4), %eax   # sum += array[size]\n        jmp   .L1                 # back to the test\n.L2:    ret')+
`<p><code>test %edi, %edi</code> sets ZF = 1 exactly when size is 0, and <code>jz</code> (same as <code>je</code>) leaves the loop then. The <code>add</code> line is Part 2 again: base %esi, index %edi, scale 4, because ints are 4 bytes. That\'s <code>array[size]</code>.</p>
<div class="tip"><span class="tl">do-while is the other way around</span>A do-while runs the body first, then jumps <b>back</b> while the test is still true. Your slide\'s pcount ends with <code>shrl %edx</code> then <code>jne .L2</code>: shift sets the flags, and jne loops again while x isn\'t zero.</div>`,
qs:[
{instr:'test %edi, %edi',plain:true,prompt:'When does this set ZF = 1?',code:false,options:['When %edi is 0','When %edi is negative','Always'],answer:0,explain:'%edi &amp; %edi is %edi, so the result is zero exactly when %edi is zero.'},

function expectedFor(q,sol){if(q.expect)return q.expect;if(!sol||sol.error)return null;return q.ask==='address'?toHex(sol.addr):sol.vStr;}
function trapFor(q,sol,val){
  var n=normHex(val); if(n===null) return null;
  var lists=[]; if(q.traps)lists.push(q.traps); if(sol&&!sol.error)lists.push(q.ask==='address'?sol.addrTraps:sol.valTraps);
  for(var i=0;i<lists.length;i++){for(var j=0;j<lists[i].length;j++){if(normHex(lists[i][j].v)===n)return lists[i][j].msg;}}
  if(sol&&!sol.error&&sol.kind==='mem'&&q.ask!=='address'&&q.m){
    var M=MACHINES[q.m],hit=null;
    M.mem.some(function(m){if(normHex(m[1])===n){hit=m[0];return true;}return false;});
    if(hit) return 'That\'s the value at '+esc(hit)+', a different address. Recheck the address math.';
  }
  return null;
}

function record(correct,info){
  var c=S.cur, qi=c.queue[0], gain=0;
  if(correct){gain=c.missed.indexOf(qi)>=0?5:10;S.xp+=gain;S.streak++;c.solved.push(qi);}
  else{S.streak=0;c.mistakes++;if(c.missed.indexOf(qi)<0)c.missed.push(qi);}
  info.correct=correct;info.gain=gain;c.answered=info;
  save();render();focusCard(false);
  var fb=document.querySelector('.fb'); if(fb){var b=fb.getBoundingClientRect();if(b.bottom>window.innerHeight)fb.scrollIntoView({block:'nearest',behavior:smooth()});}
}
function answer(k){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||q.input||!q.options)return;
  var perm=permOf(c,c.queue[0],q); if(k<0||k>=perm.length)return;
  var oi=perm[k], correct=oi===q.answer, info={picked:k};
  if(!correct) info.trap=trapFor(q,solFor(q),q.options[oi]);
  record(correct,info);
}
function submitTyped(){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||!q.input)return;
  var inp=$('#ans-in'), msg=$('#ans-msg'); if(!inp)return;
  var raw=inp.value.trim(), n=normHex(raw);
  if(!raw){msg.textContent='Type a hex value first, like 0x2D.';msg.hidden=false;inp.focus();return;}
  if(n===null){msg.textContent='Use hex digits 0–9 and A–F, like 0x2D.';msg.hidden=false;inp.focus();return;}
  var sol=solFor(q), exp=expectedFor(q,sol), correct=n===normHex(exp), info={typed:raw};
  if(!correct) info.trap=trapFor(q,sol,raw);
  record(correct,info);
}
function submitFlags(){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||!q.flags)return;
  var keys=q.flags.slice(); if(q.set)keys.push('al');
  var picks=c.picks||{}, missing=keys.filter(function(k){return picks[k]!==0&&picks[k]!==1;});
  var msg=$('#ans-msg');
  if(missing.length){if(msg){msg.textContent='Pick 0 or 1 for '+missing.map(function(k){return k==='al'?'%al':k;}).join(', ')+' first.';msg.hidden=false;}return;}
  var r=solveFlags(q.fl); if(r.error)return;
  var res={}, correct=true;
  keys.forEach(function(k){var actual=k==='al'?condEval(q.set,r.F).val:r.F[k];var ok=picks[k]===actual;if(!ok)correct=false;res[k]={picked:picks[k],actual:actual,ok:ok};});
  record(correct,{res:res});
}
function resetProgress(){S.best={};S.xp=0;S.streak=0;S.cur=null;S.confirmReset=false;save();S.view='home';render();focusCard(true);}
function next(){
  var c=S.cur; if(!c||!c.answered)return;
  var qi=c.queue.shift(); if(!c.answered.correct)c.queue.push(qi);
  c.answered=null; c.picks={};
  if(!c.queue.length){c.phase='done';c.pts=pipsFor(c.mistakes);var id=LEVELS[c.li].id;S.best[id]=Math.max(S.best[id]||0,c.pts);save();}
  render();focusCard(true);
}
function goNextLevel(){
  var c=S.cur; if(!c)return;
  if(c.li<LEVELS.length-1)startLevel(c.li+1); else {var li=c.li;S.cur=null;startLevel(li);}
  render();focusCard(true);
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sec]');
  if(t){S.sec=t.dataset.sec;S.view='home';render();focusCard(true);return;}
  var g=e.target.closest('[data-go]');
  if(g){var v=g.dataset.go;
    if(v==='home')S.view='home';
    else if(v==='lab'){S.view='lab';S.sec='rev';}
    else if(v==='lab-mov'||v==='lab-val'||v==='lab-flags'){S.view='lab';S.sec='rev';S.labMode=v.slice(4);}
    else if(v.indexOf('sec-')===0){S.sec=v.slice(4);S.view='home';}
    else startLevel(+v);
    render();focusCard(true);return;}
  var an=e.target.closest('[data-ans]'); if(an){answer(+an.dataset.ans);return;}
  var fl=e.target.closest('[data-fl]');
  if(fl){var c0=S.cur;if(c0&&c0.phase==='q'&&!c0.answered){c0.picks=c0.picks||{};c0.picks[fl.dataset.fl]=+fl.dataset.v;var grp=fl.parentNode;Array.prototype.forEach.call(grp.querySelectorAll('button'),function(b){var on=b===fl;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});var m0=$('#ans-msg');if(m0)m0.hidden=true;}return;}
  var lm=e.target.closest('[data-lab]'); if(lm){S.labMode=lm.dataset.lab;render();return;}
  var mm=e.target.closest('[data-labm]'); if(mm){S.labM=mm.dataset.labm;render();return;}
  var fx=e.target.closest('[data-fex]'); if(fx){var ex0=LAB_FLAG_EX[+fx.dataset.fex];S.labF={op:ex0.op,bits:ex0.bits,v1:ex0.v1,v2:ex0.v2};render();return;}
  var ac=e.target.closest('[data-act]');
  if(ac){var a=ac.dataset.act;
    if(a==='practice'){S.cur.phase='q';S.cur.picks={};render();focusCard(true);}
    else if(a==='check')submitTyped();
    else if(a==='checkflags')submitFlags();
    else if(a==='reset-ask'){S.confirmReset=true;render();}
    else if(a==='reset-no'){S.confirmReset=false;render();}
    else if(a==='reset-yes')resetProgress();
    else if(a==='next')next();
    else if(a==='hint'){var hh=$('#hint');if(hh){hh.hidden=!hh.hidden;ac.textContent=hh.hidden?'Show a hint':'Hide the hint';}}
    else if(a==='replay'){var li=S.cur.li;S.cur=null;startLevel(li);render();focusCard(true);}
    else if(a==='nextlevel')goNextLevel();
    return;}
  var ex=e.target.closest('[data-ex]');
  if(ex){S.lab=ex.dataset.ex;var inp=$('#lab-in');if(inp){inp.value=S.lab;$('#lab-out').innerHTML=labMovOut(S.lab);inp.focus();}return;}
  var op=e.target.closest('[data-op]');
  if(op){S.labOp=op.dataset.op;var inp2=$('#lab-op');if(inp2){inp2.value=S.labOp;$('#lab-out').innerHTML=labValOut();inp2.focus();}}
});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  var tg=e.target;
  if(tg&&tg.id==='ans-in'){if(e.key==='Enter'){e.preventDefault();submitTyped();}return;}
  if(tg&&tg.closest&&tg.closest('input,textarea,select'))return;
  if(S.view!=='level'||!S.cur)return;
  var c=S.cur, q=c.phase==='q'?curQ():null;
  if(/^[1-9]$/.test(e.key)&&q&&!q.input&&!q.flags&&!c.answered){answer(+e.key-1);e.preventDefault();return;}
  if(e.key==='Enter'){
    if(tg&&tg.closest&&tg.closest('button,a,summary')&&!(c.phase==='q'&&q&&q.flags&&!c.answered&&tg.closest('.seg2')))return;
    if(c.phase==='lesson'){c.phase='q';c.picks={};render();focusCard(true);}
    else if(c.phase==='q'&&c.answered)next();
    else if(c.phase==='q'&&q&&q.flags)submitFlags();
    else if(c.phase==='q'&&q&&q.input){var inp=$('#ans-in');if(inp)inp.focus();}
    else if(c.phase==='done')goNextLevel();
    else return;
    e.preventDefault();
  }
});

/* ---------- boot ---------- */
function start(data){
  var base={view:'home',sec:null,xp:0,streak:0,best:{},cur:null,lab:'movb %eax, (%esp)',labMode:'val',labM:'practice',labOp:'(%rax,%rdx,4)',labF:{op:'cmp',bits:8,v1:'0xaa',v2:'0x53'},confirmReset:false};
  if(data&&data.S&&typeof data.S==='object'&&data.S.best){for(var k in data.S)base[k]=data.S[k];S=base;}
  else{S=base;var sv=loadSaved();if(sv){S.best=sv.best||{};S.xp=sv.xp||0;}}
  if(!MACHINES[S.labM])S.labM='practice';
  if(!S.labF||typeof S.labF!=='object')S.labF={op:'cmp',bits:8,v1:'0xaa',v2:'0x53'};
  S.confirmReset=false;
  if(S.cur){
    var L=LEVELS[S.cur.li];
    if(!L||!S.cur.queue){S.cur=null;}
    else{
      if(!S.cur.set)S.cur.set=range(L.qs.length);
      var ok=S.cur.queue.concat(S.cur.set).every(function(k){return k>=0&&k<L.qs.length;});
      if(!ok)S.cur=null;
    }
  }
  if(S.view==='level'&&!S.cur)S.view='home';
  if(!S.sec||!SECTIONS.some(function(x){return x.id===S.sec;}))S.sec=(S.view==='level'&&S.cur)?LEVELS[S.cur.li].sec:defaultSec();
  render();
}
if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function'){window.claude.hot.snapshot(function(){return {S:S};});}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){window.claude.hot.ready(start);}
else{start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});}
</script>
