<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Will It Assemble? A learning game for x86 assembly and the memory hierarchy: mov rules, addressing, control flow, procedures, arrays, DRAM, disks, SSDs and locality.">
<meta name="color-scheme" content="light dark">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font:14px system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Will It Assemble?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one-column game cartridge. Section tabs and a level strip on top, one card at a time below. Byte blocks are the recurring motif (progress, scores, sizes); register and memory tables light up to show where a value came from. */
:root{
  --bg:#eceef6;
  --panel:#ffffff;
  --sunk:#f3f4fa;
  --ink:#1c1e38;
  --muted:#575b7c;
  --line:#d3d6e7;
  --accent:#4a3fb4;
  --accent-ink:#ffffff;
  --accent-soft:#e8e5fb;
  --byte:#d88a0b;
  --byte-ink:#8a5000;
  --byte-soft:#fcefd5;
  --src:#0c7480;
  --src-soft:#dcf0f2;
  --good:#1b7f51;
  --good-soft:#e1f3e9;
  --bad:#bf3b28;
  --bad-soft:#fbe6e2;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-code:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-pixel:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131528;--panel:#1c1f37;--sunk:#171930;--ink:#e7e8f6;--muted:#a2a5c6;--line:#33375a;
    --accent:#a59bff;--accent-ink:#15172b;--accent-soft:#2b2856;
    --byte:#f0a43c;--byte-ink:#f7bd66;--byte-soft:#3b2d16;
    --src:#56c8d5;--src-soft:#163a40;--good:#5ad198;--good-soft:#163527;--bad:#ff8069;--bad-soft:#41211c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131528;--panel:#1c1f37;--sunk:#171930;--ink:#e7e8f6;--muted:#a2a5c6;--line:#33375a;
  --accent:#a59bff;--accent-ink:#15172b;--accent-soft:#2b2856;
  --byte:#f0a43c;--byte-ink:#f7bd66;--byte-soft:#3b2d16;
  --src:#56c8d5;--src-soft:#163a40;--good:#5ad198;--good-soft:#163527;--bad:#ff8069;--bad-soft:#41211c;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:grid;gap:16px}
code{font-family:var(--font-code);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:.05em .3em;white-space:nowrap}
.mono{font-family:var(--font-code)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card:focus,.card:focus-visible{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.top h1{margin:0;font-size:clamp(1.6rem,1.1rem + 2.2vw,2.3rem);font-weight:700;letter-spacing:-.015em;line-height:1.1}
.brand{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.brand .qm{color:var(--accent)}
.tagline{font-family:var(--font-pixel);font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.stats{display:flex;gap:8px}
.stat{font-family:var(--font-pixel);font-size:11px;letter-spacing:.06em;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;align-items:baseline;gap:6px;text-transform:uppercase}
.stat b{font-size:15px;color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}

/* sections + level strip */
.map{display:grid;gap:10px}
.secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sec-tab{display:grid;gap:1px;align-content:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.sec-tab:hover{border-color:var(--accent)}
.sec-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sec-part{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.sec-name{font-weight:600;font-size:15px;line-height:1.25}
.sec-prog{font-size:12px;opacity:.85}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lv{display:grid;gap:6px;align-content:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.lv:hover{border-color:var(--accent)}
.lv.on{border-color:var(--accent);background:var(--accent-soft)}
.lv-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lv-n{font-family:var(--font-pixel);font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.lv-next{font-family:var(--font-pixel);font-size:9px;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:2px 5px;text-transform:uppercase}
.lv-name{font-size:14px;font-weight:600;line-height:1.25}
.lv-sub{font-size:12px;color:var(--muted);line-height:1.3}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--line);display:block}
.pips i.f{background:var(--byte);border-color:var(--byte)}
@media (max-width:540px){
  .sec-tab{padding:8px 10px}
  .sec-name{font-size:13.5px}
  .strip{display:flex;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding-inline:16px;padding-bottom:4px}
  .lv{flex:0 0 136px;scroll-snap-align:start}
}

/* card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3.5vw,30px);display:grid;gap:16px;min-width:0}
.eyebrow{font-family:var(--font-pixel);font-size:11px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.card h2{margin:0;font-size:clamp(1.25rem,1rem + 1vw,1.55rem);font-weight:600;line-height:1.25;text-wrap:balance}
.card h2 code{font-size:.85em}
.card p{margin:0;max-width:65ch}
.lesson{display:grid;gap:14px;min-width:0}
.tip{background:var(--byte-soft);border-radius:10px;padding:12px 14px;max-width:65ch}
.tip .tl{display:block;font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--byte-ink);font-weight:400;margin-bottom:3px;text-transform:uppercase}
.fine{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.kbd{font-family:var(--font-pixel);font-size:9px;letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:2px 5px;opacity:.75;text-transform:uppercase}
@media (hover:none){.kbd{display:none}}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.count{font-family:var(--font-pixel);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.prog{display:flex;flex-wrap:wrap;gap:4px}
.prog i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);display:block}
.prog i.done{background:var(--byte);border-color:var(--byte)}
.prog i.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tag{font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;color:var(--src);background:var(--src-soft);border-radius:5px;padding:3px 7px;justify-self:start;text-transform:uppercase}
.again{font-size:14px;color:var(--bad);font-weight:600}

.instr{font-family:var(--font-code);font-size:clamp(1.3rem,1rem + 1.6vw,1.85rem);font-weight:500;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:.55em;row-gap:.3em;overflow-x:auto;line-height:1.3;min-width:0}
.instr.small{font-size:1.1rem;padding:12px 14px}
.instr .op{display:inline-flex;flex-direction:column;gap:4px}
.instr .t{white-space:nowrap;padding-bottom:2px;border-bottom:3px solid transparent}
.instr .src .t{border-bottom-color:var(--src)}
.instr .dst .t{border-bottom-color:var(--accent)}
.instr.plain .src .t,.instr.plain .dst .t{border-bottom-color:transparent}
.instr .cap{display:none;font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.instr.labels .cap{display:block}
.instr .src .cap{color:var(--src)}
.instr .dst .cap{color:var(--accent)}
.instr .mnw .cap{color:var(--byte-ink);text-align:right}
.instr .comma{margin-left:-.5em}
.sfx{background:var(--byte-soft);color:var(--byte-ink);border-radius:4px;padding:0 .06em;box-shadow:inset 0 -3px 0 var(--byte)}
.token{font-family:var(--font-code);font-size:clamp(1.8rem,1.3rem + 2vw,2.4rem);font-weight:500;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;min-width:0}
.token.op{font-size:clamp(1.3rem,1rem + 2vw,2.1rem);padding:16px;overflow-x:auto;white-space:nowrap}
.token.sm{font-size:1.1rem;padding:8px 14px;text-align:left;justify-self:start;max-width:100%}

.opts{display:grid;gap:10px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;transition:border-color .12s,background .12s,transform .08s;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .key{flex:none;font-family:var(--font-pixel);font-size:11px;width:24px;height:24px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.opt .lbl{min-width:0;overflow-wrap:anywhere}
.opt .lbl code{white-space:normal}
.opt.code .lbl{font-family:var(--font-code);font-weight:500}
.opt .mark{margin-left:auto;font-weight:700}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key,.opt.right .mark{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key,.opt.wrong .mark{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.5}

/* typed answers */
.ans{display:flex;flex-wrap:wrap;gap:8px}
.ans .labin{flex:1 1 180px;width:auto;min-width:0}
.ans-msg{font-size:14px;color:var(--bad);font-weight:600}
.ans-done{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--line)}
.ans-done.right{border-color:var(--good);background:var(--good-soft)}
.ans-done.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans-l{font-size:13px;color:var(--muted)}
.ans-v{font-family:var(--font-code);font-size:1.15rem;font-weight:500;overflow-wrap:anywhere;min-width:0}
.ans-done .mark{margin-left:auto;font-weight:700}
.ans-done.right .mark{color:var(--good)}
.ans-done.wrong .mark{color:var(--bad)}

.hintrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hint{flex-basis:100%;font-size:15px;color:var(--muted)}

.fb{border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb-h{font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fb.ok .fb-h{color:var(--good)}
.fb.no .fb-h{color:var(--bad)}
.gain{font-family:var(--font-pixel);font-size:11px;font-weight:400;letter-spacing:.06em;color:var(--byte-ink)}
.trap{font-weight:600}
.fb-note{font-size:14px;color:var(--muted)}
.fb-act{display:flex;justify-content:flex-end}

.peek{border-top:1px solid var(--line);padding-top:12px}
.peek summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.peek .lesson{margin-top:14px}

/* breakdowns */
.bd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;min-width:0}
.bd-h{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.chk{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.chk-s{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:14px}
.chk.pass .chk-s{background:var(--good-soft);color:var(--good)}
.chk.fail .chk-s{background:var(--bad-soft);color:var(--bad)}
.chk-t{font-weight:600;font-size:15px;line-height:1.35;padding-top:2px}
.chk-lead{font-size:14px;color:var(--muted);margin-top:2px}
.chk ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px}
.chk li{padding-left:18px;position:relative}
.chk li::before{position:absolute;left:2px;top:0;content:"·";color:var(--muted)}
.chk li.v::before{content:"✓";color:var(--good)}
.chk li.x::before{content:"✗";color:var(--bad)}
.verdict{border-radius:10px;padding:10px 12px;font-size:15px}
.verdict.ok{background:var(--good-soft)}
.verdict.no{background:var(--bad-soft)}
.verdict.idle{background:var(--sunk);color:var(--muted)}
.verdict .mono{font-size:1.1em}
.blocks{display:inline-flex;gap:2px;vertical-align:-1px;margin:0 2px}
.blocks i{width:10px;height:10px;border-radius:2px;background:var(--byte);display:block}
.blocks.bad i{background:var(--bad)}
.st{display:grid;gap:6px;min-width:0}
.st-h{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.st-notes{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:grid;gap:2px}
.calc{display:grid;grid-template-columns:auto auto auto;justify-content:start;column-gap:12px;row-gap:2px;align-items:baseline;font-variant-numeric:tabular-nums;max-width:100%;overflow-x:auto}
.calc .cl{font-size:14px;color:var(--muted)}
.calc .cs{font-family:var(--font-code);color:var(--muted);text-align:center}
.calc .cv{font-family:var(--font-code);font-size:15px;text-align:right;white-space:nowrap}
.calc .tot{border-top:1.5px solid var(--ink);padding-top:4px;margin-top:2px;color:var(--ink);font-weight:600}

/* register + memory tables */
.machine{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-start;min-width:0}
.machine-cap{flex-basis:100%;font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.mt{border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:6px 4px;min-width:0;max-width:100%;overflow-x:auto}
.mt table{border-collapse:separate;border-spacing:0;font-family:var(--font-code);font-size:13.5px;font-variant-numeric:tabular-nums}
.mt th{font-family:var(--font-pixel);font-size:9px;font-weight:400;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;text-align:left;padding:2px 8px 4px}
.mt th+th,.mt td+td{text-align:right}
.mt td{padding:3px 8px;white-space:nowrap}
.mt tr.hl-r td{background:var(--src-soft);color:var(--src);font-weight:600}
.mt tr.hl-m td{background:var(--byte-soft);color:var(--byte-ink);font-weight:600}
.mt tr.hl-r td:first-child,.mt tr.hl-m td:first-child{border-radius:6px 0 0 6px}
.mt tr.hl-r td:last-child,.mt tr.hl-m td:last-child{border-radius:0 6px 6px 0}
@media (max-width:540px){.mt{padding:5px 2px}.mt table{font-size:12px}.mt td,.mt th{padding-inline:5px}.machine{column-gap:6px}}

/* lesson pieces */
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kind{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start}
.kind-n{font-weight:700}
.kind-r{font-size:14px;color:var(--muted)}
.kind-ex{display:flex;flex-wrap:wrap;gap:6px}
.tbl-wrap{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;font-size:15px;width:100%}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-family:var(--font-pixel);font-size:10px;font-weight:400;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
table.t td.c{font-family:var(--font-code);font-weight:500;white-space:nowrap}
table.conv td{text-align:center;font-variant-numeric:tabular-nums}
.none{color:var(--muted);font-family:var(--font-body);font-size:13px}
table.grid7 td,table.grid7 th{text-align:center}
table.grid7 th:first-child,table.grid7 td:first-child{text-align:left}
table.grid7 td.y{color:var(--good);background:var(--good-soft);font-weight:700}
table.grid7 td.n{color:var(--bad);background:var(--bad-soft);font-weight:700}
.regmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 4px;max-width:380px;font-family:var(--font-code);font-size:14px;padding-top:4px}
.br{border:2px solid var(--muted);border-bottom:0;height:10px;border-radius:4px 4px 0 0;position:relative;margin-top:24px}
.br span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:600}
.br small{font-family:var(--font-body);color:var(--muted);font-weight:400;font-size:12px}
.cell{height:40px;border-radius:6px;border:2px solid var(--byte);background:var(--byte-soft)}
.under{text-align:center;font-weight:600}
.under.muted{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:400}
.rule{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.rule > b{font-weight:600}
.ex{display:grid;gap:6px;min-width:0}
.ex-l{font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.ex.bad .ex-l{color:var(--bad)}
.ex.good .ex-l{color:var(--good)}
.pair{display:grid;gap:8px;min-width:0}
.pair2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cbox{display:grid;gap:10px;align-content:start;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.worked{display:grid;gap:10px;min-width:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
.steps li{counter-increment:s;display:block;position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 52px;min-height:28px}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;font-family:var(--font-pixel);font-size:12px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.steps li > span:last-child:not(:first-child){display:inline-block;margin-left:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.path li{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;align-content:start}
.path .pn{font-family:var(--font-pixel);font-size:10px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.path b{font-weight:600}
.path .pd{font-size:14px;color:var(--muted)}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.fs{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;align-content:center;background:var(--panel)}
.fs-op{background:var(--sunk);font-size:1.15rem}
.fs-l{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.arr{align-self:center;color:var(--muted);font-size:18px}
.hexstrip{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:2px;font-family:var(--font-code);text-align:center;margin-block:8px;max-width:520px}
.hexstrip span{display:grid;gap:1px;padding:4px 0;border-radius:5px;background:var(--panel)}
.hexstrip b{font-weight:600;font-size:14px}
.hexstrip i{font-style:normal;font-size:10.5px;color:var(--muted)}
.hexstrip span.hi b{color:var(--byte-ink)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-family:var(--font-code);font-size:clamp(1.05rem,.95rem + .8vw,1.35rem);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.formula .fa{color:var(--muted)}
.fD{color:var(--byte-ink);font-weight:600}
.fB{color:var(--src);font-weight:600}
.fI{color:var(--accent);font-weight:600}
.fS{color:var(--good);font-weight:600}
.ref{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;gap:10px}
.ref summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:15px}
@media (max-width:560px){
  .kinds,.path{grid-template-columns:1fr}
  .flow{flex-direction:column}
  .arr{transform:rotate(90deg);align-self:flex-start;margin-left:18px;line-height:1}
}

/* done */
.bigpips{display:flex;gap:8px}
.bigpips i{width:34px;height:34px;border-radius:7px;border:2px solid var(--line);display:block}
.bigpips i.f{background:var(--byte);border-color:var(--byte);animation:pop .35s ease-out both}
.bigpips i.f:nth-child(2){animation-delay:.12s}
.bigpips i.f:nth-child(3){animation-delay:.24s}
.bigpips i.f:nth-child(4){animation-delay:.36s}
@keyframes pop{from{transform:scale(.6);opacity:.35}to{transform:none;opacity:1}}

/* lab */
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:4px;justify-self:start;max-width:100%}
.seg button{border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);border-color:var(--line)}
.labin{width:100%;box-sizing:border-box;font-family:var(--font-code);font-size:clamp(1.05rem,.95rem + .6vw,1.3rem);padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink)}
.labin:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lab-l{font-size:13px;color:var(--muted);margin-right:2px}
.chip{font-family:var(--font-code);font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.labout{display:grid;gap:12px;min-width:0}

/* Part 3: flags, code blocks */
.codeblock{margin:0;font-family:var(--font-code);font-size:14px;line-height:1.5;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;white-space:pre;min-width:0;max-width:100%}
.codeblock .cm{color:var(--muted)}
.codeblock .blank{background:var(--byte-soft);color:var(--byte-ink);border-radius:4px;padding:0 .3em;font-weight:600}
.vals{display:flex;flex-wrap:wrap;gap:8px}
.val{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel);min-width:0}
.val-k{font-size:14px;color:var(--muted)}
.val-k small{font-size:12px}
.val-v{font-family:var(--font-code);font-size:1.15rem;font-weight:500}
.gflags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gflag{font-family:var(--font-code);font-size:15px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel)}
.gflag b{color:var(--accent);font-weight:600}
.gflags .gl{font-size:13px;color:var(--muted);flex-basis:100%}
.flagrows{display:grid;gap:8px}
.flagrow{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0;flex-wrap:wrap}
.flagrow.right{border-color:var(--good);background:var(--good-soft)}
.flagrow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fl-n{font-family:var(--font-code);font-weight:600;min-width:3.2em}
.fl-n small{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:12px}
.fl-v{font-size:14px;color:var(--muted)}
.fl-v b{font-family:var(--font-code);color:var(--ink)}
.flagrow .mark{margin-left:auto;font-weight:700}
.flagrow.right .mark{color:var(--good)}
.flagrow.wrong .mark{color:var(--bad)}
.seg2{display:flex;gap:4px;margin-left:auto}
.seg2 button{font-family:var(--font-code);font-size:15px;font-weight:600;width:44px;height:36px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);cursor:pointer}
.seg2 button:hover{border-color:var(--accent)}
.seg2 button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flagact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
table.vals-t{width:auto;font-size:14px}
table.vals-t td,table.vals-t th{font-variant-numeric:tabular-nums;white-space:nowrap;padding:5px 7px}
table.condtbl{font-size:14px}
table.condtbl td,table.condtbl th{padding:6px 8px;vertical-align:top}
table.condtbl td.c{white-space:normal}
.flaglist{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}
.flaglist b{font-family:var(--font-code)}
.condtbl td.on{color:var(--good);font-weight:700}
.condtbl td.off{color:var(--muted)}
.labgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.labgrid label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.labgrid select,.labgrid input{font:inherit;font-family:var(--font-code);font-size:1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.labgrid select:focus,.labgrid input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;max-width:320px;font-family:var(--font-code);text-align:center}
.bits span{border:1px solid var(--line);border-radius:5px;padding:6px 0;font-weight:600;background:var(--panel)}
.bits span.top{border-color:var(--byte);background:var(--byte-soft);color:var(--byte-ink)}
.bits-cap{font-size:12px;color:var(--muted)}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
/* Parts 4-5: stack and array pictures */
.stk{display:grid;gap:4px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);min-width:0;align-content:start}
.stk-t{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.stk-regs{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--font-code);font-size:14px;margin-bottom:2px}
.stk-regs b{font-weight:600}
.stk-cap{font-size:12px;color:var(--muted)}
.stk-row{display:grid;grid-template-columns:5.6em minmax(0,1fr) 4.6em;gap:8px;align-items:center;font-family:var(--font-code);font-size:14px}
.stk-a{color:var(--muted);font-size:13px;text-align:right}
.stk-v{border:1.5px solid var(--line);border-radius:6px;background:var(--sunk);padding:6px 8px;text-align:center;min-height:1.5em;overflow-wrap:anywhere}
.stk-row.new .stk-v{border-color:var(--byte);background:var(--byte-soft);color:var(--byte-ink);font-weight:600}
.stk-row.room .stk-v{border-style:dashed;padding-block:16px}
.stk-p{color:var(--accent);font-weight:600;font-size:13px}
.arv{display:grid;gap:6px;min-width:0}
.arv-d{font-size:14px}
.arv-row{display:grid;gap:3px}
.arv-c{display:grid;gap:2px;border:1.5px solid var(--line);border-radius:6px;background:var(--sunk);padding:6px 2px;text-align:center;font-family:var(--font-code);min-width:0;font-size:14px}
.arv-c.hl{border-color:var(--byte);background:var(--byte-soft);color:var(--byte-ink)}
.arv-i{font-size:11px;color:var(--muted)}
.arv-o{font-size:11px;color:var(--accent);overflow-wrap:anywhere}
.argtbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;max-width:620px}
.argc{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:2px;text-align:center;background:var(--panel)}
.argc span{font-size:12px;color:var(--muted)}
.argc b{font-family:var(--font-code);font-size:16px;font-weight:600;color:var(--src)}
.argc.ret b{color:var(--byte-ink)}
.rule-box{font-family:var(--font-code);font-size:clamp(1.05rem,.95rem + .8vw,1.3rem);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 16px;justify-self:start;max-width:100%;overflow-x:auto}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== v6: Parts 3-9, guided steps, ordering, toys ===== */
.secs{grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.strip{position:relative}
.path{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.sm{padding:8px 12px;font-size:14px;gap:6px}
.fb.mid{background:var(--byte-soft)}
.fb.mid .fb-h{color:var(--byte-ink)}
.combo{font-family:var(--font-pixel);font-size:11px;font-weight:400;letter-spacing:.06em;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:2px 7px;animation:pop .35s ease-out both}
.unit{align-self:center;font-family:var(--font-code);color:var(--muted)}
.facts{margin:0;padding-left:20px;display:grid;gap:6px;max-width:65ch}
.cleared{font-family:var(--font-pixel);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:8px;padding:8px 12px;justify-self:start;animation:pop .4s ease-out both}
.sheet{display:grid;gap:12px;min-width:0}
.sheet h3{margin:8px 0 0;font-size:1.05rem;font-weight:600}

/* flag lamps */
.lights{display:flex;flex-wrap:wrap;gap:6px}
.light{display:grid;justify-items:center;gap:1px;min-width:52px;padding:6px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--panel);font-family:var(--font-code)}
.light b{font-size:12px;color:var(--muted);font-weight:600}
.light i{font-style:normal;font-size:19px;font-weight:600;line-height:1.1}
.light.on{border-color:var(--byte);background:var(--byte-soft);box-shadow:0 0 10px var(--byte-soft)}
.light.on b,.light.on i{color:var(--byte-ink)}
.light.unk i{color:var(--muted)}
.light.focus{outline:2px solid var(--accent);outline-offset:2px}

/* recipe rows (flags and arrays) */
.rc-top{font-size:15px}
.rc-row{display:grid;grid-template-columns:3.6em minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.rc-row.st{grid-template-columns:4.4em minmax(0,1fr);align-items:start}
.rc-row.focus{border-color:var(--accent);background:var(--accent-soft)}
.rc-k{font-family:var(--font-code);font-weight:600;font-size:13.5px;overflow-wrap:anywhere;line-height:1.3}
.rc-b{display:grid;gap:2px;min-width:0}
.rc-q{font-weight:600;font-size:14.5px;line-height:1.35}
.rc-w{font-size:14px;color:var(--muted);line-height:1.45}
.rc-f{display:block;font-size:12.5px;margin-top:2px}
.rc-v{font-family:var(--font-code);font-weight:600;font-size:18px;min-width:1.8em;text-align:center;border-radius:7px;padding:2px 8px;background:var(--sunk);border:1px solid var(--line)}
.rc-v.on{background:var(--byte-soft);color:var(--byte-ink);border-color:var(--byte)}
.rc-v.wide{font-size:14px;white-space:nowrap}
.rc-ans{margin-top:4px}
.rc-ans code{font-size:14px;white-space:normal;overflow-wrap:anywhere}
@media (max-width:420px){.rc-row{grid-template-columns:2.9em minmax(0,1fr) auto;gap:8px;padding:8px}.rc-row.st{grid-template-columns:3.9em minmax(0,1fr)}.rc-v.wide{white-space:normal;font-size:13px;max-width:5.5em}}

/* guided problems */
.gd-board{display:grid;gap:10px;min-width:0}
.gd{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.gd-s{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.gd-n{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--font-pixel);font-size:11px;background:var(--sunk);color:var(--muted)}
.gd-s.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gd-s.now .gd-n{background:var(--accent);color:var(--accent-ink)}
.gd-s.done .gd-n{background:var(--good-soft);color:var(--good);font-family:var(--font-body);font-weight:700;font-size:14px}
.gd-s.todo{border-style:dashed;opacity:.6;padding-block:6px}
.gd-s.todo .gd-q{font-weight:400;color:var(--muted);font-size:14px}
.gd-body{display:grid;gap:8px;min-width:0}
.gd-q{font-weight:600;line-height:1.4;padding-top:3px}
.gd-a{font-weight:600;color:var(--good);overflow-wrap:anywhere}
.gd-say{font-size:14px;color:var(--muted)}
.gd-hint{font-size:14px;color:var(--bad);font-weight:600;margin:0}
.wsc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;align-items:baseline;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--panel);justify-self:start;max-width:100%}
.wsc-l{font-size:13px;color:var(--muted)}
.wsc-v{font-family:var(--font-code);font-weight:600;overflow-wrap:anywhere}
.wsc-v.blankc{color:var(--byte-ink)}
.wsc-v.filled{color:var(--good)}
.blank.fill{background:var(--good-soft);color:var(--good)}

/* put-in-order questions */
.ord{display:grid;gap:8px}
.ord-n{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--font-pixel);font-size:11px;color:var(--muted)}
.ord-n.on{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ord-i.placed{border-color:var(--accent)}
.ord-i.right .ord-n.on{background:var(--good);border-color:var(--good)}
.ord-i.wrong .ord-n.on{background:var(--bad);border-color:var(--bad)}
.ord-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}

/* toys */
.toy{border:1.5px dashed var(--accent);border-radius:14px;padding:14px;display:grid;gap:12px;min-width:0}
.toy-h{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.toy-ctl,.toy-out{display:grid;gap:10px;min-width:0}
.toy-l{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.toy input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0}
.toy-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toy-msg{font-size:14.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.byte-out{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.bo-hex{font-size:26px;font-weight:600;padding:6px 14px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center}
.bo-v{display:grid;padding:6px 12px;border-radius:10px;border:1px solid var(--line);min-width:86px}
.bo-v span{font-size:12px;color:var(--muted)}
.bo-v b{font-family:var(--font-code);font-size:22px;font-weight:600}
.bo-v.neg b{color:var(--bad)}
.stk-row.gone .stk-v{opacity:.45;border-style:dashed}
.tr-code{padding:10px 8px}
.tr-l{display:block;border-radius:5px;padding:0 4px}
.tr-l.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.tr-step{font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.tr-note{font-size:15px;max-width:65ch}

/* 2D array toy */
.g2{display:grid;gap:4px;align-items:center}
.g2-h{font-family:var(--font-code);font-size:12px;color:var(--muted);text-align:center}
.g2-r{text-align:left;white-space:nowrap}
.g2-r small{color:var(--accent)}
.g2-c{font:inherit;font-family:var(--font-code);font-weight:600;padding:8px 0;border:1.5px solid var(--line);border-radius:7px;background:var(--sunk);color:var(--ink);cursor:pointer;min-width:0}
.g2-c:hover{border-color:var(--accent)}
.g2-c.row{background:var(--accent-soft)}
.g2-c.on{background:var(--byte-soft);border-color:var(--byte);color:var(--byte-ink)}
.flat{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px;font-family:var(--font-code);font-size:11px;text-align:center}
.flat span{padding:4px 0;border-radius:3px;background:var(--sunk);border:1px solid var(--line);min-width:0}
.flat span.rs{box-shadow:inset 2px 0 0 var(--muted)}
.flat span.row{background:var(--accent-soft)}
.flat span.on{background:var(--byte);color:var(--panel);border-color:var(--byte)}

/* DRAM */
.dram{display:grid;gap:8px;max-width:440px;min-width:0}
.dram-cap{font-size:13px;color:var(--muted)}
.dram-grid{display:grid;gap:4px;align-items:center}
.dg-h{font-family:var(--font-code);font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.dg-c{height:34px;border:1.5px solid var(--line);border-radius:6px;background:var(--sunk);font:inherit;font-family:var(--font-code);font-size:12px;color:var(--ink);display:grid;place-items:center;padding:0;min-width:0}
button.dg-c{cursor:pointer}
button.dg-c:hover{border-color:var(--accent)}
.dg-c.row{background:var(--accent-soft);border-color:var(--accent)}
.dg-c.cell{background:var(--byte-soft);border-color:var(--byte);color:var(--byte-ink);font-weight:600}
.dg-buf,.dg-c.bufc{margin-top:8px}
.dg-c.bufc{border-style:dashed}
.dram-out{font-size:14px;border-radius:8px;padding:8px 10px;background:var(--byte-soft);color:var(--byte-ink)}

/* memory module */
.mod{display:grid;gap:8px;min-width:0}
.mod-chips,.mod-word{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.mod-chip{border:1.5px solid var(--line);border-radius:6px;padding:6px 2px;display:grid;justify-items:center;gap:4px;background:var(--sunk);min-width:0}
.mod-chip span{font-family:var(--font-code);font-size:10.5px;color:var(--muted);text-align:center;line-height:1.1}
.mod-chip i{width:12px;height:12px;border-radius:3px;background:var(--accent-soft);border:1.5px solid var(--accent)}
.mod-chip.hl{border-color:var(--byte);background:var(--byte-soft)}
.mod-chip.hl i{background:var(--byte);border-color:var(--byte)}
.mod-word span{font-family:var(--font-code);font-size:10.5px;text-align:center;padding:6px 0;border-radius:4px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);min-width:0}
.mod-word span.hl{background:var(--byte);border-color:var(--byte);color:var(--panel);font-weight:600}
.mod-cap{font-size:12.5px;color:var(--muted)}

/* buses */
.bus{display:flex;align-items:stretch;min-width:0}
.bus-b{flex:1 1 0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel);display:grid;gap:2px;align-content:center;min-width:0}
.bus-b b{font-size:14px}
.bus-b small{font-size:12px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.bus-b.on{border-color:var(--accent);background:var(--accent-soft)}
.bus-w{flex:0 1 96px;display:grid;align-content:center;justify-items:center;gap:3px;padding:0 4px;position:relative;min-width:0}
.bus-w::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:var(--line);border-radius:3px}
.bus-w span{position:relative;font-size:11px;color:var(--muted);background:var(--panel);padding:0 3px;text-align:center;line-height:1.2}
.bus-w em{position:relative;font-style:normal;font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:1px 5px;text-align:center;line-height:1.3}
.bus-w.on::before{background:var(--accent)}
.iov{display:grid;gap:8px;min-width:0}
.io-bus{position:relative;display:flex;justify-content:center;gap:8px;align-items:center;padding:6px 0;flex-wrap:wrap}
.io-bus::before{content:"";position:absolute;left:0;right:0;top:50%;height:6px;margin-top:-3px;background:var(--line);border-radius:3px}
.io-bus.on::before{background:var(--accent)}
.io-bus span{position:relative;font-size:11.5px;background:var(--panel);padding:0 4px;color:var(--muted)}
.io-bus em{position:relative;font-style:normal;font-size:11.5px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:5px;padding:1px 6px}
.io-ds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.io-d{border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;display:grid;gap:2px;background:var(--panel);min-width:0}
.io-d b{font-size:13px;line-height:1.25}
.io-d small{font-size:11.5px;color:var(--muted)}
.io-d.on{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:560px){
  .bus{flex-direction:column}
  .bus-w{flex:0 0 auto;min-height:46px;padding:4px 0}
  .bus-w::before{left:50%;right:auto;top:0;bottom:0;width:6px;height:auto;margin:0 0 0 -3px}
  .io-ds{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* disks */
.disk{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
.dk-t{fill:none;stroke:var(--muted);stroke-width:1.2}
.dk-t.on{stroke:var(--accent);stroke-width:2.5}
.dk-l{stroke:var(--line);stroke-width:1.2}
.dk-s{fill:var(--byte);opacity:.85}
.dk-sp{fill:var(--src-soft);stroke:var(--src);stroke-width:1.5}
.dk-tx{font-family:var(--font-body);font-size:9px;fill:var(--src);text-anchor:middle}
.cyl{width:100%;max-width:240px;height:auto;display:block;margin:0 auto}
.cy-p{fill:var(--sunk);stroke:var(--muted);stroke-width:1.3}
.cy-t{fill:none;stroke:var(--accent);stroke-width:2}
.cy-d{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.cy-s{fill:var(--src-soft);stroke:var(--src);stroke-width:1.5}

/* SSD */
.ssd{display:grid;gap:8px;min-width:0}
.ssd-ftl{border:1.5px solid var(--accent);border-radius:10px;padding:8px 10px;background:var(--accent-soft);font-weight:600;font-size:14px;display:grid;gap:2px}
.ssd-ftl small{font-weight:400;font-size:12.5px;color:var(--muted)}
.ssd-mem,.ssd-buf{border:1.5px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;background:var(--sunk)}
.ssd-buf{border-style:dashed;background:transparent}
.ssd-l{font-size:12px;color:var(--muted)}
.blk{display:grid;gap:4px}
.blk b{font-size:13px}
.blk b em{font-style:normal;color:var(--bad);font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px}
.pgs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.pg{font-size:12px;text-align:center;padding:6px 2px;border-radius:5px;border:1px solid var(--line);background:var(--panel);min-height:1.4em;overflow-wrap:anywhere;min-width:0}
.pg.used{background:var(--src-soft);border-color:var(--src)}
.pg.new{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}

/* pyramid */
.pyr{display:grid;gap:6px;justify-items:center;min-width:0}
.pyr-end{font-size:12.5px;color:var(--muted)}
.pyr-stack{display:grid;gap:3px;justify-items:center;width:100%;max-width:520px}
.pyr-row{background:var(--accent-soft);border:1px solid var(--line);border-radius:6px;padding:5px 6px;text-align:center;font-size:13.5px;line-height:1.25;min-width:0}
.pyr-row b{font-family:var(--font-code);color:var(--accent);margin-right:2px}
.pyr-row small{display:block;font-size:11.5px;color:var(--muted)}
.pyr-row.hl{background:var(--byte-soft);border-color:var(--byte)}

/* access-order tables */
table.acc{width:auto}
table.acc th{white-space:nowrap}
table.acc td{text-align:center;font-family:var(--font-code);font-size:13px;padding:6px 7px}

.acc-fit>[hidden]{display:none!important}

table.acc-sm tbody+tbody tr:first-child>*{border-top:2px solid var(--line);padding-top:12px}
table.acc td.hl{background:var(--byte-soft);color:var(--byte-ink)}

/* univ and struct */
.uv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:12px;min-width:0}
.uv-col{display:grid;gap:6px;align-content:start;min-width:0}

.uv-r.hl{border-color:var(--byte);background:var(--byte-soft)}
.uv-a{color:var(--muted);font-size:11.5px}
.uv-k{color:var(--muted)}

.uv-nm{font-family:var(--font-code);font-size:12.5px;font-weight:600}

.uv-arr.on .uv-nm{color:var(--byte-ink)}
.uv-cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.uv-cells span{display:grid;justify-items:center;border:1.5px solid var(--line);border-radius:5px;padding:3px 0;background:var(--sunk);font-family:var(--font-code);min-width:0}
.uv-cells b{font-size:14px}
.uv-cells small{font-size:10.5px;color:var(--muted)}
.uv-cells span.hl{border-color:var(--byte);background:var(--byte-soft);color:var(--byte-ink)}
@media (max-width:560px){.uv{grid-template-columns:1fr}}
.sv{display:grid;gap:4px;max-width:480px;min-width:0}
.sv-row,.sv-off{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.sv-f{border:1.5px solid var(--line);border-right-width:0;padding:10px 0;text-align:center;font-family:var(--font-code);font-weight:600;background:var(--sunk);min-width:0}
.sv-f:first-child{border-radius:8px 0 0 8px}
.sv-f:last-child{border-right-width:1.5px;border-radius:0 8px 8px 0}
.sv-f.hl{background:var(--byte-soft);color:var(--byte-ink)}
.sv-off span{font-family:var(--font-code);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-left:-.25em}
.sv-off span i{font-style:normal}
.sv-cap{font-size:12.5px;color:var(--muted)}

/* trends */
.gapb{display:grid;gap:6px;max-width:560px}
.gb-r{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 4.6em;gap:8px;align-items:center;font-size:13.5px}
.gb-bar{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.gb-bar i{display:block;height:100%;background:var(--accent)}
.gb-r b{font-family:var(--font-code);text-align:right}
.gb-cap{font-size:12.5px;color:var(--muted)}
@media (max-width:420px){.gb-r{grid-template-columns:minmax(0,7.5em) minmax(0,1fr) 4.2em;font-size:12.5px}}

@media (max-width:540px){
  .secs{display:flex;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding-inline:16px;padding-bottom:4px}
  .sec-tab{flex:0 0 128px;scroll-snap-align:start}
}
/* keep wide children (auto-fit grids, code) from stretching their parent grid on phones */
.lesson>*,.toy-out>*,.toy-ctl>*,.gd-board>*,.fb>*,.sheet>*,.bd>*,.cbox>*,.peek>*{min-width:0}

/* v7: Practice 6-9 pieces */
.p2strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;font-family:var(--font-code);text-align:center;max-width:560px}
.p2strip span{display:grid;gap:1px;padding:4px 0;border-radius:5px;background:var(--sunk);border:1px solid var(--line);min-width:0}
.p2strip b{font-weight:600;font-size:13px;color:var(--accent)}
.p2strip i{font-style:normal;font-size:12px}
@media (max-width:540px){.p2strip{grid-template-columns:repeat(5,minmax(0,1fr))}}
.gbox{display:inline-grid;gap:6px;justify-items:center;justify-self:start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-width:100%}
.gbox span{font-size:13px;color:var(--muted)}
.gbox b{color:var(--ink)}
.gsvg{display:block;max-width:100%;height:auto}
.gs-b{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}

.shape-out{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:480px){.shape-out{grid-template-columns:1fr}}

<body>


<div class="app">
  <header class="top">
    <div>
      <h1><button class="brand" data-go="home">Will It Assemble<span class="qm">?</span></button></h1>
      <div class="tagline">x86 assembly · memory hierarchy · parts 1–9</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="map" id="map" aria-label="Sections and levels"></nav>
  <main id="stage"></main>
</div>

<script>
/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function $(s){return document.querySelector(s);}
function blocks(n,cls){return '<span class="blocks'+(cls?' '+cls:'')+'" aria-hidden="true">'+'<i></i>'.repeat(n)+'</span>';}
function fmtOpt(t){return esc(t).replace(/(%[a-z0-9]+|\$-?0x[0-9a-f]+|\$-?\d+)/gi,'<code>$1</code>');}
function smooth(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';}catch(e){return 'auto';}}
function fineHover(){try{return matchMedia('(hover: hover) and (pointer: fine)').matches;}catch(e){return false;}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}

/* ---------- registers ---------- */
var REG={};
[['eax','ax','ah','al'],['ebx','bx','bh','bl'],['ecx','cx','ch','cl'],['edx','dx','dh','dl']].forEach(function(r){REG[r[0]]={s:4};REG[r[1]]={s:2};REG[r[2]]={s:1};REG[r[3]]={s:1};});
[['esi','si'],['edi','di'],['esp','sp'],['ebp','bp']].forEach(function(r){REG[r[0]]={s:4};REG[r[1]]={s:2};});
['rax','rbx','rcx','rdx','rsi','rdi','rsp','rbp'].forEach(function(r){REG[r]={s:8,x64:true};});
['sil','dil','spl','bpl'].forEach(function(r){REG[r]={s:1,x64:true};});
for(var i=8;i<=15;i++){REG['r'+i]={s:8,x64:true};REG['r'+i+'d']={s:4,x64:true};REG['r'+i+'w']={s:2,x64:true};REG['r'+i+'b']={s:1,x64:true};}
var SFX={b:1,w:2,l:4,q:8};
var SIZE_NAME={1:'1 byte',2:'2 bytes',4:'4 bytes',8:'8 bytes'};

function fakeHint(n){
  var N='<code>%'+esc(n)+'</code>';
  if(/^e[a-z]{1,2}[lh]$/.test(n)) return N+' isn\'t a register. It mixes <code>e</code> (4 bytes) with a 1-byte ending.';
  if(/^[a-z][lh]$/.test(n)) return N+' isn\'t a register. Only a, b, c and d have 1-byte versions, like <code>%al</code>.'+(n[0]==='s'?' <code>%esi</code> stops at <code>%si</code>.':'');
  if(/^e[a-z]{2}$/.test(n)) return N+' isn\'t a register. The 4-byte names are <code>%eax</code> <code>%ebx</code> <code>%ecx</code> <code>%edx</code> <code>%esi</code> <code>%edi</code> <code>%esp</code> <code>%ebp</code>.';
  if(/^[a-z]x$/.test(n)) return N+' isn\'t a register. The 2-byte names are <code>%ax</code> <code>%bx</code> <code>%cx</code> <code>%dx</code> <code>%si</code> <code>%di</code> <code>%sp</code> <code>%bp</code>.';
  return N+' isn\'t one of the x86 register names.';
}

/* ---------- numbers ---------- */
function parseNum(t){
  t=String(t).trim();var neg=false;
  if(t[0]==='-'||t[0]==='+'){neg=t[0]==='-';t=t.slice(1);}
  var v=null;
  if(/^0x[0-9a-f]+$/i.test(t))v=parseInt(t.slice(2),16);
  else if(/^0[0-7]+$/.test(t))v=parseInt(t.slice(1),8);
  else if(/^(0|[1-9]\d*)$/.test(t))v=parseInt(t,10);
  if(v===null||!isFinite(v))return null;
  return neg?-v:v;
}
function toHex(n){return (n<0?'−':'')+'0x'+Math.abs(n).toString(16).toUpperCase();}
function normHex(s){s=String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,'');if(s[0]==='$')s=s.slice(1);if(s.slice(0,2)==='0x')s=s.slice(2);if(!/^[0-9a-f]+$/.test(s))return null;return s.replace(/^0+(?=[0-9a-f])/,'');}
function numNote(lit){
  var u=String(lit).trim().replace(/^[-+]/,'');
  if(/^[1-9]\d+$/.test(u)) return '<code>'+esc(u)+'</code> has no 0x, so it\'s decimal: '+esc(u)+' = '+toHex(parseInt(u,10))+'.';
  if(/^0[0-7]+$/.test(u)) return '<code>'+esc(u)+'</code> starts with 0, so the assembler reads it as octal (base 8): '+toHex(parseInt(u.slice(1),8))+'.';
  return '';
}
function dispStr(d){var u=String(d).trim().replace(/^[-+]/,'');if(/^0x/i.test(u))return '0x'+u.slice(2).toUpperCase();var v=parseNum(u);return v===null?u:toHex(v);}

/* ---------- parsing ---------- */
var RSP_IDX='can\'t be the index register';
function splitOps(s){
  s=(s||'').trim(); if(!s) return [];
  var out=[],depth=0,cur='';
  for(var k=0;k<s.length;k++){var ch=s[k];
    if(ch==='(')depth++; else if(ch===')')depth=Math.max(0,depth-1);
    if(ch===','&&depth===0){out.push(cur);cur='';} else cur+=ch;}
  out.push(cur);
  return out.map(function(x){return x.trim();});
}
function regTok(tok){tok=tok.trim();if(tok[0]!=='%'||!/^%[a-z0-9]+$/i.test(tok))return {bad:true,text:tok};var n=tok.slice(1).toLowerCase();return {name:n,info:REG[n]||null};}

function parseOperand(raw,role){
  var t=raw.trim(), o={text:t,role:role};
  if(!t){o.kind='bad';o.why='The '+role+' is missing.';return o;}
  if(t[0]==='$'){
    if(parseNum(t.slice(1))!==null){o.kind='imm';}
    else{o.kind='bad';o.why=t+' isn\'t a valid number. An immediate is $ followed by a number, like $5 or $0x10.';}
    return o;
  }
  if(t[0]==='%'){
    if(!/^%[a-z0-9]+$/i.test(t)){o.kind='bad';o.why=t+' doesn\'t look like a register name.';return o;}
    o.kind='reg';o.name=t.slice(1).toLowerCase();o.info=REG[o.name]||null;return o;
  }
  var mm=t.match(/^([^()]*)\(([^()]*)\)$/);
  if(mm){
    var disp=mm[1].trim(), parts=mm[2].split(',').map(function(x){return x.trim();});
    o.kind='mem';o.issues=[];o.disp=disp;
    if(disp&&parseNum(disp)===null) o.issues.push('<code>'+esc(disp)+'</code> isn\'t a valid displacement. It should be a number, like <code>8</code> or <code>0x10</code>.');
    if(parts.length>3) o.issues.push('Too many commas inside the parentheses. The longest form is <code>D(Rb,Ri,S)</code>.');
    var b=parts[0]||'', ix=parts[1]||'', sc=parts[2]||'';
    o.scale=sc;
    o.base=b?regTok(b):null; o.index=ix?regTok(ix):null;
    if(o.base&&o.base.bad) o.issues.push('The base <code>'+esc(b)+'</code> should be a register, like <code>%eax</code>.');
    if(o.index&&o.index.bad) o.issues.push('The index <code>'+esc(ix)+'</code> should be a register, like <code>%ecx</code>.');
    if(!b&&!ix) o.issues.push('The parentheses need at least one register inside.');
    if(sc){
      if(['1','2','4','8'].indexOf(sc)<0) o.issues.push('The scale must be 1, 2, 4 or 8. <code>'+esc(sc)+'</code> isn\'t allowed.');
      if(!ix) o.issues.push('A scale needs an index register in front of it.');
    }
    if(o.index&&o.index.info&&(o.index.name==='esp'||o.index.name==='rsp')){o.rspIndex=true;o.issues.push('<code>%'+o.index.name+'</code> '+RSP_IDX+'. It can only be the base.');}
    [o.base,o.index].forEach(function(x){if(x&&x.info&&x.info.s<4)o.issues.push('<code>%'+esc(x.name)+'</code> is '+SIZE_NAME[x.info.s]+'. Addresses use 4-byte registers (or 8-byte ones in 64-bit code).');});
    if(o.base&&o.index&&o.base.info&&o.index.info&&o.base.info.s>=4&&o.index.info.s>=4&&o.base.info.s!==o.index.info.s) o.issues.push('Don\'t mix 32-bit and 64-bit registers inside one address.');
    var terms=[];
    if(o.base&&!o.base.bad) terms.push('<code>%'+esc(o.base.name)+'</code>');
    if(o.index&&!o.index.bad) terms.push((sc&&sc!=='1'?esc(sc)+'×':'')+'<code>%'+esc(o.index.name)+'</code>');
    var f=terms.join(' + ');
    if(disp){ if(disp[0]==='-') f+=' − <code>'+esc(disp.slice(1))+'</code>'; else f+=(f?' + ':'')+'<code>'+esc(disp)+'</code>'; }
    o.formula=f;
    return o;
  }
  if(parseNum(t)!==null){o.kind='mem';o.abs=true;o.issues=[];o.formula='<code>'+esc(t)+'</code> (a fixed address)';return o;}
  o.kind='bad';o.why=t+' doesn\'t look like an operand. Use $ for a number, % for a register, or parentheses for memory.';
  return o;
}

/* ---------- Part 1: the mov checker ---------- */
function analyze(str){
  var r={checks:[],problems:[],parseError:null};
  var s=(str||'').trim();
  if(!s){r.parseError='Type an instruction above to run the checks.';r.idle=true;return r;}
  var m=s.match(/^([A-Za-z]+)(?:\s+([\s\S]*))?$/);
  if(!m){r.parseError='Start with an instruction name, like movl.';return r;}
  var mn=m[1].toLowerCase();

    ops.forEach(function(o){

        if(!ok) r.problems.push(r.sfx?R+' operand is the wrong size. <code>'+mn+'</code> moves '+SIZE_NAME[size]+', but <code>%'+esc(o.name)+'</code> is '+SIZE_NAME[o.info.s]+'.':'The two registers are different sizes.');

    });
    c5.status=c5.items.some(function(i){return i.ok===false;})?'fail':'pass';
    r.checks.push(c5);
  }
  return r;
}

function solveOperand(text,M){

    r.steps.push({h:'Step 2 · The value',p:'Find <code>%'+esc(o.name)+'</code> in the register table. It holds <b>'+esc(R.s)+'</b>.'+(R.note?' '+R.note:'')});
    if(M.Mem[R.n]) r.valTraps.push({v:M.Mem[R.n].s,msg:'That\'s what\'s stored at '+esc(M.Mem[R.n].a)+'. Without parentheses you don\'t follow the pointer. The value is just what\'s in the register.'});

  if(o.rspIndex) r.warns.push('Your slide says <code>%rsp</code> can\'t be the index register, so a real assembler would reject this operand. The worksheet still wants the math, so here it is.');

  if(o.index){I=lookupReg(o.index.name,M);if(!I){r.error=regMissing(o.index.name,M);return r;}}

var FLAGNAMES=['CF','ZF','SF','OF'];
function maskBits(n,bits){var m=Math.pow(2,bits);return ((n%m)+m)%m;}
function toSigned(u,bits){var half=Math.pow(2,bits-1);return u>=half?u-Math.pow(2,bits):u;}
function hexW(u,bits){var s=u.toString(16).toUpperCase();if(bits<=8)s=s.padStart(2,'0');return '0x'+s;}
function fmtS(s){return (s<0?'−':'+')+Math.abs(s);}
function bin8(u){return u.toString(2).padStart(8,'0');}
function opLabel(s,fallback){if(!s)return fallback;if(s.label)return '<i>'+esc(s.label)+'</i>';if(s.reg)return '<code>'+esc(s.reg)+'</code>';return fallback;}

function solveFlags(spec){
  var bits=spec.bits||8, op=spec.op||'cmp', range=Math.pow(2,bits), half=range/2;
  var r={bits:bits,op:op,range:range,half:half,warns:[]};
  var v1=parseNum(spec.s1.val), v2=parseNum(spec.s2.val);
  if(v1===null||v2===null){r.error='Each value needs to be a number, like 37, -46 or 0xAA.';return r;}
  function conv(v,given){var u=maskBits(v,bits),s=toSigned(u,bits);if(v<-half||v>=range)r.warns.push('<code>'+esc(given)+'</code> doesn\'t fit in '+bits+' bits, so only its low '+bits+' bits are used: '+hexW(u,bits)+'.');return {given:given,u:u,s:s,hex:hexW(u,bits)};}
  var A=conv(v1,spec.s1.val), B=conv(v2,spec.s2.val); r.A=A; r.B=B;
  var res,CF,OF;
  if(op==='cmp'||op==='sub'){var tu=B.u-A.u,ts=B.s-A.s;res=maskBits(tu,bits);CF=tu<0?1:0;OF=(ts<-half||ts>half-1)?1:0;r.math={kind:'sub',tu:tu,ts:ts};}
  else if(op==='add'){var tu2=B.u+A.u,ts2=B.s+A.s;res=maskBits(tu2,bits);CF=tu2>=range?1:0;OF=(ts2<-half||ts2>half-1)?1:0;r.math={kind:'add',tu:tu2,ts:ts2};}
  else {res=maskBits(bits<=32?(B.u&A.u):0,bits);CF=0;OF=0;r.math={kind:'and'};}
  r.res=res; r.resHex=hexW(res,bits); r.resS=toSigned(res,bits);
  r.F={CF:CF,ZF:res===0?1:0,SF:res>=half?1:0,OF:OF};

var CONDS={
  e:{expr:'ZF',desc:'Equal / zero',fam:'eq'},
  ne:{expr:'~ZF',desc:'Not equal / not zero',fam:'eq'},
  s:{expr:'SF',desc:'Negative',fam:'sign'},
  ns:{expr:'~SF',desc:'Nonnegative',fam:'sign'},
  g:{expr:'~(SF^OF) & ~ZF',desc:'Greater (signed)',fam:'signed'},
  ge:{expr:'~(SF^OF)',desc:'Greater or equal (signed)',fam:'signed'},
  l:{expr:'SF^OF',desc:'Less (signed)',fam:'signed'},
  le:{expr:'(SF^OF) | ZF',desc:'Less or equal (signed)',fam:'signed'},
  a:{expr:'~CF & ~ZF',desc:'Above (unsigned)',fam:'unsigned'},
  ae:{expr:'~CF',desc:'Above or equal (unsigned)',fam:'unsigned'},
  b:{expr:'CF',desc:'Below (unsigned)',fam:'unsigned'},
  be:{expr:'CF | ZF',desc:'Below or equal (unsigned)',fam:'unsigned'}

var COND_ORDER=['e','ne','s','ns','g','ge','l','le','a','ae','b','be'];
var SYN={z:'e',nz:'ne',nle:'g',nl:'ge',nge:'l',ng:'le',nbe:'a',nb:'ae',nae:'b',na:'be',c:'b',nc:'ae'};

  var c=condCode(name); if(!c) return null;
  var SF=F.SF,OF=F.OF,ZF=F.ZF,CF=F.CF,x=SF^OF,v,calc;
  switch(c){
    case 'e':v=ZF;calc='ZF = '+ZF;break;
    case 'ne':v=1-ZF;calc='~ZF = ~'+ZF+' = '+(1-ZF);break;
    case 's':v=SF;calc='SF = '+SF;break;
    case 'ns':v=1-SF;calc='~SF = ~'+SF+' = '+(1-SF);break;
    case 'g':v=(1-x)&(1-ZF);calc='~(SF^OF) & ~ZF = ~('+SF+'^'+OF+') & ~'+ZF+' = '+(1-x)+' & '+(1-ZF)+' = '+v;break;

    case 'l':v=x;calc='SF^OF = '+SF+'^'+OF+' = '+v;break;

function breakdownHTML(r,mode){

  }).join('');

  var n=5;

/* the flag recipe: one row per flag, worked out for this question's numbers */
var COND_Q={e:'equal to',ne:'not equal to',g:'greater than',ge:'greater than or equal to',l:'less than',le:'less than or equal to',a:'above',ae:'above or equal to',b:'below',be:'below or equal to'};
function cfSolve(cf){
  return solveFlags({op:cf.op||'cmp',bits:Math.min(cf.bits||8,32),s1:{label:cf.s1[0],val:normMinus(cf.s1[1])},s2:{label:cf.s2[0],val:normMinus(cf.s2[1])}});
}
function cfRows(cf){
  var r=cfSolve(cf); if(r.error) return null;
  var bits=cf.bits||8, op=cf.op||'cmp', A=r.A, B=r.B, N1=cf.s1[0], N2=cf.s2[0];
  var hi=Math.pow(2,bits-1)-1, lo=-Math.pow(2,bits-1), unit=bits===8?'byte':bits===16?'word':bits===32?'int':'long';
  var ts=B.s-A.s, over=ts>hi||ts<lo, rows={};
  var gA=esc(cf.s1[1]), gB=esc(cf.s2[1]);
  if(op==='test'){
    rows.ZF=['Is it zero?',gB+(r.res===0?' is 0, so yes.':' isn\'t 0, so no.')];
    rows.SF=['Is it negative?',gB+(B.s<0?' is negative, so yes.':' isn\'t negative, so no.')];
    rows.CF=['CF after test?','test always sets CF to 0.'];
    rows.OF=['OF after test?','test always sets OF to 0.'];
  } else {
    rows.ZF=['Is the answer zero? (Are they equal?)',gB+' and '+gA+(B.u===A.u?' are equal, so yes.':' are different, so no.')];
    var sw=sn(B.s)+' − '+snp(A.s)+' = '+sn(ts);
    if(over) sw+=', too '+(ts>hi?'big':'small')+' for a signed '+unit+', so it wraps to '+sn(r.resS);
    rows.SF=['Is the answer negative?',sw+(r.resS<0?'. Negative, so yes.':'. Not negative, so no.')];
    rows.CF=['Is '+nmH(N2)+' below '+nmH(N1)+', unsigned?',B.u+' below '+A.u+'? '+(B.u<A.u?'Yes.':'No.')];
    rows.OF=['Does the signed answer overflow?',sn(B.s)+' − '+snp(A.s)+' = '+sn(ts)+(over?', outside '+sn(lo)+' to '+hi+'. Overflow, so yes.':(bits===8?', inside −128 to 127. It fits, so no.':'. It fits, so no.'))];
  }
  var name=cf.set||cf.jmp, ev=name?condEval(name,r.F):null;
  if(ev){
    var c=ev.code, q, w;
    if(ev.fam==='eq'){q='Is '+nmH(N2)+' '+COND_Q[c]+' '+nmH(N1)+'?';w=gB+' vs '+gA;}
    else if(ev.fam==='signed'){q='Is '+nmH(N2)+' '+COND_Q[c]+' '+nmH(N1)+', signed?';w=sn(B.s)+' vs '+sn(A.s);}
    else if(ev.fam==='unsigned'){q='Is '+nmH(N2)+' '+COND_Q[c]+' '+nmH(N1)+', unsigned?';w=B.u+' vs '+A.u;}
    else {q=c==='s'?'Is the answer negative?':'Is the answer not negative?';w='SF = '+r.F.SF;}
    rows.set=[q,w+': '+(ev.val?'yes':'no')+'.',ev];
  }
  return {r:r,rows:rows,F:r.F,name:name,ev:ev};
}
function flagRecipe(cf,opt){
  opt=opt||{}; var R=cfRows(cf); if(!R) return '';
  var r=R.r, A=r.A, B=r.B, op=cf.op||'cmp', bits=cf.bits||8;
  var only=opt.only||cf.only||['ZF','SF','CF','OF'], focus=opt.focus||cf.focus||null;
  var h='<div class="bd recipe"><div class="bd-h">'+(opt.title||'The flag recipe')+'</div>';
  h+='<p class="rc-top"><code>'+esc(cf.ins)+'</code> '+(op==='test'?'looks at '+nmH(cf.s2[0])+' by itself.':'computes '+nmH(cf.s2[0])+' − '+nmH(cf.s1[0])+'.')+'</p>';
  var hexy=function(s){return /^\s*[-−]|^\s*0x/i.test(String(s));};

/* the array recipe: brackets → type, index × size → value, split → instruction */
function linParse(s){
  s=normMinus(String(s)).replace(/\s+/g,''); if(!s) return {a:0,b:0};
  if(!/^[+-]/.test(s)) s='+'+s;
  var t=s.match(/[+-][^+-]+/g)||[], a=0, b=0, ok=true;
  t.forEach(function(x){var sg=x.charAt(0)==='-'?-1:1, y=x.slice(1), m;
    if(y==='i')a+=sg; else if((m=y.match(/^(\d+)\*i$/))||(m=y.match(/^i\*(\d+)$/)))a+=sg*(+m[1]); else if(/^\d+$/.test(y))b+=sg*(+y); else ok=false;});
  return ok?{a:a,b:b}:null;
}
function linStr(a,b){var o='';if(a)o+=(a<0?'-':'+')+(Math.abs(a)===1?'':Math.abs(a))+'i';if(b)o+=(b<0?'-':'+')+Math.abs(b);return o;}
function linNice(a,b){var p=[];if(a)p.push((a<0?'−':'')+(Math.abs(a)===1?'':Math.abs(a))+'i');if(b)p.push(p.length?(b<0?'− ':'+ ')+Math.abs(b):(b<0?'−':'')+Math.abs(b));return p.length?p.join(' '):'0';}
var SUF={1:['b','%al','char'],2:['w','%ax','short'],4:['l','%eax','int'],8:['q','%rax','long']};
function arrSolve(ar){
  var e=normMinus(ar.expr).replace(/\s+/g,''), N=ar.name, q=N.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), m, kind, idx;
  if((m=e.match(new RegExp('^&'+q+'\\[(.+)\\]$')))){kind='addr';idx=m[1];}
  else if((m=e.match(new RegExp('^'+q+'\\[(.+)\\]$')))){kind='val';idx=m[1];}
  else if((m=e.match(new RegExp('^\\*\\('+q+'([+-].+)?\\)$')))){kind='val';idx=m[1]||'';}
  else if((m=e.match(new RegExp('^'+q+'([+-].+)?$')))){kind='addr';idx=m[1]||'';}
  else return null;
  var L=linParse(idx); if(!L) return null;
  var K=ar.K, s=K*L.a, d=K*L.b, x=ar.x||('x_'+N), base=ar.base||'%rdx', ix=ar.idx||'%rcx';
  var off=linStr(s,d), mem=(d?String(d):'')+'('+base+(s?','+ix+','+s:'')+')';
  return {kind:kind,amp:e.charAt(0)==='&',L:L,K:K,s:s,d:d,x:x,off:off,mem:mem,
    value:kind==='addr'?x+off:'M['+x+off+']', type:kind==='addr'?ar.T+' *':ar.T,
    asm:kind==='addr'?'leaq '+mem+', %rax':'mov'+SUF[K][0]+' '+mem+', '+SUF[K][1]};
}
function arrRecipe(ar,focus){
  var r=arrSolve(ar); if(!r) return '';
  var T=ar.T, K=r.K;
  var w1=r.amp?'<code>&amp;</code> asks for the address of the element. An address.':r.kind==='val'?'Brackets alone give the element itself. A value.':'A plain name, with or without + or −, is an address.';
  var w2=(r.L.a||r.L.b?'Index '+linNice(r.L.a,r.L.b)+', and each '+esc(T)+' is '+K+' byte'+(K>1?'s':'')+': ('+linNice(r.L.a,r.L.b)+') × '+K+' = '+linNice(r.s,r.d)+'.':'Index 0, so 0 bytes in.')+(r.kind==='val'?' A value gets M[…].':' An address gets no M[…].');
  var w3=(r.kind==='addr'?'An address goes into %rax with <code>leaq</code>, which never reads memory.':'A '+K+'-byte value is read with <code>mov'+SUF[K][0]+'</code> into <code>'+SUF[K][1]+'</code>.')+' Split '+linNice(r.s,r.d)+' into D(base, index, scale): '+(r.d?'D = '+sn(r.d)+', ':'no D, ')+'base '+esc(ar.base||'%rdx')+(r.s?', index '+esc(ar.idx||'%rcx')+', scale '+r.s:'')+'.';
  var row=function(k,lab,q,w,v){return '<div class="rc-row st'+(focus===k?' focus':'')+'"><span class="rc-k">'+lab+'</span><div class="rc-b"><div class="rc-q">'+q+'</div><div class="rc-w">'+w+'</div><div class="rc-ans"><code>'+esc(v)+'</code></div></div></div>';};
  return '<div class="bd recipe"><div class="bd-h">The array recipe for '+esc(ar.expr)+'</div>'+
    row('type','1 · Type','Value or address?',w1,r.type)+
    row('value','2 · Value','How many bytes from the start?',w2,r.value)+
    row('asm','3 · Asm','Which instruction?',w3,r.asm)+'</div>';
}

function gPerm(c,qi,j,q){var g=c.gperm&&c.gperm[qi],st=q.guided[j];return (g&&g[j]&&g[j].length===st.options.length)?g[j]:range(st.options.length);}
function guidedHTML(q,c,qi,a){

/* ===== Part 1 · Moving Data ===== */
{id:'dir',sec:'p1',name:'Which way does it go?',short:'Which way',

{instr:'movl %edx, %eax',plain:true,prompt:'Which line of C does the same thing?',options:['eax = edx;','edx = eax;'],code:true,answer:0,hint:'In C, the variable that changes goes on the left of the =.',explain:'Data moves from <code>%edx</code> into <code>%eax</code>. In C the destination goes on the left, so it\'s <code>eax = edx;</code>'},

{instr:'movl $5, %eax',plain:true,prompt:'What does this instruction do?',options:['Puts the number 5 into %eax','Puts %eax into the number 5','Adds 5 to %eax'],answer:0,hint:'mov only copies. Find the source and the destination.',explain:'The source is 5 and the destination is <code>%eax</code>, so <code>%eax</code> ends up holding 5. The <code>$</code> marks a plain number, which Level 2 covers.'},

{id:'kind',sec:'p1',name:'What kind of operand?',short:'Operand kinds',

lesson:'<p>Every operand is one of three kinds. The way it\'s written tells you which.</p>'+
'<div class="kinds">'+
'<div class="kind"><div class="kind-n">Immediate</div><div class="kind-r">Starts with <code>$</code>. A plain number.</div><div class="kind-ex"><code>$5</code><code>$0x123</code><code>$-147</code></div></div>'+
'<div class="kind"><div class="kind-n">Register</div><div class="kind-r">Starts with <code>%</code>. A storage slot inside the CPU.</div><div class="kind-ex"><code>%eax</code><code>%dx</code><code>%al</code></div></div>'+
'<div class="kind"><div class="kind-n">Memory</div><div class="kind-r">Has parentheses. A spot in RAM.</div><div class="kind-ex"><code>(%eax)</code><code>8(%ebp)</code></div></div>'+
'</div>'+
'<p><code>(%eax)</code> means <i>the memory at the address stored in %eax</i>, like <code>*p</code> in C. <code>8(%ebp)</code> means <i>the address in %ebp, plus 8</i>.</p>'+
'<div class="tip"><span class="tl">Tip</span>Look for parentheses first. A register inside parentheses makes the whole operand memory.</div>',

{token:'%edx',answer:1,explain:'It starts with <code>%</code> and has no parentheses, so it\'s a register.'},
{token:'(%esp)',answer:2,hint:'Are there parentheses?',explain:'The parentheses make it memory. <code>%esp</code> holds an address, and this operand is the memory at that address.'},
{token:'$-147',answer:0,explain:'Negative numbers still start with <code>$</code>, so it\'s an immediate.'},
{token:'4(%esp)',answer:2,explain:'A number in front of parentheses is still memory. It means the address in <code>%esp</code>, plus 4.'},
{token:'%al',answer:1,explain:'It starts with <code>%</code>, so it\'s a register. A small one, which Level 4 explains.'},
{instr:'movl $0x10, %ecx',labels:true,prompt:'What kind of operand is the source?',answer:0,hint:'The source is the first operand.',explain:'The source is <code>$0x10</code>. It starts with <code>$</code>, so it\'s an immediate.'},
{instr:'movl (%eax), 4(%esp)',labels:true,prompt:'How many memory operands does this instruction have?',options:['0','1','2'],answer:2,hint:'Count the operands with parentheses.',explain:'Both operands have parentheses, so both are memory. Remember this one. It comes back in Level 7.'}
