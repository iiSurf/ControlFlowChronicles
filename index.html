<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Will It Assemble? A learning game for x86 assembly: mov rules, memory addressing, control flow, procedures and arrays.">
<meta name="color-scheme" content="light dark">
<style>
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font:14px system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Will It Assemble?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one-column game cartridge. Section tabs and a level strip on top, one card at a time below. Byte blocks are the recurring motif (progress, scores, sizes); register and memory tables light up to show where a value came from. */
:root{
  --bg:#eceef6;
  --panel:#ffffff;
  --sunk:#f3f4fa;
  --ink:#1c1e38;
  --muted:#575b7c;
  --line:#d3d6e7;
  --accent:#4a3fb4;
  --accent-ink:#ffffff;
  --accent-soft:#e8e5fb;
  --byte:#d88a0b;
  --byte-ink:#8a5000;
  --byte-soft:#fcefd5;
  --src:#0c7480;
  --src-soft:#dcf0f2;
  --good:#1b7f51;
  --good-soft:#e1f3e9;
  --bad:#bf3b28;
  --bad-soft:#fbe6e2;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-code:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-pixel:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131528;--panel:#1c1f37;--sunk:#171930;--ink:#e7e8f6;--muted:#a2a5c6;--line:#33375a;
    --accent:#a59bff;--accent-ink:#15172b;--accent-soft:#2b2856;
    --byte:#f0a43c;--byte-ink:#f7bd66;--byte-soft:#3b2d16;
    --src:#56c8d5;--src-soft:#163a40;--good:#5ad198;--good-soft:#163527;--bad:#ff8069;--bad-soft:#41211c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131528;--panel:#1c1f37;--sunk:#171930;--ink:#e7e8f6;--muted:#a2a5c6;--line:#33375a;
  --accent:#a59bff;--accent-ink:#15172b;--accent-soft:#2b2856;
  --byte:#f0a43c;--byte-ink:#f7bd66;--byte-soft:#3b2d16;
  --src:#56c8d5;--src-soft:#163a40;--good:#5ad198;--good-soft:#163527;--bad:#ff8069;--bad-soft:#41211c;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
.app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:grid;gap:16px}
code{font-family:var(--font-code);font-size:.9em;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:.05em .3em;white-space:nowrap}
.mono{font-family:var(--font-code)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card:focus,.card:focus-visible{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.top h1{margin:0;font-size:clamp(1.6rem,1.1rem + 2.2vw,2.3rem);font-weight:700;letter-spacing:-.015em;line-height:1.1}
.brand{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.brand .qm{color:var(--accent)}
.tagline{font-family:var(--font-pixel);font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.stats{display:flex;gap:8px}
.stat{font-family:var(--font-pixel);font-size:11px;letter-spacing:.06em;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;align-items:baseline;gap:6px;text-transform:uppercase}
.stat b{font-size:15px;color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}

/* sections + level strip */
.map{display:grid;gap:10px}
.secs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sec-tab{display:grid;gap:1px;align-content:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.sec-tab:hover{border-color:var(--accent)}
.sec-tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sec-part{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.sec-name{font-weight:600;font-size:15px;line-height:1.25}
.sec-prog{font-size:12px;opacity:.85}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lv{display:grid;gap:6px;align-content:start;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s;min-width:0}
.lv:hover{border-color:var(--accent)}
.lv.on{border-color:var(--accent);background:var(--accent-soft)}
.lv-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lv-n{font-family:var(--font-pixel);font-size:11px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.lv-next{font-family:var(--font-pixel);font-size:9px;letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:2px 5px;text-transform:uppercase}
.lv-name{font-size:14px;font-weight:600;line-height:1.25}
.lv-sub{font-size:12px;color:var(--muted);line-height:1.3}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:2px;border:1.5px solid var(--line);display:block}
.pips i.f{background:var(--byte);border-color:var(--byte)}
@media (max-width:540px){
  .sec-tab{padding:8px 10px}
  .sec-name{font-size:13.5px}
  .strip{display:flex;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding-inline:16px;padding-bottom:4px}
  .lv{flex:0 0 136px;scroll-snap-align:start}
}

/* card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3.5vw,30px);display:grid;gap:16px;min-width:0}
.eyebrow{font-family:var(--font-pixel);font-size:11px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.card h2{margin:0;font-size:clamp(1.25rem,1rem + 1vw,1.55rem);font-weight:600;line-height:1.25;text-wrap:balance}
.card h2 code{font-size:.85em}
.card p{margin:0;max-width:65ch}
.lesson{display:grid;gap:14px;min-width:0}
.tip{background:var(--byte-soft);border-radius:10px;padding:12px 14px;max-width:65ch}
.tip .tl{display:block;font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--byte-ink);font-weight:400;margin-bottom:3px;text-transform:uppercase}
.fine{font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.kbd{font-family:var(--font-pixel);font-size:9px;letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:2px 5px;opacity:.75;text-transform:uppercase}
@media (hover:none){.kbd{display:none}}

/* question */
.qhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.count{font-family:var(--font-pixel);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.prog{display:flex;flex-wrap:wrap;gap:4px}
.prog i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--line);display:block}
.prog i.done{background:var(--byte);border-color:var(--byte)}
.prog i.now{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tag{font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;color:var(--src);background:var(--src-soft);border-radius:5px;padding:3px 7px;justify-self:start;text-transform:uppercase}
.again{font-size:14px;color:var(--bad);font-weight:600}

.instr{font-family:var(--font-code);font-size:clamp(1.3rem,1rem + 1.6vw,1.85rem);font-weight:500;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:.55em;row-gap:.3em;overflow-x:auto;line-height:1.3;min-width:0}
.instr.small{font-size:1.1rem;padding:12px 14px}
.instr .op{display:inline-flex;flex-direction:column;gap:4px}
.instr .t{white-space:nowrap;padding-bottom:2px;border-bottom:3px solid transparent}
.instr .src .t{border-bottom-color:var(--src)}
.instr .dst .t{border-bottom-color:var(--accent)}
.instr.plain .src .t,.instr.plain .dst .t{border-bottom-color:transparent}
.instr .cap{display:none;font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.instr.labels .cap{display:block}
.instr .src .cap{color:var(--src)}
.instr .dst .cap{color:var(--accent)}
.instr .mnw .cap{color:var(--byte-ink);text-align:right}
.instr .comma{margin-left:-.5em}
.sfx{background:var(--byte-soft);color:var(--byte-ink);border-radius:4px;padding:0 .06em;box-shadow:inset 0 -3px 0 var(--byte)}
.token{font-family:var(--font-code);font-size:clamp(1.8rem,1.3rem + 2vw,2.4rem);font-weight:500;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;min-width:0}
.token.op{font-size:clamp(1.3rem,1rem + 2vw,2.1rem);padding:16px;overflow-x:auto;white-space:nowrap}
.token.sm{font-size:1.1rem;padding:8px 14px;text-align:left;justify-self:start;max-width:100%}

.opts{display:grid;gap:10px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 15px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:1rem;cursor:pointer;transition:border-color .12s,background .12s,transform .08s;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .key{flex:none;font-family:var(--font-pixel);font-size:11px;width:24px;height:24px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.opt .lbl{min-width:0;overflow-wrap:anywhere}
.opt .lbl code{white-space:normal}
.opt.code .lbl{font-family:var(--font-code);font-weight:500}
.opt .mark{margin-left:auto;font-weight:700}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key,.opt.right .mark{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key,.opt.wrong .mark{border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.5}

/* typed answers */
.ans{display:flex;flex-wrap:wrap;gap:8px}
.ans .labin{flex:1 1 180px;width:auto;min-width:0}
.ans-msg{font-size:14px;color:var(--bad);font-weight:600}
.ans-done{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--line)}
.ans-done.right{border-color:var(--good);background:var(--good-soft)}
.ans-done.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans-l{font-size:13px;color:var(--muted)}
.ans-v{font-family:var(--font-code);font-size:1.15rem;font-weight:500;overflow-wrap:anywhere;min-width:0}
.ans-done .mark{margin-left:auto;font-weight:700}
.ans-done.right .mark{color:var(--good)}
.ans-done.wrong .mark{color:var(--bad)}

.hintrow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hint{flex-basis:100%;font-size:15px;color:var(--muted)}

.fb{border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb-h{font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fb.ok .fb-h{color:var(--good)}
.fb.no .fb-h{color:var(--bad)}
.gain{font-family:var(--font-pixel);font-size:11px;font-weight:400;letter-spacing:.06em;color:var(--byte-ink)}
.trap{font-weight:600}
.fb-note{font-size:14px;color:var(--muted)}
.fb-act{display:flex;justify-content:flex-end}

.peek{border-top:1px solid var(--line);padding-top:12px}
.peek summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:14px}
.peek .lesson{margin-top:14px}

/* breakdowns */
.bd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;min-width:0}
.bd-h{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.chk{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.chk-s{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:14px}
.chk.pass .chk-s{background:var(--good-soft);color:var(--good)}
.chk.fail .chk-s{background:var(--bad-soft);color:var(--bad)}
.chk-t{font-weight:600;font-size:15px;line-height:1.35;padding-top:2px}
.chk-lead{font-size:14px;color:var(--muted);margin-top:2px}
.chk ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px}
.chk li{padding-left:18px;position:relative}
.chk li::before{position:absolute;left:2px;top:0;content:"·";color:var(--muted)}
.chk li.v::before{content:"✓";color:var(--good)}
.chk li.x::before{content:"✗";color:var(--bad)}
.verdict{border-radius:10px;padding:10px 12px;font-size:15px}
.verdict.ok{background:var(--good-soft)}
.verdict.no{background:var(--bad-soft)}
.verdict.idle{background:var(--sunk);color:var(--muted)}
.verdict .mono{font-size:1.1em}
.blocks{display:inline-flex;gap:2px;vertical-align:-1px;margin:0 2px}
.blocks i{width:10px;height:10px;border-radius:2px;background:var(--byte);display:block}
.blocks.bad i{background:var(--bad)}
.st{display:grid;gap:6px;min-width:0}
.st-h{font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.st-notes{margin:0;padding-left:18px;font-size:14px;color:var(--muted);display:grid;gap:2px}
.calc{display:grid;grid-template-columns:auto auto auto;justify-content:start;column-gap:12px;row-gap:2px;align-items:baseline;font-variant-numeric:tabular-nums;max-width:100%;overflow-x:auto}
.calc .cl{font-size:14px;color:var(--muted)}
.calc .cs{font-family:var(--font-code);color:var(--muted);text-align:center}
.calc .cv{font-family:var(--font-code);font-size:15px;text-align:right;white-space:nowrap}
.calc .tot{border-top:1.5px solid var(--ink);padding-top:4px;margin-top:2px;color:var(--ink);font-weight:600}

/* register + memory tables */
.machine{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:flex-start;min-width:0}
.machine-cap{flex-basis:100%;font-family:var(--font-pixel);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.mt{border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:6px 4px;min-width:0;max-width:100%;overflow-x:auto}
.mt table{border-collapse:separate;border-spacing:0;font-family:var(--font-code);font-size:13.5px;font-variant-numeric:tabular-nums}
.mt th{font-family:var(--font-pixel);font-size:9px;font-weight:400;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;text-align:left;padding:2px 8px 4px}
.mt th+th,.mt td+td{text-align:right}
.mt td{padding:3px 8px;white-space:nowrap}
.mt tr.hl-r td{background:var(--src-soft);color:var(--src);font-weight:600}
.mt tr.hl-m td{background:var(--byte-soft);color:var(--byte-ink);font-weight:600}
.mt tr.hl-r td:first-child,.mt tr.hl-m td:first-child{border-radius:6px 0 0 6px}
.mt tr.hl-r td:last-child,.mt tr.hl-m td:last-child{border-radius:0 6px 6px 0}
@media (max-width:540px){.mt{padding:5px 2px}.mt table{font-size:12px}.mt td,.mt th{padding-inline:5px}.machine{column-gap:6px}}

/* lesson pieces */
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kind{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;align-content:start}
.kind-n{font-weight:700}
.kind-r{font-size:14px;color:var(--muted)}
.kind-ex{display:flex;flex-wrap:wrap;gap:6px}
.tbl-wrap{overflow-x:auto;min-width:0}
table.t{border-collapse:collapse;font-size:15px;width:100%}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.t th{font-family:var(--font-pixel);font-size:10px;font-weight:400;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
table.t td.c{font-family:var(--font-code);font-weight:500;white-space:nowrap}
table.conv td{text-align:center;font-variant-numeric:tabular-nums}
.none{color:var(--muted);font-family:var(--font-body);font-size:13px}
table.grid7 td,table.grid7 th{text-align:center}
table.grid7 th:first-child,table.grid7 td:first-child{text-align:left}
table.grid7 td.y{color:var(--good);background:var(--good-soft);font-weight:700}
table.grid7 td.n{color:var(--bad);background:var(--bad-soft);font-weight:700}
.regmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 4px;max-width:380px;font-family:var(--font-code);font-size:14px;padding-top:4px}
.br{border:2px solid var(--muted);border-bottom:0;height:10px;border-radius:4px 4px 0 0;position:relative;margin-top:24px}
.br span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:600}
.br small{font-family:var(--font-body);color:var(--muted);font-weight:400;font-size:12px}
.cell{height:40px;border-radius:6px;border:2px solid var(--byte);background:var(--byte-soft)}
.under{text-align:center;font-weight:600}
.under.muted{font-family:var(--font-body);font-size:12px;color:var(--muted);font-weight:400}
.rule{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.rule > b{font-weight:600}
.ex{display:grid;gap:6px;min-width:0}
.ex-l{font-family:var(--font-pixel);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.ex.bad .ex-l{color:var(--bad)}
.ex.good .ex-l{color:var(--good)}
.pair{display:grid;gap:8px;min-width:0}
.pair2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cbox{display:grid;gap:10px;align-content:start;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.worked{display:grid;gap:10px;min-width:0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
.steps li{counter-increment:s;display:block;position:relative;border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 52px;min-height:28px}
.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;font-family:var(--font-pixel);font-size:12px;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.steps li > span:last-child:not(:first-child){display:inline-block;margin-left:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.path{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.hexstrip span{display:grid;gap:1px;padding:4px 0;border-radius:5px;background:var(--panel)}

.formula .fa{color:var(--muted)}

}

/* done */

@keyframes pop{from{transform:scale(.6);opacity:.35}to{transform:none;opacity:1}}

/* lab */
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:4px;justify-self:start;max-width:100%}

/* Part 3: flags, code blocks */

.vals{display:flex;flex-wrap:wrap;gap:8px}

.gflags .gl{font-size:13px;color:var(--muted);flex-basis:100%}

.seg2{display:flex;gap:4px;margin-left:auto}

.seg2 button:hover{border-color:var(--accent)}
.seg2 button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flagact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
table.vals-t{width:auto;font-size:14px}
table.vals-t td,table.vals-t th{font-variant-numeric:tabular-nums;white-space:nowrap;padding:5px 7px}

table.condtbl td.c{white-space:normal}
.flaglist{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px}

.labgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.labgrid label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.labgrid select,.labgrid input{font:inherit;font-family:var(--font-code);font-size:1rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.labgrid select:focus,.labgrid input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;max-width:320px;font-family:var(--font-code);text-align:center}

/* Parts 4-5: stack and array pictures */
.stk{display:grid;gap:4px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);min-width:0;align-content:start}

.argtbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;max-width:620px}

.argc.ret b{color:var(--byte-ink)}
.rule-box{font-family:var(--font-code);font-size:clamp(1.05rem,.95rem + .8vw,1.3rem);background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 16px;justify-self:start;max-width:100%;overflow-x:auto}
@media (max-width:540px){.secs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<body>
<div class="app">
  <header class="top">
    <div>
      <h1><button class="brand" data-go="home">Will It Assemble<span class="qm">?</span></button></h1>
      <div class="tagline">x86 assembly · parts 1–5</div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <nav class="map" id="map" aria-label="Sections and levels"></nav>
  <main id="stage"></main>
</div>

<script>
/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function $(s){return document.querySelector(s);}
function blocks(n,cls){return '<span class="blocks'+(cls?' '+cls:'')+'" aria-hidden="true">'+'<i></i>'.repeat(n)+'</span>';}
function fmtOpt(t){return esc(t).replace(/(%[a-z0-9]+|\$-?0x[0-9a-f]+|\$-?\d+)/gi,'<code>$1</code>');}
function smooth(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth';}catch(e){return 'auto';}}
function fineHover(){try{return matchMedia('(hover: hover) and (pointer: fine)').matches;}catch(e){return false;}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}

/* ---------- registers ---------- */
var REG={};
[['eax','ax','ah','al'],['ebx','bx','bh','bl'],['ecx','cx','ch','cl'],['edx','dx','dh','dl']].forEach(function(r){REG[r[0]]={s:4};REG[r[1]]={s:2};REG[r[2]]={s:1};REG[r[3]]={s:1};});
[['esi','si'],['edi','di'],['esp','sp'],['ebp','bp']].forEach(function(r){REG[r[0]]={s:4};REG[r[1]]={s:2};});
['rax','rbx','rcx','rdx','rsi','rdi','rsp','rbp'].forEach(function(r){REG[r]={s:8,x64:true};});
['sil','dil','spl','bpl'].forEach(function(r){REG[r]={s:1,x64:true};});
for(var i=8;i<=15;i++){REG['r'+i]={s:8,x64:true};REG['r'+i+'d']={s:4,x64:true};REG['r'+i+'w']={s:2,x64:true};REG['r'+i+'b']={s:1,x64:true};}
var SFX={b:1,w:2,l:4,q:8};
var SIZE_NAME={1:'1 byte',2:'2 bytes',4:'4 bytes',8:'8 bytes'};

function fakeHint(n){
  var N='<code>%'+esc(n)+'</code>';
  if(/^e[a-z]{1,2}[lh]$/.test(n)) return N+' isn\'t a register. It mixes <code>e</code> (4 bytes) with a 1-byte ending.';
  if(/^[a-z][lh]$/.test(n)) return N+' isn\'t a register. Only a, b, c and d have 1-byte versions, like <code>%al</code>.'+(n[0]==='s'?' <code>%esi</code> stops at <code>%si</code>.':'');
  if(/^e[a-z]{2}$/.test(n)) return N+' isn\'t a register. The 4-byte names are <code>%eax</code> <code>%ebx</code> <code>%ecx</code> <code>%edx</code> <code>%esi</code> <code>%edi</code> <code>%esp</code> <code>%ebp</code>.';
  if(/^[a-z]x$/.test(n)) return N+' isn\'t a register. The 2-byte names are <code>%ax</code> <code>%bx</code> <code>%cx</code> <code>%dx</code> <code>%si</code> <code>%di</code> <code>%sp</code> <code>%bp</code>.';
  return N+' isn\'t one of the x86 register names.';
}

/* ---------- numbers ---------- */
function parseNum(t){
  t=String(t).trim();var neg=false;
  if(t[0]==='-'||t[0]==='+'){neg=t[0]==='-';t=t.slice(1);}
  var v=null;
  if(/^0x[0-9a-f]+$/i.test(t))v=parseInt(t.slice(2),16);
  else if(/^0[0-7]+$/.test(t))v=parseInt(t.slice(1),8);
  else if(/^(0|[1-9]\d*)$/.test(t))v=parseInt(t,10);
  if(v===null||!isFinite(v))return null;
  return neg?-v:v;
}
function toHex(n){return (n<0?'−':'')+'0x'+Math.abs(n).toString(16).toUpperCase();}
function normHex(s){s=String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,'');if(s[0]==='$')s=s.slice(1);if(s.slice(0,2)==='0x')s=s.slice(2);if(!/^[0-9a-f]+$/.test(s))return null;return s.replace(/^0+(?=[0-9a-f])/,'');}
function numNote(lit){
  var u=String(lit).trim().replace(/^[-+]/,'');
  if(/^[1-9]\d+$/.test(u)) return '<code>'+esc(u)+'</code> has no 0x, so it\'s decimal: '+esc(u)+' = '+toHex(parseInt(u,10))+'.';
  if(/^0[0-7]+$/.test(u)) return '<code>'+esc(u)+'</code> starts with 0, so the assembler reads it as octal (base 8): '+toHex(parseInt(u.slice(1),8))+'.';
  return '';
}
function dispStr(d){var u=String(d).trim().replace(/^[-+]/,'');if(/^0x/i.test(u))return '0x'+u.slice(2).toUpperCase();var v=parseNum(u);return v===null?u:toHex(v);}

/* ---------- parsing ---------- */
var RSP_IDX='can\'t be the index register';
function splitOps(s){
  s=(s||'').trim(); if(!s) return [];
  var out=[],depth=0,cur='';
  for(var k=0;k<s.length;k++){var ch=s[k];
    if(ch==='(')depth++; else if(ch===')')depth=Math.max(0,depth-1);
    if(ch===','&&depth===0){out.push(cur);cur='';} else cur+=ch;}
  out.push(cur);
  return out.map(function(x){return x.trim();});
}
function regTok(tok){tok=tok.trim();if(tok[0]!=='%'||!/^%[a-z0-9]+$/i.test(tok))return {bad:true,text:tok};var n=tok.slice(1).toLowerCase();return {name:n,info:REG[n]||null};}

function parseOperand(raw,role){
  var t=raw.trim(), o={text:t,role:role};
  if(!t){o.kind='bad';o.why='The '+role+' is missing.';return o;}
  if(t[0]==='$'){
    if(parseNum(t.slice(1))!==null){o.kind='imm';}
    else{o.kind='bad';o.why=t+' isn\'t a valid number. An immediate is $ followed by a number, like $5 or $0x10.';}
    return o;
  }
  if(t[0]==='%'){
    if(!/^%[a-z0-9]+$/i.test(t)){o.kind='bad';o.why=t+' doesn\'t look like a register name.';return o;}
    o.kind='reg';o.name=t.slice(1).toLowerCase();o.info=REG[o.name]||null;return o;
  }
  var mm=t.match(/^([^()]*)\(([^()]*)\)$/);
  if(mm){
    var disp=mm[1].trim(), parts=mm[2].split(',').map(function(x){return x.trim();});
    o.kind='mem';o.issues=[];o.disp=disp;
    if(disp&&parseNum(disp)===null) o.issues.push('<code>'+esc(disp)+'</code> isn\'t a valid displacement. It should be a number, like <code>8</code> or <code>0x10</code>.');
    if(parts.length>3) o.issues.push('Too many commas inside the parentheses. The longest form is <code>D(Rb,Ri,S)</code>.');
    var b=parts[0]||'', ix=parts[1]||'', sc=parts[2]||'';
    o.scale=sc;
    o.base=b?regTok(b):null; o.index=ix?regTok(ix):null;
    if(o.base&&o.base.bad) o.issues.push('The base <code>'+esc(b)+'</code> should be a register, like <code>%eax</code>.');
    if(o.index&&o.index.bad) o.issues.push('The index <code>'+esc(ix)+'</code> should be a register, like <code>%ecx</code>.');
    if(!b&&!ix) o.issues.push('The parentheses need at least one register inside.');
    if(sc){
      if(['1','2','4','8'].indexOf(sc)<0) o.issues.push('The scale must be 1, 2, 4 or 8. <code>'+esc(sc)+'</code> isn\'t allowed.');
      if(!ix) o.issues.push('A scale needs an index register in front of it.');
    }
    if(o.index&&o.index.info&&(o.index.name==='esp'||o.index.name==='rsp')){o.rspIndex=true;o.issues.push('<code>%'+o.index.name+'</code> '+RSP_IDX+'. It can only be the base.');}
    [o.base,o.index].forEach(function(x){if(x&&x.info&&x.info.s<4)o.issues.push('<code>%'+esc(x.name)+'</code> is '+SIZE_NAME[x.info.s]+'. Addresses use 4-byte registers (or 8-byte ones in 64-bit code).');});
    if(o.base&&o.index&&o.base.info&&o.index.info&&o.base.info.s>=4&&o.index.info.s>=4&&o.base.info.s!==o.index.info.s) o.issues.push('Don\'t mix 32-bit and 64-bit registers inside one address.');
    var terms=[];
    if(o.base&&!o.base.bad) terms.push('<code>%'+esc(o.base.name)+'</code>');
    if(o.index&&!o.index.bad) terms.push((sc&&sc!=='1'?esc(sc)+'×':'')+'<code>%'+esc(o.index.name)+'</code>');
    var f=terms.join(' + ');
    if(disp){ if(disp[0]==='-') f+=' − <code>'+esc(disp.slice(1))+'</code>'; else f+=(f?' + ':'')+'<code>'+esc(disp)+'</code>'; }
    o.formula=f;
    return o;
  }
  if(parseNum(t)!==null){o.kind='mem';o.abs=true;o.issues=[];o.formula='<code>'+esc(t)+'</code> (a fixed address)';return o;}
  o.kind='bad';o.why=t+' doesn\'t look like an operand. Use $ for a number, % for a register, or parentheses for memory.';
  return o;
}

/* ---------- Part 1: the mov checker ---------- */
function analyze(str){
  var r={checks:[],problems:[],parseError:null};
  var s=(str||'').trim();
  if(!s){r.parseError='Type an instruction above to run the checks.';r.idle=true;return r;}
  var m=s.match(/^([A-Za-z]+)(?:\s+([\s\S]*))?$/);
  if(!m){r.parseError='Start with an instruction name, like movl.';return r;}
  var mn=m[1].toLowerCase();
  if(!/^mov[bwlq]?$/.test(mn)){r.parseError=mn.indexOf('mov')===0?'This checker covers movb, movw, movl and movq. It doesn\'t know '+mn+'.':'This checker covers the mov family: movb, movw, movl and movq.';return r;}
  r.mn=mn;r.sfx=mn.slice(3);
  var raw=splitOps(m[2]||'');
  if(raw.length!==2){r.parseError='mov needs two operands separated by a comma: a source, then a destination. This one has '+raw.length+'.';return r;}
  var ops=[parseOperand(raw[0],'source'),parseOperand(raw[1],'destination')];r.ops=ops;
  var bad=ops.filter(function(o){return o.kind==='bad';});
  if(bad.length){r.parseError=bad.map(function(o){return o.why;}).join(' ');return r;}

  var refs=[];
  ops.forEach(function(o){if(o.kind==='reg')refs.push(o);if(o.kind==='mem'){if(o.base&&!o.base.bad)refs.push(o.base);if(o.index&&!o.index.bad)refs.push(o.index);}});
  var c1={id:'names',title:'Are the register names real?',items:[]};
  if(!refs.length){c1.items.push({html:'There are no registers in this instruction.'});}
  refs.forEach(function(x){
    if(x.info)c1.items.push({ok:true,html:'<code>%'+esc(x.name)+'</code> is real'+(x.info.x64?' (64-bit code only)':'')+'.'});
    else{c1.items.push({ok:false,html:fakeHint(x.name)});r.problems.push('No register named <code>%'+esc(x.name)+'</code>.');}
  });

  r.checks.push(c1);

  var c2={id:'size',title:'Do the registers match the suffix size?',items:[]};
  var size=r.sfx?SFX[r.sfx]:null;

    var known=ops.filter(function(o){return o.kind==='reg'&&o.info;});
    if(known.length){size=known[0].info.s;c2.lead='No suffix, so the size comes from the registers: '+blocks(size)+' '+SIZE_NAME[size]+'.';}
    else c2.lead='No suffix and no register to tell the size from.';
  } else c2.lead='<code>'+mn+'</code> moves '+blocks(size)+' '+SIZE_NAME[size]+'.';
  if(!size){c2.status='fail';c2.items.push({ok:false,html:'Add a suffix, like <code>movl</code>, so the assembler knows how many bytes to move.'});r.problems.push('The assembler can\'t tell how many bytes to move.');}
  else{
    ops.forEach(function(o){
      var R=cap(o.role);
      if(o.kind==='reg'){
        if(!o.info){c2.items.push({html:R+' <code>%'+esc(o.name)+'</code> is skipped, because it isn\'t a real register.'});return;}
        var ok=o.info.s===size;
        c2.items.push({ok:ok,html:R+' <code>%'+esc(o.name)+'</code> is '+blocks(o.info.s,ok?'':'bad')+' '+SIZE_NAME[o.info.s]+'.'});
        if(!ok) r.problems.push(r.sfx?R+' operand is the wrong size. <code>'+mn+'</code> moves '+SIZE_NAME[size]+', but <code>%'+esc(o.name)+'</code> is '+SIZE_NAME[o.info.s]+'.':'The two registers are different sizes.');
      } else if(o.kind==='imm') c2.items.push({html:R+' <code>'+esc(o.text)+'</code> is a number, so it fits whatever size the instruction moves.'});
      else c2.items.push({html:R+' <code>'+esc(o.text)+'</code> is memory, so it fits whatever size the instruction moves.'});
    });

  }
  r.checks.push(c2);

  var d=ops[1], c3={id:'dest',title:'Can the destination be written to?',items:[]};
  if(d.kind==='imm'){c3.status='fail';c3.items.push({ok:false,html:'The destination <code>'+esc(d.text)+'</code> is a number. You can\'t store a value into a number.'});r.problems.push('The destination can\'t be an immediate.');}
  else{c3.status='pass';c3.items.push({ok:true,html:'The destination is '+(d.kind==='reg'?'a register':'memory')+', so it can hold a value.'});}
  r.checks.push(c3);

  var nm=ops.filter(function(o){return o.kind==='mem';}).length;
  var c4={id:'mem',title:'At most one memory operand?',items:[]};

  else{c4.status='pass';c4.items.push({ok:true,html:nm===0?'No memory operands.':'One memory operand, which is fine.'});}
  r.checks.push(c4);

  if(nm){
    var c5={id:'addr',title:'Is each memory address written correctly?',items:[]};
    ops.forEach(function(o){
      if(o.kind!=='mem')return;
      if(o.issues.length){o.issues.forEach(function(h){c5.items.push({ok:false,html:h});r.problems.push(h);});}
      else c5.items.push({ok:true,html:'<code>'+esc(o.text)+'</code> means the memory at address '+o.formula+'.'});
    });
    c5.status=c5.items.some(function(i){return i.ok===false;})?'fail':'pass';
    r.checks.push(c5);
  }
  return r;
}

var E2R={eax:'rax',ebx:'rbx',ecx:'rcx',edx:'rdx',esi:'rsi',edi:'rdi',esp:'rsp',ebp:'rbp'};

}
function regMissing(name,M){

}
function lookupStep(r,M,addr,num){

}
function solveOperand(text,M){
  var t=(text||'').trim();
  var r={text:t,steps:[],warns:[],valTraps:[],addrTraps:[],hl:{regs:[],addr:null}};
  if(!t){r.idle=true;return r;}
  if(/^[a-z]+\s/i.test(t)){r.error='That looks like a whole instruction. Type just one operand, like <code>8(%rax)</code>.';return r;}
  var o=parseOperand(t,'operand');
  if(o.kind==='bad'){r.error=esc(o.why);return r;}
  r.kind=o.kind;

  if(o.kind==='imm'){
    var lit=t.slice(1).trim(), n=parseNum(lit), nn=numNote(lit);
    r.value=n; r.vStr=/^0x/i.test(lit)?'0x'+lit.slice(2).toUpperCase():toHex(n);
    r.steps.push({h:'Step 1 · What kind?',p:'It starts with <code>$</code>, so it\'s an <b>immediate</b>: a plain number.'});
    r.steps.push({h:'Step 2 · The value',p:'The value is the number itself, <b>'+esc(r.vStr)+'</b>. There\'s nothing to look up.'+(nn?' '+nn:'')});
    if(M.Mem[n]) r.valTraps.push({v:M.Mem[n].s,msg:'That\'s what\'s stored at address '+esc(M.Mem[n].a)+'. The <code>$</code> makes this a plain number, so there\'s nothing to look up.'});

  }
  if(o.kind==='reg'){
    var R=lookupReg(o.name,M);
    if(!R){r.error=regMissing(o.name,M);return r;}
    r.value=R.n; r.vStr=R.s; r.hl.regs.push(R.key);
    r.steps.push({h:'Step 1 · What kind?',p:'It starts with <code>%</code> and has no parentheses, so it\'s a <b>register</b>.'});
    r.steps.push({h:'Step 2 · The value',p:'Find <code>%'+esc(o.name)+'</code> in the register table. It holds <b>'+esc(R.s)+'</b>.'+(R.note?' '+R.note:'')});
    if(M.Mem[R.n]) r.valTraps.push({v:M.Mem[R.n].s,msg:'That\'s what\'s stored at '+esc(M.Mem[R.n].a)+'. Without parentheses you don\'t follow the pointer. The value is just what\'s in the register.'});
    return r;
  }

    r.steps.push({h:'Step 1 · What kind?',p:'No <code>$</code> and no <code>%</code>, so <code>'+esc(t)+'</code> is a memory <b>address</b>. This is called absolute addressing.'+(nn2?' '+nn2:'')});
    lookupStep(r,M,a,2);
    r.valTraps.push({v:toHex(a),msg:'That\'s the address itself. Without a <code>$</code>, a number is an address, so look up what\'s stored there.'});
    return r;
  }
  var errs=o.issues.filter(function(x){return x.indexOf(RSP_IDX)<0;});
  if(errs.length){r.error=errs.join(' ');return r;}
  if(o.rspIndex) r.warns.push('Your slide says <code>%rsp</code> can\'t be the index register, so a real assembler would reject this operand. The worksheet still wants the math, so here it is.');
  var D=o.disp?parseNum(o.disp):0, SC=o.scale?Number(o.scale):1, B=null, I=null;
  if(o.base){B=lookupReg(o.base.name,M);if(!B){r.error=regMissing(o.base.name,M);return r;}}
  if(o.index){I=lookupReg(o.index.name,M);if(!I){r.error=regMissing(o.index.name,M);return r;}}
  var bv=B?B.n:0, iv=I?I.n*SC:0, addr=bv+iv+D;
  r.addr=addr; r.hl.addr=addr;
  if(B) r.hl.regs.push(B.key);
  if(I&&r.hl.regs.indexOf(I.key)<0) r.hl.regs.push(I.key);
  var rows=[], notes=[];
  if(B){rows.push({l:'base <code>%'+esc(o.base.name)+'</code>',s:'',v:B.s});if(B.note)notes.push(B.note);}
  if(I){
    rows.push({l:'index <code>%'+esc(o.index.name)+'</code>'+(SC>1?' × '+SC:''),s:rows.length?'+':'',v:SC>1?toHex(iv):I.s});
    if(SC>1)notes.push(esc(I.s)+' × '+SC+' = '+toHex(iv)+'.');
    if(I.note)notes.push(I.note);
  }
  if(o.disp){rows.push({l:'displacement',s:D<0?'−':'+',v:dispStr(o.disp)});var nn3=numNote(o.disp);if(nn3)notes.push(nn3);}
  rows.push({l:'address',s:'=',v:toHex(addr),tot:true});
  r.steps.push({h:'Step 1 · Find the address',calc:rows,notes:notes});
  lookupStep(r,M,addr,2);
  if(r.vStr!==undefined){
    r.valTraps.push({v:toHex(addr),msg:'That\'s the address. The value is what\'s stored there, so look up '+toHex(addr)+' in the memory table.'});
    r.addrTraps.push({v:r.vStr,msg:'That\'s the value stored at the address. This question asks for the address itself.'});
  }
  function variant(x,msg){if(x===addr)return;r.addrTraps.push({v:toHex(x),msg:msg});if(M.Mem[x])r.valTraps.push({v:M.Mem[x].s,msg:msg});}
  if(I&&SC>1) variant(bv+I.n+D,'It looks like the index wasn\'t multiplied by the scale. Multiply <code>%'+esc(o.index.name)+'</code> by '+SC+' first.');
  if(o.disp&&/^[-+]?[1-9]\d+$/.test(o.disp)){var u=o.disp.replace(/^[-+]/,''),Dh=parseInt(u,16)*(D<0?-1:1);variant(bv+iv+Dh,'It looks like '+esc(u)+' was read as hex. It has no 0x, so it\'s decimal: '+esc(u)+' = '+toHex(parseInt(u,10))+'.');}
  if(o.disp&&D<0) variant(bv+iv-D,'A minus sign means subtract. Take '+toHex(-D)+' away instead of adding it.');
  if(o.disp&&D!==0) variant(bv+iv,'It looks like the displacement was left out. '+(D<0?'Subtract '+esc(o.disp.replace(/^-/,'')):'Add '+esc(o.disp))+' too.');
  if(I) variant(bv+D,'It looks like the index was left out. Add <code>%'+esc(o.index.name)+'</code>'+(SC>1?' × '+SC:'')+' too.');
  if(B) variant(iv+D,'It looks like the base register was left out. Add <code>%'+esc(o.base.name)+'</code> too.');
  return r;
}

/* ---------- Part 3: condition codes ---------- */
var FLAGNAMES=['CF','ZF','SF','OF'];
function maskBits(n,bits){var m=Math.pow(2,bits);return ((n%m)+m)%m;}
function toSigned(u,bits){var half=Math.pow(2,bits-1);return u>=half?u-Math.pow(2,bits):u;}
function hexW(u,bits){var s=u.toString(16).toUpperCase();if(bits<=8)s=s.padStart(2,'0');return '0x'+s;}
function fmtS(s){return (s<0?'−':'+')+Math.abs(s);}
function bin8(u){return u.toString(2).padStart(8,'0');}
function opLabel(s,fallback){if(!s)return fallback;if(s.label)return '<i>'+esc(s.label)+'</i>';if(s.reg)return '<code>'+esc(s.reg)+'</code>';return fallback;}

function solveFlags(spec){
  var bits=spec.bits||8, op=spec.op||'cmp', range=Math.pow(2,bits), half=range/2;
  var r={bits:bits,op:op,range:range,half:half,warns:[]};
  var v1=parseNum(spec.s1.val), v2=parseNum(spec.s2.val);
  if(v1===null||v2===null){r.error='Each value needs to be a number, like 37, -46 or 0xAA.';return r;}
  function conv(v,given){var u=maskBits(v,bits),s=toSigned(u,bits);if(v<-half||v>=range)r.warns.push('<code>'+esc(given)+'</code> doesn\'t fit in '+bits+' bits, so only its low '+bits+' bits are used: '+hexW(u,bits)+'.');return {given:given,u:u,s:s,hex:hexW(u,bits)};}
  var A=conv(v1,spec.s1.val), B=conv(v2,spec.s2.val); r.A=A; r.B=B;
  var res,CF,OF;
  if(op==='cmp'||op==='sub'){var tu=B.u-A.u,ts=B.s-A.s;res=maskBits(tu,bits);CF=tu<0?1:0;OF=(ts<-half||ts>half-1)?1:0;r.math={kind:'sub',tu:tu,ts:ts};}
  else if(op==='add'){var tu2=B.u+A.u,ts2=B.s+A.s;res=maskBits(tu2,bits);CF=tu2>=range?1:0;OF=(ts2<-half||ts2>half-1)?1:0;r.math={kind:'add',tu:tu2,ts:ts2};}
  else {res=maskBits(bits<=32?(B.u&A.u):0,bits);CF=0;OF=0;r.math={kind:'and'};}
  r.res=res; r.resHex=hexW(res,bits); r.resS=toSigned(res,bits);
  r.F={CF:CF,ZF:res===0?1:0,SF:res>=half?1:0,OF:OF};
  return r;
}

var CONDS={
  e:{expr:'ZF',desc:'Equal / zero',fam:'eq'},
  ne:{expr:'~ZF',desc:'Not equal / not zero',fam:'eq'},
  s:{expr:'SF',desc:'Negative',fam:'sign'},
  ns:{expr:'~SF',desc:'Nonnegative',fam:'sign'},
  g:{expr:'~(SF^OF) & ~ZF',desc:'Greater (signed)',fam:'signed'},
  ge:{expr:'~(SF^OF)',desc:'Greater or equal (signed)',fam:'signed'},
  l:{expr:'SF^OF',desc:'Less (signed)',fam:'signed'},
  le:{expr:'(SF^OF) | ZF',desc:'Less or equal (signed)',fam:'signed'},
  a:{expr:'~CF & ~ZF',desc:'Above (unsigned)',fam:'unsigned'},
  ae:{expr:'~CF',desc:'Above or equal (unsigned)',fam:'unsigned'},
  b:{expr:'CF',desc:'Below (unsigned)',fam:'unsigned'},
  be:{expr:'CF | ZF',desc:'Below or equal (unsigned)',fam:'unsigned'}
};
var COND_ORDER=['e','ne','s','ns','g','ge','l','le','a','ae','b','be'];
var SYN={z:'e',nz:'ne',nle:'g',nl:'ge',nge:'l',ng:'le',nbe:'a',nb:'ae',nae:'b',na:'be',c:'b',nc:'ae'};
var JSYN={e:'jz',ne:'jnz',g:'jnle',ge:'jnl',l:'jnge',le:'jng',a:'jnbe',ae:'jnb',b:'jnae',be:'jna'};
function condCode(name){var m=String(name).toLowerCase().match(/^(set|j|cmov)([a-z]+)$/);if(!m)return null;var c=m[2];if(SYN[c])c=SYN[c];return CONDS[c]?c:null;}
function condEval(name,F){
  var c=condCode(name); if(!c) return null;
  var SF=F.SF,OF=F.OF,ZF=F.ZF,CF=F.CF,x=SF^OF,v,calc;
  switch(c){
    case 'e':v=ZF;calc='ZF = '+ZF;break;
    case 'ne':v=1-ZF;calc='~ZF = ~'+ZF+' = '+(1-ZF);break;
    case 's':v=SF;calc='SF = '+SF;break;
    case 'ns':v=1-SF;calc='~SF = ~'+SF+' = '+(1-SF);break;
    case 'g':v=(1-x)&(1-ZF);calc='~(SF^OF) & ~ZF = ~('+SF+'^'+OF+') & ~'+ZF+' = '+(1-x)+' & '+(1-ZF)+' = '+v;break;
    case 'ge':v=1-x;calc='~(SF^OF) = ~('+SF+'^'+OF+') = ~'+x+' = '+v;break;
    case 'l':v=x;calc='SF^OF = '+SF+'^'+OF+' = '+v;break;
    case 'le':v=x|ZF;calc='(SF^OF) | ZF = ('+SF+'^'+OF+') | '+ZF+' = '+x+' | '+ZF+' = '+v;break;
    case 'a':v=(1-CF)&(1-ZF);calc='~CF & ~ZF = ~'+CF+' & ~'+ZF+' = '+(1-CF)+' & '+(1-ZF)+' = '+v;break;
    case 'ae':v=1-CF;calc='~CF = ~'+CF+' = '+v;break;

function plainWords(ev,r,spec){
  if(!r||r.op!=='cmp'||!ev)return '';

  if(ev.fam==='sign') return 'In plain words: the result is '+(r.F.SF?'negative.':'not negative.');
  if(ev.fam==='signed') return 'In plain words: as signed numbers, '+L2+' ('+fmtS(B.s)+') is '+(B.s>A.s?'greater than':B.s<A.s?'less than':'equal to')+' '+L1+' ('+fmtS(A.s)+').';

}

function flagsStepsHTML(r,spec,opt){
  opt=opt||{}; var only=opt.only||FLAGNAMES;
  if(r.error) return '<div class="bd"><div class="verdict no">'+r.error+'</div></div>';
  var bits=r.bits, word=bits===8?'byte':bits===16?'2-byte value':bits===32?'4-byte int':'8-byte value';
  var A=r.A,B=r.B,L1=opLabel(spec.s1,'the first operand'),L2=opLabel(spec.s2,'the second operand'),half=r.half,range=r.range;
  var h='<div class="bd"><div class="bd-h">'+(opt.title||'How to get there')+'</div>';
  var ins=spec.text?'<code>'+esc(spec.text)+'</code>':'<code>'+r.op+'</code>';
  var what;
  if(r.op==='cmp') what=ins+' computes <b>'+L2+' − '+L1+'</b>, second minus first. It keeps the flags and throws the result away, so neither operand changes.';
  else if(r.op==='sub') what=ins+' computes <b>'+L2+' − '+L1+'</b>, second minus first, and stores the result in '+L2+'.';
  else if(r.op==='add') what=ins+' computes <b>'+L2+' + '+L1+'</b> and stores the result in '+L2+'.';
  else what=ins+' computes <b>'+L2+' & '+L1+'</b>, a bitwise AND. It keeps the flags and throws the result away. After <code>test</code>, CF and OF are always 0.';
  h+=stBlock('Step 1 · What gets computed','<p>'+what+'</p>');
  var row=function(L,V){return '<tr><td>'+L+'</td><td class="c">'+esc(V.given)+'</td><td class="c">'+V.hex+'</td><td>'+V.u+'</td><td>'+fmtS(V.s)+'</td></tr>';};
  var tbl='<div class="tbl-wrap"><table class="t vals-t"><thead><tr><th></th><th>Given</th><th>As a '+word+'</th><th>Unsigned</th><th>Signed</th></tr></thead><tbody>'+row(L1,A)+row(L2,B)+'</tbody></table></div>';
  if(r.warns.length) tbl+='<p class="fine">'+r.warns.join(' ')+'</p>';
  h+=stBlock('Step 2 · Both values as a '+word,tbl);
  var m=r.math,p='';
  if(m.kind==='and'){
    p='<p>'+B.hex+' & '+A.hex+' = <b class="mono">'+r.resHex+'</b>'+(bits===8?' <span class="fine">('+bin8(B.u)+' & '+bin8(A.u)+' = '+bin8(r.res)+')</span>':'')+'. A bit is 1 only where both inputs have a 1.</p>';
  } else {
    var sym=m.kind==='sub'?'−':'+';
    var un='Unsigned: '+B.u+' '+sym+' '+A.u+' = '+m.tu;
    if(m.kind==='sub'&&m.tu<0) un+=', which is below 0, so it wraps around to '+(m.tu+range)+' = '+r.resHex;
    else if(m.kind==='add'&&m.tu>=range) un+=', which is past the top ('+(range-1)+'), so the carry is lost and '+(m.tu-range)+' = '+r.resHex+' is stored';
    else un+=' = '+r.resHex;
    var sg='Signed: '+fmtS(B.s)+' '+sym+' ('+fmtS(A.s)+') = '+fmtS(m.ts);
    if(m.ts<-half||m.ts>half-1) sg+=', which doesn\'t fit in '+(-half)+' to '+(half-1)+', so it wraps to '+fmtS(r.resS);
    p='<p>'+un+'.</p><p>'+sg+'.</p><p>Stored result: <b class="mono">'+r.resHex+'</b>'+(r.op==='cmp'?', though <code>cmp</code> only keeps the flags':'')+'.</p>';
  }
  h+=stBlock('Step 3 · The result',p);
  var why={
    ZF:r.F.ZF?'the result is exactly zero':'the result '+r.resHex+' isn\'t zero',
    SF:r.F.SF?'the top bit of '+r.resHex+' is 1, so as a signed number it\'s negative ('+fmtS(r.resS)+')':'the top bit of '+r.resHex+' is 0, so as a signed number it isn\'t negative ('+fmtS(r.resS)+')'
  };
  if(m.kind==='sub'){why.CF=r.F.CF?'the unsigned subtraction went below 0: '+B.u+' is below '+A.u+', so there\'s a borrow':'the unsigned subtraction stayed at 0 or above: '+B.u+' isn\'t below '+A.u+', so no borrow';why.OF=r.F.OF?'the signed answer '+fmtS(m.ts)+' doesn\'t fit in '+(-half)+' to '+(half-1):'the signed answer '+fmtS(m.ts)+' fits in '+(-half)+' to '+(half-1);}
  else if(m.kind==='add'){why.CF=r.F.CF?'the unsigned sum '+m.tu+' is past '+(range-1)+', so a 1 carried out the top':'the unsigned sum '+m.tu+' fits, so nothing carried out';why.OF=r.F.OF?'the signed sum '+fmtS(m.ts)+' doesn\'t fit in '+(-half)+' to '+(half-1):'the signed sum '+fmtS(m.ts)+' fits in '+(-half)+' to '+(half-1);}
  else {why.CF='<code>test</code> always clears CF';why.OF='<code>test</code> always clears OF';}
  h+=stBlock('Step 4 · The flags','<ul class="flaglist">'+only.map(function(k){return '<li><b>'+k+' = '+r.F[k]+'</b> because '+why[k]+'.</li>';}).join('')+'</ul>');
  var n=5;
  if(opt.set) h+=stBlock('Step '+(n++)+' · '+esc(opt.set),condStepHTML(opt.set,r.F,r,spec));
  if(opt.jmp) h+=stBlock('Step '+(n++)+' · '+esc(opt.jmp),condStepHTML(opt.jmp,r.F,r,spec));
  return h+'</div>';
}

{id:'rsize',sec:'p1',name:'How big is the register?',short:'Register size',
defaults:{prompt:'How many bytes is this register?',options:BYTES3},
lesson:'<p>Registers have sizes too, and the name tells you the size. <code>%eax</code> holds 4 bytes. Its lower 2 bytes have their own name, <code>%ax</code>. And <code>%ax</code> splits into two single bytes, <code>%ah</code> (high) and <code>%al</code> (low).</p>'+
'<div class="regmap" role="img" aria-label="%eax is 4 bytes. Its lower 2 bytes are %ax. %ax is made of %ah and %al, 1 byte each.">'+
'<div class="br" style="grid-column:1/5;grid-row:1"><span>%eax <small>4 bytes</small></span></div>'+
'<div class="br" style="grid-column:3/5;grid-row:2"><span>%ax <small>2 bytes</small></span></div>'+
'<div class="cell" style="grid-row:3;grid-column:1"></div><div class="cell" style="grid-row:3;grid-column:2"></div><div class="cell" style="grid-row:3;grid-column:3"></div><div class="cell" style="grid-row:3;grid-column:4"></div>'+
'<div class="under muted" style="grid-row:4;grid-column:1/3">no names of their own</div>'+
'<div class="under" style="grid-row:4;grid-column:3">%ah</div><div class="under" style="grid-row:4;grid-column:4">%al</div>'+
'</div>'+
'<p>So the name gives the size away.</p>'+
'<div class="tbl-wrap"><table class="t"><thead><tr><th>Name looks like</th><th>Size</th><th>Examples</th></tr></thead><tbody>'+
'<tr><td>Starts with <code>e</code></td><td>'+blocks(4)+' 4 bytes</td><td><code>%eax</code> <code>%esi</code></td></tr>'+
'<tr><td>2 letters ending in <code>x</code>, <code>i</code> or <code>p</code></td><td>'+blocks(2)+' 2 bytes</td><td><code>%ax</code> <code>%si</code> <code>%sp</code></td></tr>'+
'<tr><td>2 letters ending in <code>h</code> or <code>l</code></td><td>'+blocks(1)+' 1 byte</td><td><code>%ah</code> <code>%al</code></td></tr>'+
'</tbody></table></div>'+
'<div class="tip"><span class="tl">Watch out</span>The <code>l</code> in <code>movl</code> means <i>long</i>, 4 bytes. The <code>l</code> at the end of <code>%al</code> means <i>low</i>, 1 byte. Same letter, different jobs.</div>',
qs:[
{token:'%eax',answer:2,hint:'Does it start with e?',explain:'It starts with <code>e</code>, so it\'s the full 4 bytes. '+blocks(4)},
{token:'%ax',answer:1,hint:'Two letters, ending in x.',explain:'Two letters ending in <code>x</code>, so it\'s the 2-byte lower half of <code>%eax</code>. '+blocks(2)},
{token:'%al',answer:0,hint:'What does the l at the end stand for here?',explain:'It ends in <code>l</code> for <i>low</i>, so it\'s 1 byte. '+blocks(1)},
{token:'%dx',answer:1,explain:'Two letters ending in <code>x</code>, so 2 bytes. It\'s the lower half of <code>%edx</code>.'},
{token:'%bh',answer:0,explain:'It ends in <code>h</code> for <i>high</i>, so 1 byte. It\'s the upper byte of <code>%bx</code>.'},
{token:'%esi',answer:2,explain:'It starts with <code>e</code>, so 4 bytes.'},
{token:'%si',answer:1,hint:'Two letters, ending in i.',explain:'Two letters ending in <code>i</code>, so it\'s the 2-byte lower half of <code>%esi</code>.'},
{token:'%cl',answer:0,explain:'It ends in <code>l</code> for <i>low</i>, so 1 byte. This is the <code>l</code> that means low, not long.'},
{prompt:'Which register is the low byte of <code>%edx</code>?',options:['%dh','%dl','%dx'],code:true,answer:1,hint:'Drop the e, then pick high or low.',explain:'Drop the <code>e</code> to get <code>%dx</code> (2 bytes). Its two bytes are <code>%dh</code> (high) and <code>%dl</code> (low).'}
]},

{id:'real',sec:'p1',name:'Real or fake?',short:'Real or fake',
defaults:{prompt:'Is this a real register?',options:['Real','Fake']},
lesson:'<p>Only four registers split all the way down to single bytes: the a, b, c and d registers. The other four stop at 2 bytes.</p>'+
'<div class="tbl-wrap"><table class="t"><thead><tr><th>4 bytes</th><th>2 bytes</th><th>High byte</th><th>Low byte</th></tr></thead><tbody>'+
'<tr><td class="c">%eax</td><td class="c">%ax</td><td class="c">%ah</td><td class="c">%al</td></tr>'+
'<tr><td class="c">%ebx</td><td class="c">%bx</td><td class="c">%bh</td><td class="c">%bl</td></tr>'+
'<tr><td class="c">%ecx</td><td class="c">%cx</td><td class="c">%ch</td><td class="c">%cl</td></tr>'+
'<tr><td class="c">%edx</td><td class="c">%dx</td><td class="c">%dh</td><td class="c">%dl</td></tr>'+
'<tr><td class="c">%esi</td><td class="c">%si</td><td><span class="none">none</span></td><td><span class="none">none</span></td></tr>'+
'<tr><td class="c">%edi</td><td class="c">%di</td><td><span class="none">none</span></td><td><span class="none">none</span></td></tr>'+
'<tr><td class="c">%esp</td><td class="c">%sp</td><td><span class="none">none</span></td><td><span class="none">none</span></td></tr>'+
'<tr><td class="c">%ebp</td><td class="c">%bp</td><td><span class="none">none</span></td><td><span class="none">none</span></td></tr>'+
'</tbody></table></div>'+
'<p>So <code>%si</code> is real, but <code>%sl</code> isn\'t. A name also never mixes sizes. <code>%edl</code> is fake, because <code>e</code> means 4 bytes and <code>l</code> means 1 byte.</p>'+
'<p class="fine">64-bit code adds more names, like <code>%rax</code> and <code>%sil</code>. Your Part 1 class questions use the 32-bit names in this table.</p>',
qs:[
{token:'%al',answer:0,explain:'Real. It\'s the low byte of <code>%eax</code>.'},
{token:'%sl',answer:1,hint:'Does %esi have a 1-byte version?',explain:'Fake. <code>%esi</code> shrinks to <code>%si</code> and stops there. Only a, b, c and d have 1-byte versions. This is the bug in class question Q3.'},
{token:'%si',answer:0,explain:'Real. It\'s the 2-byte lower half of <code>%esi</code>.'},
{token:'%dh',answer:0,explain:'Real. It\'s the high byte of <code>%dx</code>.'},
{token:'%edl',answer:1,hint:'Can a name be 4 bytes and 1 byte at once?',explain:'Fake. It mixes <code>e</code> (4 bytes) with <code>l</code> (1 byte). The real names are <code>%edx</code>, <code>%dx</code>, <code>%dh</code> and <code>%dl</code>.'},
{token:'%bp',answer:0,explain:'Real. It\'s the 2-byte lower half of <code>%ebp</code>.'},
{token:'%ex',answer:1,explain:'Fake. The a register\'s names are <code>%eax</code>, <code>%ax</code>, <code>%ah</code> and <code>%al</code>. There\'s no <code>%ex</code>.'},
{token:'%sh',answer:1,explain:'Fake, for the same reason as <code>%sl</code>. <code>%si</code> doesn\'t split into bytes.'},
{token:'%di',answer:0,explain:'Real. It\'s the 2-byte lower half of <code>%edi</code>.'}
]},

{id:'match',sec:'p1',name:'Do the sizes match?',short:'Size match',
defaults:{prompt:'Do the registers match the suffix size?',options:MATCH,bd:'size',labels:true,hint:'Compare each register to the suffix, one at a time.'},
lesson:'<p>Now put Levels 3 and 4 together. The suffix sets the size, and every register in the instruction has to be that same size. Count the blocks.</p>'+
'<div class="pair">'+instrHTML('movl %eax, %edx',{labels:true,small:true})+breakdownHTML(analyze('movl %eax, %edx'),'size')+'</div>'+
'<div class="pair">'+instrHTML('movb %eax, (%esp)',{labels:true,small:true})+breakdownHTML(analyze('movb %eax, (%esp)'),'size')+'</div>'+
'<div class="tip"><span class="tl">Only check registers</span>Numbers like <code>$5</code> and memory like <code>(%esp)</code> have no size of their own, so they fit any suffix. A register inside parentheses is only holding an address, so it doesn\'t get checked either.</div>',
qs:[
{instr:'movl %eax, %ebx',answer:0,explain:'<code>movl</code> is 4 bytes, and both registers are 4 bytes.'},
{instr:'movb %eax, (%esp)',answer:1,tag:'From class · Q1',explain:'<code>movb</code> is 1 byte, but <code>%eax</code> is 4 bytes. <code>(%esp)</code> is memory, so it fits any size.'},
{instr:'movl %eax, %dx',answer:2,tag:'From class · Q5',explain:'<code>movl</code> is 4 bytes. <code>%eax</code> is 4, which fits. <code>%dx</code> is only 2, so the destination is wrong.'},
{instr:'movb %al, %bl',answer:0,explain:'<code>movb</code> is 1 byte, and <code>%al</code> and <code>%bl</code> are both 1 byte.'},
{instr:'movw %ax, %ecx',answer:2,explain:'<code>movw</code> is 2 bytes. <code>%ax</code> is 2, but <code>%ecx</code> is 4.'},
{instr:'movb %si, 8(%ebp)',answer:1,tag:'From class · Q6',hint:'%si is real. How big is it?',explain:'<code>%si</code> is a real register, but it\'s 2 bytes and <code>movb</code> wants 1.'},
{instr:'movw $0x10, %bx',answer:0,hint:'Numbers fit any size.',explain:'<code>$0x10</code> is a number, so it fits. <code>%bx</code> is 2 bytes, the same as <code>movw</code>.'},
{instr:'movl %ax, (%edx)',answer:1,hint:'The register inside parentheses doesn\'t get checked.',explain:'<code>%ax</code> is 2 bytes, and <code>movl</code> wants 4. <code>%edx</code> is inside parentheses, so it\'s only holding an address.'}
]},

{id:'legal',sec:'p1',name:'Legal moves',short:'Legal moves',
defaults:{prompt:'Is this allowed?',options:LEGAL,bd:'full',labels:true,hint:'Is the destination a number? Are both operands memory?'},
lesson:'<p>Two rules are about the kind of operand, not the size.</p>'+
'<div class="rule"><b>Rule A. The destination can\'t be an immediate.</b><p>A number like <code>$5</code> is a value, not a place. You can\'t store anything into it.</p><div class="ex bad"><span class="ex-l">✗ Won\'t assemble</span>'+instrHTML('movl %eax, $5',{small:true,labels:true})+'</div></div>'+
'<div class="rule"><b>Rule B. No memory to memory.</b><p>One instruction can only touch memory once. To copy from memory to memory, go through a register in two steps.</p><div class="ex bad"><span class="ex-l">✗ Won\'t assemble</span>'+instrHTML('movl (%eax), 4(%esp)',{small:true,labels:true})+'</div><div class="ex good"><span class="ex-l">✓ Works, in two steps</span>'+instrHTML('movl (%eax), %edx',{small:true})+instrHTML('movl %edx, 4(%esp)',{small:true})+'</div></div>'+
'<p>Here is every combination. Rows are the source and columns are the destination.</p>'+
'<div class="tbl-wrap"><table class="t grid7"><thead><tr><th>Source</th><th>To immediate</th><th>To register</th><th>To memory</th></tr></thead><tbody>'+
'<tr><td>Immediate</td><td class="n">✗</td><td class="y">✓</td><td class="y">✓</td></tr>'+
'<tr><td>Register</td><td class="n">✗</td><td class="y">✓</td><td class="y">✓</td></tr>'+
'<tr><td>Memory</td><td class="n">✗</td><td class="y">✓</td><td class="n">✗</td></tr>'+
'</tbody></table></div>',
qs:[
{instr:'movl $5, %eax',answer:0,explain:'A number into a register is allowed.'},
{instr:'movl %eax, $0x123',answer:1,tag:'From class · Q4',explain:'The destination <code>$0x123</code> is a number. You can\'t store a value into a number.'},
{instr:'movl (%eax), 4(%esp)',answer:2,tag:'From class · Q2',explain:'Both operands are memory. You\'d have to go through a register in two steps.'},
{instr:'movl $-147, (%eax)',answer:0,explain:'A number into memory is allowed. The <code>l</code> suffix says to write 4 bytes.'},
{instr:'movl (%eax), %edx',answer:0,explain:'Memory into a register is allowed. This is like <code>temp = *p;</code> in C.'},
{instr:'movb 8(%ebp), (%esp)',answer:2,explain:'Both operands have parentheses, so it\'s memory to memory.'},
{instr:'movw %ax, $10',answer:1,explain:'The destination <code>$10</code> is a number, so nothing can be stored there.'},
{instr:'movl %eax, (%edx)',answer:0,explain:'A register into memory is allowed. This is like <code>*p = temp;</code> in C.'},
{prompt:'You want to copy 4 bytes from the address in <code>%eax</code> to the address <code>%esp</code> + 4. What do you write?',options:['movl (%eax), 4(%esp)','movl (%eax), %edx  then  movl %edx, 4(%esp)'],code:true,bd:null,answer:1,hint:'One mov can only touch memory once.',explain:'Load the value into a register first, then store it from that register into memory.'}
]},

{id:'boss',sec:'p1',name:'Find the bug',short:'Find the bug',
defaults:{prompt:'What\'s wrong with this instruction?',bd:'full',labels:true},
lesson:'<p>These questions use the same format as class. Each instruction has one problem, or none. Run these checks in order and stop at the first one that fails.</p>'+
'<ol class="steps"><li><b>Are the register names real?</b><span>Level 5</span></li><li><b>Do the registers match the suffix size?</b><span>Level 6</span></li><li><b>Can the destination be written to?</b><span>Level 7</span></li><li><b>At most one memory operand?</b><span>Level 7</span></li></ol>'+
'<p>After each answer you\'ll see all four checks run on the instruction, so you can see exactly where it fails.</p>',
qs:[
{instr:'movb %eax, (%esp)',tag:'From class · Q1',options:['Cannot use %eax register in mov-family instructions.','Mismatch between instruction suffix and register ID.','Cannot use %esp as address register.','Cannot use %esp register in mov-family instructions.'],answer:1,hint:'Compare the suffix to the register size.',explain:'Check 2 fails. <code>movb</code> moves 1 byte, but <code>%eax</code> is 4 bytes. Using <code>%esp</code> as an address is fine.'},
{instr:'movl (%eax),4(%esp)',tag:'From class · Q2',options:['Cannot have destination be memory reference.','Cannot have both source and destination be memory references.','Cannot have source be memory reference.','Cannot use %eax as memory reference.'],answer:1,hint:'Count the parentheses.',explain:'Check 4 fails. Both operands have parentheses, so both are memory.'},
{instr:'movb %al,%sl',tag:'From class · Q3',options:['No register named %sl.','Mismatch between instruction suffix and register ID.','Cannot have both source and destination be registers.','No register named %al.'],answer:0,hint:'Is every register name real?',explain:'Check 1 fails. <code>%esi</code> only shrinks to <code>%si</code>. There\'s no 1-byte version, so <code>%sl</code> doesn\'t exist.'},
{instr:'movl %eax,$0x123',tag:'From class · Q4',options:['Cannot have immediate as destination.','Cannot have register as source.','Cannot have immediate as source.','Cannot have register as destination.'],answer:0,hint:'Look at the first character of the destination.',explain:'Check 3 fails. The destination <code>$0x123</code> is a number, and you can\'t store into a number.'},
{instr:'movl %eax,%dx',tag:'From class · Q5',options:['Cannot have both source and destination be registers.','Cannot use %dx register in mov-family instructions.','Source operand incorrect size.','Destination operand incorrect size.'],answer:3,hint:'Check each register against the suffix separately.',explain:'Check 2 fails on the destination. <code>movl</code> is 4 bytes and <code>%eax</code> is 4, but <code>%dx</code> is only 2.'},
{instr:'movb %si, 8(%ebp)',tag:'From class · Q6',options:['Cannot have register as source.','No register named %si.','Cannot have destination be memory reference.','Mismatch between instruction suffix and register ID.'],answer:3,hint:'%si is real. How big is it?',explain:'Check 1 passes, because <code>%si</code> is real (the 2-byte half of <code>%esi</code>). Check 2 fails, because <code>%si</code> is 2 bytes and <code>movb</code> wants 1.'},
{instr:'movw %eax, %bx',options:['Source operand incorrect size.','Destination operand incorrect size.','No register named %bx.','Cannot have both source and destination be registers.'],answer:0,hint:'movw is 2 bytes. Check each register.',explain:'<code>movw</code> is 2 bytes. <code>%bx</code> is 2, so the destination is fine. <code>%eax</code> is 4, so the source is wrong.'},
{instr:'movb $0x7, %di',options:['No register named %di.','Mismatch between instruction suffix and register ID.','Cannot have immediate as source.','Cannot have register as destination.'],answer:1,hint:'%di is real. How big is it?',explain:'<code>%di</code> is real, but it\'s 2 bytes. <code>movb</code> needs a 1-byte register.'},
{instr:'movl 4(%ebp), (%eax)',options:['Cannot have destination be memory reference.','Cannot have both source and destination be memory references.','Cannot use %ebp as memory reference.','Mismatch between instruction suffix and register ID.'],answer:1,hint:'How many operands have parentheses?',explain:'Both operands are memory. One <code>mov</code> can only touch memory once.'},
{instr:'movb %ah, %el',options:['No register named %el.','No register named %ah.','Mismatch between instruction suffix and register ID.','Cannot have both source and destination be registers.'],answer:0,hint:'Which a, b, c, d names have 1-byte versions?',explain:'<code>%ah</code> is real (the high byte of <code>%ax</code>). <code>%el</code> doesn\'t exist. The 1-byte names are al, ah, bl, bh, cl, ch, dl and dh.'},
{instr:'movl $0x10, (%ecx)',prompt:'What happens when this is assembled?',options:['Nothing is wrong. It assembles.','Cannot have immediate as source.','Cannot have destination be memory reference.','Mismatch between instruction suffix and register ID.'],answer:0,hint:'Run all four checks. Does any of them fail?',explain:'All four checks pass. A number into memory is allowed, and memory takes its size from the <code>l</code> suffix.'},
{instr:'movw %dx, %eax',options:['Source operand incorrect size.','Destination operand incorrect size.','No register named %dx.','Cannot have both source and destination be registers.'],answer:1,hint:'movw is 2 bytes. Which register isn\'t?',explain:'<code>movw</code> is 2 bytes. <code>%dx</code> is 2, which fits. <code>%eax</code> is 4, so the destination is wrong.'}
]},

/* ===== Part 2 · Memory Addressing ===== */
{id:'val',sec:'p2',name:'What value does it give?',short:'Operand values',shuffleOpts:true,
defaults:{m:'practice',ask:'value',code:true,prompt:'What value does this operand give?',hint:'Look at the first character. $ means a plain number, % means a register, and a number with neither is an address.'},
lesson:`<p>Part 1 asked whether an instruction is legal. Part 2 asks what <b>value</b> an operand gives you. You read it off two tables, one for registers and one for memory. This practice table appears on every question in Levels 9–14.</p>`+
machineHTML(MACHINES.practice)+
`<p>The first character tells you where to look.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Operand</th><th>Kind</th><th>Where to look</th><th>Value</th></tr></thead><tbody>
<tr><td class="c">$0x20C</td><td>Immediate</td><td>Nowhere. It's the number itself.</td><td class="c">0x20C</td></tr>
<tr><td class="c">%rbx</td><td>Register</td><td>The register table</td><td class="c">0x20C</td></tr>
<tr><td class="c">0x20C</td><td>Memory</td><td>The memory table, at address 0x20C</td><td class="c">0x8E</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">Watch out</span>The <code>$</code> makes all the difference. <code>$0x20C</code> is the number 0x20C. A plain <code>0x20C</code> is an address, so you look up what's stored there. Your textbook calls that <i>absolute</i> addressing.</div>
<p class="fine">Part 2 uses x86-64, so the registers have 8-byte <code>r</code> names. <code>%eax</code> is the lower 4 bytes of <code>%rax</code>. Some questions ask you to type the answer. Capital letters and leading zeros don't matter, so 0x0b and 0xB both count.</p>`,
qs:[
{op:'$0x208',options:['0x208','0x17','0x20C'],answer:0},
{op:'%rsp',options:['0x208','0x17','0x210'],answer:0},
{op:'0x208',options:['0x17','0x208','0x8E'],answer:0},
{op:'0x214',options:['0xF0','0x214','0x2D'],answer:0},
{op:'%rdi',options:['0x80','0x5A','0x200'],answer:0},
{prompt:'Which operand gives the value 0x2D?',gives:'0x2D',options:['0x210','$0x210','%rbp'],answer:0,explain:'A plain 0x210 is an address, and memory at 0x210 holds 0x2D. <code>$0x210</code> is just the number 0x210, and <code>%rbp</code> holds 0x210 too.'},
{prompt:'Which operand is the number 0x40 itself, with no lookup?',m:null,options:['$0x40','0x40'],answer:0,hint:'Which one is an immediate?',explain:'Only the <code>$</code> version is a plain number. A plain <code>0x40</code> would mean the memory at address 0x40.'},
{op:'0x204',input:true,prompt:'Type the value this operand gives.'},
{op:'%rbx',input:true,prompt:'Type the value this operand gives.'}
]},

{id:'ptr',sec:'p2',name:'Follow the pointer',short:'Follow the pointer',shuffleOpts:true,
defaults:{m:'practice',ask:'value',code:true,prompt:'What value does this operand give?',hint:'Two steps: the register holds an address, then look up that address in memory.'},
lesson:`<p>Parentheses mean <i>go to memory</i>. The register inside holds an address, so look up that address in the memory table.</p>
<div class="flow" role="img" aria-label="(%rbx): %rbx holds 0x20C, and memory at 0x20C holds 0x8E.">
<div class="fs fs-op"><code>(%rbx)</code></div><span class="arr" aria-hidden="true">→</span>
<div class="fs"><span class="fs-l">Step 1 · Register</span><span><code>%rbx</code> holds 0x20C</span></div><span class="arr" aria-hidden="true">→</span>
<div class="fs"><span class="fs-l">Step 2 · Memory</span><span>0x20C holds <b>0x8E</b></span></div>
</div>
<p>So <code>%rbx</code> gives 0x20C, but <code>(%rbx)</code> gives 0x8E. In C terms, if the pointer <code>p</code> is in <code>%rbx</code>, then <code>%rbx</code> is <code>p</code> and <code>(%rbx)</code> is <code>*p</code>.</p>
<div class="tip"><span class="tl">Two steps, every time</span>Every operand with parentheses works this way: find the address, then look up what's stored there. Levels 11–14 only change how you find the address.</div>`,
qs:[
{op:'(%rsp)',ask:'address',prompt:'Step 1: what address does this point to?',options:['0x208','0x17','0x200'],answer:0,hint:'The address is whatever the register holds.'},
{op:'(%rsp)',prompt:'Step 2: what value does it give?',options:['0x17','0x208','0x2D'],answer:0},
{op:'(%rax)',options:['0x5A','0x200','0xC3'],answer:0},
{op:'(%rbp)',options:['0x2D','0x210','0xF0'],answer:0},
{prompt:'In C, if the pointer <code>p</code> is in <code>%rax</code>, which operand means <code>*p</code>?',m:null,options:['(%rax)','%rax'],answer:0,hint:'*p means "what p points to".',explain:'<code>%rax</code> is the pointer <code>p</code>. The parentheses follow it, so <code>(%rax)</code> is <code>*p</code>.'},
{op:'%rbp',input:true,prompt:'No parentheses this time. Type the value.',hint:'No parentheses means no lookup.'},
{op:'(%rbx)',input:true,prompt:'Type the value this operand gives.'}
]},

{id:'disp',sec:'p2',name:'Add a displacement',short:'Displacement',shuffleOpts:true,
defaults:{m:'practice',ask:'value',code:true,prompt:'What value does this operand give?',hint:'Add the displacement to the register, then look up that address.'},
lesson:`<p>A number in front of the parentheses is the <b>displacement</b>. Add it to the register to get the address, then look up that address.</p>`+
workedHTML('4(%rax)','practice')+
`<p>A negative displacement subtracts. <code>-4(%rbx)</code> points to 0x20C − 4 = 0x208.</p>
<div class="tip"><span class="tl">Counting in hex</span>After 9, hex uses the letters A to F for 10 to 15.`+hexStrip()+`After F comes 0x10, so adding can carry. For example, 0x20C + 4 = 0x210, because C is 12 and 12 + 4 = 16.</div>
<p class="fine">From your slides: if <code>%edx</code> holds 0xF000, then <code>0x8(%edx)</code> points to 0xF000 + 0x8 = 0xF008.</p>`,

{id:'dec',sec:'p2',name:'Decimal or hex?',short:'Decimal or hex',shuffleOpts:true,
defaults:{m:'practice',ask:'value',code:true,prompt:'What value does this operand give?',hint:'No 0x means decimal. Convert to hex before adding.'},
lesson:`<p>Look for <code>0x</code> on the displacement. With <code>0x</code>, it's hex. Without it, it's an ordinary decimal number, so convert it to hex before you add.</p>
<div class="pair2">`+calcBox('0x10(%rax)',[['base <code>%rax</code>','','0x200'],['displacement 0x10','+','0x10'],['address','=','0x210',1]])+calcBox('10(%rax)',[['base <code>%rax</code>','','0x200'],['displacement 10 = 0xA','+','0xA'],['address','=','0x20A',1]])+`</div>
<p>From 0 to 9 it doesn't matter, because those digits mean the same thing in both. From 10 up, it does.</p>
<div class="tbl-wrap"><table class="t conv"><tbody>
<tr><th scope="row">Decimal</th><td>10</td><td>12</td><td>16</td><td>20</td><td>32</td><td>256</td><td>260</td></tr>
<tr><th scope="row">Hex</th><td class="c">0xA</td><td class="c">0xC</td><td class="c">0x10</td><td class="c">0x14</td><td class="c">0x20</td><td class="c">0x100</td><td class="c">0x104</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">Shortcut</span>Remember two landmarks: 16 = 0x10 and 256 = 0x100. Then 20 = 16 + 4 = 0x14, and 260 = 256 + 4 = 0x104.</div>`,

{id:'scale',sec:'p2',name:'Scale the index',short:'Scale',shuffleOpts:true,
defaults:{m:'practice',ask:'value',code:true,prompt:'What value does this operand give?',hint:'Multiply the index by the scale first. Then add the base and the displacement.'},
lesson:`<p>A third number inside the parentheses is the <b>scale</b>. Multiply the index by it first, then add everything. The scale can only be 1, 2, 4 or 8.</p>
<div class="formula" role="img" aria-label="D(Rb,Ri,S) points to the address Rb + Ri × S + D"><span><span class="fD">D</span>(<span class="fB">Rb</span>,<span class="fI">Ri</span>,<span class="fS">S</span>)</span><span class="fa" aria-hidden="true">→</span><span>address = <span class="fB">Rb</span> + <span class="fI">Ri</span> × <span class="fS">S</span> + <span class="fD">D</span></span></div>`+
workedHTML('(%rax,%rdx,4)','practice')+
`<p>Any part that's left out counts as 0, and a missing scale counts as 1. A comma right after the opening parenthesis means there's no base, so <code>(,%rdi,4)</code> points to just 0x80 × 4 = 0x200.</p>
<div class="tip"><span class="tl">Multiplying hex</span>Go right to left, one digit at a time, and carry every 16. For 0x80 × 4: 0 × 4 = 0, then 8 × 4 = 32, which is 0x20. So the result is 0x200.</div>
<div class="tip"><span class="tl">Why only 1, 2, 4, 8?</span>They're the sizes of data types: a char is 1 byte, a short 2, an int 4, and a long or pointer 8. So <code>(%rax,%rcx,4)</code> finds item number <code>%rcx</code> in an array of ints that starts at <code>%rax</code>.</div>
<p>Your slide adds one more rule: any register can be the base, but <code>%rsp</code> can't be the index.</p>
<details class="ref"><summary>The examples from your slide</summary><p class="fine">With <code>%edx</code> = 0xF000 and <code>%ecx</code> = 0x100:</p><div class="tbl-wrap"><table class="t"><thead><tr><th>Expression</th><th>Computation</th><th>Address</th></tr></thead><tbody>
<tr><td class="c">0x8(%edx)</td><td class="c">0xF000 + 0x8</td><td class="c">0xF008</td></tr>
<tr><td class="c">(%edx,%ecx)</td><td class="c">0xF000 + 0x100</td><td class="c">0xF100</td></tr>
<tr><td class="c">(%edx,%ecx,4)</td><td class="c">0xF000 + 4 × 0x100</td><td class="c">0xF400</td></tr>
<tr><td class="c">0x80(,%edx,2)</td><td class="c">2 × 0xF000 + 0x80</td><td class="c">0x1E080</td></tr>
</tbody></table></div></details>
<details class="ref"><summary>Every form in one table (like Figure 3.3 in your textbook)</summary><div class="tbl-wrap"><table class="t"><thead><tr><th>Form</th><th>Gives you</th><th>Name</th></tr></thead><tbody>
<tr><td class="c">$Imm</td><td>the number Imm</td><td>Immediate</td></tr>
<tr><td class="c">%r</td><td>what's in register r</td><td>Register</td></tr>
<tr><td class="c">Imm</td><td>memory at Imm</td><td>Absolute</td></tr>
<tr><td class="c">(Rb)</td><td>memory at Rb</td><td>Indirect</td></tr>
<tr><td class="c">D(Rb)</td><td>memory at Rb + D</td><td>Base + displacement</td></tr>
<tr><td class="c">(Rb,Ri)</td><td>memory at Rb + Ri</td><td>Indexed</td></tr>
<tr><td class="c">D(Rb,Ri)</td><td>memory at Rb + Ri + D</td><td>Indexed</td></tr>
<tr><td class="c">(,Ri,S)</td><td>memory at Ri × S</td><td>Scaled indexed</td></tr>
<tr><td class="c">D(,Ri,S)</td><td>memory at Ri × S + D</td><td>Scaled indexed</td></tr>
<tr><td class="c">(Rb,Ri,S)</td><td>memory at Rb + Ri × S</td><td>Scaled indexed</td></tr>
<tr><td class="c">D(Rb,Ri,S)</td><td>memory at Rb + Ri × S + D</td><td>Scaled indexed</td></tr>
</tbody></table></div></details>`,
