var LEVELS=[
/* ===== Part 1 · Moving Data ===== */
{id:'dir',sec:'p1',name:'Which way does it go?',short:'Which way',
recap:"Read <code>mov</code> as <b>move from, to</b>: the first operand is the source, the second is the destination, and only the destination changes.",
lesson:'<p>A <code>mov</code> instruction copies data from one place to another. After <code>mov</code> come two operands, separated by a comma.</p>'+
instrHTML('movl %eax, %edx',{labels:true})+
'<p>The first operand is the <b>source</b>, where the data comes from. The second is the <b>destination</b>, where the copy goes. Read it as <i>move from, to</i>.</p>'+
'<div class="tip"><span class="tl">In C</span><code>movl %eax, %edx</code> does the same thing as <code>edx = eax;</code> The destination is the one that changes. The source keeps its value.</div>',
qs:[
{instr:'movl %ecx, %ebx',plain:true,prompt:'Which register gets changed?',options:['%ecx','%ebx'],code:true,answer:1,hint:'The destination is the second operand.',explain:'<code>%ebx</code> is the destination, so it gets a copy of <code>%ecx</code>. The source, <code>%ecx</code>, keeps its value.'},
{instr:'movl %edx, %eax',plain:true,prompt:'Which line of C does the same thing?',options:['eax = edx;','edx = eax;'],code:true,answer:0,hint:'In C, the variable that changes goes on the left of the =.',explain:'Data moves from <code>%edx</code> into <code>%eax</code>. In C the destination goes on the left, so it\'s <code>eax = edx;</code>'},
{instr:'movb %al, %bl',plain:true,prompt:'Which one is the source?',options:['%al','%bl'],code:true,answer:0,hint:'The source always comes first.',explain:'The source comes first, so <code>%al</code> gets copied into <code>%bl</code>.'},
{instr:'movl $5, %eax',plain:true,prompt:'What does this instruction do?',options:['Puts the number 5 into %eax','Puts %eax into the number 5','Adds 5 to %eax'],answer:0,hint:'mov only copies. Find the source and the destination.',explain:'The source is 5 and the destination is <code>%eax</code>, so <code>%eax</code> ends up holding 5. The <code>$</code> marks a plain number, which Level 2 covers.'},
{prompt:'You want to copy <code>%esi</code> into <code>%edi</code>. Which instruction does that?',options:['movl %esi, %edi','movl %edi, %esi'],code:true,answer:0,hint:'Move from, to.',explain:'Copy from <code>%esi</code>, to <code>%edi</code>. The source goes first.'},
{instr:'movl %ebx, %ecx',plain:true,prompt:'After this runs, which register has a new value?',options:['%ebx','%ecx'],code:true,answer:1,hint:'Which one is the destination?',explain:'<code>%ecx</code> is the destination, so it now holds a copy of <code>%ebx</code>.'}
]},

{id:'kind',sec:'p1',name:'What kind of operand?',short:'Operand kinds',
defaults:{prompt:'What kind of operand is this?',options:KIND,hint:'Look at the first character, and check for parentheses.'},
recap:"<b>$</b> is a plain number, <b>%</b> is a register, and <b>parentheses</b> mean memory. Look for parentheses first.",
lesson:'<p>Every operand is one of three kinds. The way it\'s written tells you which.</p>'+
'<div class="kinds">'+
'<div class="kind"><div class="kind-n">Immediate</div><div class="kind-r">Starts with <code>$</code>. A plain number.</div><div class="kind-ex"><code>$5</code><code>$0x123</code><code>$-147</code></div></div>'+
'<div class="kind"><div class="kind-n">Register</div><div class="kind-r">Starts with <code>%</code>. A storage slot inside the CPU.</div><div class="kind-ex"><code>%eax</code><code>%dx</code><code>%al</code></div></div>'+
'<div class="kind"><div class="kind-n">Memory</div><div class="kind-r">Has parentheses. A spot in RAM.</div><div class="kind-ex"><code>(%eax)</code><code>8(%ebp)</code></div></div>'+
'</div>'+
'<p><code>(%eax)</code> means <i>the memory at the address stored in %eax</i>, like <code>*p</code> in C. <code>8(%ebp)</code> means <i>the address in %ebp, plus 8</i>.</p>'+
'<div class="tip"><span class="tl">Tip</span>Look for parentheses first. A register inside parentheses makes the whole operand memory.</div>'+
'<p>Your turn. Sort these six:</p>'+toy('sorter',{s:'kind',title:'Try it · which kind is it?'}),
qs:[
{token:'$0x123',answer:0,explain:'It starts with <code>$</code>, so it\'s a plain number, an immediate.'},
{token:'%edx',answer:1,explain:'It starts with <code>%</code> and has no parentheses, so it\'s a register.'},
{token:'(%esp)',answer:2,hint:'Are there parentheses?',explain:'The parentheses make it memory. <code>%esp</code> holds an address, and this operand is the memory at that address.'},
{token:'$-147',answer:0,explain:'Negative numbers still start with <code>$</code>, so it\'s an immediate.'},
{token:'4(%esp)',answer:2,explain:'A number in front of parentheses is still memory. It means the address in <code>%esp</code>, plus 4.'},
{token:'%al',answer:1,explain:'It starts with <code>%</code>, so it\'s a register. A small one, which Level 4 explains.'},
{instr:'movl $0x10, %ecx',labels:true,prompt:'What kind of operand is the source?',answer:0,hint:'The source is the first operand.',explain:'The source is <code>$0x10</code>. It starts with <code>$</code>, so it\'s an immediate.'},
{instr:'movl (%eax), 4(%esp)',labels:true,prompt:'How many memory operands does this instruction have?',options:['0','1','2'],answer:2,hint:'Count the operands with parentheses.',explain:'Both operands have parentheses, so both are memory. Remember this one. It comes back in Level 7.'}
]},

{id:'sfx',sec:'p1',name:'Read the suffix',short:'Suffix size',
defaults:{options:BYTES4},
recap:"The suffix is the size: <b>b</b> = 1 byte, <b>w</b> = 2, <b>l</b> = 4, <b>q</b> = 8. Each step doubles.",
lesson:'<p>The letter right after <code>mov</code> is the <b>suffix</b>. It says how many bytes get copied. Picture each byte as one block.</p>'+
'<div class="tbl-wrap"><table class="t"><thead><tr><th>Instruction</th><th>Your slides call it</th><th>Size</th></tr></thead><tbody>'+
'<tr><td class="c">mov<span class="sfx">b</span></td><td>byte</td><td>'+blocks(1)+' 1 byte</td></tr>'+
'<tr><td class="c">mov<span class="sfx">w</span></td><td>word</td><td>'+blocks(2)+' 2 bytes</td></tr>'+
'<tr><td class="c">mov<span class="sfx">l</span></td><td>double word <span class="none">(l for long)</span></td><td>'+blocks(4)+' 4 bytes</td></tr>'+
'<tr><td class="c">mov<span class="sfx">q</span></td><td>quad word</td><td>'+blocks(8)+' 8 bytes <span class="none">(64-bit code)</span></td></tr>'+
'</tbody></table></div>'+
'<p>Each step doubles: 1, 2, 4, 8.</p>'+
'<div class="tip"><span class="tl">Watch out</span>The suffix in <code>movl</code> is the letter L, for <i>long</i>. It isn\'t the number 1. Your slides call this 4-byte size a <i>double word</i>.</div>',
qs:[
{instr:'movl %eax, %ebx',labels:true,prompt:'How many bytes does <code>movl</code> copy?',answer:2,hint:'The l stands for long.',explain:'<code>l</code> is for <i>long</i>, which your slides call a <i>double word</i>: 4 bytes. '+blocks(4)},
{instr:'movb %al, %bl',labels:true,prompt:'How many bytes does <code>movb</code> copy?',answer:0,hint:'The b stands for byte.',explain:'<code>b</code> stands for <i>byte</i>, exactly 1. '+blocks(1)},
{instr:'movw %ax, %bx',labels:true,prompt:'How many bytes does <code>movw</code> copy?',answer:1,hint:'The w stands for word.',explain:'<code>w</code> stands for <i>word</i>, which is 2 bytes. '+blocks(2)},
{prompt:'Which suffix copies 2 bytes?',options:['b','w','l'],code:true,answer:1,explain:'<code>w</code> (word) is 2 bytes. <code>b</code> is 1 and <code>l</code> is 4.'},
{prompt:'Which suffix copies 4 bytes?',options:['b','w','l','q'],code:true,answer:2,hint:'It\'s the letter in movl.',explain:'<code>l</code> (long, or double word) is 4 bytes. <code>q</code> (quad word) is 8.'},
{prompt:'Which suffix copies 1 byte?',options:['b','w','l'],code:true,answer:0,explain:'<code>b</code> is for byte. One byte, one block.'},
{instr:'movq %rax, %rbx',labels:true,prompt:'How many bytes does <code>movq</code> copy?',answer:3,hint:'Each step doubles: 1, 2, 4, and then?',explain:'<code>q</code> stands for <i>quad word</i>, 8 bytes. You\'ll see it in 64-bit code, with registers that start with <code>r</code>.'}
]},

{id:'rsize',sec:'p1',name:'How big is the register?',short:'Register size',
defaults:{prompt:'How many bytes is this register?',options:BYTES3},
recap:"The name gives the size away. Starts with <b>e</b>: 4 bytes. Two letters like %ax or %si: 2 bytes. Ends in <b>h</b> or <b>l</b>: 1 byte.",
lesson:'<p>Registers have sizes too, and the name tells you the size. <code>%eax</code> holds 4 bytes. Its lower 2 bytes have their own name, <code>%ax</code>. And <code>%ax</code> splits into two single bytes, <code>%ah</code> (high) and <code>%al</code> (low).</p>'+
'<div class="regmap" role="img" aria-label="%eax is 4 bytes. Its lower 2 bytes are %ax. %ax is made of %ah and %al, 1 byte each.">'+
'<div class="br" style="grid-column:1/5;grid-row:1"><span>%eax <small>4 bytes</small></span></div>'+
'<div class="br" style="grid-column:3/5;grid-row:2"><span>%ax <small>2 bytes</small></span></div>'+
'<div class="cell" style="grid-row:3;grid-column:1"></div><div class="cell" style="grid-row:3;grid-column:2"></div><div class="cell" style="grid-row:3;grid-column:3"></div><div class="cell" style="grid-row:3;grid-column:4"></div>'+
'<div class="under muted" style="grid-row:4;grid-column:1/3">no names of their own</div>'+
'<div class="under" style="grid-row:4;grid-column:3">%ah</div><div class="under" style="grid-row:4;grid-column:4">%al</div>'+
'</div>'+
'<p>So the name gives the size away.</p>'+
'<div class="tbl-wrap"><table class="t"><thead><tr><th>Name looks like</th><th>Size</th><th>Examples</th></tr></thead><tbody>'+
'<tr><td>Starts with <code>e</code></td><td>'+blocks(4)+' 4 bytes</td><td><code>%eax</code> <code>%esi</code></td></tr>'+
'<tr><td>2 letters ending in <code>x</code>, <code>i</code> or <code>p</code></td><td>'+blocks(2)+' 2 bytes</td><td><code>%ax</code> <code>%si</code> <code>%sp</code></td></tr>'+
'<tr><td>2 letters ending in <code>h</code> or <code>l</code></td><td>'+blocks(1)+' 1 byte</td><td><code>%ah</code> <code>%al</code></td></tr>'+
'</tbody></table></div>'+
'<div class="tip"><span class="tl">Watch out</span>The <code>l</code> in <code>movl</code> means <i>long</i>, 4 bytes. The <code>l</code> at the end of <code>%al</code> means <i>low</i>, 1 byte. Same letter, different jobs.</div>',
qs:[
{token:'%eax',answer:2,hint:'Does it start with e?',explain:'It starts with <code>e</code>, so it\'s the full 4 bytes. '+blocks(4)},
{token:'%ax',answer:1,hint:'Two letters, ending in x.',explain:'Two letters ending in <code>x</code>, so it\'s the 2-byte lower half of <code>%eax</code>. '+blocks(2)},
{token:'%al',answer:0,hint:'What does the l at the end stand for here?',explain:'It ends in <code>l</code> for <i>low</i>, so it\'s 1 byte. '+blocks(1)},
{token:'%dx',answer:1,explain:'Two letters ending in <code>x</code>, so 2 bytes. It\'s the lower half of <code>%edx</code>.'},
{token:'%bh',answer:0,explain:'It ends in <code>h</code> for <i>high</i>, so 1 byte. It\'s the upper byte of <code>%bx</code>.'},
{token:'%esi',answer:2,explain:'It starts with <code>e</code>, so 4 bytes.'},
{token:'%si',answer:1,hint:'Two letters, ending in i.',explain:'Two letters ending in <code>i</code>, so it\'s the 2-byte lower half of <code>%esi</code>.'},
{token:'%cl',answer:0,explain:'It ends in <code>l</code> for <i>low</i>, so 1 byte. This is the <code>l</code> that means low, not long.'},
{prompt:'Which register is the low byte of <code>%edx</code>?',options:['%dh','%dl','%dx'],code:true,answer:1,hint:'Drop the e, then pick high or low.',explain:'Drop the <code>e</code> to get <code>%dx</code> (2 bytes). Its two bytes are <code>%dh</code> (high) and <code>%dl</code> (low).'}
]},

{id:'real',sec:'p1',name:'Real or fake?',short:'Real or fake',
defaults:{prompt:'Is this a real register?',options:['Real','Fake']},
recap:"Only the <b>a, b, c and d</b> registers split down to single bytes. %si, %di, %sp and %bp stop at 2 bytes, so a name like %sl is fake.",
lesson:'<p>Only four registers split all the way down to single bytes: the a, b, c and d registers. The other four stop at 2 bytes.</p>'+
'<div class="tbl-wrap"><table class="t"><thead><tr><th>4 bytes</th><th>2 bytes</th><th>High byte</th><th>Low byte</th></tr></thead><tbody>'+
'<tr><td class="c">%eax</td><td class="c">%ax</td><td class="c">%ah</td><td class="c">%al</td></tr>'+
'<tr><td class="c">%ebx</td><td class="c">%bx</td><td class="c">%bh</td><td class="c">%bl</td></tr>'+
'<tr><td class="c">%ecx</td><td class="c">%cx</td><td class="c">%ch</td><td class="c">%cl</td></tr>'+
'<tr><td class="c">%edx</td><td class="c">%dx</td><td class="c">%dh</td><td class="c">%dl</td></tr>'+
'<tr><td class="c">%esi</td><td class="c">%si</td><td><span class="none">none</span></td><td><span class="none">none</span></td></tr>'+
'<tr><td class="c">%edi</td><td class="c">%di</td><td><span class="none">none</span></td><td><span class="none">none</span></td></tr>'+
'<tr><td class="c">%esp</td><td class="c">%sp</td><td><span class="none">none</span></td><td><span class="none">none</span></td></tr>'+
'<tr><td class="c">%ebp</td><td class="c">%bp</td><td><span class="none">none</span></td><td><span class="none">none</span></td></tr>'+
'</tbody></table></div>'+
'<p>So <code>%si</code> is real, but <code>%sl</code> isn\'t. A name also never mixes sizes. <code>%edl</code> is fake, because <code>e</code> means 4 bytes and <code>l</code> means 1 byte.</p>'+
'<p class="fine">64-bit code adds more names, like <code>%rax</code> and <code>%sil</code>. Your Part 1 class questions use the 32-bit names in this table.</p>'+
'<p>Your turn. Real name, or fake?</p>'+toy('sorter',{s:'real',title:'Try it · real or fake?'}),
qs:[
{token:'%al',answer:0,explain:'Real. It\'s the low byte of <code>%eax</code>.'},
{token:'%sl',answer:1,hint:'Does %esi have a 1-byte version?',explain:'Fake. <code>%esi</code> shrinks to <code>%si</code> and stops there. Only a, b, c and d have 1-byte versions. This is the bug in class question Q3.'},
{token:'%si',answer:0,explain:'Real. It\'s the 2-byte lower half of <code>%esi</code>.'},
{token:'%dh',answer:0,explain:'Real. It\'s the high byte of <code>%dx</code>.'},
{token:'%edl',answer:1,hint:'Can a name be 4 bytes and 1 byte at once?',explain:'Fake. It mixes <code>e</code> (4 bytes) with <code>l</code> (1 byte). The real names are <code>%edx</code>, <code>%dx</code>, <code>%dh</code> and <code>%dl</code>.'},
{token:'%bp',answer:0,explain:'Real. It\'s the 2-byte lower half of <code>%ebp</code>.'},
{token:'%ex',answer:1,explain:'Fake. The a register\'s names are <code>%eax</code>, <code>%ax</code>, <code>%ah</code> and <code>%al</code>. There\'s no <code>%ex</code>.'},
{token:'%sh',answer:1,explain:'Fake, for the same reason as <code>%sl</code>. <code>%si</code> doesn\'t split into bytes.'},
{token:'%di',answer:0,explain:'Real. It\'s the 2-byte lower half of <code>%edi</code>.'}
]},

{id:'match',sec:'p1',name:'Do the sizes match?',short:'Size match',
defaults:{prompt:'Do the registers match the suffix size?',options:MATCH,bd:'size',labels:true,hint:'Compare each register to the suffix, one at a time.'},
recap:"Every <b>register</b> has to be the size the suffix says. Numbers and memory have no size of their own, so they fit any suffix.",
lesson:'<p>Now put Levels 3 and 4 together. The suffix sets the size, and every register in the instruction has to be that same size. Count the blocks.</p>'+
'<div class="pair">'+instrHTML('movl %eax, %edx',{labels:true,small:true})+breakdownHTML(analyze('movl %eax, %edx'),'size')+'</div>'+
'<div class="pair">'+instrHTML('movb %eax, (%esp)',{labels:true,small:true})+breakdownHTML(analyze('movb %eax, (%esp)'),'size')+'</div>'+
'<div class="tip"><span class="tl">Only check registers</span>Numbers like <code>$5</code> and memory like <code>(%esp)</code> have no size of their own, so they fit any suffix. A register inside parentheses is only holding an address, so it doesn\'t get checked either.</div>',
qs:[
{instr:'movl %eax, %ebx',answer:0,explain:'<code>movl</code> is 4 bytes, and both registers are 4 bytes.'},
{instr:'movb %eax, (%esp)',answer:1,tag:'From class · Q1',explain:'<code>movb</code> is 1 byte, but <code>%eax</code> is 4 bytes. <code>(%esp)</code> is memory, so it fits any size.'},
{instr:'movl %eax, %dx',answer:2,tag:'From class · Q5',explain:'<code>movl</code> is 4 bytes. <code>%eax</code> is 4, which fits. <code>%dx</code> is only 2, so the destination is wrong.'},
{instr:'movb %al, %bl',answer:0,explain:'<code>movb</code> is 1 byte, and <code>%al</code> and <code>%bl</code> are both 1 byte.'},
{instr:'movw %ax, %ecx',answer:2,explain:'<code>movw</code> is 2 bytes. <code>%ax</code> is 2, but <code>%ecx</code> is 4.'},
{instr:'movb %si, 8(%ebp)',answer:1,tag:'From class · Q6',hint:'%si is real. How big is it?',explain:'<code>%si</code> is a real register, but it\'s 2 bytes and <code>movb</code> wants 1.'},
{instr:'movw $0x10, %bx',answer:0,hint:'Numbers fit any size.',explain:'<code>$0x10</code> is a number, so it fits. <code>%bx</code> is 2 bytes, the same as <code>movw</code>.'},
{instr:'movl %ax, (%edx)',answer:1,hint:'The register inside parentheses doesn\'t get checked.',explain:'<code>%ax</code> is 2 bytes, and <code>movl</code> wants 4. <code>%edx</code> is inside parentheses, so it\'s only holding an address.'}
]},

{id:'legal',sec:'p1',name:'Legal moves',short:'Legal moves',
defaults:{prompt:'Is this allowed?',options:LEGAL,bd:'full',labels:true,hint:'Is the destination a number? Are both operands memory?'},
recap:"Two rules about kinds: the destination can't be a <b>$</b> number, and one instruction can't have <b>two memory operands</b>.",
lesson:'<p>Two rules are about the kind of operand, not the size.</p>'+
'<div class="rule"><b>Rule A. The destination can\'t be an immediate.</b><p>A number like <code>$5</code> is a value, not a place. You can\'t store anything into it.</p><div class="ex bad"><span class="ex-l">✗ Won\'t assemble</span>'+instrHTML('movl %eax, $5',{small:true,labels:true})+'</div></div>'+
'<div class="rule"><b>Rule B. No memory to memory.</b><p>One instruction can only touch memory once. To copy from memory to memory, go through a register in two steps.</p><div class="ex bad"><span class="ex-l">✗ Won\'t assemble</span>'+instrHTML('movl (%eax), 4(%esp)',{small:true,labels:true})+'</div><div class="ex good"><span class="ex-l">✓ Works, in two steps</span>'+instrHTML('movl (%eax), %edx',{small:true})+instrHTML('movl %edx, 4(%esp)',{small:true})+'</div></div>'+
'<p>Here is every combination. Rows are the source and columns are the destination.</p>'+
'<div class="tbl-wrap"><table class="t grid7"><thead><tr><th>Source</th><th>To immediate</th><th>To register</th><th>To memory</th></tr></thead><tbody>'+
'<tr><td>Immediate</td><td class="n">✗</td><td class="y">✓</td><td class="y">✓</td></tr>'+
'<tr><td>Register</td><td class="n">✗</td><td class="y">✓</td><td class="y">✓</td></tr>'+
'<tr><td>Memory</td><td class="n">✗</td><td class="y">✓</td><td class="n">✗</td></tr>'+
'</tbody></table></div>',
qs:[
{instr:'movl $5, %eax',answer:0,explain:'A number into a register is allowed.'},
{instr:'movl %eax, $0x123',answer:1,tag:'From class · Q4',explain:'The destination <code>$0x123</code> is a number. You can\'t store a value into a number.'},
{instr:'movl (%eax), 4(%esp)',answer:2,tag:'From class · Q2',explain:'Both operands are memory. You\'d have to go through a register in two steps.'},
{instr:'movl $-147, (%eax)',answer:0,explain:'A number into memory is allowed. The <code>l</code> suffix says to write 4 bytes.'},
{instr:'movl (%eax), %edx',answer:0,explain:'Memory into a register is allowed. This is like <code>temp = *p;</code> in C.'},
{instr:'movb 8(%ebp), (%esp)',answer:2,explain:'Both operands have parentheses, so it\'s memory to memory.'},
{instr:'movw %ax, $10',answer:1,explain:'The destination <code>$10</code> is a number, so nothing can be stored there.'},
{instr:'movl %eax, (%edx)',answer:0,explain:'A register into memory is allowed. This is like <code>*p = temp;</code> in C.'},
{prompt:'You want to copy 4 bytes from the address in <code>%eax</code> to the address <code>%esp</code> + 4. What do you write?',options:['movl (%eax), 4(%esp)','movl (%eax), %edx  then  movl %edx, 4(%esp)'],code:true,bd:null,answer:1,hint:'One mov can only touch memory once.',explain:'Load the value into a register first, then store it from that register into memory.'}
]},

{id:'boss',sec:'p1',name:'Find the bug',short:'Find the bug',
defaults:{prompt:'What\'s wrong with this instruction?',bd:'full',labels:true},
recap:"Four checks, in order: real register names, sizes match the suffix, the destination can be written to, at most one memory operand.",
lesson:'<p>These questions use the same format as class. Each instruction has one problem, or none. Run these checks in order and stop at the first one that fails.</p>'+
'<ol class="steps"><li><b>Are the register names real?</b><span>Level 5</span></li><li><b>Do the registers match the suffix size?</b><span>Level 6</span></li><li><b>Can the destination be written to?</b><span>Level 7</span></li><li><b>At most one memory operand?</b><span>Level 7</span></li></ol>'+
'<p>After each answer you\'ll see all four checks run on the instruction, so you can see exactly where it fails.</p>',
qs:[
{instr:'movb %eax, (%esp)',tag:'From class · Q1',options:['Cannot use %eax register in mov-family instructions.','Mismatch between instruction suffix and register ID.','Cannot use %esp as address register.','Cannot use %esp register in mov-family instructions.'],answer:1,hint:'Compare the suffix to the register size.',explain:'Check 2 fails. <code>movb</code> moves 1 byte, but <code>%eax</code> is 4 bytes. Using <code>%esp</code> as an address is fine.'},
{instr:'movl (%eax),4(%esp)',tag:'From class · Q2',options:['Cannot have destination be memory reference.','Cannot have both source and destination be memory references.','Cannot have source be memory reference.','Cannot use %eax as memory reference.'],answer:1,hint:'Count the parentheses.',explain:'Check 4 fails. Both operands have parentheses, so both are memory.'},
{instr:'movb %al,%sl',tag:'From class · Q3',options:['No register named %sl.','Mismatch between instruction suffix and register ID.','Cannot have both source and destination be registers.','No register named %al.'],answer:0,hint:'Is every register name real?',explain:'Check 1 fails. <code>%esi</code> only shrinks to <code>%si</code>. There\'s no 1-byte version, so <code>%sl</code> doesn\'t exist.'},
{instr:'movl %eax,$0x123',tag:'From class · Q4',options:['Cannot have immediate as destination.','Cannot have register as source.','Cannot have immediate as source.','Cannot have register as destination.'],answer:0,hint:'Look at the first character of the destination.',explain:'Check 3 fails. The destination <code>$0x123</code> is a number, and you can\'t store into a number.'},
{instr:'movl %eax,%dx',tag:'From class · Q5',options:['Cannot have both source and destination be registers.','Cannot use %dx register in mov-family instructions.','Source operand incorrect size.','Destination operand incorrect size.'],answer:3,hint:'Check each register against the suffix separately.',explain:'Check 2 fails on the destination. <code>movl</code> is 4 bytes and <code>%eax</code> is 4, but <code>%dx</code> is only 2.'},
{instr:'movb %si, 8(%ebp)',tag:'From class · Q6',options:['Cannot have register as source.','No register named %si.','Cannot have destination be memory reference.','Mismatch between instruction suffix and register ID.'],answer:3,hint:'%si is real. How big is it?',explain:'Check 1 passes, because <code>%si</code> is real (the 2-byte half of <code>%esi</code>). Check 2 fails, because <code>%si</code> is 2 bytes and <code>movb</code> wants 1.'},
{instr:'movw %eax, %bx',options:['Source operand incorrect size.','Destination operand incorrect size.','No register named %bx.','Cannot have both source and destination be registers.'],answer:0,hint:'movw is 2 bytes. Check each register.',explain:'<code>movw</code> is 2 bytes. <code>%bx</code> is 2, so the destination is fine. <code>%eax</code> is 4, so the source is wrong.'},
{instr:'movb $0x7, %di',options:['No register named %di.','Mismatch between instruction suffix and register ID.','Cannot have immediate as source.','Cannot have register as destination.'],answer:1,hint:'%di is real. How big is it?',explain:'<code>%di</code> is real, but it\'s 2 bytes. <code>movb</code> needs a 1-byte register.'},
{instr:'movl 4(%ebp), (%eax)',options:['Cannot have destination be memory reference.','Cannot have both source and destination be memory references.','Cannot use %ebp as memory reference.','Mismatch between instruction suffix and register ID.'],answer:1,hint:'How many operands have parentheses?',explain:'Both operands are memory. One <code>mov</code> can only touch memory once.'},
{instr:'movb %ah, %el',options:['No register named %el.','No register named %ah.','Mismatch between instruction suffix and register ID.','Cannot have both source and destination be registers.'],answer:0,hint:'Which a, b, c, d names have 1-byte versions?',explain:'<code>%ah</code> is real (the high byte of <code>%ax</code>). <code>%el</code> doesn\'t exist. The 1-byte names are al, ah, bl, bh, cl, ch, dl and dh.'},
{instr:'movl $0x10, (%ecx)',prompt:'What happens when this is assembled?',options:['Nothing is wrong. It assembles.','Cannot have immediate as source.','Cannot have destination be memory reference.','Mismatch between instruction suffix and register ID.'],answer:0,hint:'Run all four checks. Does any of them fail?',explain:'All four checks pass. A number into memory is allowed, and memory takes its size from the <code>l</code> suffix.'},
{instr:'movw %dx, %eax',options:['Source operand incorrect size.','Destination operand incorrect size.','No register named %dx.','Cannot have both source and destination be registers.'],answer:1,hint:'movw is 2 bytes. Which register isn\'t?',explain:'<code>movw</code> is 2 bytes. <code>%dx</code> is 2, which fits. <code>%eax</code> is 4, so the destination is wrong.'}
]},

{id:'val',sec:'p2',name:'What value does it give?',short:'Operand values',shuffleOpts:true,
defaults:{m:'practice',ask:'value',code:true,prompt:'What value does this operand give?',hint:'Look at the first character. $ means a plain number, % means a register, and a number with neither is an address.'},
recap:"The first character says where to look: <b>$</b> is the number itself, <b>%</b> is the register table, and a bare number is an address in the memory table.",
lesson:`<p>Part 1 asked whether an instruction is legal. Part 2 asks what <b>value</b> an operand gives you. You read it off two tables, one for registers and one for memory. This practice table appears on every question in Levels 9–14.</p>`+
machineHTML(MACHINES.practice)+
`<p>The first character tells you where to look.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Operand</th><th>Kind</th><th>Where to look</th><th>Value</th></tr></thead><tbody>
<tr><td class="c">$0x20C</td><td>Immediate</td><td>Nowhere. It's the number itself.</td><td class="c">0x20C</td></tr>
<tr><td class="c">%rbx</td><td>Register</td><td>The register table</td><td class="c">0x20C</td></tr>
<tr><td class="c">0x20C</td><td>Memory</td><td>The memory table, at address 0x20C</td><td class="c">0x8E</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">Watch out</span>The <code>$</code> makes all the difference. <code>$0x20C</code> is the number 0x20C. A plain <code>0x20C</code> is an address, so you look up what's stored there. Your textbook calls that <i>absolute</i> addressing.</div>
<p class="fine">Part 2 uses x86-64, so the registers have 8-byte <code>r</code> names. <code>%eax</code> is the lower 4 bytes of <code>%rax</code>. Some questions ask you to type the answer. Capital letters and leading zeros don't matter, so 0x0b and 0xB both count.</p>`,

{id:'ptr',sec:'p2',name:'Follow the pointer',short:'Follow the pointer',shuffleOpts:true,
defaults:{m:'practice',ask:'value',code:true,prompt:'What value does this operand give?',hint:'Two steps: the register holds an address, then look up that address in memory.'},
recap:"Parentheses mean <b>go to memory</b>. Two steps, every time: find the address, then look up what's stored there.",
lesson:`<p>Parentheses mean <i>go to memory</i>. The register inside holds an address, so look up that address in the memory table.</p>
<div class="flow" role="img" aria-label="(%rbx): %rbx holds 0x20C, and memory at 0x20C holds 0x8E.">
<div class="fs fs-op"><code>(%rbx)</code></div><span class="arr" aria-hidden="true">→</span>
<div class="fs"><span class="fs-l">Step 1 · Register</span><span><code>%rbx</code> holds 0x20C</span></div><span class="arr" aria-hidden="true">→</span>
<div class="fs"><span class="fs-l">Step 2 · Memory</span><span>0x20C holds <b>0x8E</b></span></div>
</div>
<p>So <code>%rbx</code> gives 0x20C, but <code>(%rbx)</code> gives 0x8E. In C terms, if the pointer <code>p</code> is in <code>%rbx</code>, then <code>%rbx</code> is <code>p</code> and <code>(%rbx)</code> is <code>*p</code>.</p>
<div class="tip"><span class="tl">Two steps, every time</span>Every operand with parentheses works this way: find the address, then look up what's stored there. Levels 11–14 only change how you find the address.</div>`,
qs:[
{op:'(%rsp)',ask:'address',prompt:'Step 1: what address does this point to?',options:['0x208','0x17','0x200'],answer:0,hint:'The address is whatever the register holds.'},
{op:'(%rsp)',prompt:'Step 2: what value does it give?',options:['0x17','0x208','0x2D'],answer:0},
{op:'(%rax)',options:['0x5A','0x200','0xC3'],answer:0},
{op:'(%rbp)',options:['0x2D','0x210','0xF0'],answer:0},
{prompt:'In C, if the pointer <code>p</code> is in <code>%rax</code>, which operand means <code>*p</code>?',m:null,options:['(%rax)','%rax'],answer:0,hint:'*p means "what p points to".',explain:'<code>%rax</code> is the pointer <code>p</code>. The parentheses follow it, so <code>(%rax)</code> is <code>*p</code>.'},
{op:'%rbp',input:true,prompt:'No parentheses this time. Type the value.',hint:'No parentheses means no lookup.'},
{op:'(%rbx)',input:true,prompt:'Type the value this operand gives.'}
]},

{id:'dec',sec:'p2',name:'Decimal or hex?',short:'Decimal or hex',shuffleOpts:true,
defaults:{m:'practice',ask:'value',code:true,prompt:'What value does this operand give?',hint:'No 0x means decimal. Convert to hex before adding.'},
recap:"No <b>0x</b> means decimal, so convert it before you add. Two landmarks: 16 = 0x10 and 256 = 0x100.",
lesson:`<p>Look for <code>0x</code> on the displacement. With <code>0x</code>, it's hex. Without it, it's an ordinary decimal number, so convert it to hex before you add.</p>
<div class="pair2">`+calcBox('0x10(%rax)',[['base <code>%rax</code>','','0x200'],['displacement 0x10','+','0x10'],['address','=','0x210',1]])+calcBox('10(%rax)',[['base <code>%rax</code>','','0x200'],['displacement 10 = 0xA','+','0xA'],['address','=','0x20A',1]])+`</div>
<p>From 0 to 9 it doesn't matter, because those digits mean the same thing in both. From 10 up, it does.</p>
<div class="tbl-wrap"><table class="t conv"><tbody>
<tr><th scope="row">Decimal</th><td>10</td><td>12</td><td>16</td><td>20</td><td>32</td><td>256</td><td>260</td></tr>
<tr><th scope="row">Hex</th><td class="c">0xA</td><td class="c">0xC</td><td class="c">0x10</td><td class="c">0x14</td><td class="c">0x20</td><td class="c">0x100</td><td class="c">0x104</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">Shortcut</span>Remember two landmarks: 16 = 0x10 and 256 = 0x100. Then 20 = 16 + 4 = 0x14, and 260 = 256 + 4 = 0x104.</div>`,

{id:'scale',sec:'p2',name:'Scale the index',short:'Scale',shuffleOpts:true,
defaults:{m:'practice',ask:'value',code:true,prompt:'What value does this operand give?',hint:'Multiply the index by the scale first. Then add the base and the displacement.'},
recap:"<b>D(Rb,Ri,S)</b> points to Rb + Ri × S + D. Multiply the index by the scale first. A missing part counts as 0, and a missing scale as 1.",
lesson:`<p>A third number inside the parentheses is the <b>scale</b>. Multiply the index by it first, then add everything. The scale can only be 1, 2, 4 or 8.</p>
<div class="formula" role="img" aria-label="D(Rb,Ri,S) points to the address Rb + Ri × S + D"><span><span class="fD">D</span>(<span class="fB">Rb</span>,<span class="fI">Ri</span>,<span class="fS">S</span>)</span><span class="fa" aria-hidden="true">→</span><span>address = <span class="fB">Rb</span> + <span class="fI">Ri</span> × <span class="fS">S</span> + <span class="fD">D</span></span></div>`+
workedHTML('(%rax,%rdx,4)','practice')+
`<p>Any part that's left out counts as 0, and a missing scale counts as 1. A comma right after the opening parenthesis means there's no base, so <code>(,%rdi,4)</code> points to just 0x80 × 4 = 0x200.</p>
<div class="tip"><span class="tl">Multiplying hex</span>Go right to left, one digit at a time, and carry every 16. For 0x80 × 4: 0 × 4 = 0, then 8 × 4 = 32, which is 0x20. So the result is 0x200.</div>
<div class="tip"><span class="tl">Why only 1, 2, 4, 8?</span>They're the sizes of data types: a char is 1 byte, a short 2, an int 4, and a long or pointer 8. So <code>(%rax,%rcx,4)</code> finds item number <code>%rcx</code> in an array of ints that starts at <code>%rax</code>.</div>
<p>Your slide adds one more rule: any register can be the base, but <code>%rsp</code> can't be the index.</p>
<details class="ref"><summary>The examples from your slide</summary><p class="fine">With <code>%edx</code> = 0xF000 and <code>%ecx</code> = 0x100:</p><div class="tbl-wrap"><table class="t"><thead><tr><th>Expression</th><th>Computation</th><th>Address</th></tr></thead><tbody>
<tr><td class="c">0x8(%edx)</td><td class="c">0xF000 + 0x8</td><td class="c">0xF008</td></tr>
<tr><td class="c">(%edx,%ecx)</td><td class="c">0xF000 + 0x100</td><td class="c">0xF100</td></tr>
<tr><td class="c">(%edx,%ecx,4)</td><td class="c">0xF000 + 4 × 0x100</td><td class="c">0xF400</td></tr>
<tr><td class="c">0x80(,%edx,2)</td><td class="c">2 × 0xF000 + 0x80</td><td class="c">0x1E080</td></tr>
</tbody></table></div></details>
<details class="ref"><summary>Every form in one table (like Figure 3.3 in your textbook)</summary><div class="tbl-wrap"><table class="t"><thead><tr><th>Form</th><th>Gives you</th><th>Name</th></tr></thead><tbody>
<tr><td class="c">$Imm</td><td>the number Imm</td><td>Immediate</td></tr>
<tr><td class="c">%r</td><td>what's in register r</td><td>Register</td></tr>
<tr><td class="c">Imm</td><td>memory at Imm</td><td>Absolute</td></tr>
<tr><td class="c">(Rb)</td><td>memory at Rb</td><td>Indirect</td></tr>
<tr><td class="c">D(Rb)</td><td>memory at Rb + D</td><td>Base + displacement</td></tr>
<tr><td class="c">(Rb,Ri)</td><td>memory at Rb + Ri</td><td>Indexed</td></tr>

{id:'c1',sec:'p3',name:'cmp subtracts backwards',short:'cmp order',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"<code>cmp S1, S2</code> computes <b>S2 − S1</b>: second minus first. It throws the answer away and keeps only the four flags.",
lesson:`<p>Parts 1 and 2 moved data around. Part 3 is about <b>decisions</b>, like an <code>if</code>. Every decision starts with <code>cmp</code>.</p>
<div class="rule-box">cmp S1, S2 computes S2 − S1</div>
<p><b>Second minus first.</b> Then cmp throws the answer away. It keeps only four yes/no facts about the answer, called <b>flags</b>. Think of them as four lamps the next instruction looks at:</p>`+
flagLights({ZF:0,SF:0,CF:0,OF:0})+
cmpBox('cmpq %rax, %rbx',[['%rax','5'],['%rbx','10']],'computes %rbx − %rax = 10 − 5 = 5')+
`<div class="tip"><span class="tl">Watch the order</span>Your worksheet uses both orders. With a in %rdi and b in %rsi, <code>cmpb %rdi, %rsi</code> computes <b>b − a</b>. But <code>cmpl %esi, %edi</code> computes <b>a − b</b>.</div>`,
qs:[
{instr:'cmpl %esi, %edi',plain:true,prompt:'What does this compute?',options:['%edi − %esi','%esi − %edi','%edi + %esi'],answer:0,hint:'Second minus first.',explain:'Second minus first: %edi − %esi.'},
{vis:cmpBox('cmpq %rax, %rbx',[['%rax','5'],['%rbx','10']]),prompt:'What number does it compute?',options:['5','−5','15'],answer:0,explain:'%rbx − %rax = 10 − 5 = 5.'},
{vis:cmpBox('cmpq %rbx, %rax',[['%rax','5'],['%rbx','10']]),prompt:'Operands swapped. What number does it compute now?',options:['−5','5','15'],answer:0,explain:'%rax − %rbx = 5 − 10 = −5.'},
{instr:'cmpb %rdi, %rsi',plain:true,prompt:'a is in %rdi and b is in %rsi. What does this compute?',options:['b − a','a − b','a + b'],answer:0,explain:'Second minus first: %rsi − %rdi, which is b − a. Worksheet Q1 is written this way.'},
{instr:'cmpl %esi, %edi',plain:true,prompt:'a is in %edi and b is in %esi. What does this compute?',options:['a − b','b − a'],answer:0,keep:true,explain:'%edi − %esi, which is a − b. Worksheet Q2 is written this way.'},
{instr:'cmpl %esi, %edi',plain:true,prompt:'After this runs, what\'s in %edi?',code:false,options:['The same value as before','a − b','0'],answer:0,explain:'cmp only sets the flags. Neither value changes.'},
{prompt:'Which instruction changes %edi?',options:['subl %esi, %edi','cmpl %esi, %edi'],answer:0,keep:true,explain:'sub stores its answer. cmp doesn\'t.'},
{prompt:'<code>test S1, S2</code> is cmp\'s cousin. What does it compute?',code:false,options:['S2 AND S1, bit by bit','S2 − S1','S2 + S1'],answer:0,explain:'test ANDs the two values and keeps only the flags. <code>test %eax, %eax</code> is a quick check of %eax itself: is it zero, is it negative?'}
]},

{id:'c2',sec:'p3',name:'ZF: was the answer zero?',short:'ZF',shuffleOpts:true,
defaults:{m:null,code:true,options:['ZF = 1','ZF = 0'],keep:true},
recap:"<b>ZF = 1</b> when the answer is zero. After a cmp, that means the two values were <b>equal</b>.",
lesson:`<p>The first lamp is <b>ZF</b>, the zero flag. It lights up (ZF = 1) when the answer is exactly <b>zero</b>.</p>
<p>After a cmp, the answer is zero exactly when the two values are <b>equal</b>. So ZF = 1 means "they were equal".</p>`+
cmpBox('cmpl %esi, %edi',[['a (%edi)','7'],['b (%esi)','7']],'a − b = 7 − 7 = 0, so ZF = 1')+flagLights({ZF:1},{keys:['ZF'],focus:'ZF'})+
`<div class="tip"><span class="tl">test</span><code>test %eax, %eax</code> sets ZF = 1 exactly when %eax is 0. Loops use this to check a counter.</div>`,
qs:[
{vis:cmpBox('cmpl %esi, %edi',[['a (%edi)','7'],['b (%esi)','7']]),prompt:'What is ZF?',answer:0,explain:'7 − 7 = 0, so ZF = 1.',cf:{ins:'cmpl %esi, %edi',s1:['b','7'],s2:['a','7'],bits:32,only:['ZF'],focus:'ZF'}},
{vis:cmpBox('cmpl %esi, %edi',[['a (%edi)','3'],['b (%esi)','8']]),prompt:'What is ZF?',answer:1,explain:'3 − 8 = −5, not zero, so ZF = 0.',cf:{ins:'cmpl %esi, %edi',s1:['b','8'],s2:['a','3'],bits:32,only:['ZF'],focus:'ZF'}},
{vis:cmpBox('testl %eax, %eax',[['%eax','0']]),prompt:'What is ZF?',answer:0,explain:'%eax is 0, so ZF = 1.',cf:{ins:'testl %eax, %eax',op:'test',s1:['%eax','0'],s2:['%eax','0'],bits:32,only:['ZF'],focus:'ZF'}},
{vis:cmpBox('testl %eax, %eax',[['%eax','5']]),prompt:'What is ZF?',answer:1,explain:'%eax isn\'t 0, so ZF = 0.',cf:{ins:'testl %eax, %eax',op:'test',s1:['%eax','5'],s2:['%eax','5'],bits:32,only:['ZF'],focus:'ZF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','49'],['b','49']]),prompt:'What is ZF?',answer:0,explain:'Equal values, so the answer is 0 and ZF = 1. (The setge row on your worksheet.)',cf:{ins:'cmpb %rdi, %rsi',s1:['a','49'],s2:['b','49'],only:['ZF'],focus:'ZF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','14'],['b','37']]),prompt:'What is ZF?',answer:1,explain:'14 and 37 are different, so ZF = 0. (The setne row on your worksheet.)',cf:{ins:'cmpb %rdi, %rsi',s1:['a','14'],s2:['b','37'],only:['ZF'],focus:'ZF'}},
{prompt:'After a cmp, ZF = 1 means the two values were',code:false,options:['equal','different','negative'],answer:0,keep:false,explain:'Their difference was zero.'}
]},

{id:'c3',sec:'p3',name:'SF: was the answer negative?',short:'SF',
defaults:{m:null,code:true,options:['SF = 1','SF = 0']},
recap:"<b>SF = 1</b> when the answer, second minus first, is <b>negative</b>.",
lesson:`<p>The second lamp is <b>SF</b>, the sign flag. It lights up when the answer is <b>negative</b>. Zero and positive answers leave it off.</p>
<p>So: work out second minus first, then look at the sign.</p>`+
cmpBox('cmpq %rbx, %rax',[['%rax','5'],['%rbx','10']],'5 − 10 = −5, negative, so SF = 1')+flagLights({ZF:0,SF:1},{keys:['ZF','SF'],focus:'SF'})+

{vis:cmpBox('cmpq %rbx, %rax',[['%rax','5'],['%rbx','10']]),prompt:'What is SF?',answer:0,explain:'5 − 10 = −5, negative, so SF = 1.',cf:{ins:'cmpq %rbx, %rax',s1:['%rbx','10'],s2:['%rax','5'],bits:64,only:['ZF','SF'],focus:'SF'}},

{vis:cmpBox('cmpb %rdi, %rsi',[['a','37'],['b','14']]),prompt:'This computes b − a. What is SF?',answer:0,explain:'14 − 37 = −23, negative, so SF = 1.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','37'],s2:['b','14'],only:['ZF','SF'],focus:'SF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','49'],['b','49']]),prompt:'What is SF?',answer:1,explain:'49 − 49 = 0, and zero isn\'t negative, so SF = 0.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','49'],s2:['b','49'],only:['ZF','SF'],focus:'SF'}},

{id:'c4',sec:'p3',name:'One byte, two readings',short:'Signed bytes',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"One byte, two readings. Unsigned is 0 to 255. From 0x80 up, the top bit is 1, and the signed reading is <b>unsigned − 256</b>.",
lesson:`<p>Your worksheet compares <b>bytes</b>, and some are written in hex or as negatives. One byte holds 0 to 255. The same byte can also be read as <b>signed</b>, from −128 to 127.</p>
<div class="rule-box">0x00 to 0x7F: both readings are the same<br>0x80 to 0xFF: signed = unsigned − 256</div>`+
toy('byte',{v:0xAA})+
`<div class="tip"><span class="tl">Hex to decimal</span>First digit × 16, plus the second digit. 0xAA = 10 × 16 + 10 = 170. 0x53 = 5 × 16 + 3 = 83.</div>
<p>Going the other way, a negative like −46 is stored as 256 − 46 = 210 (0xD2).</p>`,
qs:[
{token:'0x53',prompt:'As an unsigned number, what is this byte?',options:['83','53','−83'],answer:0,explain:'5 × 16 + 3 = 83.',after:byteCard('0x53')},

{token:'0xAA',prompt:'As a signed number, what is this byte?',options:['−86','170','86'],answer:0,hint:'It\'s 0x80 or more, so subtract 256.',explain:'170 − 256 = −86.',after:byteCard('0xAA')},
{token:'0x7F',prompt:'As a signed number, what is this byte?',options:['127','−1','−127'],answer:0,explain:'0x7F is below 0x80, so both readings are 7 × 16 + 15 = 127.',after:byteCard('0x7F')},
{token:'0xFF',prompt:'As a signed number, what is this byte?',options:['−1','255','−255'],answer:0,explain:'255 − 256 = −1.',after:byteCard('0xFF')},
{token:'−46',prompt:'This byte is stored as which unsigned number?',options:['210','46','−210'],answer:0,hint:'256 − 46.',explain:'256 − 46 = 210 (0xD2).',after:byteCard('−46')},

{id:'c5',sec:'p3',name:'CF: unsigned below',short:'CF',
defaults:{m:null,code:true,options:['CF = 1','CF = 0']},
recap:"<b>CF</b> is the unsigned flag. After <code>cmp S1, S2</code>, CF = 1 when S2 is <b>below</b> S1, with both read as unsigned.",
lesson:`<p>The third lamp is <b>CF</b>, the carry flag. It's about <b>unsigned</b> numbers.</p>
<div class="rule-box">After cmp S1, S2: CF = 1 when S2 is below S1 (unsigned)</div>
<p>In words: S2 − S1 would go below zero, so the subtraction had to borrow. If a value is hex or negative, read it as unsigned first, like in the last level.</p>`+
cmpBox('cmpb %rdi, %rsi',[['a','0xaa = 170'],['b','0x53 = 83']],'is b below a?  83 below 170?  yes, so CF = 1')+flagLights({ZF:0,SF:1,CF:1},{keys:['ZF','SF','CF'],focus:'CF'})+
`<p class="fine">For addition, CF = 1 when the unsigned sum is too big for the byte, so a 1 carries out of the top. Your slide shows 1111 + 0001.</p>`,
qs:[
{vis:cmpBox('cmpq %rax, %rbx',[['%rax','5'],['%rbx','10']]),prompt:'What is CF?',answer:1,hint:'Is %rbx below %rax?',explain:'Is 10 below 5? No, so CF = 0.',cf:{ins:'cmpq %rax, %rbx',s1:['%rax','5'],s2:['%rbx','10'],bits:64,only:['ZF','SF','CF'],focus:'CF'}},
{vis:cmpBox('cmpq %rbx, %rax',[['%rax','5'],['%rbx','10']]),prompt:'What is CF?',answer:0,hint:'Is %rax below %rbx?',explain:'Is 5 below 10? Yes, so CF = 1. With SF = 1 from before, that\'s your slide\'s "CF and SF".',cf:{ins:'cmpq %rbx, %rax',s1:['%rbx','10'],s2:['%rax','5'],bits:64,only:['ZF','SF','CF'],focus:'CF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','14'],['b','37']]),prompt:'This computes b − a. What is CF?',answer:1,explain:'Is 37 below 14? No, so CF = 0.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','14'],s2:['b','37'],only:['ZF','SF','CF'],focus:'CF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','0xaa'],['b','0x53']]),prompt:'This computes b − a. What is CF?',answer:0,hint:'Convert: 0xaa = 170, 0x53 = 83.',explain:'Is 83 below 170? Yes, so CF = 1.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','0xaa'],s2:['b','0x53'],only:['ZF','SF','CF'],focus:'CF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','49'],['b','49']]),prompt:'What is CF?',answer:1,explain:'Equal isn\'t below, so CF = 0.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','49'],s2:['b','49'],only:['ZF','SF','CF'],focus:'CF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','−101'],['b','−46']]),prompt:'This computes b − a. What is CF?',answer:1,hint:'Unsigned first: 256 − 101 and 256 − 46.',explain:'As unsigned bytes, a = 155 and b = 210. Is 210 below 155? No, so CF = 0.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','−101'],s2:['b','−46'],only:['ZF','SF','CF'],focus:'CF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','0x20'],['b','0x10']]),prompt:'This computes b − a. What is CF?',answer:0,explain:'Is 16 below 32? Yes, so CF = 1.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','0x20'],s2:['b','0x10'],only:['ZF','SF','CF'],focus:'CF'}},
{prompt:'After <code>test</code>, what is CF always?',options:['CF = 0','CF = 1'],answer:0,keep:true,explain:'test always clears CF (and OF).'}
]},

{id:'c6',sec:'p3',name:'OF: signed overflow',short:'OF',
defaults:{m:null,code:true,options:['OF = 1','OF = 0']},
recap:"<b>OF</b> is the signed flag: it's 1 when the true signed answer doesn't fit (outside −128 to 127 for a byte). Two values with the same sign can never overflow a subtraction.",
lesson:`<p>The last lamp is <b>OF</b>, the overflow flag. It's about <b>signed</b> numbers. A signed byte only holds −128 to 127, and OF = 1 when the real answer doesn't fit.</p>
<ol class="steps"><li>Read both values as <b>signed</b>.</li><li>Subtract like normal math.</li><li>Outside −128 to 127? Then OF = 1.</li></ol>`+
cmpBox('cmpb %rdi, %rsi',[['a','0xaa = −86'],['b','0x53 = 83']],'b − a = 83 − (−86) = 169, too big, so OF = 1')+
`<div class="tip"><span class="tl">Shortcut</span>If both values have the same sign (both positive, or both negative), a subtraction can never overflow. OF can only be 1 when one is negative and the other isn't.</div>`+
toy('cmp',{a:0xaa,b:0x53}),
qs:[
{vis:cmpBox('cmpb %rdi, %rsi',[['a','14'],['b','37']]),prompt:'This computes b − a. What is OF?',answer:1,explain:'37 − 14 = 23, which fits, so OF = 0.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','14'],s2:['b','37'],focus:'OF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','0xaa'],['b','0x53']]),prompt:'This computes b − a. What is OF?',answer:0,hint:'Signed: a = −86, b = 83.',explain:'83 − (−86) = 169. That\'s bigger than 127, so OF = 1.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','0xaa'],s2:['b','0x53'],focus:'OF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','49'],['b','49']]),prompt:'What is OF?',answer:1,explain:'49 − 49 = 0 fits, so OF = 0.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','49'],s2:['b','49'],focus:'OF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','−101'],['b','−46']]),prompt:'This computes b − a. What is OF?',answer:1,hint:'Both negative. Check the shortcut.',explain:'Both are negative, so it can\'t overflow: −46 − (−101) = 55, which fits. OF = 0.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','−101'],s2:['b','−46'],focus:'OF'}},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','0x01'],['b','0x80']]),prompt:'This computes b − a. What is OF?',answer:0,hint:'Signed: b = −128.',explain:'−128 − 1 = −129. That\'s below −128, so OF = 1.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','0x01'],s2:['b','0x80'],focus:'OF'}},
{prompt:'What is 83 − (−86)?',options:['169','−3','3'],answer:0,keep:true,explain:'Subtracting a negative adds: 83 + 86 = 169.'},
{prompt:'Can subtracting two negative numbers overflow?',code:false,options:['No','Yes'],answer:0,keep:true,explain:'Same signs can never overflow in a subtraction.'}
]},

{id:'cflags',sec:'p3',name:'All four flags, step by step',short:'All 4 flags',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"Same order every time: what does it compute, read the values both ways, then <b>ZF</b> equal? <b>SF</b> negative? <b>CF</b> below, unsigned? <b>OF</b> signed answer out of range?",
lesson:`<p>Now all four lamps at once. This is the whole recipe your worksheet needs, in the same order every time:</p>
<ol class="steps"><li><b>What does it compute?</b> Second minus first.</li><li><b>Read the values</b>, unsigned and signed, if they're hex or negative.</li><li><b>ZF</b>: are they equal?</li><li><b>SF</b>: is the stored answer negative?</li><li><b>CF</b>: is the second one below the first, unsigned?</li><li><b>OF</b>: does the signed answer go outside −128 to 127?</li></ol>
<p>Each problem below walks you through it one small step at a time. The lamps fill in as you go.</p>`+
flagRecipe({ins:'cmpb %rdi, %rsi',s1:['a','0xaa'],s2:['b','0x53'],bits:8},{title:'Worked example: a = 0xaa, b = 0x53'}),
qs:[
{prompt:'Your slide\'s first example. Which lamps light up?',board:boardFlags({ins:'cmpq %rax, %rbx'},null,[['%rax','5'],['%rbx','10']]),
 guided:[{label:'What it computes',ask:'What does <code>cmpq %rax, %rbx</code> compute?',options:['%rbx − %rax = 5','%rax − %rbx = −5','%rbx + %rax = 15'],answer:0,hint:'Second minus first.',say:'Second minus first.'}].concat(gFlags({ins:'cmpq %rax, %rbx',s1:['%rax','5'],s2:['%rbx','10'],bits:64},['ZF','SF','CF','OF'])),
 explain:'None of them. 10 − 5 = 5 is not zero, not negative, fits easily, and 10 isn\'t below 5.',cf:{ins:'cmpq %rax, %rbx',s1:['%rax','5'],s2:['%rbx','10'],bits:64}},
{prompt:'Your slide\'s second example: the operands are swapped.',board:boardFlags({ins:'cmpq %rbx, %rax'},null,[['%rax','5'],['%rbx','10']]),
 guided:[{label:'What it computes',ask:'What does <code>cmpq %rbx, %rax</code> compute?',options:['%rax − %rbx = −5','%rbx − %rax = 5','%rax + %rbx = 15'],answer:0,hint:'Second minus first.',say:'Second minus first.'}].concat(gFlags({ins:'cmpq %rbx, %rax',s1:['%rbx','10'],s2:['%rax','5'],bits:64},['ZF','SF','CF','OF'])),
 explain:'SF and CF. The answer −5 is negative, and 5 is below 10 as unsigned numbers. That\'s your slide\'s answer, "CF and SF".',cf:{ins:'cmpq %rbx, %rax',s1:['%rbx','10'],s2:['%rax','5'],bits:64}},
{prompt:'Bytes in hex. Light up the right lamps.',board:boardFlags({ins:'cmpb %rdi, %rsi'},null,[['a (in %rdi)','0x90'],['b (in %rsi)','0x10']]),
 guided:[{label:'What it computes',ask:'What does <code>cmpb %rdi, %rsi</code> compute?',options:['b − a','a − b'],answer:0,keep:true,hint:'Second minus first: %rsi − %rdi.',say:'%rsi − %rdi, which is b − a.'},
  {label:'Read a',ask:'Read a = 0x90 both ways.',options:['144 unsigned, −112 signed','144 unsigned, 144 signed','90 unsigned, −90 signed'],answer:0,hint:'9 × 16 = 144. Is it 0x80 or more?',say:'0x90 = 9 × 16 = 144. That\'s 0x80 or more, so signed it\'s 144 − 256 = −112. (b = 0x10 = 16 both ways.)'}].concat(gFlags({ins:'cmpb %rdi, %rsi',s1:['a','0x90'],s2:['b','0x10'],bits:8},['ZF','SF','CF','OF'])),
 explain:'Three lamps. Unsigned, 16 is below 144, so CF = 1. Signed, 16 − (−112) = 128 doesn\'t fit, so OF = 1, and it wraps to −128, which is negative, so SF = 1.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','0x90'],s2:['b','0x10'],bits:8}},
{prompt:'One more. Watch the signed reading.',board:boardFlags({ins:'cmpb %rdi, %rsi'},null,[['a (in %rdi)','0x01'],['b (in %rsi)','0x80']]),
 guided:[{label:'What it computes',ask:'What does <code>cmpb %rdi, %rsi</code> compute?',options:['b − a','a − b'],answer:0,keep:true,hint:'Second minus first.',say:'b − a.'},
  {label:'Read b',ask:'Read b = 0x80 both ways.',options:['128 unsigned, −128 signed','128 unsigned, 128 signed','80 unsigned, −80 signed'],answer:0,hint:'8 × 16 = 128, and 0x80 is the first negative byte.',say:'0x80 = 128 unsigned, and 128 − 256 = −128 signed. (a = 0x01 = 1 both ways.)'}].concat(gFlags({ins:'cmpb %rdi, %rsi',s1:['a','0x01'],s2:['b','0x80'],bits:8},['ZF','SF','CF','OF'])),
 explain:'Only OF. Signed, −128 − 1 = −129 is below −128, so it overflows and wraps to 127, which isn\'t negative (SF = 0). Unsigned, 128 − 1 = 127 is fine (CF = 0).',cf:{ins:'cmpb %rdi, %rsi',s1:['a','0x01'],s2:['b','0x80'],bits:8}}
]},

{id:'c7',sec:'p3',name:'set: answer a yes/no question',short:'set',shuffleOpts:true,
defaults:{m:null,code:true,options:['1','0'],keep:true},
recap:"After <code>cmp S1, S2</code>, read <code>setX</code> as \"is S2 X S1?\" <b>A</b>bove and <b>b</b>elow are unsigned. <b>G</b>reater and <b>l</b>ess are signed.",
lesson:`<p>A <code>set</code> instruction asks a yes/no question about the last cmp. It puts the answer in a byte like <code>%al</code>: <b>1 for yes, 0 for no</b>.</p>
<p>After <code>cmp S1, S2</code>, read it as <b>"is S2 ___ S1?"</b> The letters after set fill in the blank:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Letters</th><th>Is S2 ___ S1?</th><th>Reads values as</th></tr></thead><tbody>
<tr><td class="c">e / ne</td><td>equal / not equal</td><td>either</td></tr>
<tr><td class="c">g / ge</td><td>greater / greater or equal</td><td>signed</td></tr>
<tr><td class="c">l / le</td><td>less / less or equal</td><td>signed</td></tr>
<tr><td class="c">a / ae</td><td>above / above or equal</td><td>unsigned</td></tr>
<tr><td class="c">b / be</td><td>below / below or equal</td><td>unsigned</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">How to remember it</span><b>Above and below</b> are like floors in a building, and a building has no negative floors, so a and b are <b>unsigned</b>. <b>Greater and less</b> are math words, and math has negatives, so g and l are <b>signed</b>. An extra <b>e</b> means "or equal", and <b>n</b> means "not".</div>`+
cmpBox('cmpb %rdi, %rsi   then   setb %al',[['a','0xaa = 170'],['b','0x53 = 83']],'is b below a, unsigned?  83 below 170?  yes, so %al = 1')+
`<p class="fine">This gives the same answer as the flag formulas on your slides. setb copies CF, sete copies ZF, and seta is ~CF &amp; ~ZF ("not below and not equal"). The feedback shows both.</p>`,
qs:[
{vis:cmpBox('cmpl %esi, %edi   then   sete %al',[['a (%edi)','7'],['b (%esi)','7']]),prompt:'What does sete put in %al?',answer:0,explain:'Is a equal to b? Yes, so %al = 1.',cf:{ins:'cmpl %esi, %edi',s1:['b','7'],s2:['a','7'],bits:32,set:'sete',focus:'set'}},
{vis:cmpBox('cmpb %rdi, %rsi   then   setne %al',[['a','14'],['b','37']]),prompt:'What does setne put in %al?',answer:0,explain:'Is b not equal to a? 37 isn\'t 14, so yes: %al = 1. (Worksheet Q1.)',cf:{ins:'cmpb %rdi, %rsi',s1:['a','14'],s2:['b','37'],set:'setne',focus:'set'}},
{vis:cmpBox('cmpb %rdi, %rsi   then   setg %al',[['a','5'],['b','3']]),prompt:'What does setg put in %al?',answer:1,hint:'Is b greater than a?',explain:'Is 3 greater than 5? No, so %al = 0.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','5'],s2:['b','3'],set:'setg',focus:'set'}},
{vis:cmpBox('cmpb %rdi, %rsi   then   setge %al',[['a','49'],['b','49']]),prompt:'What does setge put in %al?',answer:0,explain:'Is 49 greater than or equal to 49? Yes, it\'s equal, so %al = 1. (Worksheet Q1.)',cf:{ins:'cmpb %rdi, %rsi',s1:['a','49'],s2:['b','49'],set:'setge',focus:'set'}},
{vis:cmpBox('cmpb %rdi, %rsi   then   setb %al',[['a','0xaa'],['b','0x53']]),prompt:'What does setb put in %al?',answer:0,hint:'b is for below: unsigned. Convert both.',explain:'Is 83 below 170, unsigned? Yes, so %al = 1. (Worksheet Q1.)',cf:{ins:'cmpb %rdi, %rsi',s1:['a','0xaa'],s2:['b','0x53'],set:'setb',focus:'set'}},
{vis:cmpBox('cmpb %rdi, %rsi   then   setl %al',[['a','0xaa'],['b','0x53']]),prompt:'Same values. What does setl put in %al?',answer:1,hint:'l is signed: a = −86, b = 83.',explain:'Is 83 less than −86, signed? No, so %al = 0. Same bytes as setb, opposite answer, because signed and unsigned read them differently.',cf:{ins:'cmpb %rdi, %rsi',s1:['a','0xaa'],s2:['b','0x53'],set:'setl',focus:'set'}},
{vis:cmpBox('cmpb %rdi, %rsi   then   seta %al',[['a','−101'],['b','−46']]),prompt:'What does seta put in %al?',answer:0,hint:'a is unsigned: a = 155, b = 210.',explain:'Is 210 above 155, unsigned? Yes, so %al = 1. (Worksheet Q1.)',cf:{ins:'cmpb %rdi, %rsi',s1:['a','−101'],s2:['b','−46'],set:'seta',focus:'set'}},
{prompt:'Which one means "greater, unsigned"?',options:['seta','setg','setgt','setb'],answer:0,keep:false,explain:'Unsigned uses above and below. setgt isn\'t a real instruction.'},
{prompt:'Which one means "less or equal, signed"?',options:['setle','setbe','setl','setlte'],answer:0,keep:false,explain:'l for less (signed), plus e for "or equal".'},
{prompt:'<code>setb</code> copies which flag?',options:['CF','ZF','SF','OF'],answer:0,keep:false,explain:'Below (unsigned) is exactly CF, the borrow flag.'}
]},

{id:'c8',sec:'p3',name:'Jumps use the same letters',short:'Jumps',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"A jump asks the same question as set, with the same letters: yes means jump. <code>jz</code> is <code>je</code>, and <code>jnz</code> is <code>jne</code>.",
lesson:`<p>A jump <code>jX label</code> asks the same yes/no question as <code>setX</code>. If the answer is <b>yes</b>, it jumps to the label. If <b>no</b>, it just carries on with the next line.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Jump</th><th>Jumps when S2 is ___ S1</th></tr></thead><tbody>
<tr><td class="c">je / jne</td><td>equal / not equal</td></tr>
<tr><td class="c">jg / jge / jl / jle</td><td>greater, greater or equal, less, less or equal (signed)</td></tr>
<tr><td class="c">ja / jae / jb / jbe</td><td>above, above or equal, below, below or equal (unsigned)</td></tr>
<tr><td class="c">jmp</td><td>always</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">Real or fake?</span>Like Part 1's register names, some jump names on your worksheet are fake. There's no <code>jlt</code>, <code>jgt</code>, <code>jeq</code> or <code>jet</code>. Two extra real names: <code>jz</code> is the same as <code>je</code>, and <code>jnz</code> is the same as <code>jne</code>.</div>`,
qs:[
{prompt:'Which jump means "greater than, unsigned"?',options:['ja','jg','jgt','jae'],answer:0,explain:'Unsigned uses above. jgt isn\'t real.'},
{prompt:'Which jump means "less than or equal, signed"?',options:['jle','jbe','jl','jlte'],answer:0,explain:'l for signed less, e for "or equal".'},
{prompt:'Which jump means "less than, unsigned"?',options:['jb','jl','jlt','jbe'],answer:0,explain:'Unsigned uses below. jlt isn\'t real.'},
{token:'jlt',prompt:'Is this a real jump?',options:['Real','Fake'],answer:1,keep:true,explain:'Fake. Less-than is jl.'},
{token:'jeq',prompt:'Is this a real jump?',options:['Real','Fake'],answer:1,keep:true,explain:'Fake. Equal is je (or jz).'},
{token:'jge',prompt:'Is this a real jump?',options:['Real','Fake'],answer:0,keep:true,explain:'Real: greater or equal, signed.'},
{token:'jet',prompt:'Is this a real jump?',options:['Real','Fake'],answer:1,keep:true,explain:'Fake. It\'s a distractor on your worksheet.'},
{prompt:'Which jump is the same as <code>jz</code>?',options:['je','jne','jmp'],answer:0,explain:'"Zero" and "equal" are the same test after a cmp.'},
{prompt:'Which jump always jumps?',options:['jmp','je','ja'],answer:0,explain:'jmp has no condition.'},
{vis:cmpBox('cmpl %esi, %edi   then   jg .L2',[['a (%edi)','8'],['b (%esi)','3']]),prompt:'Does it jump to .L2?',code:false,options:['Yes, it jumps','No, it goes to the next line'],answer:0,keep:true,explain:'Is a (8) greater than b (3)? Yes, so it jumps.',cf:{ins:'cmpl %esi, %edi',s1:['b','3'],s2:['a','8'],bits:32,jmp:'jg',focus:'set'}},
{vis:cmpBox('cmpl %esi, %edi   then   jb .L5',[['a (%edi)','9'],['b (%esi)','4']]),prompt:'Does it jump to .L5?',code:false,options:['Yes, it jumps','No, it goes to the next line'],answer:1,keep:true,explain:'Is a (9) below b (4)? No, so it carries on with the next line.',cf:{ins:'cmpl %esi, %edi',s1:['b','4'],s2:['a','9'],bits:32,jmp:'jb',focus:'set'}}
]},

{id:'c9',sec:'p3',name:'if and loops',short:'if and loops',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"A jump that <b>skips</b> code uses the <b>opposite</b> of the C condition. A loop leaves with <code>test</code>, then <code>jz</code>.",
lesson:`<p>Compiled code often uses a jump to <b>skip</b> over something. Your worksheet uses two patterns.</p>
<p><b>1. Skip an if.</b> <code>if (a == b) return 0;</code> becomes "if they are <b>not</b> equal, jump past the return 0":</p>`+
codeBlock('cmpl  %esi, %edi        # a - b\n[[jne]]   .L1             # not equal? skip the next two lines\nxor   %eax, %eax        # return 0  (anything XOR itself is 0)\nret\n.L1: ...')+
`<p><b>2. Leave a loop.</b> <code>while (size)</code> keeps going while size isn't 0. So at the top: "if size <b>is</b> 0, jump out". Run the worksheet's loop with size = 2 and watch:</p>`+
toy('trace',{code:['array_sum:','        xor   %eax, %eax','.L1:    test  %edi, %edi','        jz    .L2','        dec   %edi','        add   (%esi,%edi,4), %eax','        jmp   .L1','.L2:    ret'],states:(function(){
  var T=[[0,'array_sum(array, 2) starts. The array {5, 7} is at %esi, and size = 2 is in %edi. ▶ marks the next line to run.','2','?',null,-1],
    [1,'Next: <code>xor %eax, %eax</code>. Anything XOR itself is 0, so the sum will start at 0.','2','?',null,-1],
    [2,'%eax = 0. Next: <code>test %edi, %edi</code> asks "is size 0?"','2','0',null,-1],
    [3,'%edi = 2 isn\'t 0, so ZF = 0. Next: <code>jz .L2</code> jumps only if ZF = 1.','2','0',0,-1],
    [4,'ZF = 0, so no jump. Next: <code>dec %edi</code>.','2','0',0,-1],
    [5,'size went from 2 to 1. Next: add array[1] to the sum.','1','0',0,-1],
    [6,'Added array[1] = 7. Sum = 7. Next: <code>jmp .L1</code> always jumps back to the test.','1','7',0,1],
    [2,'Back at the top. Test again: is %edi = 1 zero?','1','7',0,-1],
    [3,'No, so ZF = 0 and jz won\'t jump.','1','7',0,-1],
    [4,'Next: dec, so size goes from 1 to 0.','1','7',0,-1],
    [5,'Next: add array[0].','0','7',0,-1],
    [6,'Added array[0] = 5. Sum = 12. Jump back to the test.','0','12',0,0],
    [2,'Test again: is %edi = 0 zero?','0','12',0,-1],
    [3,'Yes! ZF = 1, so <code>jz .L2</code> will jump out of the loop.','0','12',1,-1],
    [7,'Jumped to .L2. <code>ret</code> returns the sum in %eax: 5 + 7 = 12.','0','12',1,-1]];
  return T.map(function(t){return {at:t[0],note:t[1],vis:regsViz([['%edi (size)',t[2]],['%eax (sum)',t[3]]])+flagLights({ZF:t[4]},{keys:['ZF']})+arrViz({decl:'int array[2];  (at %esi)',n:2,size:4,base:'%esi',vals:[5,7],hl:t[5]})};});
})()})+
`<div class="tip"><span class="tl">Flip or not?</span>If the jump <b>skips</b> code, it uses the opposite of the C condition: <code>==</code> becomes <code>jne</code>. If the jump goes <b>to</b> the code that should run, it uses the condition as written: "a &gt; b unsigned" goes to <code>ja</code>.</div>`,
qs:[
{prompt:'<code>if (a == b) return 0;</code> The jump skips the return 0. Which jump?',options:['jne','je','jeq','jmp'],answer:0,explain:'Skip it when they are not equal: jne.'},
{instr:'xor %eax, %eax',plain:true,prompt:'What does this do?',code:false,options:['Sets %eax to 0','Flips every bit of %eax','Compares %eax with itself'],answer:0,explain:'Anything XOR itself is 0. It\'s how the worksheet writes return 0.'},
{prompt:'After <code>cmpl %esi, %edi</code> (a − b), a jump goes <b>to</b> "return a" when a &gt; b, unsigned. Which jump?',options:['ja','jg','jbe','jgt'],answer:0,explain:'It goes to the code that should run, so no flip. Greater, unsigned, is ja.'},
{prompt:'Same setup, but for a &lt;= b, signed.',options:['jle','jbe','jg','jlte'],answer:0,explain:'Less or equal, signed: jle.'},
{prompt:'Same setup, but for a &lt; b, unsigned.',options:['jb','jl','jlt','jae'],answer:0,explain:'Less, unsigned: jb.'},
{instr:'test %edi, %edi',plain:true,prompt:'When does this set ZF = 1?',code:false,options:['When %edi is 0','When %edi is negative','Always'],answer:0,explain:'test with itself checks the register, and ZF = 1 means it was zero.'},
{prompt:'<code>while (size)</code> with size in %edi. After <code>test %edi, %edi</code>, which jump leaves the loop?',options:['jz','jnz','jmp','jg'],answer:0,explain:'Leave when size is 0: jz (same as je).'},
{prompt:'Why test %edi and not %esi?',code:false,options:['size is in %edi. %esi holds the array\'s address.','%esi can\'t be tested.','Either works.'],answer:0,explain:'while (size) checks size, and size is in %edi. %esi holds the array\'s address.'},
{instr:'jmp .L1',plain:true,prompt:'At the bottom of the loop, what does this do?',code:false,options:['Goes back to the test at the top','Leaves the loop','Jumps only if size is 0'],answer:0,explain:'jmp always jumps. The test at the top decides when to stop.'},
{prompt:'In the loop above, which element does the first <code>add</code> read?',options:['array[1], because dec ran first','array[2]','array[0]'],answer:0,explain:'dec turns size 2 into 1 before the add, so the loop adds the elements from the end: array[1], then array[0].'}
]},

{id:'stk',sec:'p4',name:'The stack grows down',short:'The stack',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"The stack grows <b>down</b>. <code>push</code>: subtract 8 from %rsp, then write. <code>pop</code>: read, then add 8.",
lesson:`<p>The <b>stack</b> is memory used like a pile of plates: the last thing put on is the first thing taken off. <code>%rsp</code>, the stack pointer, holds the address of the top item.</p>
<div class="rule-box">pushq X: %rsp − 8, then write X there<br>popq X: read the top into X, then %rsp + 8</div>
<p>The twist: the pile grows <b>toward lower addresses</b>. Every push makes %rsp <b>smaller</b>. Press the buttons and watch %rsp:</p>`+
toy('stack')+
`<div class="tip"><span class="tl">Subtracting 8 in hex</span>If the last digit is 8 or more, just take 8 off it: 0x10C − 8 = 0x104. If it's smaller than 8, borrow like in decimal: add 16 to it, take 8 off, and take 1 from the digit before. 0x110 − 8 = 0x108, and 0x778ff0 − 8 = 0x778fe8.</div>
<p class="fine">Your slides show IA32, where <code>pushl</code> moves %esp by 4. The worksheet is x86-64, where <code>pushq</code> moves %rsp by 8, because registers and addresses are 8 bytes.</p>`,
qs:[
{vis:regsViz([['%rsp','0x108']]),prompt:'After <code>pushq %rax</code>, what is %rsp?',options:['0x100','0x110','0x104'],answer:0,hint:'push makes %rsp smaller by 8.',explain:'push moves %rsp down by 8: 0x108 − 8 = 0x100.',after:stackViz({title:'After pushq %rax',regs:[['%rsp','0x100']],rows:[{a:'0x108',v:'…'},{a:'0x100',v:'%rax\'s value',cls:'new'}],rsp:1})},
{vis:regsViz([['%rsp','0x100']]),prompt:'After <code>popq %rax</code>, what is %rsp?',options:['0x108','0xF8','0x100'],answer:0,hint:'pop is the opposite of push.',explain:'pop moves %rsp up by 8: 0x100 + 8 = 0x108.',after:stackViz({title:'After popq %rax',regs:[['%rsp','0x108']],rows:[{a:'0x108',v:'…'},{a:'0x100',v:'(copied into %rax)',cls:'gone'}],rsp:0})},
{prompt:'When you push, which way does the stack grow?',code:false,options:['Toward lower addresses','Toward higher addresses'],answer:0,explain:'Each push makes %rsp smaller.'},
{vis:regsViz([['%rsp','0x108'],['%rbx','0x55']]),prompt:'After <code>pushq %rbx</code>, where is 0x55 written?',code:false,options:['At the new %rsp, 0x100','At the old %rsp, 0x108','Into %rax'],answer:0,hint:'push moves %rsp first, then writes.',explain:'push moves %rsp down first, then writes at the new %rsp.',after:stackViz({title:'After pushq %rbx',rows:[{a:'0x108',v:'123'},{a:'0x100',v:'0x55',cls:'new'}],rsp:1})},
{prompt:'What is 0x778ff0 − 8?',options:['0x778fe8','0x778fe2','0x778ff8'],answer:0,hint:'The last digit is 0, so borrow 16 from the f.',explain:'Borrow from the f: 0 + 16 − 8 = 8, and the f becomes e. So 0x778fe8. This exact subtraction is on your worksheet.',after:'<div class="bd"><div class="bd-h">Borrow, like in decimal</div>'+calcHTML([{l:'%rsp',v:'0x778ff0'},{l:'push',s:'−',v:'8'},{l:'new %rsp',s:'=',v:'0x778fe8',tot:true}])+'<p>0 − 8 doesn\'t work, so borrow 16 from the f: 16 − 8 = 8, and the f becomes e.</p></div>'},
{vis:regsViz([['%rsp','0x7ffe20']]),prompt:'Type %rsp after <code>pushq %rbp</code>.',input:true,expect:'0x7ffe18',hint:'0x20 − 8: borrow from the 2.',traps:[{v:'0x7ffe28',msg:'That went up. push moves %rsp down.'},{v:'0x7ffe12',msg:'That treated 0x20 like decimal 20. In hex, 0x20 − 8 = 0x18.'}],explain:'0x20 − 8: borrow from the 2, so 0 + 16 − 8 = 8 and the 2 becomes 1. %rsp = 0x7ffe18.'},
{prompt:'In your IA32 slides, how much does <code>pushl</code> change %esp by?',options:['4','8','1'],answer:0,keep:true,explain:'IA32 registers are 4 bytes, so pushl moves %esp by 4. In x86-64, pushq moves %rsp by 8.'},
{pre:'# %rsp = 0x200\npushq  %rax\npushq  %rbx\npopq   %rcx',prompt:'Type %rsp after all three lines.',input:true,expect:'0x1F8',hint:'Down 8, down 8, up 8.',explain:'0x200 → 0x1F8 → 0x1F0 after the two pushes, then the pop goes back up to 0x1F8.'},
{pre:'# %rax = 7, %rbx = 9\npushq  %rax\npushq  %rbx\npopq   %rcx',prompt:'What does <code>popq %rcx</code> put in %rcx?',options:['9','7'],answer:0,keep:true,hint:'Last in, first out.',explain:'%rbx was pushed last, so its 9 is on top. pop takes the top item. (Try it in the toy in the lesson.)'}
]},

{id:'callret',sec:'p4',name:'call and ret',short:'call / ret',shuffleOpts:true,
defaults:{m:null,code:true},
recap:"<code>call</code> pushes the <b>return address</b>, which is the line after the call, then jumps. <code>ret</code> pops it back into %rip.",
lesson:`<p><code>%rip</code> holds the address of the <b>next instruction to run</b>. (Your IA32 slides call it %eip.)</p>
<div class="rule-box">call f: push the return address, then jump to f<br>ret: pop the return address into %rip</div>
<p>The <b>return address</b> is the line right <b>after</b> the call, so the caller carries on where it left off. Step through it:</p>`+
toy('trace',{code:['400540   call  add3','400545   movq  %rax, %rbx','...','add3:','400600   leaq  3(%rdi), %rax','400604   ret'],states:[
 {at:0,note:'▶ marks %rip, the next line to run. Next: <code>call add3</code>.',vis:stackViz({regs:[['%rip','400540'],['%rsp','7ff100']],rows:[{a:'7ff100',v:'…'},{a:'7ff0f8',v:''}],rsp:0})},
 {at:4,note:'<code>call</code> did two things. First it <b>pushed the return address</b> 400545, the line after the call. Then it <b>jumped</b>: %rip = 400600, the start of add3.',vis:stackViz({regs:[['%rip','400600'],['%rsp','7ff0f8']],rows:[{a:'7ff100',v:'…'},{a:'7ff0f8',v:'400545',cls:'new'}],rsp:1})},
 {at:5,note:'add3 ran <code>leaq 3(%rdi), %rax</code>, so its answer is in %rax. The stack is unchanged. Next: ret.',vis:stackViz({regs:[['%rip','400604'],['%rsp','7ff0f8']],rows:[{a:'7ff100',v:'…'},{a:'7ff0f8',v:'400545',cls:'new'}],rsp:1})},
 {at:1,note:'<code>ret</code> popped 400545 into %rip, and %rsp went back up to 7ff100. The caller carries on right after its call.',vis:stackViz({regs:[['%rip','400545'],['%rsp','7ff100']],rows:[{a:'7ff100',v:'…'},{a:'7ff0f8',v:'400545',cls:'gone'}],rsp:0})}]})+
`<div class="tip"><span class="tl">The trap</span>The return address is <b>not</b> the call's own address. It's the next line, 400545. Just read it off the line below the call.</div>`,
qs:[
{pre:'400540   call  add3\n400545   movq  %rax, %rbx',prompt:'What return address does this call push?',options:['400545','400540','400600'],answer:0,explain:'It is the address of the line after the call.'},
{pre:'400540   call  add3\n400545   movq  %rax, %rbx\n...\nadd3:\n400600   leaq  3(%rdi), %rax',prompt:'Right after the call, what is %rip?',options:['400600','400545','400540'],answer:0,hint:'call jumps to add3.',explain:'call jumps to add3, so %rip holds add3\'s first address, 400600.'},
{vis:regsViz([['%rsp','7ff100']]),pre:'400540   call  add3',prompt:'Right after the call, what is %rsp?',options:['7ff0f8','7ff108','7ff100'],answer:0,hint:'call pushes, and a push moves %rsp down by 8.',explain:'7ff100 − 8: the last two digits are 00, so borrow: 0x100 − 8 = 0xF8. %rsp = 7ff0f8.'},
{pre:'400540   call  add3\n400545   movq  %rax, %rbx',prompt:'Right after the call, what value is at the address in %rsp?',options:['400545','400600','7ff100'],answer:0,explain:'The return address that call just pushed.',after:stackViz({title:'After the call',rows:[{a:'7ff100',v:'…'},{a:'7ff0f8',v:'400545',cls:'new'}],rsp:1})},
{pre:'add3:\n400600   leaq  3(%rdi), %rax\n400604   ret',prompt:'add3 runs <code>ret</code>. What is %rip after that?',options:['400545','400540','400604'],answer:0,hint:'ret pops the return address.',explain:'ret pops the return address into %rip, so the caller continues at 400545.'},
{vis:regsViz([['%rsp before ret','7ff0f8']]),prompt:'And what is %rsp after the ret?',options:['7ff100','7ff0f8','7ff0f0'],answer:0,hint:'ret pops, and a pop moves %rsp up by 8.',explain:'ret pops, which moves %rsp back up by 8, to where it was before the call.'},
{prompt:'Put these in the order they happen.',order:['call pushes the return address, 400545','%rip jumps to add3 at 400600','add3 runs leaq','ret pops 400545 into %rip','The caller carries on at 400545'],explain:'Push, jump, run, pop, carry on. call is the first two steps and ret is the fourth.'},
{prompt:'Why does call push the address of the <b>next</b> line?',code:false,options:['So the caller carries on after the call instead of calling again','Because the call line gets erased','So %rsp points at the function'],answer:0,explain:'When the function returns, the caller should carry on with the next line. Returning to the call itself would call the function again.'},
{pre:'# %rsp = 0x7ff010\n4005a0   call  f\n4005a5   addq  $1, %rax',prompt:'Type %rsp right after the call.',input:true,expect:'0x7ff008',hint:'0x10 − 8.',explain:'0x10 − 8 = 0x08, so %rsp = 0x7ff008.'},
{pre:'4005a0   call  f\n4005a5   addq  $1, %rax',prompt:'Type the return address this call pushes.',input:true,expect:'0x4005a5',traps:[{v:'4005a0',msg:'That\'s the call itself. The return address is the next line.'}],explain:'The line after the call: 4005a5.'}
