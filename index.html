/* ===== Part 3 · Control Flow ===== */
{id:'c1',sec:'p3',name:'cmp subtracts backwards',short:'cmp order',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>Part 3 is about making decisions, like an <code>if</code>. It starts with <code>cmp</code>, which compares two values by subtracting them.</p>
<div class="rule-box">cmp S1, S2 computes S2 − S1</div>
<p>Second minus first, the same direction as <code>sub</code>. But cmp throws the answer away. It only keeps a few yes/no facts about the answer, called <b>flags</b>, for the next instruction to check.</p>`+
cmpBox('cmpq %rax, %rbx',[['%rax','5'],['%rbx','10']],'computes %rbx − %rax = 10 − 5 = 5')+
`<div class="tip"><span class="tl">Watch the order</span>Your worksheet uses both orders. With a in %rdi and b in %rsi, <code>cmpb %rdi, %rsi</code> computes <b>b − a</b>, but <code>cmpl %esi, %edi</code> computes <b>a − b</b>.</div>`,
qs:[
{instr:'cmpl %esi, %edi',plain:true,prompt:'What does this compute?',options:['%edi − %esi','%esi − %edi','%edi + %esi'],answer:0,hint:'Second minus first.',explain:'Second minus first: %edi − %esi.'},
{vis:cmpBox('cmpq %rax, %rbx',[['%rax','5'],['%rbx','10']]),prompt:'What number does it compute?',options:['5','−5','15'],answer:0,explain:'%rbx − %rax = 10 − 5 = 5.'},
{vis:cmpBox('cmpq %rbx, %rax',[['%rax','5'],['%rbx','10']]),prompt:'Operands swapped. What number does it compute now?',options:['−5','5','15'],answer:0,explain:'%rax − %rbx = 5 − 10 = −5.'},
{instr:'cmpb %rdi, %rsi',plain:true,prompt:'a is in %rdi and b is in %rsi. What does this compute?',options:['b − a','a − b','a + b'],answer:0,explain:'Second minus first: %rsi − %rdi, which is b − a. Worksheet Q1 is written this way.'},
{instr:'cmpl %esi, %edi',plain:true,prompt:'a is in %edi and b is in %esi. What does this compute?',options:['a − b','b − a'],answer:0,keep:true,explain:'%edi − %esi, which is a − b. Worksheet Q2 is written this way.'},
{instr:'cmpl %esi, %edi',plain:true,prompt:'After this runs, what\'s in %edi?',code:false,options:['The same value as before','a − b','0'],answer:0,explain:'cmp only sets the flags. Neither value changes.'},
{prompt:'Which instruction changes %edi?',options:['subl %esi, %edi','cmpl %esi, %edi'],answer:0,keep:true,explain:'sub stores its answer. cmp doesn\'t.'},
{prompt:'<code>test S1, S2</code> is cmp\'s cousin. What does it compute?',code:false,options:['S2 AND S1, bit by bit','S2 − S1','S2 + S1'],answer:0,explain:'test ANDs the two values and keeps only the flags. <code>test %eax, %eax</code> is just a quick check of %eax itself: is it zero, is it negative?'}
]},

{id:'c2',sec:'p3',name:'ZF: was the answer zero?',short:'ZF',shuffleOpts:false,
defaults:{m:null,code:true,options:['ZF = 1','ZF = 0']},
lesson:`<p>The easiest flag first. <b>ZF</b>, the zero flag, is <b>1 when the answer was exactly zero</b>, and 0 otherwise.</p>
<p>After a cmp, the answer is zero exactly when the two values are <b>equal</b>. So ZF = 1 means "they were equal".</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Compare</th><th>Answer</th><th>ZF</th></tr></thead><tbody>
<tr><td>7 with 7</td><td>7 − 7 = 0</td><td><b>1</b></td></tr>
<tr><td>5 with 10</td><td>10 − 5 = 5</td><td><b>0</b></td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">test</span><code>test %eax, %eax</code> sets ZF = 1 exactly when %eax is 0. Loops use this to check a counter.</div>`,
qs:[
{vis:cmpBox('cmpl %esi, %edi',[['a (%edi)','7'],['b (%esi)','7']]),prompt:'What is ZF?',answer:0,explain:'7 − 7 = 0, so ZF = 1.'},
{vis:cmpBox('cmpl %esi, %edi',[['a (%edi)','3'],['b (%esi)','8']]),prompt:'What is ZF?',answer:1,explain:'3 − 8 = −5, not zero, so ZF = 0.'},
{vis:cmpBox('testl %eax, %eax',[['%eax','0']]),prompt:'What is ZF?',answer:0,explain:'%eax is 0, so ZF = 1.'},
{vis:cmpBox('testl %eax, %eax',[['%eax','5']]),prompt:'What is ZF?',answer:1,explain:'%eax isn\'t 0, so ZF = 0.'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','49'],['b','49']]),prompt:'What is ZF?',answer:0,explain:'Equal values, so the answer is 0 and ZF = 1. (This is the setge case on your worksheet.)'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','14'],['b','37']]),prompt:'What is ZF?',answer:1,explain:'14 and 37 are different, so ZF = 0. (The setne case on your worksheet.)'},
{prompt:'After a cmp, ZF = 1 means the two values were',code:false,options:['equal','different','negative'],answer:0,explain:'Their difference was zero.'}
]},

{id:'c4',sec:'p3',name:'One byte, two readings',short:'Signed bytes',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>Your worksheet compares <b>bytes</b>, and some values are hex or negative. One byte holds 0 to 255. The same byte can also be read as <b>signed</b>, from −128 to 127.</p>
<div class="rule-box">0x00 to 0x7F: both readings are the same<br>0x80 to 0xFF: signed = unsigned − 256</div>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Byte</th><th>Unsigned</th><th>Signed</th></tr></thead><tbody>
<tr><td class="c">0x53</td><td>83</td><td>83</td></tr>
<tr><td class="c">0x80</td><td>128</td><td>−128</td></tr>
<tr><td class="c">0xAA</td><td>170</td><td>−86</td></tr>
<tr><td class="c">0xFF</td><td>255</td><td>−1</td></tr>
</tbody></table></div>
<p>Going the other way, a negative like −46 is stored as 256 − 46 = 210 (0xD2).</p>
<div class="tip"><span class="tl">Hex to decimal</span>First digit × 16, plus the second digit. 0xAA = 10 × 16 + 10 = 170. 0x53 = 5 × 16 + 3 = 83.</div>`,
qs:[
{token:'0x53',prompt:'As an unsigned number, what is this byte?',options:['83','53','−83'],answer:0,explain:'5 × 16 + 3 = 83.'},
{token:'0xAA',prompt:'As an unsigned number, what is this byte?',options:['170','−86','110'],answer:0,hint:'A is 10.',explain:'10 × 16 + 10 = 170.'},
{token:'0xAA',prompt:'As a signed number, what is this byte?',options:['−86','170','86'],answer:0,hint:'It\'s 0x80 or more, so subtract 256.',explain:'170 − 256 = −86.'},
{token:'0x7F',prompt:'As a signed number, what is this byte?',options:['127','−1','−127'],answer:0,explain:'0x7F is below 0x80, so both readings are 7 × 16 + 15 = 127.'},
{token:'0xFF',prompt:'As a signed number, what is this byte?',options:['−1','255','−255'],answer:0,explain:'255 − 256 = −1.'},
{token:'−46',prompt:'This byte is stored as which unsigned number?',options:['210','46','−210'],answer:0,hint:'256 − 46.',explain:'256 − 46 = 210 (0xD2).'},
{token:'−101',prompt:'This byte is stored as which unsigned number?',options:['155','101','27'],answer:0,hint:'256 − 101.',explain:'256 − 101 = 155 (0x9B).'},
{token:'0x90',prompt:'Is this byte negative when read as signed?',code:false,options:['Yes, it\'s 0x80 or more','No'],answer:0,keep:true,explain:'Anything from 0x80 to 0xFF is negative when read as signed.'},
{token:'0x80',prompt:'Type this byte\'s signed value.',input:true,dec:true,expect:'-128',explain:'128 − 256 = −128, the smallest signed byte.'}
]},

{id:'c5',sec:'p3',name:'CF: unsigned below',short:'CF',
defaults:{m:null,code:true,options:['CF = 1','CF = 0']},
lesson:`<p><b>CF</b>, the carry flag, is about <b>unsigned</b> numbers.</p>
<div class="rule-box">After cmp S1, S2: CF = 1 when S2 is below S1 (unsigned)</div>
<p>In words: S2 − S1 would go below zero, so the subtraction had to borrow. If the values are hex or negative, convert them to unsigned first, as in the last level.</p>`+
cmpBox('cmpb %rdi, %rsi',[['a','0xaa = 170'],['b','0x53 = 83']],'is b below a?  83 below 170?  yes, so CF = 1')+
cmpBox('cmpb %rdi, %rsi',[['a','−101 = 155'],['b','−46 = 210']],'is b below a?  210 below 155?  no, so CF = 0')+
`<p class="fine">For addition, CF = 1 when the unsigned sum is too big for the byte, so a 1 carries out of the top. Your slide shows 1111 + 0001.</p>`,
qs:[
{vis:cmpBox('cmpq %rax, %rbx',[['%rax','5'],['%rbx','10']]),prompt:'What is CF?',answer:1,hint:'Is %rbx below %rax?',explain:'Is 10 below 5? No, so CF = 0.'},
{vis:cmpBox('cmpq %rbx, %rax',[['%rax','5'],['%rbx','10']]),prompt:'What is CF?',answer:0,hint:'Is %rax below %rbx?',explain:'Is 5 below 10? Yes, so CF = 1. With SF = 1 from before, that\'s your slide\'s "CF and SF".'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','14'],['b','37']]),prompt:'This computes b − a. What is CF?',answer:1,explain:'Is 37 below 14? No, so CF = 0.'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','0xaa'],['b','0x53']]),prompt:'This computes b − a. What is CF?',answer:0,hint:'Convert: 0xaa = 170, 0x53 = 83.',explain:'Is 83 below 170? Yes, so CF = 1.'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','49'],['b','49']]),prompt:'What is CF?',answer:1,explain:'Equal isn\'t below, so CF = 0.'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','−101'],['b','−46']]),prompt:'This computes b − a. What is CF?',answer:1,hint:'Convert to unsigned first: 256 − 101 and 256 − 46.',explain:'As unsigned bytes, a = 155 and b = 210. Is 210 below 155? No, so CF = 0.'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','0x20'],['b','0x10']]),prompt:'This computes b − a. What is CF?',answer:0,explain:'Is 16 below 32? Yes, so CF = 1.'},
{prompt:'After <code>test</code>, what is CF always?',options:['CF = 0','CF = 1'],answer:0,keep:true,explain:'test always clears CF (and OF).'}
]},

{id:'c6',sec:'p3',name:'OF: signed overflow',short:'OF',
defaults:{m:null,code:true,options:['OF = 1','OF = 0']},
lesson:`<p><b>OF</b>, the overflow flag, is about <b>signed</b> numbers. A signed byte only holds −128 to 127. OF = 1 when the real answer doesn't fit.</p>
<ol class="steps"><li>Read both values as <b>signed</b>.</li><li>Do the subtraction like normal math.</li><li>Outside −128 to 127? Then OF = 1.</li></ol>`+
cmpBox('cmpb %rdi, %rsi',[['a','0xaa = −86'],['b','0x53 = 83']],'b − a = 83 − (−86) = 169, too big, so OF = 1')+
`<div class="tip"><span class="tl">Shortcut</span>If both values have the same sign, both positive or both negative, a subtraction can never overflow. OF can only be 1 when one is negative and the other isn't.</div>`,
qs:[
{vis:cmpBox('cmpb %rdi, %rsi',[['a','14'],['b','37']]),prompt:'This computes b − a. What is OF?',answer:1,explain:'37 − 14 = 23, which fits, so OF = 0.'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','0xaa'],['b','0x53']]),prompt:'This computes b − a. What is OF?',answer:0,hint:'Signed: a = −86, b = 83.',explain:'83 − (−86) = 169. That\'s bigger than 127, so OF = 1.'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','49'],['b','49']]),prompt:'What is OF?',answer:1,explain:'49 − 49 = 0 fits, so OF = 0.'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','−101'],['b','−46']]),prompt:'This computes b − a. What is OF?',answer:1,hint:'Both negative. Check the shortcut.',explain:'Both are negative, so it can\'t overflow: −46 − (−101) = 55, which fits. OF = 0.'},
{vis:cmpBox('cmpb %rdi, %rsi',[['a','0x01'],['b','0x80']]),prompt:'This computes b − a. What is OF?',answer:0,hint:'Signed: b = −128.',explain:'−128 − 1 = −129. That\'s below −128, so OF = 1.'},
{prompt:'What is 83 − (−86)?',options:['169','−3','3'],answer:0,keep:true,explain:'Subtracting a negative adds: 83 + 86 = 169.'},
{prompt:'Can subtracting two negative numbers overflow?',code:false,options:['No','Yes'],answer:0,keep:true,explain:'Same signs can never overflow in a subtraction.'}
]},

{id:'c7',sec:'p3',name:'set: answer a yes/no question',short:'set',
defaults:{m:null,code:true,options:['1','0']},
lesson:`<p>A <code>set</code> instruction asks a yes/no question about the last cmp. It puts the answer in a byte like <code>%al</code>: <b>1 for yes, 0 for no</b>.</p>
<p>The letters after <code>set</code> pick the question. After <code>cmp S1, S2</code>, read it as <b>"is S2 ___ S1?"</b></p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Instruction</th><th>Is S2 ___ S1?</th><th>Numbers</th></tr></thead><tbody>
<tr><td class="c">sete / setne</td><td>equal / not equal</td><td>either</td></tr>
<tr><td class="c">setg / setge</td><td>greater / greater or equal</td><td>signed</td></tr>
<tr><td class="c">setl / setle</td><td>less / less or equal</td><td>signed</td></tr>
<tr><td class="c">seta / setae</td><td>above / above or equal</td><td>unsigned</td></tr>
<tr><td class="c">setb / setbe</td><td>below / below or equal</td><td>unsigned</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">The letter code</span><b>g</b>reater and <b>l</b>ess are <b>signed</b>. <b>a</b>bove and <b>b</b>elow are <b>unsigned</b>. An extra <b>e</b> means "or equal", and <b>n</b> means "not".</div>`+
cmpBox('cmpb %rdi, %rsi   then   setb %al',[['a','0xaa = 170'],['b','0x53 = 83']],'is b below a, unsigned?  83 below 170?  yes, so %al = 1')+
`<p class="fine">This gives the same answer as the flag formulas on your worksheet. setb copies CF, sete copies ZF, and seta is ~CF &amp; ~ZF ("not below and not equal").</p>`,
qs:[
{vis:cmpBox('cmpl %esi, %edi   then   sete %al',[['a (%edi)','7'],['b (%esi)','7']]),prompt:'What does sete put in %al?',answer:0,explain:'Is a equal to b? Yes, so %al = 1.'},
{vis:cmpBox('cmpb %rdi, %rsi   then   setne %al',[['a','14'],['b','37']]),prompt:'What does setne put in %al?',answer:0,explain:'Is b not equal to a? 37 isn\'t 14, so yes: %al = 1. (Worksheet Q1.)'},
{vis:cmpBox('cmpb %rdi, %rsi   then   setg %al',[['a','5'],['b','3']]),prompt:'What does setg put in %al?',answer:1,hint:'Is b greater than a?',explain:'Is 3 greater than 5? No, so %al = 0.'},
{vis:cmpBox('cmpb %rdi, %rsi   then   setge %al',[['a','49'],['b','49']]),prompt:'What does setge put in %al?',answer:0,explain:'Is 49 greater than or equal to 49? Yes, it\'s equal, so %al = 1. (Worksheet Q1.)'},
{vis:cmpBox('cmpb %rdi, %rsi   then   setb %al',[['a','0xaa'],['b','0x53']]),prompt:'What does setb put in %al?',answer:0,hint:'b is unsigned. Convert both.',explain:'Is 83 below 170, unsigned? Yes, so %al = 1. (Worksheet Q1.)'},
{vis:cmpBox('cmpb %rdi, %rsi   then   setl %al',[['a','0xaa'],['b','0x53']]),prompt:'Same values. What does setl put in %al?',answer:1,hint:'l is signed: a = −86, b = 83.',explain:'Is 83 less than −86, signed? No, so %al = 0. Same bytes as setb, opposite answer, because signed and unsigned read them differently.'},
{vis:cmpBox('cmpb %rdi, %rsi   then   seta %al',[['a','−101'],['b','−46']]),prompt:'What does seta put in %al?',answer:0,hint:'a is unsigned: a = 155, b = 210.',explain:'Is 210 above 155, unsigned? Yes, so %al = 1. (Worksheet Q1.)'},
{prompt:'Which one means "greater, unsigned"?',options:['seta','setg','setgt','setb'],answer:0,explain:'Unsigned uses above and below. setgt isn\'t a real instruction.'},
{prompt:'Which one means "less or equal, signed"?',options:['setle','setbe','setl','setlte'],answer:0,explain:'l for less (signed), plus e for "or equal".'},
{prompt:'<code>setb</code> copies which flag?',options:['CF','ZF','SF','OF'],answer:0,explain:'Below (unsigned) is exactly CF, the borrow flag.'}
]},

{id:'c8',sec:'p3',name:'Jumps use the same letters',short:'Jumps',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>A jump <code>jX label</code> asks the same yes/no question as <code>setX</code>. If the answer is <b>yes</b>, it jumps to the label. If <b>no</b>, it just continues with the next line.</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Jump</th><th>Jumps when S2 is ___ S1</th></tr></thead><tbody>
<tr><td class="c">je / jne</td><td>equal / not equal</td></tr>
<tr><td class="c">jg / jge / jl / jle</td><td>greater, greater-or-equal, less, less-or-equal (signed)</td></tr>
<tr><td class="c">ja / jae / jb / jbe</td><td>above, above-or-equal, below, below-or-equal (unsigned)</td></tr>
<tr><td class="c">jmp</td><td>always</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">Real or fake?</span>Like Part 1's register names, some jump names on your worksheet are fake. There's no <code>jlt</code>, <code>jgt</code>, <code>jeq</code> or <code>jet</code>. Two extra real names: <code>jz</code> is the same as <code>je</code>, and <code>jnz</code> is the same as <code>jne</code>.</div>`,
qs:[
{prompt:'Which jump means "greater than, unsigned"?',options:['ja','jg','jgt','jae'],answer:0,explain:'Unsigned uses above. jgt isn\'t real.'},
{prompt:'Which jump means "less than or equal, signed"?',options:['jle','jbe','jl','jlte'],answer:0,explain:'l for signed less, e for "or equal".'},
{prompt:'Which jump means "less than, unsigned"?',options:['jb','jl','jlt','jbe'],answer:0,explain:'Unsigned uses below. jlt isn\'t real.'},
{token:'jlt',prompt:'Is this a real jump?',options:['Real','Fake'],answer:1,keep:true,explain:'Fake. Less-than is jl.'},
{token:'jeq',prompt:'Is this a real jump?',options:['Real','Fake'],answer:1,keep:true,explain:'Fake. Equal is je (or jz).'},
{token:'jge',prompt:'Is this a real jump?',options:['Real','Fake'],answer:0,keep:true,explain:'Real: greater or equal, signed.'},
{token:'jet',prompt:'Is this a real jump?',options:['Real','Fake'],answer:1,keep:true,explain:'Fake. It\'s a distractor on your worksheet.'},
{prompt:'Which jump is the same as <code>jz</code>?',options:['je','jne','jmp'],answer:0,explain:'"Zero" and "equal" are the same test after a cmp.'},
{prompt:'Which jump always jumps?',options:['jmp','je','ja'],answer:0,explain:'jmp has no condition.'},
{vis:cmpBox('cmpl %esi, %edi   then   jg .L2',[['a (%edi)','8'],['b (%esi)','3']]),prompt:'Does it jump to .L2?',code:false,options:['Yes, it jumps','No, it goes to the next line'],answer:0,keep:true,explain:'Is a (8) greater than b (3)? Yes, so it jumps.'},
{vis:cmpBox('cmpl %esi, %edi   then   jb .L5',[['a (%edi)','9'],['b (%esi)','4']]),prompt:'Does it jump to .L5?',code:false,options:['Yes, it jumps','No, it goes to the next line'],answer:1,keep:true,explain:'Is a (9) below b (4)? No, so it continues with the next line.'}
]},

{id:'c9',sec:'p3',name:'if and loops',short:'if and loops',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>Compiled code often uses a jump to <b>skip</b> over something. Your worksheet uses two patterns.</p>
<p><b>1. Skip an if.</b> <code>if (a == b) return 0;</code> becomes "if they are <b>not</b> equal, jump past the return 0":</p>`+
codeBlock('cmpl  %esi, %edi        # a - b\n[[jne]]   .L1             # not equal? skip the next two lines\nxor   %eax, %eax        # return 0  (anything XOR itself is 0)\nret\n.L1: ...')+
`<p><b>2. Leave a loop.</b> <code>while (size)</code> keeps going while size isn't 0. So at the top: "if size <b>is</b> 0, jump out":</p>`+
codeBlock('.L1:  [[test  %edi, %edi]]     # size is in %edi\n      [[jz]]    .L2            # size is 0? leave the loop\n      ...                     # loop body\n      jmp   .L1             # back to the top\n.L2:  ret')+
`<div class="tip"><span class="tl">Flip or not?</span>If the jump <b>skips</b> code, it uses the opposite of the C condition: <code>==</code> becomes <code>jne</code>. If the jump goes <b>to</b> the code that should run, it uses the condition as written: "a &gt; b unsigned" goes to <code>ja</code>.</div>`,
qs:[
{prompt:'<code>if (a == b) return 0;</code> The jump skips the return 0. Which jump?',options:['jne','je','jeq','jmp'],answer:0,explain:'Skip it when they are not equal: jne.'},
{instr:'xor %eax, %eax',plain:true,prompt:'What does this do?',code:false,options:['Sets %eax to 0','Flips every bit of %eax','Compares %eax with itself'],answer:0,explain:'Anything XOR itself is 0. It\'s how the worksheet writes return 0.'},
{prompt:'After <code>cmpl %esi, %edi</code> (a − b), a jump goes <b>to</b> "return a" when a &gt; b, unsigned. Which jump?',options:['ja','jg','jbe','jgt'],answer:0,explain:'It goes to the code that should run, so no flip. Greater, unsigned, is ja.'},
{prompt:'Same setup, but for a &lt;= b, signed.',options:['jle','jbe','jg','jlte'],answer:0,explain:'Less or equal, signed: jle.'},
{prompt:'Same setup, but for a &lt; b, unsigned.',options:['jb','jl','jlt','jae'],answer:0,explain:'Less, unsigned: jb.'},
{instr:'test %edi, %edi',plain:true,prompt:'When does this set ZF = 1?',code:false,options:['When %edi is 0','When %edi is negative','Always'],answer:0,explain:'test with itself checks the register, and ZF = 1 means it was zero.'},
{prompt:'<code>while (size)</code> with size in %edi. After <code>test %edi, %edi</code>, which jump leaves the loop?',options:['jz','jnz','jmp','jg'],answer:0,explain:'Leave when size is 0: jz (same as je).'},
{prompt:'Why test %edi and not %esi?',code:false,options:['size is in %edi. %esi holds the array pointer.','%esi can\'t be tested.','Either works.'],answer:0,explain:'while (size) checks size, and size is in %edi. %esi holds the array\'s address.'},
{instr:'jmp .L1',plain:true,prompt:'At the bottom of the loop, what does this do?',code:false,options:['Goes back to the test at the top','Leaves the loop','Jumps only if size is 0'],answer:0,explain:'jmp always jumps. The test at the top decides when to stop.'}
]},

{id:'c10',sec:'p3',name:'Class Practice 3',short:'Class P3',
defaults:{m:null,code:true,keep:true},
lesson:`<p>The blanks from In-Class Practice 3, in the worksheet's order. For Q1, <code>cmpb %rdi, %rsi</code> computes <b>b − a</b>. Answer each blank with the level that taught it:</p>
<ol class="steps"><li><b>ZF</b>: equal?</li><li><b>SF</b>: is b − a negative? (use signed values)</li><li><b>CF</b>: is b below a? (use unsigned values)</li><li><b>OF</b>: does b − a fit in −128 to 127? (signed)</li><li><b>%al</b>: ask the set instruction's question.</li></ol>`,
qs:[
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setne %al',[['a','14'],['b','37']]),prompt:'setne · CF:',options:['1','0'],answer:1,explain:'Is 37 below 14, unsigned? No, so CF = 0.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setne %al',[['a','14'],['b','37']]),prompt:'setne · al:',options:['1','0'],answer:0,explain:'Is b not equal to a? Yes, so %al = 1.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setb %al',[['a','0xaa'],['b','0x53']]),prompt:'setb · CF:',options:['1','0'],answer:0,hint:'Unsigned: 83 and 170.',explain:'Is 83 below 170, unsigned? Yes, so CF = 1.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setb %al',[['a','0xaa'],['b','0x53']]),prompt:'setb · ZF:',options:['1','0'],answer:1,explain:'The values are different, so ZF = 0.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setb %al',[['a','0xaa'],['b','0x53']]),prompt:'setb · SF:',options:['1','0'],answer:0,hint:'b − a as bytes: 83 − 170 wraps around.',explain:'83 − 170 = −87, which is negative, so SF = 1. (The stored byte is 0xA9, whose top bit is 1.)'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setb %al',[['a','0xaa'],['b','0x53']]),prompt:'setb · al:',options:['1','0'],answer:0,explain:'setb copies CF, which is 1. In words: 83 is below 170.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setge %al',[['a','49'],['b','49']]),prompt:'setge · ZF:',options:['1','0'],answer:0,explain:'Equal, so ZF = 1.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setge %al',[['a','49'],['b','49']]),prompt:'setge · SF:',options:['1','0'],answer:1,explain:'49 − 49 = 0 isn\'t negative, so SF = 0.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setge %al',[['a','49'],['b','49']]),prompt:'setge · OF:',options:['1','0'],answer:1,explain:'0 fits easily, so OF = 0.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   setge %al',[['a','49'],['b','49']]),prompt:'setge · al:',options:['1','0'],answer:0,explain:'Is 49 greater than or equal to 49? Yes, so %al = 1.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   seta %al',[['a','−101'],['b','−46']]),prompt:'seta · OF:',options:['1','0'],answer:1,explain:'Both are negative, so the subtraction can\'t overflow: OF = 0.'},
{tag:'From class · Q1',vis:cmpBox('cmpb %rdi, %rsi   then   seta %al',[['a','−101'],['b','−46']]),prompt:'seta · al:',options:['1','0'],answer:0,hint:'Unsigned: a = 155, b = 210.',explain:'Is 210 above 155, unsigned? Yes, so %al = 1.'},
{tag:'From class · Q2',pre:'function:\n      cmpl        %esi, %edi    # a - b\n      [[____]]        .L1\n      xor         %eax, %eax    # return 0\n      ret\n.L1:  cond_jmp    .L2\n      movl        %esi, %eax    # return b\n      ret\n.L2:  movl        %edi, %eax    # return a\n      ret',prompt:'1. The conditional jump to .L1 should be',options:['ja','jet','jb','jle','jlt','jgt','jeq','jne'],answer:7,hint:'It skips the return 0.',explain:'Skip return 0 when a and b are not equal: jne. jet, jlt, jgt and jeq are fake.'},
{tag:'From class · Q2',prompt:'2. The greater than (unsigned) conditional jump is',options:['ja','jet','jb','jle','jlt','jgt','jeq','jne'],answer:0,explain:'Unsigned greater: ja.'},
{tag:'From class · Q2',prompt:'3. The less than or equal to (signed) conditional jump is',options:['ja','jet','jb','jle','jlt','jgt','jeq','jne'],answer:3,explain:'Signed less or equal: jle.'},
{tag:'From class · Q2',prompt:'4. The less than (unsigned) conditional jump is',options:['ja','jet','jb','jle','jlt','jgt','jeq','jne'],answer:2,explain:'Unsigned less: jb.'},
{tag:'From class · Q3',pre:'array_sum:\n        xor   %eax, %eax\n.L1:    [[[A]]]                   # test instruction\n        [[[B]]]    .L2            # conditional jump\n        dec   %edi\n        add   (%esi, %edi, 4), %eax\n        jmp   .L1\n.L2:    ret',prompt:'[A] The test instruction is',options:['jz | je','jae | jnc','jb | jnae','cmp %esi, %edi','test %esi, %esi','test %edi, %edi'],answer:5,hint:'size is in %edi.',explain:'while (size) checks size, which is in %edi: test %edi, %edi.'},
{tag:'From class · Q3',prompt:'[B] The conditional jump instruction is',options:['jz | je','jae | jnc','jb | jnae','cmp %esi, %edi','test %esi, %esi','test %edi, %edi'],answer:0,hint:'Leave when size is 0.',explain:'Jump out when the test found zero: jz (same as je).'}
]},

/* ===== Part 4 · Procedures ===== */
{id:'stk',sec:'p4',name:'The stack grows down',short:'The stack',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>The stack is a part of memory that works like a pile of plates: the last thing put on is the first thing taken off. <code>%rsp</code>, the stack pointer, holds the address of the top item.</p>
<p>One twist: the pile grows <b>toward lower addresses</b>. Putting something on makes %rsp smaller.</p>`+
stackPair({title:'Before',regs:[['%rsp','0x108'],['%rbx','0x55']],rows:[{a:'0x110',v:'…'},{a:'0x108',v:'123'},{a:'0x100',v:''}],rsp:1},
          {title:'After pushq %rbx',regs:[['%rsp','0x100']],rows:[{a:'0x110',v:'…'},{a:'0x108',v:'123'},{a:'0x100',v:'0x55',cls:'new'}],rsp:2})+
`<div class="tip"><span class="tl">The two rules</span><b>pushq X</b>: %rsp goes down by 8, then X is written at the new %rsp.<br><b>popq X</b>: the value at %rsp is copied into X, then %rsp goes up by 8.</div>
<div class="tip"><span class="tl">Subtracting 8 in hex</span>If the last digit is 8 or more, just take 8 off it: 0x10C − 8 = 0x104. If it's smaller than 8, borrow like in decimal: add 16 to it, take 8 off, and take 1 from the digit before. 0x110 − 8 = 0x108, and 0x778ff0 − 8 = 0x778fe8.</div>
<p class="fine">Your slides show IA32, where <code>pushl</code> moves %esp by 4. The worksheet is x86-64, where <code>pushq</code> moves %rsp by 8, because registers and addresses are 8 bytes.</p>`,
qs:[
{vis:regsViz([['%rsp','0x108']]),prompt:'After <code>pushq %rax</code>, what is %rsp?',options:['0x100','0x110','0x104'],answer:0,hint:'push makes %rsp smaller by 8.',explain:'push moves %rsp down by 8: 0x108 − 8 = 0x100.'},

{id:'callret',sec:'p4',name:'call and ret',short:'call / ret',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p><code>%rip</code> holds the address of the <b>next instruction to run</b>. (Your IA32 slides call it %eip.)</p>
<p><code>call f</code> does two things:</p>
<ol class="steps"><li><b>Push the return address</b>, the address of the line right after the call.</li><li><b>Jump to f</b> by putting f's address in %rip.</li></ol>
<p><code>ret</code> undoes it. It pops the return address into %rip, so the caller picks up right after its call.</p>`+
codeBlock('400540   call  add3\n400545   movq  %rax, %rbx   # next line\n...\nadd3:\n400600   leaq  3(%rdi), %rax\n400604   ret')+
stackPair({title:'Before the call',regs:[['%rip','400540'],['%rsp','7ff100']],rows:[{a:'7ff100',v:'…'},{a:'7ff0f8',v:''}],rsp:0},
          {title:'After the call',regs:[['%rip','400600'],['%rsp','7ff0f8']],rows:[{a:'7ff100',v:'…'},{a:'7ff0f8',v:'400545',cls:'new'}],rsp:1})+
`<div class="tip"><span class="tl">The trap</span>The return address is <b>not</b> the call's own address. It's the next line, 400545. Just read it off the line below the call.</div>`,
qs:[
{pre:'400540   call  add3\n400545   movq  %rax, %rbx',prompt:'What return address does this call push?',options:['400545','400540','400600'],answer:0,explain:'It is the address of the line after the call.'},
{pre:'400540   call  add3\n400545   movq  %rax, %rbx\n...\nadd3:\n400600   leaq  3(%rdi), %rax',prompt:'Right after the call, what is %rip?',options:['400600','400545','400540'],answer:0,hint:'call jumps to add3.',explain:'call jumps to add3, so %rip holds add3\'s first address, 400600.'},
{vis:regsViz([['%rsp','7ff100']]),pre:'400540   call  add3',prompt:'Right after the call, what is %rsp?',options:['7ff0f8','7ff108','7ff100'],answer:0,hint:'call pushes, and a push moves %rsp down by 8.',explain:'7ff100 − 8: the last two digits are 00, so borrow: 0x100 − 8 = 0xF8. %rsp = 7ff0f8.'},
{pre:'400540   call  add3\n400545   movq  %rax, %rbx',prompt:'Right after the call, what value is at the address in %rsp?',options:['400545','400600','7ff100'],answer:0,explain:'The return address that call just pushed.',after:stackViz({title:'After the call',rows:[{a:'7ff100',v:'…'},{a:'7ff0f8',v:'400545',cls:'new'}],rsp:1})},
{pre:'add3:\n400600   leaq  3(%rdi), %rax\n400604   ret',prompt:'add3 runs <code>ret</code>. What is %rip after that?',options:['400545','400540','400604'],answer:0,hint:'ret pops the return address.',explain:'ret pops the return address into %rip, so the caller continues at 400545.'},
{vis:regsViz([['%rsp before ret','7ff0f8']]),prompt:'And what is %rsp after the ret?',options:['7ff100','7ff0f8','7ff0f0'],answer:0,hint:'ret pops, and a pop moves %rsp up by 8.',explain:'ret pops, which moves %rsp back up by 8, to where it was before the call.'},
{prompt:'Why does call push the address of the <b>next</b> line?',code:false,options:['So the caller continues after the call instead of calling again','Because the call line gets erased','So %rsp points at the function'],answer:0,explain:'When the function returns, the caller should carry on with the next line. Returning to the call itself would call the function again.'},
{pre:'# %rsp = 0x7ff010\n4005a0   call  f\n4005a5   addq  $1, %rax',prompt:'Type %rsp right after the call.',input:true,expect:'0x7ff008',hint:'0x10 − 8.',explain:'0x10 − 8 = 0x08, so %rsp = 0x7ff008.'},

{id:'args',sec:'p4',name:'Arguments go in registers',short:'Arg registers',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>A function's first six arguments go into six registers, always in this order. The answer comes back in <code>%rax</code>.</p>`+argsViz()+
`<div class="tip"><span class="tl">Memory trick</span><b>D</b>iane's <b>S</b>ilk <b>D</b>ress <b>C</b>osts <b>$89</b>: <b>di</b>, <b>si</b>, <b>dx</b>, <b>cx</b>, <b>8</b>, <b>9</b>.</div>`+
codeBlock('long f(long a, long b, long c);\n\nf(10, 20, 30);    # 10 -> %rdi,  20 -> %rsi,  30 -> %rdx\n                  # f\'s answer comes back in %rax')+
`<p>Two more facts. A 7th argument and beyond go on the stack. And an <code>int</code> argument is only 4 bytes, so the code uses the 4-byte name of the same register: <code>%edi</code>, <code>%esi</code>, <code>%edx</code> (Part 1's register sizes again).</p>`,
qs:[
{prompt:'The 1st argument goes in',options:['%rdi','%rax','%rsi','%rdx'],answer:0,explain:'di is first: Diane.'},
{prompt:'The 3rd argument goes in',options:['%rdx','%rcx','%rsi','%rdi'],answer:0,explain:'di, si, <b>dx</b>: Diane\'s Silk <b>Dress</b>.'},
{prompt:'The return value comes back in',options:['%rax','%rdi','%rsp','%rbx'],answer:0,explain:'Every function leaves its answer in %rax.'},
{pre:'f(5, 9);',prompt:'When f starts, which register holds 9?',options:['%rsi','%rdi','%rdx'],answer:0,explain:'9 is the 2nd argument, so %rsi.'},
{prompt:'The 5th argument goes in',options:['%r8','%r9','%rcx','%r5'],answer:0,hint:'Costs $89.',explain:'di, si, dx, cx, then <b>8</b> and 9. There is no %r5.'},
{prompt:'Where does a 7th argument go?',code:false,options:['On the stack','In %r10','In %rax'],answer:0,explain:'Only six fit in registers. The rest are pushed on the stack.'},
{pre:'long g(long a, long b, long c, long d);\n\ng(1, 2, 3, 4);',prompt:'When g starts, which register holds 4?',options:['%rcx','%rdx','%r8','%rsi'],answer:0,explain:'4 is the 4th argument: Diane\'s Silk Dress <b>Costs</b>, %rcx.'},
{pre:'int f(int a, int b);',prompt:'b is an int. Which register name does the code use for it?',options:['%esi','%rsi','%si','%edi'],answer:0,hint:'2nd argument, and an int is 4 bytes.',explain:'b is the 2nd argument, so it lives in %rsi. It\'s a 4-byte int, so the code uses the 4-byte name, %esi.'},
{pre:'long add(long a, long b) {\n    return a + b;\n}\n\nadd(30, 12);',prompt:'When add returns, what number is in %rax?',input:true,dec:true,expect:'42',explain:'30 arrives in %rdi and 12 in %rsi. add leaves 30 + 12 = 42 in %rax.'}
]},

{id:'frame',sec:'p4',name:'Making room on the stack',short:'Stack frames',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>Some functions need memory for local variables, like an array. They get it from the stack by moving %rsp down, and give it back before they return.</p>`+
codeBlock('caller:\n    subq  $48, %rsp       # make 48 bytes of room\n    ...                   # the room starts at %rsp\n    addq  $48, %rsp       # give the room back\n    ret                   # now %rsp points at the return address again')+
stackViz({title:'After subq $48, %rsp',rows:[{a:'',v:'return address'},{a:'',v:'48 bytes of room<br>for local variables',cls:'room'}],rsp:1})+
`<p>Because %rsp now points at the start of that room, <code>movq %rsp, %rdi</code> means "pass the address of my local array as argument 1".</p>
<div class="tip"><span class="tl">Figure 3.25 in your text</span>From top to bottom, a function's frame holds: the return address (pushed by call), saved registers, local variables, and then the argument build area at the bottom, where %rsp points.</div>`,
qs:[
{instr:'subq $32, %rsp',plain:true,prompt:'What does this do?',code:false,options:['Makes 32 bytes of room on the stack','Gives 32 bytes back','Puts 32 into %rsp'],answer:0,explain:'Moving %rsp down makes room, the same direction a push goes.'},
{prompt:'Which instruction gives those 32 bytes back before ret?',options:['addq $32, %rsp','subq $32, %rsp','popq %rsp'],answer:0,explain:'Adding moves %rsp back up to where it was.'},
{prompt:'After <code>subq $48, %rsp</code>, %rsp is',code:false,options:['48 lower than before','48 higher than before','unchanged'],answer:0,keep:true,explain:'sub makes it smaller by 48.'},
{prompt:'A local array starts at %rsp. Which instruction passes its address as argument 1?',options:['movq %rsp, %rdi','movq %rdi, %rsp','movq %rsp, %rsi'],answer:0,hint:'Source first, then destination. Argument 1 is %rdi.',explain:'Copy %rsp (the array\'s address) into %rdi (argument 1).'},
{prompt:'Which instruction passes the int 10 as argument 2?',options:['movl $10, %esi','movl $10, %edi','movl $10, %eax','movl $10, %rsp'],answer:0,hint:'Argument 2, and an int is 4 bytes.',explain:'Argument 2 is %rsi, and a 4-byte int uses %esi with movl.'},
{prompt:'Why must <code>addq $48, %rsp</code> come before ret?',code:false,options:['So %rsp points at the return address when ret pops it','So the array gets erased','So %rax holds the answer'],answer:0,explain:'ret pops whatever %rsp points at. If the room were still there, it would pop junk instead of the return address.'},
{prompt:'In Figure 3.25, what does <code>call</code> leave right above the new function\'s frame?',code:false,options:['The return address','Local variables','Saved registers'],answer:0,explain:'call pushes the return address, then the new function builds its frame below it.'},
{prompt:'How many bytes does <code>int array[10]</code> need?',input:true,dec:true,expect:'40',explain:'An int is 4 bytes, and 10 × 4 = 40. Part 5 is all about this.'},
{prompt:'After <code>call array_sum</code> returns, where is its answer?',options:['%rax','%rdi','%rsp','%esi'],answer:0,explain:'Every function returns its answer in %rax.'}
]},

{id:'tsize',sec:'p5',name:'How big is each type?',short:'Type sizes',
defaults:{m:null,code:true,keep:true,prompt:'How many bytes is this type on x86-64?',options:['1','2','4','8']},
lesson:`<p>Every C type has a size in bytes. On x86-64:</p>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Type</th><th>Size</th><th>Part 1 suffix</th></tr></thead><tbody>
<tr><td class="c">char</td><td>`+blocks(1)+` 1 byte</td><td class="c">b</td></tr>
<tr><td class="c">short</td><td>`+blocks(2)+` 2 bytes</td><td class="c">w</td></tr>
<tr><td class="c">int</td><td>`+blocks(4)+` 4 bytes</td><td class="c">l</td></tr>
<tr><td class="c">long, double</td><td>`+blocks(8)+` 8 bytes</td><td class="c">q</td></tr>
<tr><td class="c">any pointer: char *, short **, …</td><td>`+blocks(8)+` 8 bytes</td><td class="c">q</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">The star rule</span>If the type has a <code>*</code>, it's a pointer, and every pointer is 8 bytes on x86-64. It doesn't matter what it points to: <code>short *</code> is 8, not 2.</div>
<p class="fine">Your slides also show IA32, where pointers are only 4 bytes.</p>`,
qs:[
{token:'short',answer:1,explain:'A short is 2 bytes (a word, suffix w).'},
{token:'int',answer:2,explain:'An int is 4 bytes (suffix l).'},
{token:'char',answer:0,explain:'A char is 1 byte (suffix b).'},
{token:'long',answer:3,explain:'A long is 8 bytes on x86-64 (suffix q).'},
{token:'double',answer:3,explain:'A double is 8 bytes.'},
{token:'short *',answer:3,hint:'Is there a star?',explain:'The star makes it a pointer, and pointers are 8 bytes. It doesn\'t matter that it points to shorts.'},
{token:'char *',answer:3,hint:'Is there a star?',explain:'A pointer: 8 bytes.'},
{token:'double *',answer:3,explain:'A pointer: 8 bytes.'},
{token:'short **',answer:3,hint:'Two stars is still a pointer.',explain:'A pointer to a pointer is still a pointer: 8 bytes.'},
{prompt:'In IA32 (32-bit, your slides), how big is a pointer?',answer:2,explain:'IA32 addresses are 4 bytes, so pointers are 4. On x86-64 they\'re 8.'}
]},

{id:'parith',sec:'p5',name:'Pointer math',short:'Pointer math',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>An array's name on its own is a pointer to element 0. For <code>int val[5]</code>, <code>val</code> has type <code>int *</code> and its value is x.</p>
<p>Adding to a pointer counts <b>elements</b>, not bytes. <code>val+1</code> is one int later: x + 4.</p>`+
arrViz({decl:'int val[5];',n:5,size:4,base:'x',vals:[1,5,2,1,3],hl:1})+
`<div class="tbl-wrap"><table class="t"><thead><tr><th>Expression</th><th>Type</th><th>Value</th></tr></thead><tbody>
<tr><td class="c">val</td><td class="c">int *</td><td>x</td></tr>
<tr><td class="c">val+1</td><td class="c">int *</td><td>x + 4</td></tr>
<tr><td class="c">&amp;val[2]</td><td class="c">int *</td><td>x + 8</td></tr>
<tr><td class="c">val+i</td><td class="c">int *</td><td>x + 4i</td></tr>
<tr><td class="c">val[4]</td><td class="c">int</td><td>3, the number stored there</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">Two quick rules</span><b>Brackets alone</b>, like <code>val[4]</code>, give you the element itself. Its type is the element type, <code>int</code>.<br><b>A plain name, + or &amp;</b> gives you an address. Its type gets a star, <code>int *</code>. And <code>&amp;val[i]</code> is the same as <code>val+i</code>.</div>`,
qs:[
{prompt:'<code>int val[5]</code>: what type is <code>val+1</code>?',options:['int *','int','long'],answer:0,explain:'No brackets, so it\'s an address: int *.'},
{prompt:'<code>int val[5]</code>: what is <code>val+1</code>?',options:['x+4','x+1','x+8'],answer:0,hint:'+1 means one element, not one byte.',explain:'One int later: x + 4.'},
{prompt:'<code>int val[5]</code>: what type is <code>val[4]</code>?',options:['int','int *'],answer:0,keep:true,explain:'Brackets give the element itself: an int.'},
{prompt:'<code>int val[5]</code>: what is <code>&amp;val[2]</code>?',options:['x+8','x+2','M[x+8]'],answer:0,explain:'& gives the address of val[2], which is 2 ints past x: x + 8. M[x+8] would be the value stored there.'},
{prompt:'<code>long L[4]</code> starts at x_L. What is <code>L+1</code>?',options:['x_L+8','x_L+1','x_L+4'],answer:0,explain:'One long later: 8 bytes.'},
{prompt:'<code>long L[4]</code>: what is <code>L+i-2</code>?',options:['x_L+8i-16','x_L+i-2','x_L+8i-2'],answer:0,hint:'Both the i and the 2 count elements. Multiply each by 8.',explain:'(i − 2) longs past x_L: x_L + 8i − 16.'},
{prompt:'<code>long L[4]</code>: what type is <code>L+i-2</code>?',options:['long *','long','int'],answer:0,explain:'No brackets, so it\'s an address: long *.'},
{prompt:'Which two mean the same thing?',code:false,options:['&A[i] and A+i','A[i] and A+i','&A[i] and A[i]'],answer:0,explain:'Both are the address of element i.'}
]},

{id:'leamov',sec:'p5',name:'Address or value: lea vs mov',short:'lea vs mov',shuffleOpts:true,
defaults:{m:null,code:true},
lesson:`<p>Now turn array expressions into assembly. Say the start address x_A of <code>int A[]</code> is in <code>%rdx</code> and i is in <code>%rcx</code>.</p>
<ol class="steps"><li><b>An address</b> (pointer type): compute it with <code>leaq</code> into %rax. lea does Part 2's address math but <b>never reads memory</b>.</li><li><b>An element value</b>: read memory with <code>mov</code>. The suffix matches the element size: movl and %eax for an int, movw and %ax for a short.</li></ol>
<div class="tbl-wrap"><table class="t"><thead><tr><th>Expression</th><th>Type</th><th>Value</th><th>Assembly</th></tr></thead><tbody>
<tr><td class="c">A+1</td><td class="c">int *</td><td class="c">x_A+4</td><td class="c">leaq 4(%rdx), %rax</td></tr>
<tr><td class="c">&amp;A[i]</td><td class="c">int *</td><td class="c">x_A+4i</td><td class="c">leaq (%rdx,%rcx,4), %rax</td></tr>
<tr><td class="c">A[2]</td><td class="c">int</td><td class="c">M[x_A+8]</td><td class="c">movl 8(%rdx), %eax</td></tr>
<tr><td class="c">A[i]</td><td class="c">int</td><td class="c">M[x_A+4i]</td><td class="c">movl (%rdx,%rcx,4), %eax</td></tr>
</tbody></table></div>
<div class="tip"><span class="tl">M[…]</span>Your worksheet writes <code>M[x_A+8]</code> for "the value stored in memory at x_A + 8". Values get M[…]. Addresses don't.</div>
<div class="tip"><span class="tl">Turning an index into D(Rb,Ri,S)</span>Multiply the whole index by the element size, then split it into an i part and a number part. A[2i+1] is at x_A + 4(2i+1) = x_A + 8i + 4, so it's <code>4(%rdx,%rcx,8)</code>.</div>`,
qs:[
{prompt:'What is the value of <code>A[i]</code>?',options:['M[x_A+4i]','x_A+4i','M[x_A+i]'],answer:0,explain:'A[i] is the int stored at x_A + 4i, so M[x_A+4i].'},
{prompt:'What is the value of <code>&amp;A[i]</code>?',options:['x_A+4i','M[x_A+4i]','x_A+i'],answer:0,explain:'& gives the address itself, with no M[…].'},
{prompt:'Which instruction puts <code>&amp;A[i]</code> in %rax?',options:['leaq (%rdx,%rcx,4), %rax','movl (%rdx,%rcx,4), %eax','leaq (%rcx,4), %rax'],answer:0,hint:'An address means lea.',explain:'lea computes x_A + 4i without reading memory.'},
{prompt:'Which instruction puts <code>A[i]</code> in %eax?',options:['movl (%rdx,%rcx,4), %eax','leaq (%rdx,%rcx,4), %rax','movl (%rdx,%rcx), %eax'],answer:0,hint:'A value means mov.',explain:'mov reads the int stored at x_A + 4i. The scale must be 4.'},
{prompt:'Which instruction puts <code>A[2]</code> in %eax?',options:['movl 8(%rdx), %eax','movl 2(%rdx), %eax','leaq 8(%rdx), %rax'],answer:0,explain:'A[2] is 2 ints = 8 bytes in, and it\'s a value, so movl.'},
{prompt:'Which instruction puts <code>A+1</code> in %rax?',options:['leaq 4(%rdx), %rax','movl 4(%rdx), %eax','leaq 1(%rdx), %rax'],answer:0,explain:'A+1 is an address 4 bytes in, so leaq 4(%rdx).'},
{prompt:'A short is 2 bytes. Which instruction loads a short into %ax?',options:['movw 6(%rdx), %ax','movl 6(%rdx), %ax','movw 6(%rdx), %rax'],answer:0,hint:'Part 1: the suffix must match the register size.',explain:'w = 2 bytes and %ax = 2 bytes. The other two are Part 1 size mismatches.'},
{prompt:'Where is <code>A[2*i+1]</code>?',options:['M[x_A+8i+4]','M[x_A+2i+1]','M[x_A+8i+1]'],answer:0,hint:'Multiply the whole index by 4.',explain:'4 × (2i + 1) = 8i + 4.'},
{prompt:'Which instruction loads <code>A[2*i+1]</code> into %eax?',options:['movl 4(%rdx,%rcx,8), %eax','movl 1(%rdx,%rcx,2), %eax','leaq 4(%rdx,%rcx,8), %rax'],answer:0,explain:'x_A + 8i + 4: base %rdx, index %rcx, scale 8, displacement 4. It\'s a value, so movl.'},
{prompt:'Which instruction puts <code>A+i-3</code> in %rax?',options:['leaq -12(%rdx,%rcx,4), %rax','leaq -3(%rdx,%rcx,4), %rax','movl -12(%rdx,%rcx,4), %eax'],answer:0,hint:'The 3 counts ints too.',explain:'A + i − 3 is x_A + 4i − 12. It\'s an address, so leaq.'}
]},

function labHTML(){
  var mode=S.labMode==='mov'?'mov':S.labMode==='flags'?'flags':'val';
  var seg=function(id,label){var on=mode===id;return '<button data-lab="'+id+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'">'+label+'</button>';};
  var h='<div class="eyebrow">Lab</div><h2>Try your own</h2>'+
  '<div class="seg" role="group" aria-label="What to try">'+seg('val','Find an operand\'s value')+seg('mov','Check an instruction')+seg('flags','Work out the flags')+'</div>';
  if(mode==='flags'){
    var f=S.labF, opt=function(v,l,cur){return '<option value="'+v+'"'+(String(cur)===String(v)?' selected':'')+'>'+l+'</option>';};
    h+='<p>Pick an instruction and a size, then type the two operand values in decimal or hex. The instruction computes S2 − S1 (or S2 &amp; S1 for test), the same order as <code>cmp S1, S2</code>.</p>'+
    '<div class="labgrid">'+
    '<label>Instruction<select id="labf-op">'+opt('cmp','cmp',f.op)+opt('test','test',f.op)+opt('sub','sub',f.op)+opt('add','add',f.op)+'</select></label>'+
    '<label>Size<select id="labf-bits">'+opt(8,'byte (8 bits)',f.bits)+opt(16,'word (16 bits)',f.bits)+opt(32,'int (32 bits)',f.bits)+'</select></label>'+
    '<label>S1 (first operand)<input id="labf-v1" type="text" value="'+esc(f.v1)+'" autocomplete="off" spellcheck="false"></label>'+
    '<label>S2 (second operand)<input id="labf-v2" type="text" value="'+esc(f.v2)+'" autocomplete="off" spellcheck="false"></label>'+
    '</div>'+
    '<div class="chips"><span class="lab-l">Try</span>'+LAB_FLAG_EX.map(function(e,k){return '<button class="chip" data-fex="'+k+'">'+esc(e.l)+'</button>';}).join('')+'</div>'+
    '<div class="labout" id="lab-out" aria-live="polite">'+labFlagsOut()+'</div>';
    return h;
  }
  if(mode==='val'){
    h+='<p>Type one operand and pick a table. Every step is worked out, and the rows it uses light up.</p>'+
    '<div class="seg" role="group" aria-label="Table">'+['practice','fig1','q4'].map(function(k){var on=S.labM===k;return '<button data-labm="'+k+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'">'+esc(MACHINES[k].label)+'</button>';}).join('')+'</div>'+
    '<label for="lab-op" class="sr">Operand</label><input id="lab-op" class="labin" type="text" value="'+esc(S.labOp)+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">'+
    '<div class="chips"><span class="lab-l">Try</span>'+LAB_OPS[S.labM].map(function(e){return '<button class="chip" data-op="'+esc(e)+'">'+esc(e)+'</button>';}).join('')+'</div>'+
    '<div class="labout" id="lab-out" aria-live="polite">'+labValOut()+'</div>';
  } else {
    h+='<p>Type a mov instruction and the checks run as you type. Change one thing at a time and watch which check flips.</p>'+
    '<label for="lab-in" class="sr">Instruction</label><input id="lab-in" class="labin" type="text" value="'+esc(S.lab)+'" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">'+
    '<div class="chips"><span class="lab-l">Try</span>'+LAB_EX.map(function(e){return '<button class="chip" data-ex="'+esc(e)+'">'+esc(e)+'</button>';}).join('')+'</div>'+
    '<div class="labout" id="lab-out" aria-live="polite">'+labMovOut(S.lab)+'</div>'+
    '<p class="fine">Follows the rules from your class (32-bit IA32, plus the 64-bit register names). A real assembler checks a few more things.</p>';
  }
  return h;
}

/* ---------- render ---------- */
function renderMap(){
  var tabs=SECTIONS.map(function(sc){
    var on=S.sec===sc.id, n=secLevels(sc.id).length;
    var prog=sc.id==='rev'?secCleared(sc.id)+' of '+n+' mixes + Lab':secCleared(sc.id)+' of '+n+' cleared';
    return '<button class="sec-tab'+(on?' on':'')+'" data-sec="'+sc.id+'" aria-pressed="'+on+'"><span class="sec-part">'+sc.part+'</span><span class="sec-name">'+sc.name+'</span><span class="sec-prog">'+prog+'</span></button>';
  }).join('');
  var nx=secNext(S.sec);
  var strip=secLevels(S.sec).map(function(k){
    var L=LEVELS[k], on=S.view==='level'&&S.cur&&S.cur.li===k;
    return '<button class="lv'+(on?' on':'')+'" data-go="'+k+'"'+(on?' aria-current="step"':'')+'><span class="lv-top"><span class="lv-n">L'+(k+1)+'</span>'+(k===nx&&!on?'<span class="lv-next">Next</span>':'')+'</span><span class="lv-name">'+L.short+'</span>'+pips(S.best[L.id]||0)+'</button>';
  }).join('');
  if(S.sec==='rev') strip+='<button class="lv'+(S.view==='lab'?' on':'')+'" data-go="lab"'+(S.view==='lab'?' aria-current="page"':'')+'><span class="lv-top"><span class="lv-n">Lab</span></span><span class="lv-name">Try your own</span><span class="lv-sub">Instructions, operands, flags</span></button>';
  $('#map').innerHTML='<div class="secs">'+tabs+'</div><div class="strip">'+strip+'</div>';
}
function renderStage(){
  var html;
  if(S.view==='lab') html=labHTML();
  else if(S.view==='level'&&S.cur) html=S.cur.phase==='lesson'?lessonHTML():S.cur.phase==='q'?questionHTML():doneHTML();
  else html=sectionHTML(S.sec);
  $('#stage').innerHTML='<section class="card" id="card" tabindex="-1">'+html+'</section>';
  var li=$('#lab-in'); if(li) li.addEventListener('input',function(){S.lab=li.value;$('#lab-out').innerHTML=labMovOut(S.lab);});
  var lo=$('#lab-op'); if(lo) lo.addEventListener('input',function(){S.labOp=lo.value;$('#lab-out').innerHTML=labValOut();});
  var f1=$('#labf-v1'),f2=$('#labf-v2'),fo=$('#labf-op'),fb=$('#labf-bits');
  if(f1){var upd=function(){S.labF.v1=f1.value;S.labF.v2=f2.value;S.labF.op=fo.value;S.labF.bits=+fb.value;$('#lab-out').innerHTML=labFlagsOut();};f1.addEventListener('input',upd);f2.addEventListener('input',upd);fo.addEventListener('change',upd);fb.addEventListener('change',upd);}
}
function render(){
  $('#stats').innerHTML='<span class="stat">XP <b>'+S.xp+'</b></span><span class="stat">Streak <b>'+S.streak+'</b></span>';
  renderMap();renderStage();
}
function focusCard(scroll){
  var card=$('#card'); if(!card)return;
  var af=card.querySelector('[data-autofocus]'), tgt=(af&&fineHover())?af:card;
  try{tgt.focus({preventScroll:true});}catch(e){}
  if(scroll){var top=card.getBoundingClientRect().top;if(top<0)card.scrollIntoView({block:'start',behavior:smooth()});}
}

/* ---------- actions ---------- */
function record(correct,info){
  var c=S.cur, qi=c.queue[0], gain=0;
  if(correct){gain=c.missed.indexOf(qi)>=0?5:10;S.xp+=gain;S.streak++;c.solved.push(qi);}
  else{S.streak=0;c.mistakes++;if(c.missed.indexOf(qi)<0)c.missed.push(qi);}
  info.correct=correct;info.gain=gain;c.answered=info;
  save();render();focusCard(false);
  var fb=document.querySelector('.fb'); if(fb){var b=fb.getBoundingClientRect();if(b.bottom>window.innerHeight)fb.scrollIntoView({block:'nearest',behavior:smooth()});}
}
function answer(k){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||q.input||!q.options)return;
  var perm=permOf(c,c.queue[0],q); if(k<0||k>=perm.length)return;
  var oi=perm[k], correct=oi===q.answer, info={picked:k};
  if(!correct) info.trap=trapFor(q,solFor(q),q.options[oi]);
  record(correct,info);
}
function submitTyped(){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||!q.input)return;
  var inp=$('#ans-in'), msg=$('#ans-msg'); if(!inp)return;
  var raw=inp.value.trim(), n=normHex(raw);
  if(q.dec){
    var d=raw.replace(/\s+/g,'').replace(/[−–]/g,'-');
    if(!d){msg.textContent='Type a number first, like 24.';msg.hidden=false;inp.focus();return;}
    if(!/^-?\d+$/.test(d)){msg.textContent='Type a whole number in decimal, like 24.';msg.hidden=false;inp.focus();return;}
    var okd=Number(d)===Number(q.expect), infod={typed:raw};
    if(!okd&&q.traps){q.traps.some(function(t){if(String(Number(t.v))===String(Number(d))){infod.trap=t.msg;return true;}return false;});}
    record(okd,infod);return;
  }
  if(!raw){msg.textContent='Type a hex value first, like 0x2D.';msg.hidden=false;inp.focus();return;}
  if(n===null){msg.textContent='Use hex digits 0–9 and A–F, like 0x2D.';msg.hidden=false;inp.focus();return;}
  var sol=solFor(q), exp=expectedFor(q,sol), correct=n===normHex(exp), info={typed:raw};
  if(!correct) info.trap=trapFor(q,sol,raw);
  record(correct,info);
}
function submitFlags(){
  var c=S.cur; if(!c||c.phase!=='q'||c.answered)return;
  var q=curQ(); if(!q||!q.flags)return;
  var keys=q.flags.slice(); if(q.set)keys.push('al');
  var picks=c.picks||{}, missing=keys.filter(function(k){return picks[k]!==0&&picks[k]!==1;});
  var msg=$('#ans-msg');
  if(missing.length){if(msg){msg.textContent='Pick 0 or 1 for '+missing.map(function(k){return k==='al'?'%al':k;}).join(', ')+' first.';msg.hidden=false;}return;}
  var r=solveFlags(q.fl); if(r.error)return;
  var res={}, correct=true;
  keys.forEach(function(k){var actual=k==='al'?condEval(q.set,r.F).val:r.F[k];var ok=picks[k]===actual;if(!ok)correct=false;res[k]={picked:picks[k],actual:actual,ok:ok};});
  record(correct,{res:res});
}
function resetProgress(){S.best={};S.xp=0;S.streak=0;S.cur=null;S.confirmReset=false;save();S.view='home';render();focusCard(true);}
function next(){
  var c=S.cur; if(!c||!c.answered)return;
  var qi=c.queue.shift(); if(!c.answered.correct)c.queue.push(qi);
  c.answered=null; c.picks={};
  if(!c.queue.length){c.phase='done';c.pts=pipsFor(c.mistakes);var id=LEVELS[c.li].id;S.best[id]=Math.max(S.best[id]||0,c.pts);save();}
  render();focusCard(true);
}
function goNextLevel(){
  var c=S.cur; if(!c)return;
  if(c.li<LEVELS.length-1)startLevel(c.li+1); else {var li=c.li;S.cur=null;startLevel(li);}
  render();focusCard(true);
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-sec]');
  if(t){S.sec=t.dataset.sec;S.view='home';render();focusCard(true);return;}
  var g=e.target.closest('[data-go]');
  if(g){var v=g.dataset.go;
    if(v==='home')S.view='home';
    else if(v==='lab'){S.view='lab';S.sec='rev';}
    else if(v==='lab-mov'||v==='lab-val'||v==='lab-flags'){S.view='lab';S.sec='rev';S.labMode=v.slice(4);}
    else if(v.indexOf('sec-')===0){S.sec=v.slice(4);S.view='home';}
    else startLevel(+v);
    render();focusCard(true);return;}
  var an=e.target.closest('[data-ans]'); if(an){answer(+an.dataset.ans);return;}
  var fl=e.target.closest('[data-fl]');
  if(fl){var c0=S.cur;if(c0&&c0.phase==='q'&&!c0.answered){c0.picks=c0.picks||{};c0.picks[fl.dataset.fl]=+fl.dataset.v;var grp=fl.parentNode;Array.prototype.forEach.call(grp.querySelectorAll('button'),function(b){var on=b===fl;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});var m0=$('#ans-msg');if(m0)m0.hidden=true;}return;}
  var lm=e.target.closest('[data-lab]'); if(lm){S.labMode=lm.dataset.lab;render();return;}
  var mm=e.target.closest('[data-labm]'); if(mm){S.labM=mm.dataset.labm;render();return;}
  var fx=e.target.closest('[data-fex]'); if(fx){var ex0=LAB_FLAG_EX[+fx.dataset.fex];S.labF={op:ex0.op,bits:ex0.bits,v1:ex0.v1,v2:ex0.v2};render();return;}
  var ac=e.target.closest('[data-act]');
  if(ac){var a=ac.dataset.act;
    if(a==='practice'){S.cur.phase='q';S.cur.picks={};render();focusCard(true);}
    else if(a==='check')submitTyped();
    else if(a==='checkflags')submitFlags();
    else if(a==='reset-ask'){S.confirmReset=true;render();}
    else if(a==='reset-no'){S.confirmReset=false;render();}
    else if(a==='reset-yes')resetProgress();
    else if(a==='next')next();
    else if(a==='hint'){var hh=$('#hint');if(hh){hh.hidden=!hh.hidden;ac.textContent=hh.hidden?'Show a hint':'Hide the hint';}}
    else if(a==='replay'){var li=S.cur.li;S.cur=null;startLevel(li);render();focusCard(true);}
    else if(a==='nextlevel')goNextLevel();
    return;}
  var ex=e.target.closest('[data-ex]');
  if(ex){S.lab=ex.dataset.ex;var inp=$('#lab-in');if(inp){inp.value=S.lab;$('#lab-out').innerHTML=labMovOut(S.lab);inp.focus();}return;}
  var op=e.target.closest('[data-op]');
  if(op){S.labOp=op.dataset.op;var inp2=$('#lab-op');if(inp2){inp2.value=S.labOp;$('#lab-out').innerHTML=labValOut();inp2.focus();}}
});
document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  var tg=e.target;
  if(tg&&tg.id==='ans-in'){if(e.key==='Enter'){e.preventDefault();submitTyped();}return;}
  if(tg&&tg.closest&&tg.closest('input,textarea,select'))return;
  if(S.view!=='level'||!S.cur)return;
  var c=S.cur, q=c.phase==='q'?curQ():null;
  if(/^[1-9]$/.test(e.key)&&q&&!q.input&&!q.flags&&!c.answered){answer(+e.key-1);e.preventDefault();return;}
  if(e.key==='Enter'){
    if(tg&&tg.closest&&tg.closest('button,a,summary')&&!(c.phase==='q'&&q&&q.flags&&!c.answered&&tg.closest('.seg2')))return;
    if(c.phase==='lesson'){c.phase='q';c.picks={};render();focusCard(true);}
    else if(c.phase==='q'&&c.answered)next();
    else if(c.phase==='q'&&q&&q.flags)submitFlags();
    else if(c.phase==='q'&&q&&q.input){var inp=$('#ans-in');if(inp)inp.focus();}
    else if(c.phase==='done')goNextLevel();
    else return;
    e.preventDefault();
  }
});

/* ---------- boot ---------- */
function start(data){
  var base={view:'home',sec:null,xp:0,streak:0,best:{},cur:null,lab:'movb %eax, (%esp)',labMode:'val',labM:'practice',labOp:'(%rax,%rdx,4)',labF:{op:'cmp',bits:8,v1:'0xaa',v2:'0x53'},confirmReset:false};
  if(data&&data.S&&typeof data.S==='object'&&data.S.best){for(var k in data.S)base[k]=data.S[k];S=base;}
  else{S=base;var sv=loadSaved();if(sv){S.best=sv.best||{};S.xp=sv.xp||0;if(!sv.v||sv.v<5)S.sec='p4';}}
  if(!MACHINES[S.labM])S.labM='practice';
  if(!S.labF||typeof S.labF!=='object')S.labF={op:'cmp',bits:8,v1:'0xaa',v2:'0x53'};
  S.confirmReset=false;
  if(S.cur){
    if(S.cur.id){var kk=lvOf(S.cur.id)-1;if(kk<0)S.cur=null;else S.cur.li=kk;}
    else if(S.cur.li>=lvOf('stk')-1)S.cur=null;
  }
  if(S.cur){
    var L=LEVELS[S.cur.li];
    if(!L||!S.cur.queue){S.cur=null;}
    else{
      if(!S.cur.set)S.cur.set=range(L.qs.length);
      var ok=S.cur.queue.concat(S.cur.set).every(function(k){return k>=0&&k<L.qs.length;});
      if(!ok)S.cur=null;
    }
  }
  if(S.view==='level'&&!S.cur)S.view='home';
  if(!S.sec||!SECTIONS.some(function(x){return x.id===S.sec;}))S.sec=(S.view==='level'&&S.cur)?LEVELS[S.cur.li].sec:defaultSec();
  render();
}
if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function'){window.claude.hot.snapshot(function(){return {S:S};});}
if(window.claude&&window.claude.hot&&window.claude.hot.ready){window.claude.hot.ready(start);}
else{start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});}
</script>
